<!doctype html>
<html lang="en">
<head>

<title>Boids</title>
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0e14;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  canvas {
    display: block;
    background: radial-gradient(ellipse at center, #10151f 0%, #0a0e14 100%);
  }
  #panel {
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(20, 24, 34, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 14px 16px;
    color: #d7dce3;
    font-size: 12px;
    width: 220px;
    user-select: none;
    transition: opacity 0.2s;
  }
  #panel.collapsed .row { display: none; }
  #panel h1 {
    font-size: 13px;
    margin: 0 0 10px 0;
    font-weight: 600;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;

  }
  #panel h1 .hint {
    font-size: 10px;

  .row {

  .row output {

  button {

  button:hover { background: #262f42; }
  button.active {

  .meter {

  }
</style>

<body>
<a href="../../index.html" title="Back to Arcade" style="position:fixed;top:10px;left:10px;z-index:2147483647;display:flex;align-items:center;justify-content:center;width:26px;height:26px;background:rgba(0,0,0,0.6);color:#fff;font:14px/1 system-ui,-apple-system,sans-serif;border-radius:50%;text-decoration:none;opacity:0.4;transition:opacity .15s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.4">&larr;</a>
<canvas id="c"></canvas>

<div id="panel">
  <h1 id="panelToggle">Boids <span class="hint">click to collapse</span></h1>

  <div class="row">
    <label for="count">Count</label>
    <input type="range" id="count" min="10" max="800" value="350" step="10">
    <output id="countVal">350</output>
  </div>
  <div class="row">
    <label for="flockCount">Flocks</label>
    <input type="range" id="flockCount" min="1" max="8" value="4" step="1">
    <output id="flockCountVal">4</output>
  </div>
  <div class="row">
    <label for="separation">Separation</label>
    <input type="range" id="separation" min="0" max="3" value="1.2" step="0.05">
    <output id="separationVal">1.2</output>
  </div>
  <div class="row">
    <label for="alignment">Alignment</label>
    <input type="range" id="alignment" min="0" max="3" value="1.0" step="0.05">
    <output id="alignmentVal">1.0</output>
  </div>
  <div class="row">
    <label for="cohesion">Cohesion</label>
    <input type="range" id="cohesion" min="0" max="3" value="1.0" step="0.05">
    <output id="cohesionVal">1.0</output>
  </div>
  <div class="row">
    <label for="perception">Perception</label>
    <input type="range" id="perception" min="10" max="200" value="90" step="5">
    <output id="perceptionVal">90</output>
  </div>
  <div class="row">
    <label for="maxSpeed">Max Speed</label>
    <input type="range" id="maxSpeed" min="1" max="10" value="4" step="0.2">
    <output id="maxSpeedVal">4</output>
  </div>
  <div class="row">
    <label for="mouseForce">Mouse Force</label>
    <input type="range" id="mouseForce" min="0" max="3" value="1" step="0.1">
    <output id="mouseForceVal">1</output>
  </div>
  <div class="row">
    <label for="micInfluence">Mic Influence</label>
    <input type="range" id="micInfluence" min="0" max="4" value="2" step="0.1">
    <output id="micInfluenceVal">2</output>
  </div>
  <div class="row">
    <label>Mic Level</label>
    <div class="meter"><div class="meterFill" id="meterFill"></div></div>
  </div>
  <div class="btnrow">
    <button id="mouseModeBtn">Mouse: Attract</button>
    <button id="resetBtn">Reset</button>
  </div>
  <div class="btnrow">
    <button id="micBtn">Enable Mic</button>
  </div>
</div>

<div id="stats"></div>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;
  let boids = [];

  // ---- Params (bound to UI) ----
  const params = {
    count: 350,
    flockCount: 4,
    separation: 1.2,
    alignment: 1.0,
    cohesion: 1.0,
    perception: 90,
    maxSpeed: 4,
    mouseForce: 1,
    micInfluence: 2,
  };

  function flockHue(flockId) {
    return (flockId * 137.508) % 360; // golden-angle spacing for distinct flock colors
  }

  // ---- Microphone-reactive cohesion ----
  const mic = {
    enabled: false,
    level: 0, // smoothed 0..1 loudness, drives extra cohesion
    analyser: null,
    dataArray: null,
    stream: null,
    audioCtx: null,
  };

  async function enableMic() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    source.connect(analyser); // not connected to destination: no playback/feedback
    mic.stream = stream;
    mic.audioCtx = audioCtx;
    mic.analyser = analyser;
    mic.dataArray = new Uint8Array(analyser.fftSize);
    mic.enabled = true;
  }

  function disableMic() {
    if (mic.stream) for (const track of mic.stream.getTracks()) track.stop();
    if (mic.audioCtx) mic.audioCtx.close();
    mic.enabled = false;
    mic.analyser = null;
    mic.dataArray = null;
    mic.stream = null;
    mic.audioCtx = null;
    mic.level = 0;
  }

  function sampleMic() {
    if (!mic.enabled || !mic.analyser) {
      mic.level *= 0.9; // decay toward 0 when off
      return;
    }
    mic.analyser.getByteTimeDomainData(mic.dataArray);
    let sumSquares = 0;
    for (let i = 0; i < mic.dataArray.length; i++) {
      const v = (mic.dataArray[i] - 128) / 128;
      sumSquares += v * v;
    }
    const rms = Math.sqrt(sumSquares / mic.dataArray.length);
    const loudness = Math.min(1, rms * 6); // typical mic RMS is quiet; boost & clamp
    mic.level += (loudness - mic.level) * 0.2; // smoothing
  }

  let mouseMode = 'attract'; // 'attract' | 'repel' | 'off'
  const mouse = { x: null, y: null, active: false };

  canvas.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });
  canvas.addEventListener('mouseleave', () => { mouse.active = false; });
  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length) {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
      mouse.active = true;
    }
  }, { passive: true });
  canvas.addEventListener('touchend', () => { mouse.active = false; });

  // ---- Boid ----
  const MAX_FORCE = 0.15;
  const EDGE_MARGIN = 100;
  const EDGE_FORCE = 2.2;
  const FORMATION_ROW_SPACING = 18; // distance between rows of the triangle, along heading
  const FORMATION_COL_SPACING = 18; // spacing between boids within a row
  const FORMATION_COEF = 0.25; // how strongly followers snap to their formation slot
  const FLOCK_AVOID_RADIUS = 150; // flocks start repelling each other within this range
  const FLOCK_AVOID_STRENGTH = 1.6;
  const LEADER_ROTATION_INTERVAL = 6000; // ms between leadership handoffs
  const MIGRATION_INTERVAL = 7000; // ms between boids switching flocks

  class Boid {
    constructor(x, y, flockId) {
      this.x = x;
      this.y = y;
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.flockId = flockId;
      this.slot = 0; // position within the flock's triangle formation
      this.hue = flockHue(flockId) + (Math.random() * 20 - 10);
    }
  }

  // assigns each boid a stable slot (0, 1, 2, ...) within its flock, in
  // array order, used to place it within the triangle formation below
  function recomputeSlots() {
    const counters = new Map();
    for (const b of boids) {
      const n = counters.get(b.flockId) || 0;
      b.slot = n;
      counters.set(b.flockId, n + 1);
    }
  }

  // triangle formation: row 0 has 1 boid (the tip), row 1 has 2, row 2 has
  // 3, etc. — a classic delta/wedge shape. Returns offsets in "flock space"
  // (along = forward/back along heading, across = left/right).
  function formationOffset(slot) {
    const row = Math.floor((Math.sqrt(8 * slot + 1) - 1) / 2);
    const posInRow = slot - (row * (row + 1)) / 2;
    const along = -row * FORMATION_ROW_SPACING;
    const across = (posInRow - row / 2) * FORMATION_COL_SPACING;
    return [along, across];
  }

  // periodically hands leadership to a random member of each flock, by
  // swapping slots — the old leader just becomes a follower somewhere
  // else in the formation. The steering forces are already smooth, so
  // the flock reorganizes gradually around the new leader instead of
  // snapping instantly.
  let lastLeaderRotation = 0;
  function rotateLeaders(now) {
    if (now - lastLeaderRotation < LEADER_ROTATION_INTERVAL) return;
    lastLeaderRotation = now;

    const byFlock = new Map();
    for (const b of boids) {
      let list = byFlock.get(b.flockId);
      if (!list) { list = []; byFlock.set(b.flockId, list); }
      list.push(b);
    }
    for (const members of byFlock.values()) {
      if (members.length < 2) continue;
      const leader = members.find((b) => b.slot === 0);
      const candidates = members.filter((b) => b !== leader);
      const newLeader = candidates[Math.floor(Math.random() * candidates.length)];
      const tmp = leader.slot;
      leader.slot = newLeader.slot;
      newLeader.slot = tmp;
    }
  }

  // periodically sends a couple of random boids off to join a different
  // flock — they just get a new flockId/color/slot, and the existing
  // formation & alignment forces do the rest, so they visibly peel off
  // and fly over to their new group instead of teleporting
  let lastMigration = 0;
  function migrateBoids(now) {
    if (now - lastMigration < MIGRATION_INTERVAL) return;
    lastMigration = now;

    const flockCount = Math.max(1, params.flockCount);
    if (flockCount < 2 || boids.length === 0) return;

    const migrantCount = Math.min(boids.length, 1 + Math.floor(Math.random() * 2));
    for (let i = 0; i < migrantCount; i++) {
      const b = boids[Math.floor(Math.random() * boids.length)];
      let newFlockId = Math.floor(Math.random() * flockCount);
      while (newFlockId === b.flockId) newFlockId = Math.floor(Math.random() * flockCount);
      b.flockId = newFlockId;
      b.hue = flockHue(newFlockId) + (Math.random() * 20 - 10);
    }
    recomputeSlots();
  }

  function spawn(n) {
    boids = [];
    const flockCount = Math.max(1, params.flockCount);
    for (let i = 0; i < n; i++) {
      boids.push(new Boid(Math.random() * W, Math.random() * H, i % flockCount));
    }
    recomputeSlots();
  }

  function reflockExisting() {
    const flockCount = Math.max(1, params.flockCount);
    boids.forEach((b, i) => {
      b.flockId = i % flockCount;
      b.hue = flockHue(b.flockId) + (Math.random() * 20 - 10);
    });
    recomputeSlots();
  }

  function resize() {
    const newW = window.innerWidth;
    const newH = window.innerHeight;
    if (!newW || !newH) return; // ignore transient zero-size layout passes

    if (W > 0 && H > 0 && boids.length) {
      // real resize: rescale existing boids proportionally instead of
      // leaving them stranded near their old (now-invalid) coordinates
      const sx = newW / W;
      const sy = newH / H;
      for (const b of boids) {
        b.x *= sx;
        b.y *= sy;
      }
    }

    W = canvas.width = newW;
    H = canvas.height = newH;

    if (!boids.length && params.count > 0) spawn(params.count);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- Spatial grid for neighbor queries ----
  class Grid {
    constructor(cellSize) {
      this.cellSize = cellSize;
      this.map = new Map();
    }
    key(cx, cy) { return cx + ',' + cy; }
    clear() { this.map.clear(); }
    insert(b) {
      const cx = Math.floor(b.x / this.cellSize);
      const cy = Math.floor(b.y / this.cellSize);
      const k = this.key(cx, cy);
      let arr = this.map.get(k);
      if (!arr) { arr = []; this.map.set(k, arr); }
      arr.push(b);
    }
    forNear(b, radius, fn) {
      const cx = Math.floor(b.x / this.cellSize);
      const cy = Math.floor(b.y / this.cellSize);
      const r = Math.ceil(radius / this.cellSize);
      for (let dx = -r; dx <= r; dx++) {
        for (let dy = -r; dy <= r; dy++) {
          const arr = this.map.get(this.key(cx + dx, cy + dy));
          if (arr) for (const other of arr) fn(other);
        }
      }
    }
  }

  function limit(vx, vy, max) {
    const m = Math.hypot(vx, vy);
    if (m > max) {
      return [vx / m * max, vy / m * max];
    }
    return [vx, vy];
  }

  function step() {
    const queryRadius = Math.max(params.perception, FLOCK_AVOID_RADIUS);
    const grid = new Grid(Math.max(20, queryRadius));
    // slot 0 in each flock is that flock's leader; everyone else in the
    // flock targets a position in the triangle relative to the leader's
    // own position & heading — this is far more stable than steering
    // toward a whole-flock average, which wobbles as members move
    const leaders = new Map(); // flockId -> leader boid
    for (const b of boids) {
      grid.insert(b);
      if (b.slot === 0) leaders.set(b.flockId, b);
    }

    const perception2 = params.perception * params.perception;
    const flockAvoidRadius2 = FLOCK_AVOID_RADIUS * FLOCK_AVOID_RADIUS;
    // ambient sound temporarily boosts separation, scattering the flock like a startle response
    const separationMult = params.separation * (1 + mic.level * params.micInfluence);

    for (const b of boids) {
      let sepX = 0, sepY = 0, sepCount = 0;
      let aliX = 0, aliY = 0, aliCount = 0;
      let cohX = 0, cohY = 0, cohCount = 0;
      let avoidX = 0, avoidY = 0, avoidCount = 0;

      grid.forNear(b, queryRadius, (other) => {
        if (other === b) return;
        const dx = b.x - other.x;
        const dy = b.y - other.y;
        const d2 = dx * dx + dy * dy;
        if (d2 === 0) return;

        if (other.flockId === b.flockId) {
          // separation, alignment & cohesion only consider same-flock
          // neighbors — personal space within one flock's own formation
          if (d2 > perception2) return;
          const d = Math.sqrt(d2);
          sepX += dx / d;
          sepY += dy / d;
          sepCount++;

          aliX += other.vx;
          aliY += other.vy;
          aliCount++;

          cohX += other.x;
          cohY += other.y;
          cohCount++;
        } else {
          // different flocks repel each other over a longer range, so
          // whole flocks steer apart instead of overlapping
          if (d2 > flockAvoidRadius2) return;
          const d = Math.sqrt(d2);
          const strength = 1 - d / FLOCK_AVOID_RADIUS;
          avoidX += (dx / d) * strength;
          avoidY += (dy / d) * strength;
          avoidCount++;
        }
      });

      let ax = 0, ay = 0;

      if (sepCount > 0) {
        sepX /= sepCount; sepY /= sepCount;
        ax += sepX * separationMult;
        ay += sepY * separationMult;
      }
      if (aliCount > 0) {
        aliX /= aliCount; aliY /= aliCount;
        // steer towards average heading
        ax += (aliX - b.vx) * 0.08 * params.alignment;
        ay += (aliY - b.vy) * 0.08 * params.alignment;
      }
      if (cohCount > 0) {
        cohX /= cohCount; cohY /= cohCount;
        ax += (cohX - b.x) * 0.002 * params.cohesion;
        ay += (cohY - b.y) * 0.002 * params.cohesion;
      }
      if (avoidCount > 0) {
        avoidX /= avoidCount; avoidY /= avoidCount;
        ax += avoidX * FLOCK_AVOID_STRENGTH;
        ay += avoidY * FLOCK_AVOID_STRENGTH;
      }
      // followers steer toward their slot in the triangle formation,
      // positioned relative to their flock leader's position & heading
      if (b.slot !== 0) {
        const leader = leaders.get(b.flockId);
        const leaderSpeed = Math.hypot(leader.vx, leader.vy);
        const headX = leaderSpeed > 0.01 ? leader.vx / leaderSpeed : 1;
        const headY = leaderSpeed > 0.01 ? leader.vy / leaderSpeed : 0;
        const rightX = headY, rightY = -headX; // perpendicular to heading
        const [along, across] = formationOffset(b.slot);
        const targetX = leader.x + headX * along + rightX * across;
        const targetY = leader.y + headY * along + rightY * across;
        ax += (targetX - b.x) * FORMATION_COEF * params.cohesion;
        ay += (targetY - b.y) * FORMATION_COEF * params.cohesion;
      }

      // edge avoidance (soft bounds instead of hard wrap for nicer visuals)
      if (b.x < EDGE_MARGIN) ax += EDGE_FORCE * (1 - b.x / EDGE_MARGIN);
      if (b.x > W - EDGE_MARGIN) ax -= EDGE_FORCE * (1 - (W - b.x) / EDGE_MARGIN);
      if (b.y < EDGE_MARGIN) ay += EDGE_FORCE * (1 - b.y / EDGE_MARGIN);
      if (b.y > H - EDGE_MARGIN) ay -= EDGE_FORCE * (1 - (H - b.y) / EDGE_MARGIN);

      // mouse interaction (boosted so it still reads clearly against the
      // stronger wall/flock-avoidance forces added above)
      if (mouse.active && mouseMode !== 'off') {
        const dx = mouse.x - b.x;
        const dy = mouse.y - b.y;
        const d2 = dx * dx + dy * dy;
        const radius = 180;
        if (d2 < radius * radius && d2 > 1) {
          const d = Math.sqrt(d2);
          const strength = (1 - d / radius) * params.mouseForce * 3.5;
          if (mouseMode === 'attract') {
            ax += (dx / d) * strength;
            ay += (dy / d) * strength;
          } else {
            ax -= (dx / d) * strength;
            ay -= (dy / d) * strength;
          }
        }
      }

      const [lax, lay] = limit(ax, ay, MAX_FORCE * 4);
      b.vx += lax;
      b.vy += lay;
      const [lvx, lvy] = limit(b.vx, b.vy, params.maxSpeed);
      b.vx = lvx; b.vy = lvy;

      b.x += b.vx;
      b.y += b.vy;

      // hard clamp as safety net
      if (b.x < -20) b.x = -20;
      if (b.x > W + 20) b.x = W + 20;
      if (b.y < -20) b.y = -20;
      if (b.y > H + 20) b.y = H + 20;
    }
  }

  function draw() {
    ctx.fillStyle = 'rgba(10, 14, 20, 0.25)';
    ctx.fillRect(0, 0, W, H);

    for (const b of boids) {
      const angle = Math.atan2(b.vy, b.vx);
      const speed = Math.hypot(b.vx, b.vy);
      const len = 8 + speed * 0.8;

      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(angle);
      const grad = ctx.createLinearGradient(-len, 0, len * 0.6, 0);
      grad.addColorStop(0, `hsla(${b.hue}, 80%, 60%, 0)`);
      grad.addColorStop(1, `hsla(${b.hue}, 90%, 68%, 0.95)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(len * 0.6, 0);
      ctx.lineTo(-len * 0.5, len * 0.28);
      ctx.lineTo(-len * 0.5, -len * 0.28);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    if (mouse.active && mouseMode !== 'off') {
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 150, 0, Math.PI * 2);
      ctx.strokeStyle = mouseMode === 'attract'
        ? 'rgba(94, 177, 255, 0.25)'
        : 'rgba(255, 100, 100, 0.25)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  const statsEl = document.getElementById('stats');
  const meterFillEl = document.getElementById('meterFill');
  let lastTime = performance.now();
  let frames = 0;
  let fps = 0;

  function loop(now) {
    sampleMic();
    meterFillEl.style.width = (mic.level * 100).toFixed(0) + '%';
    rotateLeaders(now);
    migrateBoids(now);
    step();
    draw();

    frames++;
    if (now - lastTime >= 500) {
      fps = Math.round((frames * 1000) / (now - lastTime));
      frames = 0;
      lastTime = now;
      statsEl.textContent = `${boids.length} boids · ${fps} fps`;
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---- UI wiring ----
  function bindSlider(id, key, isInt) {
    const el = document.getElementById(id);
    const out = document.getElementById(id + 'Val');
    el.addEventListener('input', () => {
      const v = isInt ? parseInt(el.value, 10) : parseFloat(el.value);
      out.textContent = v;
      if (key === 'count') {
        params.count = v;
        const diff = v - boids.length;
        const flockCount = Math.max(1, params.flockCount);
        if (diff > 0) {
          for (let i = 0; i < diff; i++) {
            const flockId = (boids.length) % flockCount;
            boids.push(new Boid(Math.random() * W, Math.random() * H, flockId));
          }
        } else {
          boids.length = v;
        }
        recomputeSlots();
      } else if (key === 'flockCount') {
        params.flockCount = v;
        reflockExisting();
      } else {
        params[key] = v;
      }
    });
  }
  bindSlider('count', 'count', true);
  bindSlider('flockCount', 'flockCount', true);
  bindSlider('separation', 'separation', false);
  bindSlider('alignment', 'alignment', false);
  bindSlider('cohesion', 'cohesion', false);
  bindSlider('perception', 'perception', true);
  bindSlider('maxSpeed', 'maxSpeed', false);
  bindSlider('mouseForce', 'mouseForce', false);
  bindSlider('micInfluence', 'micInfluence', false);

  document.getElementById('mouseModeBtn').addEventListener('click', (e) => {
    mouseMode = mouseMode === 'attract' ? 'repel' : mouseMode === 'repel' ? 'off' : 'attract';
    e.target.textContent = 'Mouse: ' + mouseMode[0].toUpperCase() + mouseMode.slice(1);
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    spawn(params.count);
  });

  document.getElementById('panelToggle').addEventListener('click', () => {
    document.getElementById('panel').classList.toggle('collapsed');
  });

  const micBtn = document.getElementById('micBtn');
  micBtn.addEventListener('click', async () => {
    if (mic.enabled) {
      disableMic();
      micBtn.textContent = 'Enable Mic';
      micBtn.classList.remove('active');
      return;
    }
    micBtn.textContent = 'Requesting…';
    try {
      await enableMic();
      micBtn.textContent = 'Mic: On';
      micBtn.classList.add('active');
    } catch (err) {
      console.warn('Microphone access failed:', err);
      micBtn.textContent = 'Mic Blocked';
      micBtn.classList.remove('active');
      setTimeout(() => { micBtn.textContent = 'Enable Mic'; }, 2000);
    }
  });
})();
</script>
</body>
</html>
