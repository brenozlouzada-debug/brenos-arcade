<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
  <title>Ultimate Eleven</title>
  <link rel="icon" href="data:,">
  <style>
:root {
  --bg: #0b1020;
  --bg-elev: #131a30;
  --bg-elev-2: #1b2440;
  --pitch: #0f5c2e;
  --pitch-line: rgba(255,255,255,0.35);
  --text: #f2f5fa;
  --text-dim: #9aa4bf;
  --accent: #34d399;
  --accent-2: #fbbf24;
  --danger: #f87171;
  --gold: #d9a441;
  --goldplus: #f2c14e;
  --icon: #7fd7ff;
  --radius: 14px;
  --nav-h: 64px;
  --header-h: 56px;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: radial-gradient(circle at top, #16204a 0%, var(--bg) 55%);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

#app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  background: var(--bg-elev-2);
  color: var(--text);
  padding: 10px 14px;
  font-size: 14px;
  font-weight: 600;
}
button:active { transform: scale(0.97); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.primary { background: var(--accent); color: #04170f; }
button.gold { background: linear-gradient(135deg, var(--goldplus), var(--gold)); color: #2b1c02; }
button.ghost { background: transparent; border: 1px solid rgba(255,255,255,0.15); }
button.danger { background: rgba(248,113,113,0.15); color: var(--danger); }

/* ---------- Header ---------- */
.app-header {
  height: var(--header-h);
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: rgba(11,16,32,0.9);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 20;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.app-header .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: 0.2px; }
.app-header .brand .ball { font-size: 20px; }
.coin-pill {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-elev-2); padding: 6px 12px; border-radius: 999px;
  font-weight: 700; font-size: 14px; color: var(--accent-2);
}

/* ---------- Main content ---------- */
.app-main {
  flex: 1 1 auto;
  padding: 16px 16px calc(var(--nav-h) + 24px);
  max-width: 720px;
  width: 100%;
  margin: 0 auto;
}

.screen-title {
  font-size: 22px;
  font-weight: 800;
  margin: 4px 0 16px;
}
.screen-subtitle { color: var(--text-dim); font-size: 13px; margin: -12px 0 16px; }

/* ---------- Bottom Nav ---------- */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: var(--nav-h);
  display: flex;
  background: rgba(11,16,32,0.95);
  backdrop-filter: blur(10px);
  border-top: 1px solid rgba(255,255,255,0.08);
  z-index: 20;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
  flex: 1;
  background: transparent;
  border-radius: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 600;
  padding: 6px 4px;
}
.nav-btn .icon { font-size: 20px; }
.nav-btn.active { color: var(--accent); }

/* ---------- Cards ---------- */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 12px;
}
.player-card {
  position: relative;
  border-radius: 12px;
  padding: 10px 8px 8px;
  text-align: center;
  background: linear-gradient(160deg, var(--bg-elev-2), var(--bg-elev));
  border: 1px solid rgba(255,255,255,0.08);
  overflow: hidden;
}
.player-card.tier-gold { border-color: rgba(217,164,65,0.55); }
.player-card.tier-goldplus { border-color: rgba(242,193,78,0.8); box-shadow: 0 0 0 1px rgba(242,193,78,0.25) inset; }
.player-card.tier-icon { border-color: rgba(127,215,255,0.9); box-shadow: 0 0 16px rgba(127,215,255,0.25); }
.player-card .ovr { font-size: 20px; font-weight: 800; line-height: 1; }
.player-card .pos { font-size: 11px; color: var(--text-dim); font-weight: 700; margin-bottom: 4px; }
.player-card .avatar {
  width: 48px; height: 48px; margin: 4px auto 6px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 15px;
  background: radial-gradient(circle at 30% 30%, #2b355c, #10152a);
  border: 2px solid rgba(255,255,255,0.15);
}
.player-card.tier-icon .avatar { border-color: var(--icon); }
.player-card.tier-goldplus .avatar { border-color: var(--goldplus); }
.player-card .name { font-size: 12px; font-weight: 700; line-height: 1.2; min-height: 28px; display: flex; align-items: center; justify-content: center; }
.player-card .flag { font-size: 13px; }
.player-card .count-badge {
  position: absolute; top: 6px; right: 6px;
  background: rgba(0,0,0,0.5); border-radius: 999px;
  font-size: 10px; padding: 2px 6px; font-weight: 700;
}
.player-card .tier-tag {
  position: absolute; top: 6px; left: 6px;
  font-size: 9px; font-weight: 800; text-transform: uppercase;
  padding: 2px 5px; border-radius: 5px; background: rgba(0,0,0,0.4);
}
.player-card.selectable { cursor: pointer; }
.player-card.selectable:active { transform: scale(0.96); }

.stat-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.stat-bars { margin-top: 8px; display: grid; gap: 4px; text-align: left; }
.stat-bar-line { display: grid; grid-template-columns: 26px 1fr 22px; align-items: center; gap: 6px; font-size: 10px; color: var(--text-dim); }
.stat-bar-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
.stat-bar-fill { height: 100%; background: var(--accent); }

/* ---------- Home ---------- */
.hero-card {
  background: linear-gradient(135deg, #16305c, #0f1c3d);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  border: 1px solid rgba(255,255,255,0.08);
}
.hero-card .rating { font-size: 40px; font-weight: 900; }
.hero-card .label { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
.quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.quick-actions button { padding: 16px 10px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.quick-actions .qa-icon { font-size: 22px; }
.section-card {
  background: var(--bg-elev); border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  border: 1px solid rgba(255,255,255,0.06);
}
.section-title { font-weight: 800; font-size: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.match-history-item { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
.match-history-item:last-child { border-bottom: none; }
.badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; }
.badge.win { background: rgba(52,211,153,0.18); color: var(--accent); }
.badge.draw { background: rgba(154,164,191,0.18); color: var(--text-dim); }
.badge.loss { background: rgba(248,113,113,0.18); color: var(--danger); }

/* ---------- Store ---------- */
.pack-card {
  background: var(--bg-elev); border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  display: flex; align-items: center; gap: 14px; border: 1px solid rgba(255,255,255,0.06);
}
.pack-icon { font-size: 34px; }
.pack-info { flex: 1; }
.pack-info .pname { font-weight: 800; font-size: 15px; }
.pack-info .podds { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
.pack-cost { color: var(--accent-2); font-weight: 700; font-size: 13px; margin-top: 6px; }

/* ---------- Squad builder ---------- */
.formation-select { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; }
.formation-select button { flex: 0 0 auto; }
.formation-select button.active { background: var(--accent); color: #04170f; }
.pitch {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,0.045) 0 10%, transparent 10% 20%),
    var(--pitch);
  border-radius: var(--radius);
  border: 2px solid var(--pitch-line);
  overflow: hidden;
  margin-bottom: 16px;
}
.pitch::before {
  content: "";
  position: absolute; left: 50%; top: 50%; width: 30%; aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border: 2px solid var(--pitch-line); border-radius: 50%;
}
.pitch::after {
  content: "";
  position: absolute; left: 20%; right: 20%; top: 0; height: 12%;
  border: 2px solid var(--pitch-line); border-top: none;
}
.pitch-slot {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 54px;
  display: flex; flex-direction: column; align-items: center;
  gap: 2px;
}
.pitch-slot .chip {
  width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800;
  background: rgba(10,14,28,0.85);
  border: 2px dashed rgba(255,255,255,0.4);
  color: var(--text-dim);
}
.pitch-slot.filled .chip {
  border-style: solid;
  border-color: var(--accent-2);
  background: #10182f;
  color: var(--text);
}
.pitch-slot.filled.tier-icon .chip { border-color: var(--icon); }
.pitch-slot .slot-label {
  font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.85);
  background: rgba(0,0,0,0.35); padding: 1px 5px; border-radius: 4px;
  white-space: nowrap; max-width: 70px; overflow: hidden; text-overflow: ellipsis;
}

/* ---------- Match ---------- */
.opponent-card {
  background: var(--bg-elev); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px;
  display: flex; align-items: center; justify-content: space-between; border: 1px solid rgba(255,255,255,0.06);
}
.opponent-card .oname { font-weight: 800; font-size: 15px; }
.opponent-card .orating { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
.opponent-card .oreward { color: var(--accent-2); font-size: 12px; font-weight: 700; }

.result-banner {
  text-align: center; font-weight: 800; font-size: 16px; padding: 10px; border-radius: 10px; margin: 10px 0 16px;
}
.result-banner.win { background: rgba(52,211,153,0.15); color: var(--accent); }
.result-banner.draw { background: rgba(154,164,191,0.15); color: var(--text-dim); }
.result-banner.loss { background: rgba(248,113,113,0.15); color: var(--danger); }

/* ---------- Live match ---------- */
.live-hud {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  margin-bottom: 10px;
}
.live-score { font-size: 28px; font-weight: 900; letter-spacing: 1px; }
.live-clock {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px;
  color: var(--accent-2); background: var(--bg-elev-2); padding: 4px 10px; border-radius: 999px;
}
.pitch-wrap {
  position: relative;
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  aspect-ratio: 360 / 560;
  border-radius: var(--radius);
  overflow: hidden;
  border: 2px solid var(--pitch-line);
  touch-action: none;
  user-select: none;
}
#matchCanvas { width: 100%; height: 100%; display: block; }
.joystick-base {
  position: absolute; left: 16px; bottom: 16px;
  width: 84px; height: 84px; border-radius: 50%;
  background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25);
  touch-action: none;
}
.joystick-knob {
  position: absolute; left: 50%; top: 50%; width: 36px; height: 36px;
  margin-left: -18px; margin-top: -18px;
  border-radius: 50%; background: rgba(255,255,255,0.5);
  pointer-events: none;
}
.action-buttons {
  position: absolute; right: 14px; bottom: 16px;
  display: flex; flex-direction: column; gap: 8px;
}
.action-btn {
  width: 58px; height: 58px; border-radius: 50%;
  font-size: 11px; font-weight: 800;
  border: 2px solid rgba(255,255,255,0.25);
}
.action-btn.shoot { background: var(--danger); color: #2a0a0a; }
.action-btn.pass { background: var(--accent); color: #04170f; }
.action-btn.tackle { background: var(--accent-2); color: #2b1c02; }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(4,7,16,0.72);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 50; backdrop-filter: blur(2px);
}
.modal-sheet {
  background: var(--bg-elev); width: 100%; max-width: 720px;
  border-radius: 18px 18px 0 0;
  max-height: 86vh; overflow-y: auto;
  padding: 18px 16px calc(24px + env(safe-area-inset-bottom));
  animation: sheet-up 0.18s ease-out;
}
@keyframes sheet-up { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.modal-header h3 { margin: 0; font-size: 17px; }
.empty-state { text-align: center; color: var(--text-dim); padding: 30px 10px; font-size: 14px; }

.pack-reveal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin: 16px 0; }
.reveal-card { animation: reveal-pop 0.35s ease-out backwards; }
@keyframes reveal-pop { from { transform: scale(0.6) rotateY(90deg); opacity: 0; } to { transform: scale(1) rotateY(0); opacity: 1; } }

.toast {
  position: fixed; bottom: calc(var(--nav-h) + 14px); left: 50%; transform: translateX(-50%);
  background: var(--bg-elev-2); border: 1px solid rgba(255,255,255,0.12);
  padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
  z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

.footnote { color: var(--text-dim); font-size: 11px; text-align: center; margin-top: 18px; line-height: 1.5; }

@media (min-width: 480px) {
  .quick-actions { grid-template-columns: repeat(4, 1fr); }
  .quick-actions button { align-items: center; text-align: center; }
}
  </style>

const MatchModule = (() => {
  const OPPONENTS = [
    { id: "sunday-league", name: "Sunday League FC", rating: 68, reward: 250 },
    { id: "riverside", name: "Riverside Athletic", rating: 75, reward: 400 },
    { id: "north-city", name: "North City United", rating: 81, reward: 650 },
    { id: "steel-town", name: "Steel Town Rovers", rating: 85, reward: 950 },
    { id: "capital", name: "Capital SC", rating: 89, reward: 1400 },
    { id: "continental", name: "Continental XI", rating: 93, reward: 2200 },
  ];

  // The only correct way to know how many slots are filled: check against
  // the current formation's real slot keys, never Object.keys(squad) (which
  // can carry stale keys left over from a previously selected formation).
  function filledSlots(squad, formation) {
    return formation.slots
      .map((slot) => squad[slot.key])
      .filter(Boolean)
      .map((id) => PlayersModule.getPlayer(id))
      .filter(Boolean);
  }

  function squadRating(squad, formation) {
    const filled = filledSlots(squad, formation);
    if (!filled.length) return 0;
    const avg = filled.reduce((s, p) => s + p.ovr, 0) / filled.length;
    const completeness = filled.length / formation.slots.length;
    // Fielding a full, coherent XI matters: an incomplete squad is weaker
    // than its average suggests.
    return Math.round(avg * (0.85 + 0.15 * completeness));
  }

  return { OPPONENTS, filledSlots, squadRating };
})();

// Module: engine/packs.js
// ---------------------------------------------------------------------
const PacksModule = (() => {
  const byTier = { Gold: [], "Gold+": [], Icon: [] };
  for (const p of PlayersModule.PLAYERS) byTier[PlayersModule.tierFor(p.ovr).name].push(p);

  const PACK_TYPES = {
    bronze: {
      id: "bronze",
      name: "Starter Pack",
      cost: 600,
      size: 3,
      odds: { Gold: 0.8, "Gold+": 0.18, Icon: 0.02 },
    },
    gold: {
      id: "gold",
      name: "Gold Pack",
      cost: 1600,
      size: 5,
      odds: { Gold: 0.55, "Gold+": 0.38, Icon: 0.07 },
    },
    icon: {
      id: "icon",
      name: "Icon Pack",
      cost: 4200,
      size: 3,
      odds: { Gold: 0.2, "Gold+": 0.5, Icon: 0.3 },
    },
  };

  function weightedTier(odds) {
    const r = Math.random();
    let acc = 0;
    for (const [tier, w] of Object.entries(odds)) {
      acc += w;
      if (r <= acc) return tier;
    }
    return "Gold";
  }

  function randomFrom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  // Returns an array of player objects pulled from the pack.
  function openPack(packId) {
    const pack = PACK_TYPES[packId];
    if (!pack) throw new Error(`Unknown pack: ${packId}`);
    const pulls = [];
    for (let i = 0; i < pack.size; i++) {
      const tier = weightedTier(pack.odds);
      const pool = byTier[tier].length ? byTier[tier] : PlayersModule.PLAYERS;
      pulls.push(randomFrom(pool));
    }
    return pulls;
  }

  function freeStarterPack() {
    // Guarantees a playable first XI: a mix across positions, all Gold tier.
    const wanted = ["GK", "CB", "CB", "LB", "RB", "CDM", "CM", "CAM", "LW", "RW", "ST"];
    const used = new Set();
    const picks = [];
    for (const pos of wanted) {
      const options = PlayersModule.PLAYERS.filter((p) => p.pos === pos && !used.has(p.id));
      const pick = options.length ? randomFrom(options) : randomFrom(PlayersModule.PLAYERS.filter((p) => !used.has(p.id)));
      used.add(pick.id);
      picks.push(pick);
    }
    return picks;
  }

  return { PACK_TYPES, openPack, freeStarterPack };
})();

// Module: engine/liveMatch.js
// ---------------------------------------------------------------------
const LiveMatchEngineModule = (() => {
  const PITCH_W = 360;
  const PITCH_H = 560;
  const GOAL_WIDTH = 110;
  const PLAYER_R = 10;
  const BALL_R = 5;
  const MATCH_SECONDS = 180;

  const PICKUP_R = PLAYER_R + BALL_R + 2;
  const TACKLE_R = PLAYER_R + 10;
  const GK_SAVE_R = PLAYER_R + 22;
  const FRICTION = 0.985;

  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  function dist(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function jitter(base, amount) {
    return clamp(Math.round(base + (Math.random() * 2 - 1) * amount), 30, 99);
  }

  class LiveMatch {
    constructor(squad, formation, opponent) {
      this.opponent = opponent;
      this.clock = MATCH_SECONDS;
      this.scoreHome = 0;
      this.scoreAway = 0;
      this.finished = false;
      this.kickoffPause = 1.2;
      this.contrib = new Map(); // playerId -> points (for MOTM)
      this.events = [];

      this.home = formation.slots.map((slot) => {
        const p = PlayersModule.getPlayer(squad[slot.key]);
        return {
          id: p.id,
          team: "home",
          name: p.name,
          pos: slot.pos,
          x: (slot.x / 100) * PITCH_W,
          y: (slot.y / 100) * PITCH_H,
          homeX: (slot.x / 100) * PITCH_W,
          homeY: (slot.y / 100) * PITCH_H,
          vx: 0,
          vy: 0,
          stats: p,
        };
      });

      this.away = formation.slots.map((slot, i) => {
        const stat = jitter(opponent.rating, 6);
        const mx = (slot.x / 100) * PITCH_W;
        const my = PITCH_H - (slot.y / 100) * PITCH_H;
        return {
          id: `opp-${i}`,
          team: "away",
          name: opponent.name,
          pos: slot.pos,
          x: mx,
          y: my,
          homeX: mx,
          homeY: my,
          vx: 0,
          vy: 0,
          stats: { pac: stat, sho: stat, pas: stat, dri: stat, def: stat, phy: stat, ovr: opponent.rating },
        };
      });

      this.players = [...this.home, ...this.away];
      this.ball = { x: PITCH_W / 2, y: PITCH_H / 2, vx: 0, vy: 0, owner: null };
      // Never default (or auto-switch) control onto the goalkeeper — see
      // updateControl().
      this.controlledId = (this.home.find((p) => p.pos !== "GK") || this.home[0]).id;
      this.pressingHomeId = this.controlledId;
      this.pressingAwayId = (this.away.find((p) => p.pos !== "GK") || this.away[0]).id;
      this.pendingKickoff = false;
      this.tackleCooldowns = new Map(); // playerId -> seconds remaining
    }

    bump(id, pts) {
      this.contrib.set(id, (this.contrib.get(id) || 0) + pts);
    }

    resetPositions() {
      for (const p of this.players) {
        p.x = p.homeX;
        p.y = p.homeY;
        p.vx = 0;
        p.vy = 0;
      }
      this.ball.x = PITCH_W / 2;
      this.ball.y = PITCH_H / 2;
      this.ball.vx = 0;
      this.ball.vy = 0;
      this.ball.owner = null;
      this.kickoffPause = 1.0;
    }

    controlledPlayer() {
      return this.players.find((p) => p.id === this.controlledId);
    }

    // Every frame, control follows whichever outfield home player is nearest
    // the ball. The goalkeeper is deliberately excluded — they hold the line
    // (see gkTarget) and letting a human end up dragging them around the
    // pitch, sometimes right out of the net, was more confusing than fun.
    //
    // Hysteresis matters here: picking the strict nearest every tick means
    // that when two players are almost equidistant (constant in a contested
    // ball cluster), the "nearest" identity flips every frame — and since
    // control determines who reads player input vs. who runs on AI pull,
    // that flip yanks a different player's target back and forth every
    // tick, which reads as the whole cluster shaking in place. Only switch
    // when a candidate is clearly closer than whoever's currently held.
    updateControl() {
      const current = this.home.find((p) => p.id === this.controlledId);
      let best = current && current.pos !== "GK" ? current : null;
      let bestD = best ? dist(best, this.ball) : Infinity;
      for (const p of this.home) {
        if (p.pos === "GK" || p.id === this.controlledId) continue;
        const d = dist(p, this.ball);
        if (d < bestD - 6) {
          bestD = d;
          best = p;
        }
      }
      this.controlledId = (best || this.home.find((p) => p.pos !== "GK") || this.home[0]).id;
    }

    // Same hysteresis idea as updateControl(), but for which player on each
    // team is the "presser" that gets the strong pull toward the ball in
    // aiTarget(). Computed once per tick (not once per aiTarget() call) so
    // every teammate agrees on who's closest instead of each racing to their
    // own snapshot of a moving ball.
    updatePressing() {
      for (const team of ["home", "away"]) {
        const list = team === "home" ? this.home : this.away;
        const currentId = team === "home" ? this.pressingHomeId : this.pressingAwayId;
        const current = list.find((p) => p.id === currentId && p.pos !== "GK");
        let best = current || null;
        let bestD = best ? dist(best, this.ball) : Infinity;
        for (const p of list) {
          if (p.pos === "GK" || p.id === currentId) continue;
          const d = dist(p, this.ball);
          if (d < bestD - 6) {
            bestD = d;
            best = p;
          }
        }
        const id = (best || list.find((p) => p.pos !== "GK") || list[0]).id;
        if (team === "home") this.pressingHomeId = id;
        else this.pressingAwayId = id;
      }
    }

    // Non-goalkeeper AI positioning — goalkeepers are handled separately in
    // update() (they always use gkTarget() and never reach here).
    aiTarget(p) {
      const ball = this.ball;
      const isClosest = p.id === (p.team === "home" ? this.pressingHomeId : this.pressingAwayId);
      // The whole team should collapse toward its own box as danger rises,
      // not just whoever's nearest — with only one presser reacting, the
      // rest of the defense held loose shape and let attackers walk into
      // the six-yard box untouched over and over.
      const ownGoalY = p.team === "home" ? PITCH_H : 0;
      const danger = clamp(1 - Math.hypot(ball.x - PITCH_W / 2, ball.y - ownGoalY) / 260, 0, 1);
      const pull = (isClosest ? 0.85 : 0.3) + danger * 0.4;
      const tx = p.homeX + (ball.x - p.homeX) * pull;
      const ty = p.homeY + (ball.y - p.homeY) * pull;
      return { x: clamp(tx, PLAYER_R, PITCH_W - PLAYER_R), y: clamp(ty, PLAYER_R, PITCH_H - PLAYER_R) };
    }

    // Goalkeepers don't chase the ball like outfield players — they hold the
    // goal line and shuffle sideways to cover it, which is what actually
    // makes shots stoppable instead of a straight line to an empty net.
    gkTarget(p) {
      const lineY = p.team === "home" ? PITCH_H - 24 : 24;
      const halfGoal = GOAL_WIDTH / 2 - 6;
      const tx = clamp(this.ball.x, PITCH_W / 2 - halfGoal, PITCH_W / 2 + halfGoal);
      return { x: tx, y: lineY };
    }

    moveToward(p, target, dt, speedMul = 1) {
      const speed = (70 + p.stats.pac * 0.9) * speedMul;
      const dx = target.x - p.x;
      const dy = target.y - p.y;
      const d = Math.hypot(dx, dy);
      if (d < 1) return;
      const vx = (dx / d) * speed;
      const vy = (dy / d) * speed;
      p.x += vx * dt;
      p.y += vy * dt;
      p.x = clamp(p.x, PLAYER_R, PITCH_W - PLAYER_R);
      p.y = clamp(p.y, PLAYER_R, PITCH_H - PLAYER_R);
    }

    moveByInput(p, input, dt) {
      const speed = 70 + p.stats.pac * 0.9;
      p.x += input.x * speed * dt;
      p.y += input.y * speed * dt;
      p.x = clamp(p.x, PLAYER_R, PITCH_W - PLAYER_R);
      p.y = clamp(p.y, PLAYER_R, PITCH_H - PLAYER_R);
    }

    findPassTarget(p) {
      const teammates = (p.team === "home" ? this.home : this.away).filter((t) => t.id !== p.id);
      const ahead = teammates.filter((t) => (p.team === "home" ? t.y < p.y : t.y > p.y));
      const pool = ahead.length ? ahead : teammates;
      let best = pool[0];
      let bestD = Infinity;
      for (const t of pool) {
        const d = dist(t, p);
        if (d < bestD) {
          bestD = d;
          best = t;
        }
      }
      return best;
    }

    kickBall(p, target, power) {
      const dx = target.x - p.x;
      const dy = target.y - p.y;
      const d = Math.hypot(dx, dy) || 1;
      this.ball.owner = null;
      this.ball.x = p.x;
      this.ball.y = p.y;
      this.ball.vx = (dx / d) * power;
      this.ball.vy = (dy / d) * power;
      // A struck ball can bounce straight back off a nearby boundary and
      // land at the kicker's own feet a tick later — without a brief lockout
      // that turns into an infinite self-pass loop (a player pinned near a
      // corner could shoot-and-reclaim thousands of times in one match).
      this.ball.lastKicker = p.id;
      this.ball.lastKickerCooldown = 0.25;
    }

    shoot(p) {
      if (this.ball.owner !== p.id) return;
      const goalY = p.team === "home" ? 0 : PITCH_H;
      const rangeToGoal = Math.hypot(p.x - PITCH_W / 2, p.y - goalY);
      const baseInaccuracy = (99 - p.stats.sho) * 0.35;
      // Long-range efforts should mostly sail wide, not fly true from 40
      // yards — without this, distance from goal barely mattered and any
      // shot attempt was close to a guaranteed goal.
      const rangePenalty = Math.max(0, rangeToGoal - 110) * 0.9;
      const inaccuracy = baseInaccuracy + rangePenalty;
      const target = { x: PITCH_W / 2 + (Math.random() * 2 - 1) * inaccuracy, y: goalY };
      const power = 210 + p.stats.sho * 1.1;
      this.kickBall(p, target, power);
      if (p.team === "home") this.bump(p.id, 0.3);
      this.events.push({ type: "shot", team: p.team, player: p.name });
    }

    pass(p) {
      if (this.ball.owner !== p.id) return;
      const target = this.findPassTarget(p);
      // Power scales with distance to the receiver (with friction, travel
      // distance ends up roughly power/3) — a fixed high power regardless
      // of distance made short passes blast straight through the intended
      // receiver at full speed, sometimes carrying all the way into the
      // goal without ever being an actual shot.
      const d = dist(p, target);
      const power = clamp(d * 0.36 + p.stats.pas * 0.25, 50, 230);
      this.kickBall(p, { x: target.x, y: target.y }, power);
      if (p.team === "home") this.bump(p.id, 0.2);
    }

    // Deliberate tackle: only the player currently under user control can
    // trigger one (teammates and opponents still contest loose-ball
    // proximity passively every tick — see the possession/tackling block in
    // update()). A short per-player cooldown stops mashing the button from
    // guaranteeing a steal.
    tackle(p) {
      if (this.ball.owner === p.id) return;
      if (this.tackleCooldowns.get(p.id) > 0) return;
      this.tackleCooldowns.set(p.id, 0.5);
      const carrier = this.players.find((pl) => pl.id === this.ball.owner);
      if (!carrier || carrier.team === p.team) return;
      if (dist(p, carrier) > TACKLE_R + 8) return;
      const chance = clamp(0.24 + (p.stats.def - carrier.stats.dri) * 0.0012, 0.06, 0.6);
      if (Math.random() < chance) {
        this.dispossess(carrier, 24);
        if (p.team === "home") this.bump(p.id, 0.5);
        this.events.push({ type: "tackle", team: p.team, player: p.name });
      }
    }

    // Knocks the ball loose from whoever has it and, crucially, locks them
    // out of immediately re-collecting it. Without that lockout, a tackle
    // (or the passive contest below) would frequently just bounce the ball
    // a few pixels and hand it straight back to the same player next tick —
    // ownership ping-ponging between two adjacent players every frame, which
    // is what "the ball is shaking" actually was.
    dispossess(carrier, knockPower) {
      this.ball.owner = null;
      const ang = Math.random() * Math.PI * 2;
      this.ball.vx = Math.cos(ang) * knockPower;
      this.ball.vy = Math.sin(ang) * knockPower;
      this.ball.lastKicker = carrier.id;
      this.ball.lastKickerCooldown = 0.35;
    }

    // A dedicated save roll for whichever keeper the loose ball is near.
    // Without this, "goalkeeper" was just another AI dot with no special
    // ability to stop a shot — the generic equal-footing pickup radius was
    // far too small to represent an actual keeper's reach, so shots that
    // reached the box were nearly always goals.
    tryGoalkeeperSave(team) {
      if (this.ball.owner) return;
      const gk = this.players.find((p) => p.team === team && p.pos === "GK");
      if (!gk) return;
      const ownGoalY = team === "home" ? PITCH_H : 0;
      // Only relevant near this keeper's own goal, and only when the ball is
      // headed toward it — otherwise a keeper standing near a stray loose
      // ball would out-compete outfield players for every 50/50.
      const headingTowardGoal = team === "home" ? this.ball.vy > 0 : this.ball.vy < 0;
      if (!headingTowardGoal) return;
      if (dist(gk, this.ball) > GK_SAVE_R) return;
      if (Math.abs(gk.y - ownGoalY) > 90) return;
      const saveChance = clamp(0.35 + (gk.stats.def - 70) * 0.01, 0.15, 0.85);
      if (Math.random() < saveChance) {
        if (team === "home") this.bump(gk.id, 1);
        this.events.push({ type: "save", team, player: gk.name });
        this.gkClear(gk);
      }
    }

    // Goalkeepers never hold the ball or dribble upfield with it — whether
    // they got it from a save or just a loose ball rolling into the box,
    // they immediately punt it back into play. Keeps them anchored on their
    // line instead of wandering the pitch like an outfield player.
    gkClear(gk) {
      const team = gk.team;
      const clearY = team === "home" ? PITCH_H * 0.55 : PITCH_H * 0.45;
      const clearX = clamp(gk.x + (Math.random() * 2 - 1) * 90, 30, PITCH_W - 30);
      this.kickBall(gk, { x: clearX, y: clearY }, 260);
    }

    registerGoal(team) {
      if (team === "home") {
        this.scoreHome++;
        const scorer = this.players.find((pl) => pl.id === this._lastKickerHome);
        if (scorer) {
          this.bump(scorer.id, 3);
          this.events.push({ type: "goal", team: "home", player: scorer.name, minute: this.minute() });
        } else {
          this.events.push({ type: "goal", team: "home", player: "Your XI", minute: this.minute() });
        }
      } else {
        this.scoreAway++;
        this.events.push({ type: "goal", team: "away", player: this.opponent.name, minute: this.minute() });
      }
      this.resetPositions();
    }

    minute() {
      return Math.max(1, Math.round((MATCH_SECONDS - this.clock) / MATCH_SECONDS * 90));
    }

    update(dt, input, actions) {
      if (this.finished) return;

      if (this.kickoffPause > 0) {
        this.kickoffPause -= dt;
        return;
      }

      this.clock -= dt;
      if (this.clock <= 0) {
        this.clock = 0;
        this.finished = true;
        return;
      }

      this.updateControl();
      this.updatePressing();
      const controlled = this.controlledPlayer();

      // Track who last kicked the ball on the home team, to credit goals.
      if (this.ball.owner && this.players.find((p) => p.id === this.ball.owner)?.team === "home") {
        this._lastKickerHome = this.ball.owner;
      }

      for (const [id, secs] of this.tackleCooldowns) {
        const next = secs - dt;
        if (next <= 0) this.tackleCooldowns.delete(id);
        else this.tackleCooldowns.set(id, next);
      }

      for (const p of this.players) {
        if (p.pos === "GK") {
          // Goalkeepers always hold the line — never player-controlled,
          // never dribbling upfield with the ball.
          this.moveToward(p, this.gkTarget(p), dt);
          if (this.ball.owner === p.id) this.gkClear(p);
          continue;
        }
        if (p.id === controlled.id) {
          this.moveByInput(p, input, dt);
          if (actions.shoot) this.shoot(p);
          if (actions.pass) this.pass(p);
          if (actions.tackle) this.tackle(p);
        } else {
          const isBallCarrier = this.ball.owner === p.id;
          const attackY = p.team === "home" ? 0 : PITCH_H; // the goal this player is attacking
          const target = isBallCarrier
            ? { x: PITCH_W / 2, y: p.y + (attackY === 0 ? -40 : 40) }
            : this.aiTarget(p);
          this.moveToward(p, target, dt, isBallCarrier ? 1 : 1);
          if (p.team === "away" && isBallCarrier) {
            // Simple AI decision-making: shoot in range, otherwise pass or dribble.
            // Must measure distance to the goal they're attacking (bottom),
            // not their own goal — mixing those up made defenders launch
            // length-of-pitch "shots" from inside their own box.
            const distToGoal = Math.hypot(p.x - PITCH_W / 2, p.y - attackY);
            if (distToGoal < 110 && Math.random() < 0.006) this.shoot(p);
            else if (Math.random() < 0.01) this.pass(p);
          }
        }
      }

      // Ball follows its owner (simple dribble stick). Goals can only be
      // scored off a free/kicked ball below — a dribbler's ball offset used
      // to be unclamped, so simply running the ball up to the edge of the
      // pitch (an easy clamp to reach) pushed it past the goal line and
      // scored automatically with no shot, no keeper, nothing to stop it.
      if (this.ball.owner) {
        const owner = this.players.find((p) => p.id === this.ball.owner);
        if (owner) {
          const facing = owner.team === "home" ? -1 : 1;
          this.ball.x = clamp(owner.x, BALL_R, PITCH_W - BALL_R);
          this.ball.y = clamp(owner.y + facing * (PLAYER_R + BALL_R - 2), BALL_R, PITCH_H - BALL_R);
        } else {
          this.ball.owner = null;
        }
      } else {
        if (this.ball.lastKickerCooldown > 0) this.ball.lastKickerCooldown -= dt;
        this.ball.x += this.ball.vx * dt;
        this.ball.y += this.ball.vy * dt;
        this.ball.vx *= FRICTION;
        this.ball.vy *= FRICTION;
        if (this.ball.x < BALL_R || this.ball.x > PITCH_W - BALL_R) {
          this.ball.vx *= -0.6;
          this.ball.x = clamp(this.ball.x, BALL_R, PITCH_W - BALL_R);
        }
        this.tryGoalkeeperSave("home");
        this.tryGoalkeeperSave("away");

        const inGoalX = Math.abs(this.ball.x - PITCH_W / 2) < GOAL_WIDTH / 2;
        if (inGoalX && this.ball.y <= BALL_R) {
          this.registerGoal("home");
          return;
        }
        if (inGoalX && this.ball.y >= PITCH_H - BALL_R) {
          this.registerGoal("away");
          return;
        }
        if (this.ball.y < BALL_R || this.ball.y > PITCH_H - BALL_R) {
          this.ball.vy *= -0.6;
          this.ball.y = clamp(this.ball.y, BALL_R, PITCH_H - BALL_R);
        }
      }

      // Possession pickup / tackling.
      if (!this.ball.owner) {
        const lockedOut = this.ball.lastKickerCooldown > 0 ? this.ball.lastKicker : null;
        let closest = null;
        let closestD = Infinity;
        for (const p of this.players) {
          if (p.id === lockedOut) continue;
          const d = dist(p, this.ball);
          if (d < PICKUP_R && d < closestD) {
            closestD = d;
            closest = p;
          }
        }
        if (closest) {
          this.ball.owner = closest.id;
          if (closest.team === "home") this.bump(closest.id, 0.05);
        }
      } else {
        const owner = this.players.find((p) => p.id === this.ball.owner);
        if (owner) {
          for (const p of this.players) {
            if (p.team === owner.team) continue;
            const d = dist(p, owner);
            if (d < TACKLE_R) {
              const chance = clamp(0.02 + (p.stats.def - owner.stats.dri) * 0.0007, 0.002, 0.09);
              if (Math.random() < chance) {
                this.dispossess(owner, 22);
                if (p.team === "home") this.bump(p.id, 0.5);
                break;
              }
            }
          }
        }
      }
    }

    summary() {
      let motm = null;
      if (this.contrib.size) {
        const [topId] = [...this.contrib.entries()].sort((a, b) => b[1] - a[1])[0];
        motm = PlayersModule.getPlayer(topId) || null;
      }
      const result = this.scoreHome > this.scoreAway ? "win" : this.scoreHome < this.scoreAway ? "loss" : "draw";
      const rewardMultiplier = result === "win" ? 1 : result === "draw" ? 0.5 : 0.2;
      const coins = Math.round(this.opponent.reward * rewardMultiplier);
      return {
        homeGoals: this.scoreHome,
        awayGoals: this.scoreAway,
        result,
        coins,
        motm,
        events: this.events,
      };
    }
  }

  return { PITCH_W, PITCH_H, GOAL_WIDTH, PLAYER_R, BALL_R, MATCH_SECONDS, LiveMatch };
})();

// ---------------------------------------------------------------------
// Module: state.js
// ---------------------------------------------------------------------
const StateModule = (() => {
  const STORAGE_KEY = "ultimate-eleven-save-v2";

  function defaultState() {
    return {
      coins: 2000,
      collection: {}, // playerId -> count owned
      formation: "4-3-3",
      squads: {}, // formationId -> { slotKey: playerId }
      history: [], // recent match results
      claimedStarterPack: false,
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      return { ...defaultState(), ...parsed };
    } catch {
      return defaultState();
    }
  }

  class Store {
    constructor() {
      this.state = load();
      this.listeners = new Set();
      if (!this.state.claimedStarterPack) {
        this.grantStarterPack();
      }
    }

    save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
      this.listeners.forEach((fn) => fn(this.state));
    }

    subscribe(fn) {
      this.listeners.add(fn);
      return () => this.listeners.delete(fn);
    }

    grantStarterPack() {
      const picks = PacksModule.freeStarterPack();
      for (const p of picks) this.addToCollection(p.id, false);
      this.state.claimedStarterPack = true;
      // Auto-fill the default formation with the starter XI so there's
      // something to play immediately. Order must line up 1:1 with the
      // "wanted" position order in freeStarterPack() and with real slot
      // keys in FORMATIONS["4-3-3"] (engine/formations.js) — every key
      // here must exist there or the player silently never gets fielded.
      const slotOrder = ["GK", "CB1", "CB2", "LB", "RB", "CM1", "CM2", "CM3", "LW", "RW", "ST"];
      const squad = {};
      picks.forEach((p, i) => {
        if (slotOrder[i]) squad[slotOrder[i]] = p.id;
      });
      this.state.squads["4-3-3"] = squad;
      this.save();
    }

    addCoins(amount) {
      this.state.coins += amount;
      this.save();
    }

    spendCoins(amount) {
      if (this.state.coins < amount) return false;
      this.state.coins -= amount;
      this.save();
      return true;
    }

    addToCollection(playerId, persist = true) {
      this.state.collection[playerId] = (this.state.collection[playerId] || 0) + 1;
      if (persist) this.save();
    }

    ownedIds() {
      return Object.keys(this.state.collection).filter((id) => this.state.collection[id] > 0);
    }

    setFormation(formationId) {
      this.state.formation = formationId;
      if (!this.state.squads[formationId]) this.state.squads[formationId] = {};
      this.save();
    }

    currentSquad() {
      return this.state.squads[this.state.formation] || {};
    }

    assignToSlot(slotKey, playerId) {
      const squad = { ...this.currentSquad() };
      // A player can only occupy one slot at a time.
      for (const k of Object.keys(squad)) {
        if (squad[k] === playerId) delete squad[k];
      }
      squad[slotKey] = playerId;
      this.state.squads[this.state.formation] = squad;
      this.save();
    }

    clearSlot(slotKey) {
      const squad = { ...this.currentSquad() };
      delete squad[slotKey];
      this.state.squads[this.state.formation] = squad;
      this.save();
    }

    recordMatch(summary) {
      this.state.history.unshift(summary);
      this.state.history = this.state.history.slice(0, 20);
      this.save();
    }
  }

  const store = new Store();

  return { store };
})();

// ---------------------------------------------------------------------
// Module: ui/components.js
// ---------------------------------------------------------------------
const ComponentsModule = (() => {
  function initials(name) {
    const parts = name.replace(/[^\p{L}\s]/gu, "").split(/\s+/).filter(Boolean);
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function playerCardHTML(player, { count, selectable, showStats } = {}) {
    const tier = PlayersModule.tierFor(player.ovr);
    const badge = count && count > 1 ? `<div class="count-badge">x${count}</div>` : "";
    const stats = showStats
      ? `<div class="stat-bars">${["pac","sho","pas","dri","def","phy"].map(
          (k) => `<div class="stat-bar-line"><span>${k.toUpperCase()}</span>
            <span class="stat-bar-track"><span class="stat-bar-fill" style="width:${player[k]}%"></span></span>
            <span>${player[k]}</span></div>`
        ).join("")}</div>`
      : "";
    return `
      <div class="player-card ${tier.className} ${selectable ? "selectable" : ""}" data-player-id="${player.id}">
        <div class="tier-tag">${tier.name}</div>
        ${badge}
        <div class="avatar">${initials(player.name)}</div>
        <div class="ovr">${player.ovr}</div>
        <div class="pos">${player.pos}</div>
        <div class="name">${player.flag} ${player.name}</div>
        ${stats}
      </div>
    `;
  }

  let modalRoot = null;
  function showModal(innerHTML, { onMount } = {}) {
    closeModal();
    modalRoot = document.createElement("div");
    modalRoot.className = "modal-backdrop";
    modalRoot.innerHTML = `<div class="modal-sheet">${innerHTML}</div>`;
    modalRoot.addEventListener("click", (e) => {
      if (e.target === modalRoot) closeModal();
    });
    document.body.appendChild(modalRoot);
    if (onMount) onMount(modalRoot);
    return modalRoot;
  }

  function closeModal() {
    if (modalRoot) {
      modalRoot.remove();
      modalRoot = null;
    }
  }

  let toastTimer = null;
  function showToast(message) {
    let el = document.getElementById("toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      el.className = "toast";
      document.body.appendChild(el);
    }
    el.textContent = message;
    el.style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.style.display = "none";
    }, 2200);
  }

  return { initials, playerCardHTML, showModal, closeModal, showToast };
})();

    container.innerHTML = `
      <div class="hero-card">
        <div class="label">Squad Rating (${formation.name})</div>
        <div class="rating">${rating || "--"}</div>
        <div class="screen-subtitle" style="margin:6px 0 0;">${filled}/11 spots filled</div>
      </div>

      <div class="quick-actions">
        <button class="primary" data-nav="match"><span class="qa-icon">⚽</span>Play a Match</button>
        <button data-nav="squad"><span class="qa-icon">🧩</span>Squad Builder</button>
        <button data-nav="store"><span class="qa-icon">🎁</span>Open Packs</button>
        <button data-nav="collection"><span class="qa-icon">📇</span>Collection</button>
      </div>

      <div class="section-card">
        <div class="section-title">Recent Matches</div>
        ${
          history.length
            ? history
                .slice(0, 6)

                  (h) => `<div class="match-history-item">

                    <span>${h.homeGoals}-${h.awayGoals}</span>
                    <span class="badge ${h.result}">${h.result.toUpperCase()}</span>
                  </div>`
                )
                .join("")
            : `<div class="empty-state">No matches played yet. Build your squad and kick off!</div>`
        }
      </div>

      <div class="footnote">
        Player names, nationalities and positions are real. Attribute ratings are
        this app's own original estimates — not official EA Sports FC/FIFA ratings.
      </div>

    container.querySelectorAll("[data-nav]").forEach((btn) => {
      btn.addEventListener("click", () => navigate(btn.dataset.nav));

  }

  return { renderHome };
})();

// ---------------------------------------------------------------------
const StoreUIModule = (() => {
  const PACK_META = {
    bronze: { icon: "📦" },
    gold: { icon: "🥇" },
    icon: { icon: "💎" },
  };

  function renderStore(container) {
    container.innerHTML = `
      <div class="screen-title">Card Store</div>
      <div class="screen-subtitle">Spend coins to open packs and grow your collection.</div>
      ${Object.values(PacksModule.PACK_TYPES)
        .map(
          (pack) => `
        <div class="pack-card">
          <div class="pack-icon">${PACK_META[pack.id].icon}</div>
          <div class="pack-info">
            <div class="pname">${pack.name}</div>
            <div class="podds">${pack.size} cards · Gold ${Math.round(pack.odds.Gold * 100)}% · Gold+ ${Math.round(pack.odds["Gold+"] * 100)}% · Icon ${Math.round(pack.odds.Icon * 100)}%</div>
            <div class="pack-cost">🪙 ${pack.cost.toLocaleString()}</div>
          </div>
          <button class="gold" data-pack="${pack.id}" ${StateModule.store.state.coins < pack.cost ? "disabled" : ""}>Open</button>
        </div>
      `
        )
        .join("")}
      <div class="footnote">Odds shown are exact. Duplicate pulls still count toward your collection total.</div>
    `;

    container.querySelectorAll("[data-pack]").forEach((btn) => {
      btn.addEventListener("click", () => handleOpen(btn.dataset.pack, container));
    });
  }

  function handleOpen(packId, container) {
    const pack = PacksModule.PACK_TYPES[packId];
    if (!StateModule.store.spendCoins(pack.cost)) {
      ComponentsModule.showToast("Not enough coins");
      return;
    }
    const pulls = PacksModule.openPack(packId);
    pulls.forEach((p) => StateModule.store.addToCollection(p.id));

    ComponentsModule.showModal(
      `
      <div class="modal-header"><h3>${pack.name} Opened</h3><button class="ghost" id="closeReveal">Close</button></div>
      <div class="pack-reveal-grid">
        ${pulls
          .map(
            (p, i) =>
              `<div class="reveal-card" style="animation-delay:${i * 90}ms">${ComponentsModule.playerCardHTML(p)}</div>`
          )
          .join("")}
      </div>
      <button class="primary" id="doneReveal" style="width:100%">Nice!</button>
    `,
      {
        onMount: (root) => {
          root.querySelector("#closeReveal").addEventListener("click", ComponentsModule.closeModal);
          root.querySelector("#doneReveal").addEventListener("click", ComponentsModule.closeModal);
        },
      }
    );
    renderStore(container);
  }

  return { renderStore };
})();

// Module: ui/squad.js
// ---------------------------------------------------------------------
const SquadModule = (() => {
  function renderSquad(container) {
    const formationId = StateModule.store.state.formation;
    const formation = FormationsModule.FORMATIONS[formationId];
    const squad = StateModule.store.currentSquad();
    const rating = MatchModule.squadRating(squad, formation);

    container.innerHTML = `
      <div class="screen-title">Squad Builder</div>
      <div class="screen-subtitle">Tap a spot to fill it. Rating: <strong>${rating || "--"}</strong></div>
      <div class="formation-select">
        ${Object.keys(FormationsModule.FORMATIONS)
          .map(
            (id) =>
              `<button data-formation="${id}" class="${id === formationId ? "active" : ""}">${id}</button>`
          )
          .join("")}
      </div>
      <div class="pitch">
        ${formation.slots
          .map((slot) => {
            const playerId = squad[slot.key];
            const player = playerId ? PlayersModule.getPlayer(playerId) : null;
            return `
            <div class="pitch-slot ${player ? "filled" : ""} ${player ? require_tier(player) : ""}"
                 style="left:${slot.x}%; top:${slot.y}%;" data-slot="${slot.key}" data-pos="${slot.pos}">
              <div class="chip">${player ? ComponentsModule.initials(player.name) : slot.pos}</div>
              <div class="slot-label">${player ? player.name.split(" ").slice(-1)[0] : slot.pos}</div>
            </div>`;
          })
          .join("")}
      </div>
      <div class="footnote">Formation and squad chemistry are simplified for this fan-made game.</div>
    `;

    container.querySelectorAll("[data-formation]").forEach((btn) => {
      btn.addEventListener("click", () => {
        StateModule.store.setFormation(btn.dataset.formation);
        renderSquad(container);
      });
    });

    container.querySelectorAll("[data-slot]").forEach((slotEl) => {
      slotEl.addEventListener("click", () => openPicker(slotEl.dataset.slot, slotEl.dataset.pos, container));
    });
  }

  function require_tier(player) {
    // Small helper kept local to avoid importing tierFor just for a class name.
    if (player.ovr >= 93) return "tier-icon";
    if (player.ovr >= 88) return "tier-goldplus";
    return "tier-gold";
  }

  function openPicker(slotKey, slotPos, container) {
    const owned = StateModule.store
      .ownedIds()
      .map((id) => PlayersModule.getPlayer(id))
      .filter(Boolean)
      .sort((a, b) => b.ovr - a.ovr);

    const compatible = owned.filter((p) => FormationsModule.isCompatible(slotPos, p.pos));
    const others = owned.filter((p) => !FormationsModule.isCompatible(slotPos, p.pos));
    const currentId = StateModule.store.currentSquad()[slotKey];

    const section = (title, list) =>
      list.length
        ? `<div class="section-title" style="margin-top:14px;">${title}</div>
           <div class="card-grid">${list.map((p) => ComponentsModule.playerCardHTML(p, { selectable: true })).join("")}</div>`
        : "";

    ComponentsModule.showModal(
      `
      <div class="modal-header"><h3>Choose ${slotPos}</h3><button class="ghost" id="closePicker">Close</button></div>
      ${currentId ? `<button class="danger" id="clearSlot" style="width:100%;margin-bottom:12px;">Remove Player</button>` : ""}
      ${
        owned.length
          ? section("Best Fit", compatible) + section("Other Players", others)
          : `<div class="empty-state">You don't own any players yet. Open a pack first!</div>`
      }
    `,
      {
        onMount: (root) => {
          root.querySelector("#closePicker").addEventListener("click", ComponentsModule.closeModal);
          root.querySelector("#clearSlot")?.addEventListener("click", () => {
            StateModule.store.clearSlot(slotKey);
            ComponentsModule.closeModal();
            renderSquad(container);
          });
          root.querySelectorAll("[data-player-id]").forEach((card) => {
            card.addEventListener("click", () => {
              StateModule.store.assignToSlot(slotKey, card.dataset.playerId);
              ComponentsModule.closeModal();
              renderSquad(container);
            });
          });
        },
      }
    );
  }

  return { renderSquad };
})();

// Module: ui/collection.js
// ---------------------------------------------------------------------
const CollectionModule = (() => {
  let activeFilter = "ALL";

  function renderCollection(container) {
    const owned = StateModule.store
      .ownedIds()
      .map((id) => PlayersModule.getPlayer(id))
      .filter(Boolean)
      .sort((a, b) => b.ovr - a.ovr);

    const filtered = activeFilter === "ALL" ? owned : owned.filter((p) => p.pos === activeFilter);
    const filters = ["ALL", ...PlayersModule.POSITIONS];

    container.innerHTML = `
      <div class="screen-title">Your Collection</div>
      <div class="screen-subtitle">${owned.length} unique player${owned.length === 1 ? "" : "s"} owned</div>
      <div class="formation-select">
        ${filters
          .map(
            (f) =>
              `<button data-filter="${f}" class="${f === activeFilter ? "active" : ""}">${f}</button>`
          )
          .join("")}
      </div>
      ${
        filtered.length
          ? `<div class="card-grid">${filtered
              .map((p) => ComponentsModule.playerCardHTML(p, { count: StateModule.store.state.collection[p.id], selectable: true }))
              .join("")}</div>`
          : `<div class="empty-state">No players in this position yet. Try opening a pack!</div>`
      }
    `;

    container.querySelectorAll("[data-filter]").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.filter;
        renderCollection(container);
      });
    });

    container.querySelectorAll("[data-player-id]").forEach((card) => {
      card.addEventListener("click", () => {
        const player = PlayersModule.getPlayer(card.dataset.playerId);
        ComponentsModule.showModal(`
          <div class="modal-header"><h3>${player.name}</h3></div>
          <div style="max-width:220px;margin:0 auto;">
            ${ComponentsModule.playerCardHTML(player, { showStats: true })}
          </div>
          <div class="footnote">Born ${player.born} · ${player.nation}${player.legend ? " · Retired legend" : ""}</div>
        `);
      });
    });
  }

  return { renderCollection };
})();

// ---------------------------------------------------------------------
// Module: ui/liveMatch.js
// ---------------------------------------------------------------------
const LiveMatchUIModule = (() => {
  const MOVE_KEYS = {
    ArrowUp: [0, -1], KeyW: [0, -1],
    ArrowDown: [0, 1], KeyS: [0, 1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0],
    ArrowRight: [1, 0], KeyD: [1, 0],
  };

  function renderLiveMatch(container, squad, formation, opponent, onDone) {
    const match = new LiveMatchEngineModule.LiveMatch(squad, formation, opponent);

    container.innerHTML = `
      <div class="screen-title">vs ${opponent.name}</div>
      <div class="live-hud">
        <div class="live-score" id="liveScore">0 - 0</div>
        <div class="live-clock" id="liveClock">3:00</div>
      </div>
      <div class="pitch-wrap" id="pitchWrap">
        <canvas id="matchCanvas"></canvas>
        <div class="joystick-base" id="joyBase"><div class="joystick-knob" id="joyKnob"></div></div>
        <div class="action-buttons">
          <button class="action-btn tackle" id="tackleBtn">TACKLE</button>
          <button class="action-btn pass" id="passBtn">PASS</button>
          <button class="action-btn shoot" id="shootBtn">SHOOT</button>
        </div>
      </div>
      <div class="screen-subtitle" style="text-align:center;margin-top:10px;">
        Arrows/WASD to move &middot; Space to shoot &middot; X to pass &middot; C to tackle &middot; you always control whoever's closest to the ball
      </div>
      <div id="matchSummary"></div>
    `;

    const canvas = container.querySelector("#matchCanvas");
    canvas.width = LiveMatchEngineModule.PITCH_W * 2;
    canvas.height = LiveMatchEngineModule.PITCH_H * 2;
    const ctx = canvas.getContext("2d");

    const scoreEl = container.querySelector("#liveScore");
    const clockEl = container.querySelector("#liveClock");
    const summaryEl = container.querySelector("#matchSummary");
    const joyBase = container.querySelector("#joyBase");
    const joyKnob = container.querySelector("#joyKnob");
    const passBtn = container.querySelector("#passBtn");
    const shootBtn = container.querySelector("#shootBtn");
    const tackleBtn = container.querySelector("#tackleBtn");

    const pressed = new Set();
    const actionsQueued = { shoot: false, pass: false, tackle: false };
    let joyVec = { x: 0, y: 0 };
    let joyActive = false;
    let joyPointerId = null;

    function onKeyDown(e) {
      if (MOVE_KEYS[e.code]) { pressed.add(e.code); e.preventDefault(); }
      if (e.code === "Space") { actionsQueued.shoot = true; e.preventDefault(); }
      if (e.code === "KeyX") { actionsQueued.pass = true; e.preventDefault(); }
      if (e.code === "KeyC") { actionsQueued.tackle = true; e.preventDefault(); }
    }
    function onKeyUp(e) {
      if (MOVE_KEYS[e.code]) pressed.delete(e.code);
    }
    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keyup", onKeyUp);

    function joyVecFromEvent(e) {
      const rect = joyBase.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const max = rect.width / 2;
      const d = Math.hypot(dx, dy) || 1;
      const clampedD = Math.min(d, max);
      const nx = (dx / d) * clampedD;
      const ny = (dy / d) * clampedD;
      joyKnob.style.transform = `translate(${nx}px, ${ny}px)`;
      return { x: clamp(nx / max, -1, 1), y: clamp(ny / max, -1, 1) };
    }
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function onJoyDown(e) {
      joyActive = true;
      joyPointerId = e.pointerId;
      joyBase.setPointerCapture(e.pointerId);
      joyVec = joyVecFromEvent(e);
    }
    function onJoyMove(e) {
      if (!joyActive || e.pointerId !== joyPointerId) return;
      joyVec = joyVecFromEvent(e);
    }
    function onJoyUp(e) {
      if (e.pointerId !== joyPointerId) return;
      joyActive = false;
      joyPointerId = null;
      joyVec = { x: 0, y: 0 };
      joyKnob.style.transform = `translate(0px, 0px)`;
    }
    joyBase.addEventListener("pointerdown", onJoyDown);
    joyBase.addEventListener("pointermove", onJoyMove);
    joyBase.addEventListener("pointerup", onJoyUp);
    joyBase.addEventListener("pointercancel", onJoyUp);

    function fireShoot() { actionsQueued.shoot = true; }
    function firePass() { actionsQueued.pass = true; }
    function fireTackle() { actionsQueued.tackle = true; }
    shootBtn.addEventListener("click", fireShoot);
    passBtn.addEventListener("click", firePass);
    tackleBtn.addEventListener("click", fireTackle);

    function computeInput() {
      if (joyActive) return joyVec;
      let x = 0, y = 0;
      for (const code of pressed) {
        const [dx, dy] = MOVE_KEYS[code];
        x += dx; y += dy;
      }
      const d = Math.hypot(x, y);
      return d > 1 ? { x: x / d, y: y / d } : { x, y };
    }

    function drawPitch() {
      ctx.fillStyle = "#0f5c2e";
      ctx.fillRect(0, 0, LiveMatchEngineModule.PITCH_W, LiveMatchEngineModule.PITCH_H);
      ctx.strokeStyle = "rgba(255,255,255,0.4)";
      ctx.lineWidth = 2;
      ctx.strokeRect(4, 4, LiveMatchEngineModule.PITCH_W - 8, LiveMatchEngineModule.PITCH_H - 8);
      ctx.beginPath();
      ctx.moveTo(4, LiveMatchEngineModule.PITCH_H / 2);
      ctx.lineTo(LiveMatchEngineModule.PITCH_W - 4, LiveMatchEngineModule.PITCH_H / 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(LiveMatchEngineModule.PITCH_W / 2, LiveMatchEngineModule.PITCH_H / 2, 45, 0, Math.PI * 2);
      ctx.stroke();
      // Goal mouths
      ctx.strokeRect(LiveMatchEngineModule.PITCH_W / 2 - LiveMatchEngineModule.GOAL_WIDTH / 2, 4, LiveMatchEngineModule.GOAL_WIDTH, 40);
      ctx.strokeRect(LiveMatchEngineModule.PITCH_W / 2 - LiveMatchEngineModule.GOAL_WIDTH / 2, LiveMatchEngineModule.PITCH_H - 44, LiveMatchEngineModule.GOAL_WIDTH, 40);
      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(LiveMatchEngineModule.PITCH_W / 2 - LiveMatchEngineModule.GOAL_WIDTH / 2 - 3, 0, LiveMatchEngineModule.GOAL_WIDTH + 6, 3);
      ctx.fillRect(LiveMatchEngineModule.PITCH_W / 2 - LiveMatchEngineModule.GOAL_WIDTH / 2 - 3, LiveMatchEngineModule.PITCH_H - 3, LiveMatchEngineModule.GOAL_WIDTH + 6, 3);
    }

    function drawPlayers() {
      for (const p of match.players) {
        const isControlled = p.id === match.controlledId;
        const hasBall = match.ball.owner === p.id;
        ctx.beginPath();
        ctx.arc(p.x, p.y, LiveMatchEngineModule.PLAYER_R, 0, Math.PI * 2);
        ctx.fillStyle = p.team === "home" ? "#34d399" : "#f87171";
        ctx.fill();
        if (isControlled) {
          ctx.lineWidth = 3;
          ctx.strokeStyle = "#fbbf24";
          ctx.stroke();
        } else if (hasBall) {
          ctx.lineWidth = 2;
          ctx.strokeStyle = "#ffffff";
          ctx.stroke();
        }
      }
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(match.ball.x, match.ball.y, LiveMatchEngineModule.BALL_R, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = "#334155";
      ctx.stroke();
    }

    function draw() {
      ctx.save();
      ctx.setTransform(2, 0, 0, 2, 0, 0);
      drawPitch();
      drawPlayers();
      drawBall();
      ctx.restore();
    }

    function formatClock(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${String(sec).padStart(2, "0")}`;
    }

    // Physics/game-state ticks on setInterval rather than requestAnimationFrame:
    // rAF is suspended by the browser whenever document.visibilityState is
    // "hidden", which this embedded preview pane reports even while the tab
    // is on-screen — rAF would silently never fire and the match would
    // freeze at kickoff. The dt cap is deliberately generous (not ~1 frame's
    // worth): background tabs throttle timers to a few hundred ms between
    // ticks, and a tight cap there would desync the match clock into slow
    // motion instead of just updating choppier. Simple velocity-based
    // movement stays stable at any dt, so there's no physics cost to
    // allowing bigger steps.
    //
    // Rendering is kept on a *separate* requestAnimationFrame loop so it's
    // synced to the display's actual refresh rate — drawing from setInterval
    // instead (as this used to) produces visible stutter/tearing since those
    // callbacks aren't timed to the compositor. rAF only drives drawing here,
    // never game logic, so it staying paused in a hidden tab just means the
    // (already-paused-looking) canvas doesn't repaint — it can't desync the
    // match clock.
    let timer = null;
    let raf = null;
    let last = performance.now();
    const TICK_MS = 33;

    function tick() {
      const now = performance.now();
      const dt = Math.min(0.25, (now - last) / 1000);
      last = now;
      if (!match.finished) {
        const input = computeInput();
        const actions = { shoot: actionsQueued.shoot, pass: actionsQueued.pass, tackle: actionsQueued.tackle };
        actionsQueued.shoot = false;
        actionsQueued.pass = false;
        actionsQueued.tackle = false;
        match.update(dt, input, actions);
        scoreEl.textContent = `${match.scoreHome} - ${match.scoreAway}`;
        clockEl.textContent = formatClock(match.clock);
      } else {
        clearInterval(timer);
        finish();
      }
    }
    timer = setInterval(tick, TICK_MS);

    function renderLoop() {
      draw();
      if (!match.finished) raf = requestAnimationFrame(renderLoop);
    }
    raf = requestAnimationFrame(renderLoop);

    function finish() {
      const result = match.summary();
      StateModule.store.addCoins(result.coins);
      StateModule.store.recordMatch({
        opponent: opponent.name,
        homeGoals: result.homeGoals,
        awayGoals: result.awayGoals,
        result: result.result,
        coins: result.coins,
      });
      summaryEl.innerHTML = `
        <div class="result-banner ${result.result}">
          ${result.result === "win" ? "Victory!" : result.result === "draw" ? "Draw" : "Defeat"} · Full Time ${result.homeGoals}-${result.awayGoals} · +${result.coins.toLocaleString()} coins
        </div>
        ${
          result.motm
            ? `<div class="section-title">Man of the Match</div>
               <div style="max-width:200px;margin:0 auto 10px;">${ComponentsModule.playerCardHTML(result.motm, { showStats: true })}</div>`
            : ""
        }
        <button class="primary" id="backToFixtures" style="width:100%;">Back to Fixtures</button>
      `;
      summaryEl.querySelector("#backToFixtures").addEventListener("click", () => {
        cleanup();
        onDone();
      });
      passBtn.disabled = true;
      shootBtn.disabled = true;
      tackleBtn.disabled = true;
    }

    function cleanup() {
      clearInterval(timer);
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener("keydown", onKeyDown);
      window.removeEventListener("keyup", onKeyUp);
      joyBase.removeEventListener("pointerdown", onJoyDown);
      joyBase.removeEventListener("pointermove", onJoyMove);
      joyBase.removeEventListener("pointerup", onJoyUp);
      joyBase.removeEventListener("pointercancel", onJoyUp);
      shootBtn.removeEventListener("click", fireShoot);
      passBtn.removeEventListener("click", firePass);
      tackleBtn.removeEventListener("click", fireTackle);
    }

    return cleanup;
  }

  return { renderLiveMatch };
})();

// ---------------------------------------------------------------------
// Module: ui/matchScreen.js
// ---------------------------------------------------------------------
const MatchScreenModule = (() => {
  let activeCleanup = null;

  // Called by the router before switching tabs, so a live match's animation
  // loop and window key listeners never keep running after you navigate away.
  function cleanupMatchScreen() {
    if (activeCleanup) {
      activeCleanup();
      activeCleanup = null;
    }
  }

  function renderMatch(container) {
    cleanupMatchScreen();
    const formation = FormationsModule.FORMATIONS[StateModule.store.state.formation];
    const squad = StateModule.store.currentSquad();
    const filled = MatchModule.filledSlots(squad, formation).length;
    const rating = MatchModule.squadRating(squad, formation);

    if (filled < 11) {
      container.innerHTML = `
        <div class="screen-title">Play a Match</div>
        <div class="empty-state">
          Your squad only has ${filled}/11 players.<br/>
          Fill your ${formation.name} lineup in Squad Builder before kicking off.
        </div>
      `;
      return;
    }

    container.innerHTML = `
      <div class="screen-title">Play a Match</div>
      <div class="screen-subtitle">Your squad rating: <strong>${rating}</strong> (${formation.name})</div>
      ${MatchModule.OPPONENTS.map(
        (o) => `
        <div class="opponent-card">
          <div>
            <div class="oname">${o.name}</div>
            <div class="orating">Opponent rating: ${o.rating}</div>
            <div class="oreward">🪙 up to ${o.reward.toLocaleString()}</div>
          </div>
          <button class="primary" data-opponent="${o.id}">Kick Off</button>
        </div>`
      ).join("")}
    `;

    container.querySelectorAll("[data-opponent]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const opponent = MatchModule.OPPONENTS.find((o) => o.id === btn.dataset.opponent);
        activeCleanup = LiveMatchUIModule.renderLiveMatch(container, squad, formation, opponent, () => {
          activeCleanup = null;
          renderMatch(container);
        });
      });
    });
  }

  return { renderMatch, cleanupMatchScreen };
})();

// ---------------------------------------------------------------------
// Module: main.js
// ---------------------------------------------------------------------
(() => {
  const store = StateModule.store;
  const renderHome = HomeModule.renderHome;
  const renderStore = StoreUIModule.renderStore;
  const renderCollection = CollectionModule.renderCollection;
  const renderSquad = SquadModule.renderSquad;
  const renderMatch = MatchScreenModule.renderMatch;
  const cleanupMatchScreen = MatchScreenModule.cleanupMatchScreen;

  const TABS = [
    { id: "home", label: "Home", icon: "🏠", render: (el) => renderHome(el, navigate) },
    { id: "squad", label: "Squad", icon: "🧩", render: renderSquad },
    { id: "match", label: "Play", icon: "⚽", render: renderMatch },
    { id: "store", label: "Store", icon: "🎁", render: renderStore },
    { id: "collection", label: "Cards", icon: "📇", render: renderCollection },
  ];

  let currentTab = "home";

  const app = document.getElementById("app");
  app.innerHTML = `
    <header class="app-header">
      <div class="brand"><span class="ball">⚽</span> Ultimate Eleven</div>
      <div class="coin-pill">🪙 <span id="coinCount">0</span></div>
    </header>
    <main class="app-main" id="main"></main>
    <nav class="bottom-nav" id="nav"></nav>
  `;

  const mainEl = document.getElementById("main");
  const navEl = document.getElementById("nav");
  const coinEl = document.getElementById("coinCount");

  navEl.innerHTML = TABS.map(
    (t) => `<button class="nav-btn" data-tab="${t.id}"><span class="icon">${t.icon}</span>${t.label}</button>`
  ).join("");

  navEl.querySelectorAll("[data-tab]").forEach((btn) => {
    btn.addEventListener("click", () => navigate(btn.dataset.tab));
  });

  function navigate(tabId) {
    cleanupMatchScreen();
    currentTab = tabId;
    renderAll();
    mainEl.scrollTo({ top: 0 });
  }

  function renderAll() {
    navEl.querySelectorAll("[data-tab]").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.tab === currentTab);
    });
    coinEl.textContent = store.state.coins.toLocaleString();
    const tab = TABS.find((t) => t.id === currentTab);
    tab.render(mainEl);
  }

  store.subscribe(() => {
    coinEl.textContent = store.state.coins.toLocaleString();
  });

  renderAll();
})();
  </script>
</body>
