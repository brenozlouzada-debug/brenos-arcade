<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tank — Particle Wave Field</title>
<style>
  :root {
    --bg: #050b12;
    --bg-deep: #020609;
    --panel: rgba(10, 22, 33, 0.62);
    --panel-border: rgba(120, 200, 200, 0.16);
    --ink: #eaf6f6;
    --ink-dim: #7f97a3;
    --ink-faint: #4c6169;
    --accent: #49e0c9;
    --accent-dim: #1f6e64;
    --trough: #0c2338;
    --crest: #e8fffa;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: var(--font-ui);
    color: var(--ink);
  }

  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
    background:
      radial-gradient(120% 90% at 50% 38%, #0a1a26 0%, var(--bg) 55%, var(--bg-deep) 100%);
  }
  #stage.dragging { cursor: grabbing; }

  .hud {
    position: fixed;
    z-index: 5;
    pointer-events: none;
  }

  .hud-title {
    top: 22px;
    left: 24px;
    line-height: 1;
  }

  .hud-title .word {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
    text-shadow: 0 1px 12px rgba(0,0,0,0.6);
  }

  .hud-title .word span {
    color: var(--accent);
  }

  .hud-title .sub {
    margin-top: 5px;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .hud-stats {
    top: 24px;
    right: 24px;
    text-align: right;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    color: var(--ink-faint);
    line-height: 1.7;
    letter-spacing: 0.02em;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }
  .hud-stats b { color: var(--ink-dim); font-weight: 500; }

  .hint {
    bottom: 118px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink-dim);
    background: rgba(4, 10, 15, 0.5);
    padding: 7px 14px;
    border-radius: 100px;
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(6px);
    transition: opacity 900ms ease;
    white-space: nowrap;
  }
  .hint.faded { opacity: 0; }

  .panel {
    position: fixed;
    z-index: 6;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 12px 20px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    max-width: calc(100vw - 32px);
    overflow-x: auto;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 92px;
  }

  .field label {
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .field label em {
    font-style: normal;
    font-family: var(--font-mono);
    color: var(--accent);
    font-size: 10px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 3px;
    border-radius: 2px;
    background: rgba(127, 151, 163, 0.28);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(73, 224, 201, 0.18);
    cursor: pointer;
    margin-top: -5px;
  }
  input[type="range"]::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(73, 224, 201, 0.18);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-track {
    height: 3px;
    border-radius: 2px;
    background: rgba(127, 151, 163, 0.28);
  }

  .divider {
    width: 1px;
    align-self: stretch;
    background: var(--panel-border);
  }

  .toggles {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .chk {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    cursor: pointer;
    user-select: none;
  }
  .chk input {
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    border: 1px solid var(--ink-faint);
    background: transparent;
    cursor: pointer;
    position: relative;
    flex: none;
  }
  .chk input:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .chk input:checked::after {
    content: "";
    position: absolute;
    left: 3.5px;
    top: 1px;
    width: 3px;
    height: 6px;
    border: solid #04231f;
    border-width: 0 1.6px 1.6px 0;
    transform: rotate(40deg);
  }

  select#density {
    background: rgba(127, 151, 163, 0.12);
    color: var(--ink);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    font-family: var(--font-ui);
    font-size: 10.5px;
    padding: 4px 6px;
    outline: none;
  }

  button#reset {
    background: transparent;
    color: var(--ink-dim);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 14px;
    font-family: var(--font-ui);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 150ms ease, border-color 150ms ease;
    flex: none;
  }
  button#reset:hover {
    color: var(--accent);
    border-color: var(--accent-dim);
  }
  button#reset:focus-visible,
  input:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (max-width: 640px) {
    .panel { gap: 14px; padding: 10px 14px; }
    .field { min-width: 74px; }
    .hud-stats { display: none; }
    .hint { bottom: 128px; font-size: 10px; }
  }
</style>
</head>
<body>
<a href="../../index.html" title="Back to Arcade" style="position:fixed;top:10px;left:10px;z-index:2147483647;display:flex;align-items:center;justify-content:center;width:26px;height:26px;background:rgba(0,0,0,0.6);color:#fff;font:14px/1 system-ui,-apple-system,sans-serif;border-radius:50%;text-decoration:none;opacity:0.4;transition:opacity .15s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.4">&larr;</a>


<canvas id="stage"></canvas>

<div class="hud hud-title">
  <div class="word">TANK<span>_</span>01</div>
  <div class="sub">particle wave field</div>
</div>

<div class="hud hud-stats">
  <div><b>grid</b> <span id="statGrid">–</span></div>
  <div><b>particles</b> <span id="statCount">–</span></div>
  <div><b>fps</b> <span id="statFps">–</span></div>
</div>

<div class="hint" id="hint">drag to orbit - scroll to zoom - click the surface to disturb it</div>

<div class="panel">
  <div class="field">
    <label>Ripple<em id="vStrength">1.0</em></label>
    <input type="range" id="strength" min="0.3" max="2.4" step="0.05" value="1.0">
  </div>
  <div class="field">
    <label>Damping<em id="vDamping">0.988</em></label>
    <input type="range" id="damping" min="0.94" max="0.999" step="0.001" value="0.988">
  </div>
  <div class="field">
    <label>Speed<em id="vSpeed">2</em></label>
    <input type="range" id="speed" min="1" max="4" step="1" value="2">
  </div>
  <div class="divider"></div>
  <div class="toggles">
    <label class="chk"><input type="checkbox" id="ambient" checked> ambient rain</label>
    <label class="chk"><input type="checkbox" id="autorotate"> auto-orbit</label>
  </div>
  <div class="field" style="min-width:76px;">
    <label>Density</label>
    <select id="density">
      <option value="32">Low</option>
      <option value="46" selected>Medium</option>
      <option value="62">High</option>
    </select>
  </div>
  <button id="reset" type="button">Reset</button>
</div>

<script>
(function () {
  "use strict";

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");

  var BOX = { halfX: 1, halfZ: 1, ampY: 0.44 };
  var FOV = 50 * Math.PI / 180;

  var dpr = 1, cssW = 0, cssH = 0, cx = 0, cy = 0, focal = 1;

  // ---- wave field state ----
  var gridSize = 46;
  var cur, prev, next, posX, posZ, order, screenX, screenY, screenS, screenA, colR, colG, colB, depthArr;

  function buildGrid(size) {
    gridSize = size;
    var n = size * size;
    cur = new Float32Array(n);
    prev = new Float32Array(n);
    next = new Float32Array(n);
    posX = new Float32Array(n);
    posZ = new Float32Array(n);
    order = new Uint32Array(n);
    screenX = new Float32Array(n);
    screenY = new Float32Array(n);
    screenS = new Float32Array(n);
    screenA = new Float32Array(n);
    colR = new Uint8ClampedArray(n);
    colG = new Uint8ClampedArray(n);
    colB = new Uint8ClampedArray(n);
    depthArr = new Float32Array(n);
    for (var j = 0; j < size; j++) {
      for (var i = 0; i < size; i++) {
        var idx = i + j * size;
        posX[idx] = (i / (size - 1) * 2 - 1) * BOX.halfX;
        posZ[idx] = (j / (size - 1) * 2 - 1) * BOX.halfZ;
        order[idx] = idx;
      }
    }
    document.getElementById("statGrid").textContent = size + "x" + size;
    document.getElementById("statCount").textContent = n.toLocaleString();
  }

  function addImpulse(gx, gz, strength, radius) {
    var r2 = radius * radius * 0.55;
    for (var j = -radius; j <= radius; j++) {
      var zz = gz + j;
      if (zz < 1 || zz >= gridSize - 1) continue;
      for (var i = -radius; i <= radius; i++) {
        var xx = gx + i;
        if (xx < 1 || xx >= gridSize - 1) continue;
        var d2 = i * i + j * j;
        var falloff = Math.exp(-d2 / r2);
        cur[xx + zz * gridSize] += strength * falloff;
      }
    }
  }

  function simulateStep(damping) {
    var w = gridSize;
    for (var j = 1; j < w - 1; j++) {
      var row = j * w;
      for (var i = 1; i < w - 1; i++) {
        var idx = row + i;
        var v = (cur[idx - 1] + cur[idx + 1] + cur[idx - w] + cur[idx + w]) * 0.5 - prev[idx];
        next[idx] = v * damping;
      }
    }
    var tmp = prev;
    prev = cur;
    cur = next;
    next = tmp;
  }

  // ---- camera ----
  var cam = { theta: 0.7, phi: 0.42, radius: 2.9 };
  var isDown = false, moved = false, downX = 0, downY = 0, lastX = 0, lastY = 0;

  function computeCamera() {
    var theta = cam.theta, phi = cam.phi, radius = cam.radius;
    var eye = {
      x: radius * Math.sin(theta) * Math.cos(phi),
      y: radius * Math.sin(phi) + 0.12,
      z: radius * Math.cos(theta) * Math.cos(phi)
    };
    var zx = eye.x, zy = eye.y, zz = eye.z;
    var zl = Math.hypot(zx, zy, zz) || 1e-6;
    zx /= zl; zy /= zl; zz /= zl;
    // xAxis = normalize(cross(up, zAxis))
    var xx = 1 * zz - 0 * zy;
    var xy = 0 * zx - 0 * zz;
    var xz = 0 * zy - 1 * zx;
    var xl = Math.hypot(xx, xy, xz) || 1e-6;
    xx /= xl; xy /= xl; xz /= xl;
    // yAxis = cross(zAxis, xAxis)
    var yx = zy * xz - zz * xy;
    var yy = zz * xx - zx * xz;
    var yz = zx * xy - zy * xx;
    return { eye: eye, xx: xx, xy: xy, xz: xz, yx: yx, yy: yy, yz: yz, zx: zx, zy: zy, zz: zz };
  }

  function pick(px, py) {
    var c = computeCamera();
    var ndx = (px - cx) / focal;
    var ndy = -(py - cy) / focal;
    var dx = ndx * c.xx + ndy * c.yx - c.zx;
    var dy = ndx * c.xy + ndy * c.yy - c.zy;
    var dz = ndx * c.xz + ndy * c.yz - c.zz;
    var dl = Math.hypot(dx, dy, dz) || 1e-6;
    dx /= dl; dy /= dl; dz /= dl;
    if (Math.abs(dy) < 1e-5) return null;
    var t = -c.eye.y / dy;
    if (t <= 0) return null;
    var hx = c.eye.x + dx * t;
    var hz = c.eye.z + dz * t;
    if (Math.abs(hx) > BOX.halfX || Math.abs(hz) > BOX.halfZ) return null;
    return { x: hx, z: hz };
  }

  // ---- color ----
  function hexToRgb(h) {
    var v = parseInt(h.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }
  var TROUGH = hexToRgb("#0c2338");
  var MID = hexToRgb("#2f9e94");
  var CREST = hexToRgb("#e8fffa");

  function paramsFromUI() {
    return {
      strength: parseFloat(document.getElementById("strength").value),
      damping: parseFloat(document.getElementById("damping").value),
      speed: parseInt(document.getElementById("speed").value, 10),
      ambient: document.getElementById("ambient").checked,
      autorotate: document.getElementById("autorotate").checked
    };
  }

  // ---- resize ----
  function resize() {
    var rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cssW = rect.width;
    cssH = rect.height;
    canvas.width = Math.max(1, Math.round(cssW * dpr));
    canvas.height = Math.max(1, Math.round(cssH * dpr));
    cx = cssW / 2;
    cy = cssH / 2 - cssH * 0.02;
    focal = (cssH * 0.5) / Math.tan(FOV / 2);
  }

  // ---- pointer interaction ----
  var hintEl = document.getElementById("hint");
  function dismissHint() { hintEl.classList.add("faded"); }

  canvas.addEventListener("pointerdown", function (e) {
    isDown = true; moved = false;
    downX = lastX = e.clientX;
    downY = lastY = e.clientY;
    canvas.classList.add("dragging");
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener("pointermove", function (e) {
    if (!isDown) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 4) moved = true;
    if (moved) {
      cam.theta -= dx * 0.0055;
      cam.phi = Math.max(-1.15, Math.min(1.15, cam.phi + dy * 0.0055));
    }
    lastX = e.clientX; lastY = e.clientY;
  });

  function endDrag(e) {
    if (!isDown) return;
    isDown = false;
    canvas.classList.remove("dragging");
    dismissHint();
    if (!moved) {
      var rect = canvas.getBoundingClientRect();
      var hit = pick(e.clientX - rect.left, e.clientY - rect.top);
      if (hit) {
        var gx = Math.round((hit.x / BOX.halfX * 0.5 + 0.5) * (gridSize - 1));
        var gz = Math.round((hit.z / BOX.halfZ * 0.5 + 0.5) * (gridSize - 1));
        var p = paramsFromUI();
        addImpulse(gx, gz, -p.strength * BOX.ampY * 0.5, 3);
      }
    }
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    cam.radius = Math.max(1.5, Math.min(6.5, cam.radius + e.deltaY * 0.0015 * cam.radius));
  }, { passive: false });

  document.getElementById("reset").addEventListener("click", function () {
    cur.fill(0); prev.fill(0); next.fill(0);
  });

  document.getElementById("density").addEventListener("change", function (e) {
    buildGrid(parseInt(e.target.value, 10));
  });

  var strengthEl = document.getElementById("strength");
  var dampingEl = document.getElementById("damping");
  var speedEl = document.getElementById("speed");
  function syncReadouts() {
    document.getElementById("vStrength").textContent = parseFloat(strengthEl.value).toFixed(2);
    document.getElementById("vDamping").textContent = parseFloat(dampingEl.value).toFixed(3);
    document.getElementById("vSpeed").textContent = speedEl.value;
  }
  [strengthEl, dampingEl, speedEl].forEach(function (el) {
    el.addEventListener("input", syncReadouts);
  });

  // ---- ambient rain ----
  var rainTimer = 0;
  function maybeRain(dt) {
    rainTimer -= dt;
    if (rainTimer <= 0) {
      rainTimer = 420 + Math.random() * 900;
      var gx = 4 + Math.floor(Math.random() * (gridSize - 8));
      var gz = 4 + Math.floor(Math.random() * (gridSize - 8));
      addImpulse(gx, gz, (0.5 + Math.random() * 0.7) * BOX.ampY * 0.4, 2);
    }
  }

  // ---- render ----
  function render(camState, heightScale) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);

    var n = gridSize * gridSize;
    var ex = camState.eye.x, ey = camState.eye.y, ez = camState.eye.z;
    var refDepth = cam.radius;
    var baseSize = (gridSize <= 34 ? 4.4 : gridSize <= 50 ? 3.2 : 2.35);

    for (var idx = 0; idx < n; idx++) {
      var h = cur[idx] * heightScale;
      var rx = posX[idx] - ex;
      var ry = h - ey;
      var rz = posZ[idx] - ez;
      var czp = rx * camState.zx + ry * camState.zy + rz * camState.zz;
      var depth = -czp;
      if (depth < 0.05) depth = 0.05;
      var cxp = rx * camState.xx + ry * camState.xy + rz * camState.xz;
      var cyp = rx * camState.yx + ry * camState.yy + rz * camState.yz;
      screenX[idx] = cx + (cxp / depth) * focal;
      screenY[idx] = cy - (cyp / depth) * focal;
      depthArr[idx] = depth;
      var sizeF = baseSize * (refDepth / depth);
      if (sizeF < 0.5) sizeF = 0.5;
      if (sizeF > baseSize * 3.2) sizeF = baseSize * 3.2;
      screenS[idx] = sizeF;

      var hn = h / (BOX.ampY * 0.9);
      if (hn > 1) hn = 1; else if (hn < -1) hn = -1;

      var gx1 = idx - 1, gx2 = idx + 1, gz1 = idx - gridSize, gz2 = idx + gridSize;
      var slopeX = 0, slopeZ = 0;
      var col = idx % gridSize;
      if (col > 0 && col < gridSize - 1) slopeX = cur[gx2] - cur[gx1];
      var rowIdx = (idx / gridSize) | 0;
      if (rowIdx > 0 && rowIdx < gridSize - 1) slopeZ = cur[gz2] - cur[gz1];
      var light = 0.55 - slopeX * 6 - slopeZ * 3.5;
      if (light < 0) light = 0; else if (light > 1) light = 1;

      var r, g, b;
      if (hn >= 0) {
        r = TROUGH[0] + (MID[0] - TROUGH[0]) * (hn) + (CREST[0] - MID[0]) * Math.max(0, hn - 0.5) * 2;
        g = TROUGH[1] + (MID[1] - TROUGH[1]) * (hn) + (CREST[1] - MID[1]) * Math.max(0, hn - 0.5) * 2;
        b = TROUGH[2] + (MID[2] - TROUGH[2]) * (hn) + (CREST[2] - MID[2]) * Math.max(0, hn - 0.5) * 2;
      } else {
        var t2 = 1 + hn;
        r = TROUGH[0] * (1 - t2 * 0.35);
        g = TROUGH[1] * (1 - t2 * 0.35);
        b = TROUGH[2] * (1 - t2 * 0.35);
      }
      colR[idx] = r * (0.55 + light * 0.65);
      colG[idx] = g * (0.55 + light * 0.65);
      colB[idx] = b * (0.55 + light * 0.65);

      var fade = 1 - depth / (cam.radius * 2.4);
      if (fade < 0.3) fade = 0.3; else if (fade > 1) fade = 1;
      screenA[idx] = fade;
    }

    for (var k = 0; k < n; k++) order[k] = k;
    var da = depthArr;
    Array.prototype.sort.call(order, function (a, b) { return da[b] - da[a]; });

    for (var s = 0; s < n; s++) {
      var pi = order[s];
      var x = screenX[pi], y = screenY[pi];
      if (x < -20 || x > cssW + 20 || y < -20 || y > cssH + 20) continue;
      ctx.beginPath();
      ctx.fillStyle = "rgba(" + colR[pi] + "," + colG[pi] + "," + colB[pi] + "," + screenA[pi].toFixed(3) + ")";
      ctx.arc(x, y, screenS[pi], 0, 6.283185);
      ctx.fill();
    }
  }

  // ---- main loop ----
  var lastT = performance.now();
  var fpsAcc = 0, fpsN = 0, fpsShown = 0, fpsTimer = 0;

  function frame(now) {
    var dt = Math.min(64, now - lastT);
    lastT = now;
    var p = paramsFromUI();

    if (p.ambient) maybeRain(dt);

    for (var i = 0; i < p.speed; i++) simulateStep(p.damping);

    if (p.autorotate && !isDown && !reduceMotion) {
      cam.theta += dt * 0.00016;
    }

    var camState = computeCamera();
    render(camState, 1.0);

    fpsAcc += dt; fpsN++;
    fpsTimer += dt;
    if (fpsTimer > 400) {
      fpsShown = Math.round(1000 / (fpsAcc / fpsN));
      document.getElementById("statFps").textContent = fpsShown;
      fpsAcc = 0; fpsN = 0; fpsTimer = 0;
    }

    requestAnimationFrame(frame);
  }

  function seedInitialRipples() {
    addImpulse((gridSize * 0.5) | 0, (gridSize * 0.5) | 0, BOX.ampY * 0.85, 5);
    addImpulse((gridSize * 0.3) | 0, (gridSize * 0.65) | 0, -BOX.ampY * 0.5, 3);
  }

  buildGrid(46);
  resize();
  window.addEventListener("resize", resize);
  syncReadouts();
  seedInitialRipples();
  requestAnimationFrame(frame);
})();
</script>

</body>
