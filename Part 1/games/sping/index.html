<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>SPING</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0b0d17;
  --panel: rgba(18, 20, 34, 0.92);
  --panel-border: rgba(255, 255, 255, 0.08);
  --text: #f2f3f8;
  --text-dim: rgba(242, 243, 248, 0.6);
  --accent: #6C5CE7;
  --accent-2: #00D9C0;
  --danger: #ff5470;
  --gold: #FFC94A;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

html, body {
  height: 100%;
  background: #05060a;
  color: var(--text);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

#app {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

#canvas-wrap {
  position: relative;
  background: #000;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
  /* actual width/height are set from JS to preserve the 9:16 game
     resolution while fitting the viewport -- see fitCanvasWrap() */
}

#game-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.hidden { display: none !important; }

/* HUD */
#hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 16px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  pointer-events: none;
}
#hud > * { pointer-events: auto; }
#hud-right { display: flex; gap: 8px; }
.hud-pill {
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.icon-btn {
  width: 42px; height: 42px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(4px);
  color: var(--text);
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.icon-btn:active { transform: scale(0.94); }

#hint {
  position: absolute;
  left: 50%; top: 40%;
  transform: translate(-50%, -50%);
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 15px;
  letter-spacing: 0.02em;
  opacity: 1;
  transition: opacity 0.6s ease;
  pointer-events: none;
}
#hint.fade { opacity: 0; }

/* Screens */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: radial-gradient(120% 100% at 50% 0%, #1a1d34 0%, #0b0d17 60%, #05060a 100%);
  padding: 28px 24px;
  overflow-y: auto;
}

.title-wrap { text-align: center; margin-top: 14vh; }
.game-title {
  font-size: 64px;
  font-weight: 800;
  letter-spacing: 0.06em;
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 4px 18px rgba(108, 92, 231, 0.45));
}
.subtitle { color: var(--text-dim); margin-top: 6px; font-size: 15px; letter-spacing: 0.04em; }

.menu-stats {
  margin-top: 28px;
  margin-bottom: 34px;
  font-size: 20px;
  font-weight: 700;
  color: var(--gold);
}
.menu-stats .dim { color: var(--text-dim); font-weight: 500; }

.btn {
  width: 100%;
  max-width: 300px;
  padding: 16px;
  margin: 8px 0;
  border-radius: 16px;
  border: 1px solid var(--panel-border);
  background: rgba(255, 255, 255, 0.06);
  color: var(--text);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: transform 0.08s ease, background 0.15s ease;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  border: none;
  box-shadow: 0 8px 24px rgba(108, 92, 231, 0.4);
}
.btn-ghost {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: var(--text-dim);
  font-weight: 600;
}

.screen-header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.screen-header h2 { font-size: 20px; font-weight: 700; }
.screen-header .spacer { width: 42px; }

/* World select */
.world-list {
  width: 100%;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.world-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  border-radius: 18px;
  border: 1px solid var(--panel-border);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.world-card .world-swatch {
  width: 54px; height: 54px;
  border-radius: 14px;
  flex-shrink: 0;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
}
.world-card .world-info { flex: 1; min-width: 0; }
.world-card .world-name { font-weight: 700; font-size: 16px; line-height: 1.25; }
.world-card .world-progress { font-size: 13px; color: var(--text-dim); margin-top: 3px; }
.world-card.locked { opacity: 0.45; cursor: not-allowed; }
.world-card .lock-icon { font-size: 20px; }

/* Level grid */
.level-grid {
  width: 100%;
  max-width: 460px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.level-cell {
  aspect-ratio: 1;
  border-radius: 14px;
  border: 1px solid var(--panel-border);
  background: rgba(255, 255, 255, 0.05);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  gap: 4px;
}
.level-cell .level-num { font-size: 18px; font-weight: 700; }
.level-cell .level-stars { font-size: 10px; letter-spacing: 1px; color: var(--gold); }
.level-cell.locked { opacity: 0.35; cursor: not-allowed; }

/* Skins */
.skin-preview-wrap { margin-bottom: 18px; }
#skin-preview-canvas { display: block; }
.skin-grid {
  width: 100%;
  max-width: 460px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  padding-bottom: 20px;
}
.skin-cell {
  aspect-ratio: 1;
  border-radius: 14px;
  border: 1px solid var(--panel-border);
  background: rgba(255, 255, 255, 0.05);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  gap: 4px;
  position: relative;
}
.skin-cell.selected { border-color: var(--accent-2); box-shadow: 0 0 0 2px rgba(0, 217, 192, 0.4); }
.skin-cell canvas { display: block; }
.skin-cell .skin-name { font-size: 10px; color: var(--text-dim); text-align: center; padding: 0 4px; }
.skin-cell.locked { opacity: 0.4; cursor: not-allowed; }
.skin-cell .lock-badge { position: absolute; top: 4px; right: 6px; font-size: 11px; color: var(--text-dim); }

/* Overlays */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(3, 4, 8, 0.72);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
}
.panel {
  width: 88%;
  max-width: 340px;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 22px;
  padding: 28px 24px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
.panel h2 { font-size: 22px; margin-bottom: 18px; }
.stars-row { font-size: 40px; letter-spacing: 6px; color: var(--gold); margin-bottom: 8px; }
#complete-stats { color: var(--text-dim); font-size: 14px; margin-bottom: 20px; }

@media (max-width: 560px) {
  .game-title { font-size: 50px; }
}

</style>
</head>

<script>
// ---- src/constants.js ----
// Shared tuning constants. Used by the browser game, the level generator,
// and the Node-based bot validator, so gameplay feel and level solvability
// always agree.

const GRAVITY = 1500; // px/s^2
const BALL_RADIUS = 14;
const GRAB_RADIUS = 95; // pivot capture radius
const RELEASE_COOLDOWN = 0.15; // s, prevents instant re-grab of the pivot just released
const MAX_SPEED = 2200; // px/s, safety clamp on free flight
const MIN_SPIN_SPEED = 90; // px/s, a swing's tangential speed floor -- keeps it orbiting instead of slowing to a stop and swinging back like a real pendulum
const GEM_RADIUS = 11;
const HAZARD_RADIUS = 20;
const GOAL_RADIUS = 60;
const FIXED_DT = 1 / 120;

const VIEW_W = 540;
const VIEW_H = 960;
const BOUNDS_HEIGHT = VIEW_H; // levels are exactly one screen tall; camera only pans horizontally

const WORLD_COUNT = 6;
const LEVELS_PER_WORLD = 15;
const TOTAL_LEVELS = WORLD_COUNT * LEVELS_PER_WORLD;


// ---- src/physics.js ----
// Core swing physics, shared verbatim between the browser game and the
// headless Node bot validator. Keeping this isomorphic is what lets the
// validator prove a level is beatable using the exact rules the player
// experiences.
//
// Mechanic: the ball is always falling under gravity. While the input is
// held AND the ball is within a pivot's capture radius, it latches onto
// that pivot with a fixed-length rope and ORBITS it: gravity still speeds
// it up on the way down and slows it on the way up (so it still feels
// physical), but its spin never reverses direction the way a real pendulum
// would if it ran out of energy partway up -- it always keeps going around,
// like SPiNG's spin rather than a back-and-forth swing. Release detaches it
// with whatever tangential speed it had at that instant, so timing the
// release is the entire skill.



function createBallState(x, y) {
  return {
    x, y,
    vx: 0, vy: 0,
    attached: -1, // index into pivots array, or -1 when free-flying
    ropeLen: 0,
    angle: 0, // position around the pivot while attached (radians)
    spinSpeed: 0, // signed tangential speed while attached (px/s)
    spinDir: 1, // rotation direction locked in at grab time, +1 or -1
    lastPivot: -1,
    cooldown: 0,
    dead: false,
    finished: false,
    elapsed: 0,
  };
}

function resetBallState(ball, x, y) {
  ball.x = x; ball.y = y;
  ball.vx = 0; ball.vy = 0;
  ball.attached = -1;
  ball.ropeLen = 0;
  ball.angle = 0;
  ball.spinSpeed = 0;
  ball.spinDir = 1;
  ball.lastPivot = -1;
  ball.cooldown = 0;
  ball.dead = false;
  ball.finished = false;
  ball.elapsed = 0;
}

/**
 * Advance the ball by one fixed timestep.
 * @param {object} ball - mutable ball state from createBallState
 * @param {boolean} held - whether the player's single input is held down
 * @param {Array<{x:number,y:number,radius:number}>} pivots
 * @param {number} dt
 */
function stepBall(ball, held, pivots, dt) {
  if (ball.dead || ball.finished) return;

  ball.elapsed += dt;
  if (ball.cooldown > 0) ball.cooldown = Math.max(0, ball.cooldown - dt);

  // Attempt to grab the nearest eligible pivot in range.
  if (ball.attached === -1 && held) {
    let best = -1;
    let bestDist = Infinity;
    for (let i = 0; i < pivots.length; i++) {
      if (i === ball.lastPivot && ball.cooldown > 0) continue;
      const p = pivots[i];
      const dx = ball.x - p.x;
      const dy = ball.y - p.y;
      const d = Math.hypot(dx, dy);
      if (d <= p.radius && d < bestDist) {
        best = i;
        bestDist = d;
      }
    }
    if (best !== -1) {
      ball.attached = best;
      ball.ropeLen = bestDist;
      const grabbed = pivots[best];
      ball.angle = Math.atan2(ball.y - grabbed.y, ball.x - grabbed.x);
      const tx = -Math.sin(ball.angle);
      const ty = Math.cos(ball.angle);
      ball.spinSpeed = ball.vx * tx + ball.vy * ty; // tangential component of entry velocity
      ball.spinDir = ball.spinSpeed >= 0 ? 1 : -1;
      if (Math.abs(ball.spinSpeed) < MIN_SPIN_SPEED) ball.spinSpeed = ball.spinDir * MIN_SPIN_SPEED;
    }
  }

  // Release on input-up: hand off the current spin as linear velocity.
  if (!held && ball.attached !== -1) {
    const tx = -Math.sin(ball.angle);
    const ty = Math.cos(ball.angle);
    ball.vx = tx * ball.spinSpeed;
    ball.vy = ty * ball.spinSpeed;
    ball.lastPivot = ball.attached;
    ball.attached = -1;
    ball.cooldown = RELEASE_COOLDOWN;
  }

  if (ball.attached !== -1) {
    const p = pivots[ball.attached];
    // Gravity's component along the current tangential direction: speeds
    // the ball up on the descending half of the orbit and slows it on the
    // ascending half, same as a real pendulum -- but then it's floored
    // instead of allowed to cross zero, so it always keeps orbiting.
    const gravityTangential = GRAVITY * Math.cos(ball.angle);
    ball.spinSpeed += gravityTangential * dt;
    if (ball.spinDir > 0 && ball.spinSpeed < MIN_SPIN_SPEED) ball.spinSpeed = MIN_SPIN_SPEED;
    if (ball.spinDir < 0 && ball.spinSpeed > -MIN_SPIN_SPEED) ball.spinSpeed = -MIN_SPIN_SPEED;

    ball.angle += (ball.spinSpeed / ball.ropeLen) * dt;
    ball.x = p.x + Math.cos(ball.angle) * ball.ropeLen;
    ball.y = p.y + Math.sin(ball.angle) * ball.ropeLen;
    ball.vx = -Math.sin(ball.angle) * ball.spinSpeed;
    ball.vy = Math.cos(ball.angle) * ball.spinSpeed;
  } else {
    ball.vy += GRAVITY * dt;
    const speed = Math.hypot(ball.vx, ball.vy);
    if (speed > MAX_SPEED) {
      const s = MAX_SPEED / speed;
      ball.vx *= s;
      ball.vy *= s;
    }
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
  }
}

function clampToBounds(ball, bounds) {
  if (ball.x < bounds.minX) {
    ball.x = bounds.minX;
    ball.vx = Math.abs(ball.vx) * 0.3;
  }
  if (ball.x > bounds.maxX) {
    ball.x = bounds.maxX;
    ball.vx = -Math.abs(ball.vx) * 0.3;
  }
  if (ball.y < bounds.minY) {
    ball.y = bounds.minY;
    ball.vy = Math.abs(ball.vy) * 0.3;
  }
}

function checkGems(ball, gems, ballRadius) {
  let collected = 0;
  for (const g of gems) {
    if (g.taken) continue;
    if (Math.hypot(ball.x - g.x, ball.y - g.y) <= ballRadius + g.radius) {
      g.taken = true;
      collected++;
    }
  }
  return collected;
}

function checkHazards(ball, hazards, ballRadius) {
  for (const h of hazards) {
    if (Math.hypot(ball.x - h.x, ball.y - h.y) <= ballRadius + h.radius) return true;
  }
  return false;
}

function checkGoal(ball, goal, ballRadius) {
  return Math.hypot(ball.x - goal.x, ball.y - goal.y) <= ballRadius + goal.radius;
}

function checkVoid(ball, killY) {
  return ball.y > killY;
}


// ---- src/worlds.js ----
// Visual theme data for each world, plus a generic parallax background
// decoration renderer driven purely by a deterministic hash (so levels
// don't need to store decoration data — the same world always "looks" the
// same without bloating level JSON).

const WORLDS = [
  {
    key: 'meadow', name: 'Meadow Hills',
    bg: ['#8FD3F4', '#D6F5C4'], accent: '#3AA655',
    pivotColor: '#2E7D32', pivotGlow: '#A5D6A7',
    hazardColor: '#C0392B', ropeColor: '#1B5E20',
    decorShape: 'cloud', decorColor: '#FFFFFF',
  },
  {
    key: 'desert', name: 'Sundune Desert',
    bg: ['#FDE9A0', '#F6A15A'], accent: '#C9770E',
    pivotColor: '#8D5524', pivotGlow: '#FFD59E',
    hazardColor: '#7B241C', ropeColor: '#6D4C1B',
    decorShape: 'dune', decorColor: '#E58A3A',
  },
  {
    key: 'reef', name: 'Coral Reef',
    bg: ['#2C8FE0', '#123A78'], accent: '#00E5C7',
    pivotColor: '#01579B', pivotGlow: '#80DEEA',
    hazardColor: '#D6336C', ropeColor: '#014377',
    decorShape: 'bubble', decorColor: '#BFF6FF',
  },
  {
    key: 'volcano', name: 'Volcano Core',
    bg: ['#3A1414', '#8E1B1B'], accent: '#FF7043',
    pivotColor: '#4E342E', pivotGlow: '#FFB74D',
    hazardColor: '#FFD54F', ropeColor: '#3E2723',
    decorShape: 'ember', decorColor: '#FFAB40',
  },
  {
    key: 'tundra', name: 'Frostbite Tundra',
    bg: ['#C9E9FF', '#6FA8D8'], accent: '#4FC3F7',
    pivotColor: '#37474F', pivotGlow: '#E1F5FE',
    hazardColor: '#0D47A1', ropeColor: '#263238',
    decorShape: 'snow', decorColor: '#FFFFFF',
  },
  {
    key: 'nebula', name: 'Neon Nebula',
    bg: ['#0F0C29', '#3A2B7A'], accent: '#E100FF',
    pivotColor: '#B388FF', pivotGlow: '#EA80FC',
    hazardColor: '#FF1744', ropeColor: '#7C4DFF',
    decorShape: 'star', decorColor: '#00E5FF',
  },
];

function hash2(a, b) {
  let h = 2166136261 ^ a;
  h = Math.imul(h ^ b, 16777619);
  h ^= h >>> 15;
  return ((h >>> 0) % 10000) / 10000;
}

const LAYERS = [
  { tile: 260, parallax: 0.25, yBase: 0.18, yJitter: 0.16, scale: 1.0, alpha: 0.55 },
  { tile: 190, parallax: 0.5, yBase: 0.55, yJitter: 0.3, scale: 0.7, alpha: 0.8 },
];

function drawShape(ctx, shape, x, y, s, color, alpha, seedT) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.strokeStyle = color;
  switch (shape) {
    case 'cloud': {
      ctx.beginPath();
      ctx.ellipse(x, y, 30 * s, 16 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 22 * s, y + 4 * s, 20 * s, 13 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(x - 22 * s, y + 5 * s, 18 * s, 11 * s, 0, 0, Math.PI * 2);
      ctx.fill();
      break;
    }
    case 'dune': {
      ctx.beginPath();
      ctx.moveTo(x - 60 * s, y + 30 * s);
      ctx.quadraticCurveTo(x, y - 30 * s, x + 60 * s, y + 30 * s);
      ctx.closePath();
      ctx.fill();
      break;
    }
    case 'bubble': {
      const r = 6 * s + 4 * s * Math.sin(seedT * 3);
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.stroke();
      break;
    }
    case 'ember': {
      const r = 4 * s;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      break;
    }
    case 'snow': {
      const r = 3.5 * s;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      break;
    }
    case 'star': {
      const r = 2.5 * s + 1.5 * s * Math.sin(seedT * 4);
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      break;
    }
    default:
      break;
  }
  ctx.globalAlpha = 1;
}

/**
 * Draws the sky gradient plus deterministic parallax decorations for a
 * world. `cameraX` and `time` (seconds) drive motion; `viewW/viewH` are the
 * logical canvas size; `worldSeed` differentiates one level from the next so
 * neighboring levels in the same world don't look identical.
 */
function drawWorldBackground(ctx, world, cameraX, viewW, viewH, time, worldSeed = 0) {
  const grad = ctx.createLinearGradient(0, 0, 0, viewH);
  grad.addColorStop(0, world.bg[0]);
  grad.addColorStop(1, world.bg[1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, viewW, viewH);

  LAYERS.forEach((layer, li) => {
    const drift = world.decorShape === 'bubble' ? -time * 18 : world.decorShape === 'ember' ? -time * 14 : 0;
    const offset = cameraX * layer.parallax + drift * layer.parallax;
    const firstTile = Math.floor((offset - 40) / layer.tile) - 1;
    const lastTile = Math.floor((offset + viewW + 40) / layer.tile) + 1;
    for (let i = firstTile; i <= lastTile; i++) {
      const seedA = worldSeed * 97 + li * 131 + i;
      const jx = hash2(seedA, 1);
      const jy = hash2(seedA, 2);
      const jscale = 0.7 + hash2(seedA, 3) * 0.6;
      const x = i * layer.tile + jx * layer.tile - offset;
      let y = viewH * (layer.yBase + (jy - 0.5) * layer.yJitter);
      if (world.decorShape === 'bubble' || world.decorShape === 'ember') {
        y = ((y + time * (world.decorShape === 'bubble' ? 40 : 30) * (0.5 + jscale)) % (viewH + 60)) - 30;
        if (world.decorShape === 'bubble') y = viewH - y; // bubbles rise
      }
      drawShape(ctx, world.decorShape, x, y, layer.scale * jscale, world.decorColor, layer.alpha, time + i);
    }
  });
}

// Cosmetic ball skins. Every skin is drawn purely with canvas primitives
// (no image assets) so the whole game stays a handful of self-contained
// files. `unlockAt` is a cumulative star total across all levels.

function outline(ctx, x, y, r) {
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.stroke();
}

function radial(ctx, x, y, r, c1, c2) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);
  return g;
}

function baseCircle(ctx, x, y, r, fill) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = fill;
  ctx.fill();
}

function spikes(ctx, x, y, r, count, color) {
  ctx.fillStyle = color;
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2;
    const bx = x + Math.cos(a) * r * 0.92;
    const by = y + Math.sin(a) * r * 0.92;
    const tx = x + Math.cos(a) * r * 1.35;
    const ty = y + Math.sin(a) * r * 1.35;
    const pa = a + Math.PI / 2;
    const w = r * 0.16;
    ctx.beginPath();
    ctx.moveTo(bx + Math.cos(pa) * w, by + Math.sin(pa) * w);
    ctx.lineTo(bx - Math.cos(pa) * w, by - Math.sin(pa) * w);
    ctx.lineTo(tx, ty);
    ctx.closePath();
    ctx.fill();
  }
}

function facets(ctx, x, y, r, color, count = 6) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.2;
  ctx.globalAlpha = 0.5;
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ---- src/render.js ----
// Pure drawing helpers for gameplay entities. Everything here takes a
// canvas context plus plain data -- no state lives in this module.

function drawPivot(ctx, p, world, active, t) {
  ctx.globalAlpha = active ? 0.16 : 0.07;
  ctx.fillStyle = world.pivotGlow;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  const pulse = active ? 1 + 0.12 * Math.sin(t * 14) : 1;
  ctx.fillStyle = world.pivotColor;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 9 * pulse, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = active ? world.pivotGlow : 'rgba(255,255,255,0.55)';
  ctx.lineWidth = active ? 3 : 2;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 9 * pulse + (active ? 5 : 3), 0, Math.PI * 2);
  ctx.stroke();
}

function drawHazard(ctx, h, world, t) {
  // Deliberately a dark "mine" silhouette with colored spike tips, not a
  // filled colored circle -- ball skins are all light/gradient-filled
  // circles, so this shape can never be mistaken for the player's ball no
  // matter which skin or world it's paired with (a red gradient hazard next
  // to the default red spiky ball skin was previously almost unreadable).
  const wobble = Math.sin(t * 6 + h.x * 0.05) * 1.5;
  const pulse = 0.55 + 0.25 * (0.5 + 0.5 * Math.sin(t * 5 + h.x * 0.02));

  ctx.save();
  ctx.translate(h.x, h.y);

  ctx.globalAlpha = pulse * 0.5;
  ctx.fillStyle = world.hazardColor;
  ctx.beginPath();
  ctx.arc(0, 0, h.radius * 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  const spikeCount = 8;
  const rOuter = h.radius + wobble;
  const rInner = h.radius * 0.42;
  ctx.fillStyle = world.hazardColor;
  for (let i = 0; i < spikeCount; i++) {
    const a = (i / spikeCount) * Math.PI * 2;
    const ax = Math.cos(a) * rOuter, ay = Math.sin(a) * rOuter;
    const pa = a + Math.PI / 2;
    const w = h.radius * 0.16;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * rInner + Math.cos(pa) * w, Math.sin(a) * rInner + Math.sin(pa) * w);
    ctx.lineTo(Math.cos(a) * rInner - Math.cos(pa) * w, Math.sin(a) * rInner - Math.sin(pa) * w);
    ctx.lineTo(ax, ay);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = '#1c1c22';
  ctx.beginPath();
  ctx.arc(0, 0, rInner, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = world.hazardColor;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.arc(-rInner * 0.3, -rInner * 0.3, rInner * 0.28, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawGem(ctx, g, t) {
  if (g.taken) return;
  const bob = Math.sin(t * 3 + g.x * 0.02) * 4;
  const spin = t * 2.2;
  ctx.save();
  ctx.translate(g.x, g.y + bob);
  ctx.rotate(spin);
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.arc(0, 0, g.radius * 1.9, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  const grad = ctx.createLinearGradient(-g.radius, -g.radius, g.radius, g.radius);
  grad.addColorStop(0, '#E0FFFF');
  grad.addColorStop(0.5, '#4FD6FF');
  grad.addColorStop(1, '#0090C8');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, -g.radius);
  ctx.lineTo(g.radius, 0);
  ctx.lineTo(0, g.radius);
  ctx.lineTo(-g.radius, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.restore();
}

function drawGoal(ctx, g, world, t) {
  for (let i = 0; i < 3; i++) {
    const phase = (t * 0.6 + i / 3) % 1;
    ctx.globalAlpha = (1 - phase) * 0.35;
    ctx.strokeStyle = world.accent;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.radius * (0.5 + phase * 0.9), 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = world.accent;
  ctx.beginPath();
  ctx.arc(g.x, g.y, g.radius * 0.55, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  ctx.save();
  ctx.translate(g.x, g.y);
  ctx.rotate(Math.sin(t * 1.5) * 0.15);
  const s = g.radius * 0.28;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = (-Math.PI / 2) + (i / 5) * Math.PI * 2;
    const a2 = a + Math.PI / 5;
    const x1 = Math.cos(a) * s, y1 = Math.sin(a) * s;
    const x2 = Math.cos(a2) * s * 0.45, y2 = Math.sin(a2) * s * 0.45;
    if (i === 0) ctx.moveTo(x1, y1); else ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawRope(ctx, ball, pivot, world) {
  ctx.strokeStyle = world.ropeColor;
  ctx.lineWidth = 2.5;
  ctx.globalAlpha = 0.8;
  ctx.beginPath();
  ctx.moveTo(ball.x, ball.y);
  ctx.lineTo(pivot.x, pivot.y);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawTrail(ctx, points) {
  const n = points.length;
  for (let i = 0; i < n; i++) {
    const p = points[i];
    const frac = (i + 1) / n;
    ctx.globalAlpha = frac * 0.35;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3 + frac * 5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawParticles(ctx, particles) {
  for (const p of particles) {
    const frac = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = frac;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * frac, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function spawnBurst(particles, x, y, color, count = 14, speed = 260) {
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + Math.random() * 0.5;
    const s = speed * (0.4 + Math.random() * 0.6);
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: 0.5 + Math.random() * 0.3,
      maxLife: 0.5 + Math.random() * 0.3,
      color,
      size: 3 + Math.random() * 3,
    });
  }
}

function updateParticles(particles, dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += 900 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}


// ---- src/save.js ----
// LocalStorage-backed progression: per-level stars/best time, selected
// skin. Skin/world unlocks are derived from this rather than stored
// separately, so there's one source of truth.



const SAVE_KEY = 'sping_save_v1';

function defaultSave() {
  return {
    levels: {}, // id -> { stars, bestTime, gems }
    selectedSkin: 'classic',
  };
}

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    const parsed = JSON.parse(raw);
    return { ...defaultSave(), ...parsed, levels: parsed.levels || {} };
  } catch {
    return defaultSave();
  }
}

function writeSave(save) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  } catch {
    // storage unavailable (private browsing, quota) -- play on without saving
  }
}

function resetSave() {
  const fresh = defaultSave();
  writeSave(fresh);
  return fresh;
}

function totalStars(save) {
  let sum = 0;
  for (const key in save.levels) sum += save.levels[key]?.stars || 0;
  return sum;
}

function maxPossibleStars() {
  return WORLD_COUNT * LEVELS_PER_WORLD * 3;
}

function recordLevelResult(save, levelId, stars, time, gemsCollected) {
  const existing = save.levels[levelId] || { stars: 0, bestTime: null, gems: 0 };
  const updated = {
    stars: Math.max(existing.stars, stars),
    bestTime: existing.bestTime == null ? time : Math.min(existing.bestTime, time),
    gems: Math.max(existing.gems, gemsCollected),
  };
  save.levels[levelId] = updated;
  writeSave(save);
  return updated;
}

function isWorldUnlocked(save, worldIndex) {
  if (worldIndex <= 0) return true;
  let count = 0;
  for (let i = 0; i < LEVELS_PER_WORLD; i++) {
    const id = `w${worldIndex - 1}l${i}`;
    if ((save.levels[id]?.stars || 0) >= 1) count++;
  }
  return count >= Math.ceil(LEVELS_PER_WORLD * 0.5);
}

function isLevelUnlocked(save, worldIndex, levelIndex) {
  if (levelIndex === 0) return isWorldUnlocked(save, worldIndex);
  const prevId = `w${worldIndex}l${levelIndex - 1}`;
  return (save.levels[prevId]?.stars || 0) >= 1;
}

function worldStars(save, worldIndex) {
  let sum = 0;
  for (let i = 0; i < LEVELS_PER_WORLD; i++) {
    sum += save.levels[`w${worldIndex}l${i}`]?.stars || 0;
  }
  return sum;
}

// Tiny synthesized sound effects via WebAudio -- no audio files needed.
// Must be unlocked by a user gesture first (browser autoplay policy), so
// call unlock() from the first pointerdown/keydown handler.

let audioCtx = null;
let muted = false;

function unlock() {
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
}

function setMuted(m) {
  muted = m;
}

function isMuted() {
  return muted;
}

function tone({ freq = 440, dur = 0.12, type = 'sine', gain = 0.15, slideTo = null, delay = 0 }) {
  if (!audioCtx || muted) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo != null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}

function sfxGrab() {
  tone({ freq: 380, slideTo: 520, dur: 0.08, type: 'triangle', gain: 0.12 });
}

function sfxRelease() {
  tone({ freq: 300, slideTo: 180, dur: 0.1, type: 'triangle', gain: 0.1 });
}

function sfxGem() {
  tone({ freq: 700, slideTo: 1100, dur: 0.14, type: 'sine', gain: 0.14 });
}

function sfxDeath() {
  tone({ freq: 220, slideTo: 60, dur: 0.35, type: 'sawtooth', gain: 0.13 });
}

function sfxWin() {
  tone({ freq: 520, slideTo: 780, dur: 0.16, type: 'sine', gain: 0.16 });
  tone({ freq: 780, slideTo: 1040, dur: 0.22, type: 'sine', gain: 0.14, delay: 0.1 });
}

function sfxClick() {
  tone({ freq: 500, dur: 0.05, type: 'square', gain: 0.05 });
}


const sfx = { unlock, setMuted, isMuted, sfxGrab, sfxRelease, sfxGem, sfxDeath, sfxWin, sfxClick };

// ---------------------------------------------------------------------------

function fitCanvasWrap() {
  const targetAspect = VIEW_W / VIEW_H;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  let w, h;
  if (vw / vh > targetAspect) {
    h = vh;
    w = h * targetAspect;
  } else {
    w = vw;
    h = w / targetAspect;
  }
  canvasWrap.style.width = `${w}px`;
  canvasWrap.style.height = `${h}px`;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = VIEW_W * dpr;
  canvas.height = VIEW_H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function showScreen(name) {
  screen = name;
  screenMenu.classList.toggle('hidden', name !== 'menu');
  screenWorlds.classList.toggle('hidden', name !== 'worlds');
  screenLevels.classList.toggle('hidden', name !== 'levels');
  screenSkins.classList.toggle('hidden', name !== 'skins');
  hud.classList.toggle('hidden', name !== 'playing');
}

function refreshMenuStats() {
  menuTotalStars.textContent = totalStars(save);
  menuMaxStars.textContent = maxPossibleStars();
}

function buildWorldList() {
  worldList.innerHTML = '';
  WORLDS.forEach((world, i) => {
    const unlocked = isWorldUnlocked(save, i);
    const stars = worldStars(save, i);
    const card = document.createElement('div');
    card.className = 'world-card' + (unlocked ? '' : ' locked');
    card.innerHTML = `
      <div class="world-swatch" style="background:linear-gradient(135deg, ${world.bg[0]}, ${world.bg[1]})"></div>
      <div class="world-info">
        <div class="world-name">${i + 1}. ${world.name}</div>
        <div class="world-progress">${unlocked ? `⭐ ${stars} / ${LEVELS_PER_WORLD * 3}` : 'Locked'}</div>
      </div>
      ${unlocked ? '' : '<div class="lock-icon">🔒</div>'}
    `;
    if (unlocked) card.addEventListener('click', () => { sfx.sfxClick(); openLevelSelect(i); });
    worldList.appendChild(card);
  });
}

function openLevelSelect(worldIndex) {
  currentWorld = worldIndex;
  levelsTitle.textContent = `${worldIndex + 1}. ${WORLDS[worldIndex].name}`;
  levelGrid.innerHTML = '';
  for (let i = 0; i < LEVELS_PER_WORLD; i++) {
    const id = `w${worldIndex}l${i}`;
    const unlocked = isLevelUnlocked(save, worldIndex, i);
    const stars = save.levels[id]?.stars || 0;
    const cell = document.createElement('div');
    cell.className = 'level-cell' + (unlocked ? '' : ' locked');
    cell.innerHTML = `
      <div class="level-num">${unlocked ? i + 1 : '🔒'}</div>
      <div class="level-stars">${unlocked ? starString(stars) : ''}</div>
    `;
    if (unlocked) cell.addEventListener('click', () => { sfx.sfxClick(); startLevel(worldIndex, i); });
    levelGrid.appendChild(cell);
  }
  showScreen('levels');
}

function buildSkinGrid() {
  skinGrid.innerHTML = '';
  const stars = totalStars(save);
  SKINS.forEach((skin) => {
    const unlocked = stars >= skin.unlockAt;
    const cell = document.createElement('div');
    cell.className = 'skin-cell' + (unlocked ? '' : ' locked') + (save.selectedSkin === skin.id ? ' selected' : '');
    cell.innerHTML = `<canvas width="54" height="54"></canvas><div class="skin-name">${skin.name}</div>${unlocked ? '' : `<div class="lock-badge">⭐${skin.unlockAt}</div>`}`;
    const cvs = cell.querySelector('canvas');
    skin.draw(cvs.getContext('2d'), 27, 27, 22, 0);
    if (unlocked) {
      cell.addEventListener('click', () => {
        sfx.sfxClick();
        save.selectedSkin = skin.id;
        writeSave(save);
        buildSkinGrid();
      });
    }
    skinGrid.appendChild(cell);
  });
}

function startLevel(worldIndex, levelIndex) {
  currentWorld = worldIndex;
  currentLevelIndex = levelIndex;
  currentLevel = levelsById.get(`w${worldIndex}l${levelIndex}`);
  resetAttempt();
  showScreen('playing');

  const seenHint = localStorage.getItem('sping_hint_seen') === '1';
  hint.classList.remove('fade');
  hint.classList.toggle('hidden', seenHint);
  hintTimer = seenHint ? 0 : 4;
}

function resetAttempt() {
  const lvl = currentLevel;
  resetBallState(ball, lvl.start.x, lvl.start.y);
  for (const g of lvl.gems) g.taken = false;
  held = false;
  trail = [];
  particles = [];
  ballAngle = 0;
  ballAngularVel = 0;
  cameraX = clamp(ball.x - VIEW_W * 0.42, 0, Math.max(0, lvl.bounds.maxX - VIEW_W));
  deathTimer = 0;
  paused = false;
  overlayPause.classList.add('hidden');
  overlayComplete.classList.add('hidden');
  updateHud();
}

function updateHud() {
  const collected = currentLevel.gems.filter((g) => g.taken).length;
  hudGemsCount.textContent = `${collected}/${currentLevel.gems.length}`;
  hudTimer.textContent = `${ball.elapsed.toFixed(1)}s`;
}

function dismissHint() {
  if (!hint.classList.contains('hidden')) {
    hint.classList.add('fade');
    setTimeout(() => hint.classList.add('hidden'), 650);
  }
  localStorage.setItem('sping_hint_seen', '1');
  hintTimer = 0;
}

function onDeath() {
  ball.dead = true;
  sfx.sfxDeath();
  spawnBurst(particles, ball.x, ball.y, '#ff5470', 22, 320);
  deathTimer = 0.5;
}

function onWin(gemsCollected) {
  ball.finished = true;
  sfx.sfxWin();
  spawnBurst(particles, currentLevel.goal.x, currentLevel.goal.y, WORLDS[currentWorld].accent, 30, 380);

  const time = ball.elapsed;
  let stars = 1;
  if (gemsCollected >= currentLevel.gems.length) stars++;
  if (time <= currentLevel.parTime) stars++;

  recordLevelResult(save, currentLevel.id, stars, time, gemsCollected);
  setTimeout(() => showCompleteOverlay(stars, time, gemsCollected), 650);
}

function showCompleteOverlay(stars, time, gemsCollected) {
  completeTitle.textContent = stars === 3 ? 'Perfect!' : 'Level Complete!';
  completeStars.textContent = starString(stars);
  completeStats.textContent = `Time ${time.toFixed(1)}s   ·   💎 ${gemsCollected}/${currentLevel.gems.length}`;
  const isLastLevel = currentLevelIndex >= LEVELS_PER_WORLD - 1 && currentWorld >= WORLD_COUNT - 1;
  btnNext.classList.toggle('hidden', isLastLevel);
  overlayComplete.classList.remove('hidden');
  refreshMenuStats();
}

function togglePause() {
  if (screen !== 'playing' || ball.dead || ball.finished) return;
  paused = !paused;
  held = false;
  overlayPause.classList.toggle('hidden', !paused);
}

// ---------------------------------------------------------------------------
// Simulation + rendering
// ---------------------------------------------------------------------------

function stepPhysics(dt) {
  const lvl = currentLevel;
  const world = WORLDS[currentWorld];
  const wasAttached = ball.attached;

  stepBall(ball, held, lvl.pivots, dt);

  if (ball.attached !== wasAttached) {
    if (ball.attached !== -1) {
      sfx.sfxGrab();
      spawnBurst(particles, ball.x, ball.y, world.pivotGlow, 6, 120);
    } else {
      sfx.sfxRelease();
    }
  }

  // The sprite's rotation is its own continuously-integrated quantity, not
  // a direct readout of ball.angle (the physics orbital position relative
  // to whichever pivot it's currently on) -- reading that directly snapped
  // the sprite to a new angle at the instant of every grab, since the new
  // pivot's geometric angle has nothing to do with wherever the free-flight
  // spin had rotated to. So the angle always just keeps integrating, and
  // only the RATE tracks the swing -- but even the rate eases toward its
  // target rather than snapping to it, since a fresh grab can hand it a
  // wildly different (even opposite-signed) target than whatever the
  // free-flight carry-over rate was; within one continuous swing the
  // target itself already changes gradually via gravity, so the easing is
  // inert there and this only smooths the moment of grabbing something new.
  if (ball.attached !== -1) {
    const targetAngularVel = ball.spinSpeed / ball.ropeLen;
    const ease = Math.min(1, dt * SPIN_EASE_RATE);
    ballAngularVel += (targetAngularVel - ballAngularVel) * ease;
  }
  ballAngle += ballAngularVel * dt;

  clampToBounds(ball, lvl.bounds);

  const collected = checkGems(ball, lvl.gems, BALL_RADIUS);
  if (collected > 0) {
    sfx.sfxGem();
    spawnBurst(particles, ball.x, ball.y, '#4FD6FF', 8, 160);
  }

  trail.push({ x: ball.x, y: ball.y });
  if (trail.length > 14) trail.shift();

  if (checkHazards(ball, lvl.hazards, BALL_RADIUS)) { onDeath(); return; }
  if (checkVoid(ball, lvl.bounds.killY)) { onDeath(); return; }
  if (checkGoal(ball, lvl.goal, BALL_RADIUS)) {
    onWin(lvl.gems.filter((g) => g.taken).length);
    return;
  }

  const targetCamX = clamp(ball.x - VIEW_W * 0.42, 0, Math.max(0, lvl.bounds.maxX - VIEW_W));
  cameraX += (targetCamX - cameraX) * Math.min(1, dt * 6);

  updateHud();
}

function renderGame(t) {
  const lvl = currentLevel;
  const world = WORLDS[currentWorld];

  drawWorldBackground(ctx, world, cameraX, VIEW_W, VIEW_H, t, currentWorld * 137 + currentLevelIndex);

  ctx.save();
  ctx.translate(-cameraX, 0);

  lvl.pivots.forEach((p, i) => drawPivot(ctx, p, world, ball.attached === i, t));
  for (const h of lvl.hazards) drawHazard(ctx, h, world, t);
  for (const g of lvl.gems) drawGem(ctx, g, t);
  drawGoal(ctx, lvl.goal, world, t);

  drawTrail(ctx, trail);
  if (ball.attached !== -1) drawRope(ctx, ball, lvl.pivots[ball.attached], world);

  if (!ball.dead) {
    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.rotate(ballAngle);
    getSkinById(save.selectedSkin).draw(ctx, 0, 0, BALL_RADIUS, t);
    ctx.restore();
  }

  drawParticles(ctx, particles);
  ctx.restore();
}

function renderSkinPreview(t) {
  if (screen !== 'skins') return;
  skinPreviewCtx.clearRect(0, 0, 120, 120);
  getSkinById(save.selectedSkin).draw(skinPreviewCtx, 60, 62, 42, t);
}

let lastT = 0;
const MAX_FRAME_DT = 0.25;
let accumulator = 0;

function frame(tMs) {
  requestAnimationFrame(frame);
  const t = tMs / 1000;
  if (!lastT) lastT = t;
  let dt = t - lastT;
  lastT = t;
  if (dt > MAX_FRAME_DT) dt = MAX_FRAME_DT;

  renderSkinPreview(t);

  if (screen !== 'playing') return;

  if (hintTimer > 0) {
    hintTimer -= dt;
    if (hintTimer <= 0) dismissHint();
  }

  if (paused) {
    // no physics/render update while paused, keep last frame on screen
    return;
  }

  if (deathTimer > 0) {
    deathTimer -= dt;
    updateParticles(particles, dt);
    if (deathTimer <= 0) resetAttempt();
  } else if (!ball.finished) {
    accumulator += dt;
    let steps = 0;
    while (accumulator >= FIXED_DT && steps < 8) {
      stepPhysics(FIXED_DT);
      accumulator -= FIXED_DT;
      steps++;
    }
    updateParticles(particles, dt);
  } else {
    updateParticles(particles, dt);
  }

  renderGame(t);
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

async function boot() {
  fitCanvasWrap();
  // Some embedding contexts report window.innerWidth/Height as 0 for the
  // very first script tick before the viewport has actually settled; a
  // couple of follow-up calls self-correct instead of leaving the canvas
  // permanently collapsed to 0x0 in those cases. Using both rAF and a
  // timer covers backgrounded/hidden pages too, where rAF alone can be
  // suspended indefinitely.
  requestAnimationFrame(fitCanvasWrap);
  setTimeout(fitCanvasWrap, 150);

  for (const lvl of EMBEDDED_LEVELS) levelsById.set(lvl.id, lvl);

  refreshMenuStats();
  showScreen('menu');
  requestAnimationFrame(frame);
}

boot();

</script>
