  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M3 15v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/></svg><strong>${photos.length ? "Add another photo" : "Use your own photo"}</strong><span>Drop one here, paste, or browse</span>`;
  btn.addEventListener("click", () => $("fileInput").click());
  wrap.appendChild(cell);

  refreshThumbSelection();
}

function refreshThumbSelection() {
  $("thumbs").querySelectorAll(".thumb").forEach(t => {
    const k = t.dataset.kind;
    const on = k === "design" ? (chosen.kind === "design" && Number(t.dataset.key) === chosen.index)
             : k === "photo"  ? (chosen.kind === "photo"  && Number(t.dataset.key) === chosen.id)
             : false;
    t.setAttribute("aria-pressed", String(on));
  });
}

function setPicError(msg) {
  const el = $("picError");
  el.textContent = msg || "";
  el.hidden = !msg;
}

// Decode without ever handing bytes to the image loader where we can help it:
// createImageBitmap has no img-src policy to trip over, and reads the EXIF
// orientation phone cameras write instead of leaving holiday snaps sideways.
async function decodeImageFile(file) {
  if (typeof createImageBitmap === "function") {
    try { return await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch (e) {
      try { return await createImageBitmap(file); } catch (e2) { /* fall through */ }
    }
  }
  const dataUrl = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(new Error("read"));
    fr.readAsDataURL(file);
  });
  return await new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error("decode"));
    im.src = dataUrl;
  });
}

async function addPhoto(file) {
  if (!file) return;
  if (file.type && !file.type.startsWith("image/")) {
    setPicError(`"${file.name}" is not an image file.`);
    return;
  }
  setPicError("Reading your photo…");
  let bmp;
  try {
    bmp = await decodeImageFile(file);
  } catch (e) {
    setPicError(`Could not read "${file.name || "that file"}". JPG, PNG, WebP and GIF all work.`);
    return;
  }

  const w = bmp.width, h = bmp.height;
  if (!w || !h) { setPicError("That image came back empty."); return; }

  // Very long or very tall pictures get centre-cropped, so pieces stay square
  let ar = w / h, cw = w, ch = h, ox = 0, oy = 0;
  if (ar > 1.85) { cw = h * 1.85; ox = (w - cw) / 2; ar = 1.85; }
  if (ar < 0.60) { ch = w / 0.60; oy = (h - ch) / 2; ar = 0.60; }

  // Aim for the same pixel budget as the built-in pictures, so a 1000-piece
  // cut off a small phone photo still has detail in every piece.
  const outW = clamp(Math.round(Math.sqrt(1920000 * ar)), 600, 1800);
  const outH = Math.max(1, Math.round(outW / ar));
  const cv = document.createElement("canvas");
  cv.width = outW; cv.height = outH;
  const cx = cv.getContext("2d");
  cx.imageSmoothingQuality = "high";
  cx.drawImage(bmp, ox, oy, cw, ch, 0, 0, outW, outH);
  if (bmp.close) bmp.close();

  const name = String(file.name || "Photo").replace(/\.[^.]+$/, "").slice(0, 28) || "Photo";
  const p = { id: ++photoSeq, name, canvas: cv };
  photos.push(p);
  chosen = { kind: "photo", index: chosen.index, id: p.id };
  setPicError("");
  buildThumbs();
  updateSpec();
}

function removePhoto(id) {
  photos = photos.filter(p => p.id !== id);
  if (chosen.kind === "photo" && chosen.id === id) chosen = { kind: "design", index: chosen.index, id: 0 };
  buildThumbs();
  updateSpec();
}

async function addPhotoFiles(list) {
  const files = [...list].filter(f => !f.type || f.type.startsWith("image/"));
  if (!files.length) { setPicError("No image files in what you dropped."); return; }
  for (const f of files.slice(0, 12)) await addPhoto(f);
}

$("fileInput").addEventListener("change", e => {
  const files = e.target.files;
  if (files && files.length) addPhotoFiles(files);
  e.target.value = "";   // so picking the same file twice still fires
});

// Drag a photo anywhere onto the box lid
const setupEl = $("setup");
setupEl.addEventListener("dragover", e => {
  if (!e.dataTransfer) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "copy";
  setupEl.classList.add("dropping");
});
setupEl.addEventListener("dragleave", e => {
  if (e.relatedTarget && setupEl.contains(e.relatedTarget)) return;
  setupEl.classList.remove("dropping");
});
setupEl.addEventListener("drop", e => {
  e.preventDefault();
  setupEl.classList.remove("dropping");
  if (e.dataTransfer && e.dataTransfer.files.length) addPhotoFiles(e.dataTransfer.files);
});

// Paste a photo straight from the clipboard
window.addEventListener("paste", e => {
  if (!$("play").hidden || !e.clipboardData) return;
  const files = [...e.clipboardData.items]
    .filter(i => i.kind === "file" && i.type.startsWith("image/"))
    .map(i => i.getAsFile())
    .filter(Boolean);
  if (files.length) { e.preventDefault(); addPhotoFiles(files); }
});

function buildChips() {
  const wrap = $("chips");
  wrap.innerHTML = "";
  PIECE_OPTIONS.forEach(opt => {
    const b = document.createElement("button");
    b.className = "chip" + (opt.n >= 500 ? " tier-hard" : "");
    b.type = "button";
    b.dataset.n = opt.n;
    b.innerHTML = `<b>${opt.n}</b><small>${opt.label}</small>`;
    b.addEventListener("click", () => { G.target = opt.n; $("customCount").value = ""; updateSpec(); });
    wrap.appendChild(b);
  });
}

function updateSpec() {
  const g = chooseGrid(G.target, currentAspect());
  $("gridSpec").textContent = `${g.cols} \u00d7 ${g.rows} = ${g.count} pieces \u00b7 ${2 * (g.cols + g.rows) - 4} edge pieces`;
  $("stampCount").firstChild.nodeValue = String(g.count);
  $("chips").querySelectorAll(".chip").forEach(c => {
    c.setAttribute("aria-pressed", String(Number(c.dataset.n) === G.target));
  });
  const best = store("jt.best." + g.count);
  $("bestNote").innerHTML = best
    ? `Your best at ${g.count} pieces: <b>${fmtTime(best)}</b>`
    : `No time recorded at ${g.count} pieces yet.`;
}

$("customCount").addEventListener("input", e => {
  const v = parseInt(e.target.value, 10);
  if (!isNaN(v) && v >= 12 && v <= 2000) { G.target = v; updateSpec(); }
});

$("reroll").addEventListener("click", () => {
  seeds = DESIGNS.map(() => Math.floor(Math.random() * 1e9));
  buildThumbs();
  refreshThumbSelection();
});

// The divider is a genuine cut line, from the same generator that cuts the pieces.
function drawKerf() {
  // tab height is 0.338 × the tab scale, so 20 keeps both bulge and socket
  // inside the 16-unit band
  const n = 9, W = 1000, H = 16, mid = 8, len = W / n;
  let d = `M 0 ${mid}`;
  for (let i = 0; i < n; i++) {
    const s = Math.random() < .5 ? 1 : -1;
    const segs = edgeSegs(i * len, mid, 1, 0, 0, -1, len, 20, s, (Math.random() - .5) * .05, Math.random() - .5);
    for (const sg of segs) {
      d += sg[0] === "L" ? ` L ${sg[1].toFixed(1)} ${sg[2].toFixed(1)}`
                         : ` C ${sg[1].toFixed(1)} ${sg[2].toFixed(1)}, ${sg[3].toFixed(1)} ${sg[4].toFixed(1)}, ${sg[5].toFixed(1)} ${sg[6].toFixed(1)}`;
    }
  }
  $("kerf").innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" fill="none"><path d="${d}" stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ---- start / restart ---- */
let lastSetup = null;

function startGame(reuse) {
  const rotate = $("optRotate").checked;
  const ghost = $("optGhost").checked;

  let source, name;
  if (reuse && lastSetup) {
    source = lastSetup.source; name = lastSetup.name;
  } else {
    const pick = chosenSource();
    name = pick.name;
    source = pick.canvas || paint(pick.design, seeds[DESIGNS.indexOf(pick.design)], 1600);
  }
  lastSetup = { source, name, target: G.target };

  $("setup").hidden = true;
  $("play").hidden = false;
  $("solvedVeil").hidden = true;
  $("cutVeil").hidden = false;
  $("cutFill").style.width = "0%";
  $("cutNote").textContent = "Pressing the die\u2026";
  resize();

  G.rotateMode = rotate;
  G.ghost = ghost;
  G.edgeFocus = false;
  G.elapsed = 0; G.running = false; G.solved = false;
  $("clock").textContent = "0:00";
  G.hints = 0; updateHintBtn();
  $("ghostBtn").setAttribute("aria-pressed", String(ghost));
  $("edgeBtn").setAttribute("aria-pressed", "false");
  $("rotBtn").hidden = !rotate;
  $("railTitle").textContent = name;

  // let the overlay paint before the heavy work starts
  schedule(() => {
    buildPuzzle(source, G.target, name, frac => {
      $("cutFill").style.width = (frac * 100).toFixed(1) + "%";
      if (frac > .55) $("cutNote").textContent = "Sanding the tabs\u2026";
      if (frac > .88) $("cutNote").textContent = "Tipping out the box\u2026";
    }, () => {
      computeWorld();
      scatter();
      fitView();
      $("railSub").textContent = `${G.cols} \u00d7 ${G.rows}`;
      updateHud();
      $("cutVeil").hidden = true;
      dirty = true;
      showHint(G.rotateMode
        ? "Drag pieces together \u00b7 R turns the held piece \u00b7 scroll or pinch to zoom"
        : "Drag a piece next to its neighbour and it clicks in \u00b7 scroll or pinch to zoom", 9000);
    });
  });
}

$("startBtn").addEventListener("click", () => startGame(false));
$("againBtn").addEventListener("click", () => { $("solvedVeil").hidden = true; startGame(true); });
$("newBtn").addEventListener("click", backToBox);
$("backBtn").addEventListener("click", backToBox);

function backToBox() {
  $("solvedVeil").hidden = true;
  $("play").hidden = true;
  $("setup").hidden = false;
  setPicError("");
  G.running = false;
  G.pieces = []; G.groups = []; G.order = []; G.atlases = [];
  updateSpec();
}

/* ---- play controls ---- */
$("ghostBtn").addEventListener("click", () => {
  G.ghost = !G.ghost;
  $("ghostBtn").setAttribute("aria-pressed", String(G.ghost));
  dirty = true;
});
$("edgeBtn").addEventListener("click", () => {
  G.edgeFocus = !G.edgeFocus;
  $("edgeBtn").setAttribute("aria-pressed", String(G.edgeFocus));
  if (G.edgeFocus) showHint("Only border pieces are pickable while this is on.", 4000);
  dirty = true;
});
$("hintBtn").addEventListener("click", giveHint);
$("tidyBtn").addEventListener("click", () => {
  scatter("single");
  showHint("Loose pieces spread back out.", 3000);
});
$("zoomIn").addEventListener("click", () => zoomAt(cssW / 2, cssH / 2, 1.3));
$("zoomOut").addEventListener("click", () => zoomAt(cssW / 2, cssH / 2, 1 / 1.3));
$("zoomFit").addEventListener("click", () => fitView());
$("rotBtn").addEventListener("click", turnHeld);

$("previewBtn").addEventListener("click", showPreview);
function showPreview() {
  if (!G.img) return;
  const v = $("previewVeil");
  v.innerHTML = "";
  const cv = document.createElement("canvas");
  const w = Math.min(1100, G.W);
  cv.width = w; cv.height = Math.round(w * G.H / G.W);
  cv.getContext("2d").drawImage(G.img, 0, 0, cv.width, cv.height);
  v.appendChild(cv);
  v.hidden = false;
}
$("previewVeil").addEventListener("click", () => { $("previewVeil").hidden = true; });

window.addEventListener("keydown", e => {
  if ($("play").hidden) return;
  if (e.target.tagName === "INPUT") return;
  const k = e.key.toLowerCase();
  if (k === "r") turnHeld();
  else if (k === "h") giveHint();
  else if (k === "f") fitView();
  else if (k === "g") $("ghostBtn").click();
  else if (k === "e") $("edgeBtn").click();
  else if (k === "p") { $("previewVeil").hidden ? showPreview() : ($("previewVeil").hidden = true); }
  else if (k === "escape") { $("previewVeil").hidden = true; }
  else if (k === "+" || k === "=") zoomAt(cssW / 2, cssH / 2, 1.25);
  else if (k === "-" || k === "_") zoomAt(cssW / 2, cssH / 2, 1 / 1.25);
});

/* ---- boot ---- */
drawKerf();
buildThumbs();
buildChips();
updateSpec();
resize();
</script>
