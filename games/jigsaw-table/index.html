<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jigsaw Table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,500;112,600;112,700&family=Spline+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
  :root {
    --table:      #173029;
    --table-edge: #0c1a16;
    --ground:     #0e1618;
    --surface:    #182628;
    --surface-2:  #213234;
    --line:       #2d4144;
    --ink:        #eff3ec;
    --muted:      #93a89f;
    --faint:      #67807a;
    --brass:      #d9a441;
    --brass-deep: #a97a22;
    --brass-ink:  #23190a;
    --mint:       #74d3a6;
    --coral:      #e2694a;
    --shadow:     0 18px 48px -18px rgba(0,0,0,.72);
    --radius:     14px;
    /* Controls that float over the felt keep felt colours in both themes —
       the table is dark either way, so page chrome would glare against it. */
    --felt-glass: rgba(12,24,20,.74);
    --felt-line:  rgba(255,255,255,.17);
    --felt-ink:   #e9efea;
    --felt-muted: #b3c4bc;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --table:      #22453b;
    --table-edge: #14291f;
    --ground:     #dfe4dc;
    --surface:    #f8f7f1;
    --surface-2:  #ebe9df;
    --line:       #cdcabb;
    --ink:        #141f1c;
    --muted:      #576661;
    --faint:      #7d8b85;
    --brass:      #9a6b12;
    --brass-deep: #7b5409;
    --brass-ink:  #fdf6e6;
    --mint:       #1f7f55;
    --coral:      #b8462a;
    --shadow:     0 18px 44px -20px rgba(28,40,36,.42);
    color-scheme: light;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --table:      #22453b;
      --table-edge: #14291f;
      --ground:     #dfe4dc;
      --surface:    #f8f7f1;
      --surface-2:  #ebe9df;
      --line:       #cdcabb;
      --ink:        #141f1c;
      --muted:      #576661;
      --faint:      #7d8b85;
      --brass:      #9a6b12;
      --brass-deep: #7b5409;
      --brass-ink:  #fdf6e6;
      --mint:       #1f7f55;
      --coral:      #b8462a;
      --shadow:     0 18px 44px -20px rgba(28,40,36,.42);
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }
  /* .play, .veil and .zoom-btn all set display, which outranks the UA rule */
  [hidden] { display: none !important; }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Spline Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  h1, h2, h3, .display {
    font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
    font-variation-settings: "wdth" 112;
    margin: 0;
    text-wrap: balance;
  }
  .mono { font-family: "Spline Sans Mono", ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }

  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 6px; }

  .app { height: 100dvh; width: 100%; position: relative; }

  /* ---------------- Setup: the box lid ---------------- */
  .setup {
    position: absolute; inset: 0;
    overflow-y: auto;
    display: flex; align-items: flex-start; justify-content: center;
    padding: clamp(16px, 4vw, 48px) 16px;
    background:
      radial-gradient(1100px 620px at 50% -12%, color-mix(in srgb, var(--table) 55%, transparent), transparent 70%),
      var(--ground);
  }
  .lid {
    width: min(980px, 100%);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: clamp(20px, 3.4vw, 34px);
    display: flex; flex-direction: column; gap: 26px;
  }

  .lid-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .brandmark { display: flex; align-items: center; gap: 14px; }
  .brandmark svg { width: 44px; height: 44px; flex: none; }
  .lid-head h1 { font-size: clamp(28px, 4.4vw, 40px); font-weight: 700; letter-spacing: -.01em; line-height: 1.05; }
  .tagline { margin: 4px 0 0; color: var(--muted); font-size: 14px; max-width: 46ch; }

  .stamp {
    font-family: "Archivo", sans-serif; font-variation-settings: "wdth" 112; font-weight: 700;
    font-size: 30px; line-height: 1;
    color: var(--brass);
    border: 2px solid var(--brass); border-radius: 10px;
    padding: 10px 14px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transform: rotate(-2.5deg);
    font-variant-numeric: tabular-nums;
  }
  .stamp span { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; color: var(--brass-deep); }
  :root[data-theme="dark"] .stamp span { color: var(--brass); opacity: .72; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stamp span { color: var(--brass); opacity: .72; } }

  .kerf { width: 100%; height: 16px; color: var(--line); }
  .kerf svg { display: block; width: 100%; height: 100%; }

  .field { display: flex; flex-direction: column; gap: 12px; }
  .field-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .field-head h2 { font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); }
  .spec { font-family: "Spline Sans Mono", monospace; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ghost { color: var(--muted); font-size: 12.5px; padding: 3px 8px; border-radius: 7px; border: 1px solid transparent; }
  .ghost:hover { color: var(--ink); border-color: var(--line); }

  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .thumb-wrap { position: relative; display: block; }
  .thumb-wrap .thumb { width: 100%; }

  .thumb-remove {
    position: absolute; top: 6px; right: 6px;
    width: 24px; height: 24px; border-radius: 7px;
    display: grid; place-items: center;
    background: rgba(12,20,18,.72); color: #fff;
    border: 1px solid rgba(255,255,255,.28);
    opacity: 0; transition: opacity .14s ease;
  }
  .thumb-remove svg { width: 12px; height: 12px; }
  .thumb-wrap:hover .thumb-remove, .thumb-remove:focus-visible { opacity: 1; }
  .thumb-remove:hover { background: var(--coral); border-color: var(--coral); }

  .pic-error {
    margin: 0; font-size: 12.5px; color: var(--coral);
    background: color-mix(in srgb, var(--coral) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--coral) 34%, transparent);
    border-radius: 9px; padding: 8px 12px;
  }

  .setup.dropping .thumbs {
    outline: 2px dashed var(--brass); outline-offset: 8px; border-radius: 12px;
  }

  .thumb {
    position: relative; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--line); padding: 0; display: block; background: var(--surface-2);
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .thumb canvas { display: block; width: 100%; height: 100%; object-fit: cover; }
  .thumb figcaption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 14px 8px 6px; font-size: 11.5px; font-weight: 500; letter-spacing: .04em; text-align: left;
    color: #fff; background: linear-gradient(transparent, rgba(6,14,12,.82));
  }
  .thumb:hover { transform: translateY(-2px); }
  .thumb[aria-pressed="true"] { border-color: var(--brass); box-shadow: 0 0 0 2px var(--brass); }
  .thumb.upload {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    color: var(--muted); font-size: 12.5px; border-style: dashed;
  }
  .thumb.upload strong { font-weight: 500; color: var(--ink); font-size: 13px; }
  .thumb.upload svg { width: 22px; height: 22px; }
  .thumb.upload.has-image { display: block; border-style: solid; padding: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 8px 14px 7px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface-2);
    transition: border-color .14s ease, background .14s ease, transform .14s ease;
  }
  .chip b { font-family: "Spline Sans Mono", monospace; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .chip small { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .chip:hover { border-color: var(--faint); }
  .chip[aria-pressed="true"] { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); }
  .chip[aria-pressed="true"] small { color: var(--brass-ink); opacity: .72; }
  .chip.tier-hard small { color: var(--coral); }
  .chip.tier-hard[aria-pressed="true"] small { color: var(--brass-ink); }

  .custom { display: inline-flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--muted); }
  .custom input {
    width: 96px; padding: 7px 10px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
    font-family: "Spline Sans Mono", monospace; font-size: 13px;
  }

  .rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
  .rule {
    display: flex; gap: 11px; align-items: flex-start; cursor: pointer;
    padding: 11px 13px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface-2);
  }
  .rule:hover { border-color: var(--faint); }
  .rule input { margin: 2px 0 0; accent-color: var(--brass); width: 15px; height: 15px; flex: none; }
  .rule b { display: block; font-weight: 500; font-size: 13.5px; }
  .rule span small { display: block; color: var(--muted); font-size: 12px; line-height: 1.4; }

  .lid-foot { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .primary {
    background: var(--brass); color: var(--brass-ink);
    font-family: "Archivo", sans-serif; font-variation-settings: "wdth" 112; font-weight: 700;
    font-size: 15px; letter-spacing: .04em; text-transform: uppercase;
    padding: 13px 26px; border-radius: 11px;
    transition: transform .14s ease, background .14s ease;
  }
  .primary:hover { background: color-mix(in srgb, var(--brass) 86%, #fff); transform: translateY(-1px); }
  .primary:active { transform: translateY(0); }
  .best { margin: 0; color: var(--muted); font-size: 12.5px; }
  .best b { font-family: "Spline Sans Mono", monospace; font-weight: 500; color: var(--ink); }

  /* ---------------- Play: the table ---------------- */
  .play { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--table-edge); }

  .rail {
    display: flex; align-items: center; gap: 14px;
    padding: 9px 14px;
    background: var(--surface); border-bottom: 1px solid var(--line);
    flex: none; flex-wrap: wrap;
  }
  .rail-left { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .rail-title { font-family: "Archivo", sans-serif; font-variation-settings: "wdth" 112; font-weight: 600; font-size: 15px; white-space: nowrap; }
  .rail-sub { font-family: "Spline Sans Mono", monospace; font-size: 11.5px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .progress { flex: 1 1 160px; min-width: 120px; display: flex; align-items: center; gap: 10px; }
  .bar { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
  .bar i { display: block; height: 100%; width: 0%; background: var(--mint); border-radius: 99px; transition: width .28s cubic-bezier(.2,.7,.3,1); }
  .count { font-family: "Spline Sans Mono", monospace; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .count b { color: var(--ink); font-weight: 500; }

  .clock { font-family: "Spline Sans Mono", monospace; font-size: 17px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

  .tools { display: flex; align-items: center; gap: 5px; }
  .tool {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 11px; border-radius: 9px; font-size: 12.5px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--muted);
    white-space: nowrap;
  }
  .tool:hover { color: var(--ink); border-color: var(--faint); }
  .tool[aria-pressed="true"] { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); }
  .tool svg { width: 15px; height: 15px; }
  .tool.icon-only { padding: 7px 9px; }
  @media (max-width: 720px) { .tool .lbl { display: none; } .tool { padding: 7px 9px; } }

  .stage { position: relative; flex: 1; min-height: 0; }
  #board { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #board.grabbing { cursor: grabbing; }

  .cluster {
    position: absolute; right: 14px; bottom: 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .zoom-btn {
    width: 40px; height: 40px; border-radius: 11px;
    display: grid; place-items: center;
    background: var(--felt-glass);
    border: 1px solid var(--felt-line); color: var(--felt-ink);
    backdrop-filter: blur(8px);
    font-family: "Spline Sans Mono", monospace; font-size: 17px;
  }
  .zoom-btn:hover { border-color: var(--brass); }
  .zoom-btn.wide { width: 40px; font-size: 11px; letter-spacing: .04em; }
  .zoom-btn.accent { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); }
  .zoom-btn svg { width: 18px; height: 18px; }

  .hint {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    background: var(--felt-glass);
    border: 1px solid var(--felt-line); border-radius: 10px;
    padding: 7px 14px; font-size: 12.5px; color: var(--felt-muted);
    backdrop-filter: blur(8px); pointer-events: none;
    transition: opacity .5s ease; text-align: center; max-width: calc(100% - 32px);
  }

  /* ---------------- Overlays ---------------- */
  .veil {
    position: absolute; inset: 0; z-index: 20;
    display: grid; place-items: center; padding: 24px;
    background: color-mix(in srgb, var(--ground) 84%, transparent);
    backdrop-filter: blur(10px);
  }
  .cutting { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .cutting h2 { font-size: 20px; font-weight: 600; }
  .cutting p { margin: 0; color: var(--muted); font-size: 13px; }
  .cut-bar { width: min(340px, 74vw); height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
  .cut-bar i { display: block; height: 100%; width: 0; background: var(--brass); }

  .preview-veil { cursor: zoom-out; }
  .preview-veil canvas, .preview-veil img {
    max-width: min(1100px, 92vw); max-height: 84vh; width: auto; height: auto;
    border-radius: 10px; box-shadow: var(--shadow); border: 1px solid var(--line);
  }

  .solved {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: var(--shadow); padding: 30px 34px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    max-width: 420px;
  }
  .solved .eyebrow { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--mint); font-weight: 600; }
  .solved h2 { font-size: 34px; font-weight: 700; }
  .solved .time { font-family: "Spline Sans Mono", monospace; font-size: 44px; line-height: 1.1; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .solved .detail { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
  .solved .record { color: var(--brass); font-size: 12.5px; font-weight: 500; margin-top: 4px; }
  .solved .acts { display: flex; gap: 9px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
  .solved .acts .tool { padding: 12px 18px; font-size: 13px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<a href="../../index.html" title="Back to Arcade" style="position:fixed;top:10px;left:10px;z-index:2147483647;display:flex;align-items:center;justify-content:center;width:26px;height:26px;background:rgba(0,0,0,0.6);color:#fff;font:14px/1 system-ui,-apple-system,sans-serif;border-radius:50%;text-decoration:none;opacity:0.4;transition:opacity .15s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.4">&larr;</a>

<div class="app">
  <section class="setup" id="setup">
    <div class="lid">
      <header class="lid-head">
        <div class="brandmark">
          <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M6 10a4 4 0 0 1 4-4h10.2c.7 0 1.1-.8.8-1.4a4.6 4.6 0 0 1-.5-2.1C20.5-.6 27.5-.6 27.5 2.5c0 .8-.2 1.5-.5 2.1-.3.6.1 1.4.8 1.4H38a4 4 0 0 1 4 4v10.2c0 .7.8 1.1 1.4.8.6-.3 1.3-.5 2.1-.5 3.1 0 3.1 7 0 7-.8 0-1.5-.2-2.1-.5-.6-.3-1.4.1-1.4.8V38a4 4 0 0 1-4 4H27.8c-.7 0-1.1-.8-.8-1.4.3-.6.5-1.3.5-2.1 0-3.1-7-3.1-7 0 0 .8.2 1.5.5 2.1.3.6-.1 1.4-.8 1.4H10a4 4 0 0 1-4-4V27.8c0-.7-.8-1.1-1.4-.8-.6.3-1.3.5-2.1.5-3.1 0-3.1-7 0-7 .8 0 1.5.2 2.1.5.6.3 1.4-.1 1.4-.8V10Z"
              fill="var(--brass)" opacity=".16"/>
            <path d="M6 10a4 4 0 0 1 4-4h10.2c.7 0 1.1-.8.8-1.4a4.6 4.6 0 0 1-.5-2.1C20.5-.6 27.5-.6 27.5 2.5c0 .8-.2 1.5-.5 2.1-.3.6.1 1.4.8 1.4H38a4 4 0 0 1 4 4v10.2c0 .7.8 1.1 1.4.8.6-.3 1.3-.5 2.1-.5 3.1 0 3.1 7 0 7-.8 0-1.5-.2-2.1-.5-.6-.3-1.4.1-1.4.8V38a4 4 0 0 1-4 4H27.8c-.7 0-1.1-.8-.8-1.4.3-.6.5-1.3.5-2.1 0-3.1-7-3.1-7 0 0 .8.2 1.5.5 2.1.3.6-.1 1.4-.8 1.4H10a4 4 0 0 1-4-4V27.8c0-.7-.8-1.1-1.4-.8-.6.3-1.3.5-2.1.5-3.1 0-3.1-7 0-7 .8 0 1.5.2 2.1.5.6.3 1.4-.1 1.4-.8V10Z"
              stroke="var(--brass)" stroke-width="2.2"/>
          </svg>
          <div>
            <h1>Jigsaw Table</h1>
            <p class="tagline">Pick a picture, choose how many pieces you can live with, and put it back together.</p>
          </div>
        </div>
        <div class="stamp" id="stampCount">100<span>pieces</span></div>
      </header>

      <div class="kerf" id="kerf" aria-hidden="true"></div>

      <div class="field">
        <div class="field-head">
          <h2>Picture</h2>
          <button class="ghost" id="reroll" type="button">Redraw designs</button>
        </div>
        <div class="thumbs" id="thumbs"></div>
        <p class="pic-error" id="picError" hidden></p>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
      </div>

      <div class="field">
        <div class="field-head">
          <h2>Pieces</h2>
          <span class="spec" id="gridSpec">&mdash;</span>
        </div>
        <div class="chips" id="chips"></div>
        <label class="custom">Or set your own
          <input type="number" id="customCount" min="12" max="2000" inputmode="numeric" placeholder="420">
        </label>
      </div>

      <div class="field">
        <div class="field-head"><h2>House rules</h2></div>
        <div class="rules">
          <label class="rule">
            <input type="checkbox" id="optRotate">
            <span><b>Rotating pieces</b><small>Pieces start at random angles. Turn them with R, right-click, or the turn button.</small></span>
          </label>
          <label class="rule">
            <input type="checkbox" id="optGhost" checked>
            <span><b>Faint guide on the board</b><small>Leaves a ghost of the picture inside the frame. Switch it off for a real fight.</small></span>
          </label>
        </div>
      </div>

      <footer class="lid-foot">
        <button class="primary" id="startBtn" type="button">Cut the puzzle</button>
        <p class="best" id="bestNote"></p>
      </footer>
    </div>
  </section>

  <section class="play" id="play" hidden>
    <div class="rail">
      <div class="rail-left">
        <button class="tool icon-only" id="backBtn" type="button" title="Back to the box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
        </button>
        <div>
          <div class="rail-title" id="railTitle">Aurora</div>
          <div class="rail-sub" id="railSub">10 &times; 10</div>
        </div>
      </div>

      <div class="progress">
        <div class="bar"><i id="barFill"></i></div>
        <div class="count"><b id="joinedCount">0</b> / <span id="totalCount">100</span> joined</div>
      </div>

      <div class="clock mono" id="clock">0:00</div>

      <div class="tools">
        <button class="tool" id="previewBtn" type="button" title="Look at the picture (P)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="lbl">Picture</span>
        </button>
        <button class="tool" id="ghostBtn" type="button" aria-pressed="false" title="Faint guide on the board (G)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 14l5-4 4 3 3-2 6 4"/></svg>
          <span class="lbl">Guide</span>
        </button>
        <button class="tool" id="tidyBtn" type="button" title="Spread the loose pieces out again">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h6M4 12h4M4 17h7"/><circle cx="17" cy="8" r="2.4"/><circle cx="19" cy="16" r="2.4"/></svg>
          <span class="lbl">Scatter</span>
        </button>
        <button class="tool" id="hintBtn" type="button" title="Place one piece for me (H)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.5.3.8.9.9 1.5l.1.6h5l.1-.6c.1-.6.4-1.2.9-1.5A6 6 0 0 0 12 3Z"/></svg>
          <span class="lbl">Hint</span>
        </button>
        <button class="tool" id="edgeBtn" type="button" aria-pressed="false" title="Dim everything but the border pieces (E)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M3 9h18" opacity=".35"/></svg>
          <span class="lbl">Edges</span>
        </button>
      </div>
    </div>

    <div class="stage" id="stage">
      <canvas id="board"></canvas>
      <div class="cluster">
        <button class="zoom-btn" id="rotBtn" type="button" title="Turn the held piece (R)" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="zoom-btn" id="zoomIn" type="button" title="Zoom in (+)">+</button>
        <button class="zoom-btn" id="zoomOut" type="button" title="Zoom out (&minus;)">&minus;</button>
        <button class="zoom-btn wide" id="zoomFit" type="button" title="Fit the table (F)">FIT</button>
      </div>
      <div class="hint" id="hint" hidden></div>
    </div>

    <div class="veil" id="cutVeil" hidden>
      <div class="cutting">
        <h2 class="display" id="cutTitle">Cutting the board</h2>
        <div class="cut-bar"><i id="cutFill"></i></div>
        <p id="cutNote">Pressing the die&hellip;</p>
      </div>
    </div>

    <div class="veil preview-veil" id="previewVeil" hidden></div>

    <div class="veil" id="solvedVeil" hidden>
      <div class="solved">
        <div class="eyebrow">Last piece in</div>
        <h2 class="display">Solved</h2>
        <div class="time mono" id="solvedTime">0:00</div>
        <p class="detail" id="solvedDetail">100 pieces &middot; Aurora</p>
        <p class="record" id="solvedRecord" hidden></p>
        <div class="acts">
          <button class="tool" id="againBtn" type="button">Same puzzle again</button>
          <button class="tool" id="newBtn" type="button">Back to the box</button>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
"use strict";

/* ============================================================
   Small helpers
   ============================================================ */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function fmtTime(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`
           : `${m}:${String(sec).padStart(2, "0")}`;
}

function store(key, val) {
  try {
    if (val === undefined) { const v = localStorage.getItem(key); return v === null ? null : JSON.parse(v); }
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) { /* private browsing, blocked storage — best times are a nicety */ }
  return null;
}

/* ============================================================
   Procedural pictures
   Every generator scales its detail with area so the small
   thumbnails read the same as the full-size board.
   ============================================================ */

function artAurora(x, W, H, R) {
  const A = (W * H) / (1600 * 1200), s = W / 1600;
  const sky = x.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#03060f"); sky.addColorStop(.34, "#08152a");
  sky.addColorStop(.6, "#0f2a43"); sky.addColorStop(.78, "#0a1a2a"); sky.addColorStop(1, "#040a11");
  x.fillStyle = sky; x.fillRect(0, 0, W, H);

  for (let i = 0; i < 1700 * A; i++) {
    const px = R() * W, py = R() * H * .8, r = (R() * 1.6 + .25) * s * 1.5;
    x.globalAlpha = .12 + R() * .85;
    x.fillStyle = R() < .14 ? "#a8d8ff" : (R() < .22 ? "#ffd9b0" : "#ffffff");
    x.beginPath(); x.arc(px, py, r, 0, TAU); x.fill();
  }
  x.globalAlpha = 1;

  x.globalCompositeOperation = "lighter";
  const pal = [["#31ffc4", "#0b73ff"], ["#b6ff4d", "#00c9a7"], ["#ff7ae0", "#5b4bff"], ["#4af3ff", "#2166ff"], ["#9dff7a", "#00a2ff"]];
  for (let b = 0; b < 7; b++) {
    const c = pal[Math.floor(R() * pal.length)];
    const base = H * (.1 + .072 * b) + R() * 46 * s;
    const amp = (30 + R() * 90) * s, freq = 1 + R() * 2.6, ph = R() * TAU, drop = (110 + R() * 250) * s;
    const yAt = xx => base + Math.sin(xx / W * freq * TAU + ph) * amp + Math.sin(xx / W * 9.3 + ph * 1.7) * 16 * s;
    x.beginPath();
    for (let xx = -60; xx <= W + 60; xx += 8) xx === -60 ? x.moveTo(xx, yAt(xx)) : x.lineTo(xx, yAt(xx));
    for (let xx = W + 60; xx >= -60; xx -= 8) x.lineTo(xx, yAt(xx) + drop * (.5 + .5 * Math.sin(xx / W * 3 + ph)));
    x.closePath();
    const g = x.createLinearGradient(0, base - amp, 0, base + amp + drop);
    g.addColorStop(0, rgba(c[0], 0)); g.addColorStop(.12, rgba(c[0], .46));
    g.addColorStop(.46, rgba(c[1], .24)); g.addColorStop(1, rgba(c[1], 0));
    x.fillStyle = g; x.fill();

    x.strokeStyle = rgba(c[0], .12); x.lineWidth = 1.4 * s;
    for (let k = 0; k < 80 * Math.sqrt(A); k++) {
      const xx = R() * W, y0 = yAt(xx), h2 = drop * (.25 + R() * .8);
      x.beginPath(); x.moveTo(xx, y0); x.lineTo(xx + (R() - .5) * 22 * s, y0 + h2); x.stroke();
    }
  }
  x.globalCompositeOperation = "source-over";

  const ridge = (yb, col, rough, span) => {
    x.beginPath(); x.moveTo(0, H);
    let y = yb;
    for (let xx = 0; xx <= W; xx += 11 * s) {
      y += (R() - .5) * rough * s;
      y = clamp(y, yb - span * s, yb + span * s);
      x.lineTo(xx, y);
    }
    x.lineTo(W, H); x.closePath(); x.fillStyle = col; x.fill();
  };
  ridge(H * .66, "#0c1822", 26, 86);
  ridge(H * .745, "#050d14", 34, 62);

  const wg = x.createLinearGradient(0, H * .8, 0, H);
  wg.addColorStop(0, "#0b1f31"); wg.addColorStop(1, "#03080d");
  x.fillStyle = wg; x.fillRect(0, H * .8, W, H * .2);
  x.globalCompositeOperation = "lighter";
  for (let i = 0; i < 520 * A; i++) {
    const py = H * .8 + R() * H * .2, len = (10 + R() * 130) * s;
    x.globalAlpha = .03 + R() * .13;
    x.fillStyle = ["#31ffc4", "#4af3ff", "#b6ff4d", "#ffffff"][Math.floor(R() * 4)];
    x.fillRect(R() * W, py, len, 1.5 * s);
  }
  x.globalAlpha = 1; x.globalCompositeOperation = "source-over";
}

function artMeadow(x, W, H, R) {
  const A = (W * H) / (1600 * 1200), s = W / 1600, hz = H * .58;
  const sky = x.createLinearGradient(0, 0, 0, hz);
  sky.addColorStop(0, "#2f6fa6"); sky.addColorStop(.42, "#8cc0d6");
  sky.addColorStop(.78, "#f2d6a4"); sky.addColorStop(1, "#f5bd76");
  x.fillStyle = sky; x.fillRect(0, 0, W, hz + 2);

  const sx = W * .73, sy = hz * .34;
  const sg = x.createRadialGradient(sx, sy, 0, sx, sy, H * .44);
  sg.addColorStop(0, "rgba(255,247,218,.95)"); sg.addColorStop(.16, "rgba(255,226,152,.5)");
  sg.addColorStop(1, "rgba(255,198,118,0)");
  x.fillStyle = sg; x.beginPath(); x.arc(sx, sy, H * .44, 0, TAU); x.fill();
  x.fillStyle = "rgba(255,250,232,.92)"; x.beginPath(); x.arc(sx, sy, 34 * s, 0, TAU); x.fill();

  for (let i = 0; i < 16; i++) {
    const cx = R() * W, cy = R() * hz * .6, w = (90 + R() * 260) * s;
    x.globalAlpha = .1 + R() * .3; x.fillStyle = "#fff";
    for (let k = 0; k < 9; k++) {
      x.beginPath();
      x.ellipse(cx + (R() - .5) * w, cy + (R() - .5) * w * .22, w * (.14 + R() * .26), w * (.06 + R() * .1), 0, 0, TAU);
      x.fill();
    }
  }
  x.globalAlpha = 1;

  const hills = (yb, col, amp) => {
    x.beginPath(); x.moveTo(0, H);
    for (let xx = 0; xx <= W; xx += 14 * s) x.lineTo(xx, yb + Math.sin(xx / W * (2 + R() * .3) * TAU) * amp * s + Math.sin(xx / W * 7) * 9 * s);
    x.lineTo(W, H); x.closePath(); x.fillStyle = col; x.fill();
  };
  hills(hz - 6 * s, "#7fa46a", 22);
  hills(hz + 12 * s, "#5d8c4e", 16);

  const gg = x.createLinearGradient(0, hz, 0, H);
  gg.addColorStop(0, "#6e9d49"); gg.addColorStop(.45, "#3f7434"); gg.addColorStop(1, "#1e461e");
  x.fillStyle = gg; x.fillRect(0, hz, W, H - hz);

  for (let i = 0; i < 11000 * A; i++) {
    const py = hz + Math.pow(R(), .62) * (H - hz);
    const d = (py - hz) / (H - hz);
    const px = R() * W, len = (7 + d * 50) * s * (.6 + R() * .85);
    x.strokeStyle = `hsl(${82 + R() * 42} ${34 + R() * 34}% ${16 + (1 - d) * 30 + R() * 15}%)`;
    x.lineWidth = (.75 + d * 2.1) * s;
    x.beginPath(); x.moveTo(px, py);
    x.quadraticCurveTo(px + (R() - .5) * 15 * s, py - len * .6, px + (R() - .5) * 28 * s, py - len);
    x.stroke();
  }

  const petals = ["#f7f3e4", "#ffd54a", "#e8604c", "#c77ad6", "#ff9ec0", "#fff", "#ffb03a"];
  for (let i = 0; i < 1100 * A; i++) {
    const py = hz + Math.pow(R(), .5) * (H - hz);
    const d = (py - hz) / (H - hz);
    const px = R() * W, rad = (2.6 + d * 8) * s;
    const col = petals[Math.floor(R() * petals.length)];
    x.fillStyle = col;
    const n = 5 + Math.floor(R() * 2);
    for (let k = 0; k < n; k++) {
      const a = k / n * TAU + R();
      x.beginPath(); x.ellipse(px + Math.cos(a) * rad * .8, py + Math.sin(a) * rad * .8, rad * .62, rad * .46, a, 0, TAU); x.fill();
    }
    x.fillStyle = R() < .5 ? "#f6b829" : "#9a6a1e";
    x.beginPath(); x.arc(px, py, rad * .42, 0, TAU); x.fill();
  }

  for (let i = 0; i < 9 * Math.sqrt(A); i++) {
    const px = R() * W, py = hz * .5 + R() * (H - hz) * .5, w = (10 + R() * 12) * s;
    x.fillStyle = ["#f6f0dc", "#ffcf5a", "#e8804c"][Math.floor(R() * 3)];
    x.globalAlpha = .9;
    x.beginPath(); x.ellipse(px - w * .5, py, w * .55, w * .34, -.5, 0, TAU); x.fill();
    x.beginPath(); x.ellipse(px + w * .5, py, w * .55, w * .34, .5, 0, TAU); x.fill();
    x.globalAlpha = 1;
  }
}

function artReef(x, W, H, R) {
  const A = (W * H) / (1600 * 1200), s = W / 1600;
  const sea = x.createLinearGradient(0, 0, 0, H);
  sea.addColorStop(0, "#1fa5c0"); sea.addColorStop(.35, "#10748f");
  sea.addColorStop(.72, "#0a4a63"); sea.addColorStop(1, "#06293a");
  x.fillStyle = sea; x.fillRect(0, 0, W, H);

  x.globalCompositeOperation = "lighter";
  for (let i = 0; i < 26; i++) {
    const px = R() * W, w = (40 + R() * 120) * s;
    x.globalAlpha = .04 + R() * .09; x.fillStyle = "#cdf6ff";
    x.beginPath(); x.moveTo(px, -20); x.lineTo(px + w, -20);
    x.lineTo(px + w * 2.4 + 120 * s, H * .9); x.lineTo(px + w * 1.4 + 90 * s, H * .9);
    x.closePath(); x.fill();
  }
  x.globalAlpha = 1; x.globalCompositeOperation = "source-over";

  const sand = x.createLinearGradient(0, H * .74, 0, H);
  sand.addColorStop(0, "rgba(233,212,168,0)"); sand.addColorStop(.35, "#c9ab7a"); sand.addColorStop(1, "#8d7346");
  x.beginPath(); x.moveTo(0, H);
  for (let xx = 0; xx <= W; xx += 18 * s) x.lineTo(xx, H * .84 + Math.sin(xx / W * 5) * 24 * s + (R() - .5) * 10 * s);
  x.lineTo(W, H); x.closePath(); x.fillStyle = sand; x.fill();
  for (let i = 0; i < 2600 * A; i++) {
    x.fillStyle = R() < .5 ? "rgba(255,246,220,.5)" : "rgba(90,70,40,.35)";
    x.fillRect(R() * W, H * .85 + R() * H * .15, 2 * s, 2 * s);
  }

  const branch = (px, py, ang, len, w, col, depth) => {
    if (depth <= 0 || len < 4 * s) return;
    const ex = px + Math.cos(ang) * len, ey = py + Math.sin(ang) * len;
    x.strokeStyle = col; x.lineWidth = w; x.lineCap = "round";
    x.beginPath(); x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(ang + .4) * len * .5, py + Math.sin(ang + .4) * len * .5, ex, ey);
    x.stroke();
    branch(ex, ey, ang - .38 - R() * .3, len * (.62 + R() * .2), w * .68, col, depth - 1);
    branch(ex, ey, ang + .38 + R() * .3, len * (.62 + R() * .2), w * .68, col, depth - 1);
  };
  const corals = ["#ef6d5a", "#f5a04f", "#d95ba0", "#f2d06b", "#7ad4c0", "#e8523f"];
  for (let i = 0; i < 46 * Math.sqrt(A); i++) {
    const px = R() * W, py = H * (.84 + R() * .13);
    branch(px, py, -Math.PI / 2 + (R() - .5) * .6, (36 + R() * 72) * s, (7 + R() * 9) * s,
      corals[Math.floor(R() * corals.length)], 4);
  }

  for (let i = 0; i < 26 * Math.sqrt(A); i++) {
    const px = R() * W, py = H * (.85 + R() * .1), h2 = (90 + R() * 210) * s;
    x.strokeStyle = `hsl(${120 + R() * 60} ${40 + R() * 30}% ${20 + R() * 22}%)`;
    x.lineWidth = (4 + R() * 7) * s; x.lineCap = "round";
    x.beginPath(); x.moveTo(px, py);
    x.bezierCurveTo(px + 40 * s, py - h2 * .4, px - 46 * s, py - h2 * .7, px + (R() - .5) * 60 * s, py - h2);
    x.stroke();
  }

  const fishCols = ["#ffd24a", "#ff7a4a", "#5ce0ff", "#f5f0dc", "#ff5fa8", "#9dff7a"];
  for (let i = 0; i < 90 * Math.sqrt(A); i++) {
    const px = R() * W, py = R() * H * .82, L = (11 + R() * 26) * s, dir = R() < .5 ? 1 : -1;
    const c = fishCols[Math.floor(R() * fishCols.length)];
    x.save(); x.translate(px, py); x.scale(dir, 1); x.rotate((R() - .5) * .5);
    x.fillStyle = c;
    x.beginPath(); x.ellipse(0, 0, L, L * .46, 0, 0, TAU); x.fill();
    x.beginPath(); x.moveTo(-L * .92, 0); x.lineTo(-L * 1.6, -L * .48); x.lineTo(-L * 1.6, L * .48); x.closePath(); x.fill();
    x.fillStyle = "rgba(0,0,0,.6)"; x.beginPath(); x.arc(L * .46, -L * .1, L * .12, 0, TAU); x.fill();
    x.strokeStyle = "rgba(0,0,0,.18)"; x.lineWidth = L * .12;
    x.beginPath(); x.moveTo(0, -L * .4); x.lineTo(0, L * .4); x.stroke();
    x.restore();
  }

  for (let i = 0; i < 260 * A; i++) {
    const px = R() * W, py = R() * H, r = (2 + R() * 9) * s;
    x.strokeStyle = "rgba(255,255,255,.34)"; x.lineWidth = 1.2 * s;
    x.beginPath(); x.arc(px, py, r, 0, TAU); x.stroke();
    x.fillStyle = "rgba(255,255,255,.14)"; x.beginPath(); x.arc(px - r * .3, py - r * .3, r * .3, 0, TAU); x.fill();
  }
}

function artLowpoly(x, W, H, R) {
  const s = W / 1600;
  const cols = Math.max(11, Math.round(30 * (W / 1600) + 8));
  const rows = Math.max(8, Math.round(cols * H / W));
  const h0 = R() * 360, h1 = h0 + 70 + R() * 130, h2 = h0 - 50 - R() * 90;
  const lx = R(), ly = R() * .6;

  const pts = [];
  for (let r = 0; r <= rows; r++) {
    pts[r] = [];
    for (let c = 0; c <= cols; c++) {
      const edge = (r === 0 || c === 0 || r === rows || c === cols);
      const j = edge ? 0 : .42;
      pts[r][c] = [(c + (R() - .5) * j) * W / cols, (r + (R() - .5) * j) * H / rows];
    }
  }
  const colAt = (u, v) => {
    const a = (Math.sin(u * 3.1 + v * 1.9) + Math.sin(u * -1.4 + v * 4.3 + 1.1)) * .25 + .5;
    const b = (Math.sin(u * 5.2 - v * 2.6 + .7)) * .5 + .5;
    const hue = (a < .5 ? h0 + (h2 - h0) * (a * 2) : h0 + (h1 - h0) * ((a - .5) * 2));
    const d = Math.hypot(u - lx, v - ly);
    const light = 30 + (1 - clamp(d, 0, 1.3) / 1.3) * 42 + b * 10;
    return `hsl(${((hue % 360) + 360) % 360} ${44 + b * 28}% ${clamp(light, 12, 84)}%)`;
  };

  x.fillStyle = colAt(.5, .5); x.fillRect(0, 0, W, H);
  const tri = (p, q, r2) => {
    const u = (p[0] + q[0] + r2[0]) / 3 / W, v = (p[1] + q[1] + r2[1]) / 3 / H;
    x.fillStyle = colAt(u, v);
    x.beginPath(); x.moveTo(p[0], p[1]); x.lineTo(q[0], q[1]); x.lineTo(r2[0], r2[1]); x.closePath();
    x.fill();
    x.strokeStyle = "rgba(0,0,0,.05)"; x.lineWidth = .8 * s; x.stroke();
  };
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const a = pts[r][c], b = pts[r][c + 1], d = pts[r + 1][c], e = pts[r + 1][c + 1];
      if ((r + c) % 2) { tri(a, b, d); tri(b, e, d); } else { tri(a, b, e); tri(a, e, d); }
    }
  }
  const glow = x.createRadialGradient(lx * W, ly * H, 0, lx * W, ly * H, W * .6);
  glow.addColorStop(0, "rgba(255,252,236,.26)"); glow.addColorStop(1, "rgba(255,252,236,0)");
  x.fillStyle = glow; x.fillRect(0, 0, W, H);
}

function artDusk(x, W, H, R) {
  const A = (W * H) / (1600 * 1200), s = W / 1600, hz = H * .68;
  const sky = x.createLinearGradient(0, 0, 0, hz);
  sky.addColorStop(0, "#1b1447"); sky.addColorStop(.32, "#4a2a63");
  sky.addColorStop(.6, "#a8456a"); sky.addColorStop(.82, "#e97a46"); sky.addColorStop(1, "#f6b45c");
  x.fillStyle = sky; x.fillRect(0, 0, W, hz);

  for (let i = 0; i < 500 * A; i++) {
    const py = R() * hz * .5;
    x.globalAlpha = (1 - py / (hz * .5)) * .9 * R();
    x.fillStyle = "#fff";
    x.beginPath(); x.arc(R() * W, py, R() * 1.5 * s + .4 * s, 0, TAU); x.fill();
  }
  x.globalAlpha = 1;

  const sunx = W * .31, suny = hz - 46 * s;
  const sg = x.createRadialGradient(sunx, suny, 0, sunx, suny, 260 * s);
  sg.addColorStop(0, "rgba(255,226,150,.85)"); sg.addColorStop(1, "rgba(255,150,80,0)");
  x.fillStyle = sg; x.beginPath(); x.arc(sunx, suny, 260 * s, 0, TAU); x.fill();
  x.fillStyle = "#ffd98a"; x.beginPath(); x.arc(sunx, suny, 58 * s, 0, TAU); x.fill();

  for (let i = 0; i < 16; i++) {
    const cy = hz * (.18 + R() * .55), w = (160 + R() * 460) * s, h2 = (7 + R() * 16) * s;
    x.globalAlpha = .18 + R() * .34;
    x.fillStyle = R() < .5 ? "#3d2154" : "#ffb887";
    x.beginPath(); x.ellipse(R() * W, cy, w * .5, h2, 0, 0, TAU); x.fill();
  }
  x.globalAlpha = 1;

  const layer = (baseY, col, wMin, wMax, hMin, hMax, litChance, winCol) => {
    let px = -40 * s;
    while (px < W + 40 * s) {
      const bw = (wMin + R() * (wMax - wMin)) * s;
      const bh = (hMin + R() * (hMax - hMin)) * s;
      const top = baseY - bh;
      x.fillStyle = col; x.fillRect(px, top, bw, bh + 10 * s);
      if (R() < .3) { x.fillRect(px + bw * .35, top - 26 * s, bw * .16, 26 * s); }
      const cw = 6 * s, ch = 9 * s, gap = 6 * s;
      for (let wy = top + 12 * s; wy < baseY - 12 * s; wy += ch + gap) {
        for (let wx = px + 8 * s; wx < px + bw - cw - 4 * s; wx += cw + gap) {
          if (R() < litChance) { x.fillStyle = R() < .18 ? "#fff3c9" : winCol; x.fillRect(wx, wy, cw, ch); }
          else if (R() < .3) { x.fillStyle = "rgba(255,255,255,.05)"; x.fillRect(wx, wy, cw, ch); }
        }
      }
      px += bw + (3 + R() * 10) * s;
    }
  };
  layer(hz + 4 * s, "#3a2450", 50, 130, 120, 300, .2, "#ffcc6e");
  layer(hz + 14 * s, "#241535", 60, 150, 180, 420, .3, "#ffbf58");
  layer(hz + 26 * s, "#150c22", 70, 170, 90, 260, .38, "#ffd47c");

  const wg = x.createLinearGradient(0, hz + 20 * s, 0, H);
  wg.addColorStop(0, "#2a1738"); wg.addColorStop(1, "#0b0713");
  x.fillStyle = wg; x.fillRect(0, hz + 20 * s, W, H - hz);
  for (let i = 0; i < 900 * A; i++) {
    const py = hz + 24 * s + R() * (H - hz - 24 * s);
    const t = (py - hz) / (H - hz);
    x.globalAlpha = (1 - t) * .5 * R() + .04;
    x.fillStyle = ["#ffcc6e", "#ff9a5c", "#f6b45c", "#c98fd0"][Math.floor(R() * 4)];
    x.fillRect(R() * W, py, (14 + R() * 90) * s, 1.6 * s);
  }
  x.globalAlpha = 1;

  for (let i = 0; i < 22 * Math.sqrt(A); i++) {
    const px = R() * W, py = R() * hz * .5, w = (7 + R() * 9) * s;
    x.strokeStyle = "rgba(20,10,30,.62)"; x.lineWidth = 1.8 * s; x.lineCap = "round";
    x.beginPath();
    x.moveTo(px - w, py); x.quadraticCurveTo(px - w * .5, py - w * .55, px, py);
    x.quadraticCurveTo(px + w * .5, py - w * .55, px + w, py);
    x.stroke();
  }
}

function artBalloons(x, W, H, R) {
  const A = (W * H) / (1600 * 1200), s = W / 1600, hz = H * .52;
  const sky = x.createLinearGradient(0, 0, 0, hz);
  sky.addColorStop(0, "#2a72b8"); sky.addColorStop(.55, "#77b6dd"); sky.addColorStop(1, "#cfe6ef");
  x.fillStyle = sky; x.fillRect(0, 0, W, hz + 2);

  for (let i = 0; i < 22; i++) {
    const cx = R() * W, cy = R() * hz * .8, w = (110 + R() * 300) * s;
    x.globalAlpha = .22 + R() * .5; x.fillStyle = "#fff";
    for (let k = 0; k < 11; k++) {
      x.beginPath();
      x.ellipse(cx + (R() - .5) * w, cy + (R() - .5) * w * .2, w * (.13 + R() * .25), w * (.05 + R() * .1), 0, 0, TAU);
      x.fill();
    }
  }
  x.globalAlpha = 1;

  const fieldCols = ["#7f9e46", "#a8b957", "#c8aa45", "#5d8742", "#d9c27a", "#96ae4f", "#b98d47", "#6f9a55"];
  const rowsN = 9;
  let y = hz;
  for (let r = 0; r < rowsN; r++) {
    const nh = (H - hz) * (0.05 + r * 0.035);
    const y2 = Math.min(H, y + nh);
    let px = -60 * s;
    while (px < W + 60 * s) {
      const w = (70 + R() * 260) * s * (1 + r * .25);
      x.fillStyle = fieldCols[Math.floor(R() * fieldCols.length)];
      x.beginPath();
      x.moveTo(px, y); x.lineTo(px + w, y);
      x.lineTo(px + w + (R() - .5) * 40 * s, y2); x.lineTo(px + (R() - .5) * 40 * s, y2);
      x.closePath(); x.fill();
      x.globalAlpha = .12 + R() * .16; x.fillStyle = "#2f3f1c";
      for (let k = 0; k < 8; k++) {
        x.fillRect(px + R() * w, y + R() * (y2 - y), w * .5, .9 * s * (1 + r * .4));
      }
      x.globalAlpha = 1;
      x.strokeStyle = "rgba(42,58,24,.42)"; x.lineWidth = (1 + r * .5) * s; x.stroke();
      px += w;
    }
    y = y2;
    if (y >= H) break;
  }
  x.strokeStyle = "rgba(48,64,28,.5)"; x.lineWidth = 2 * s;
  x.beginPath(); x.moveTo(0, hz); x.lineTo(W, hz); x.stroke();

  const stripes = [["#e0493c", "#f6e7cf"], ["#f0a92c", "#2f6f8f"], ["#7d3f9c", "#f3d35e"], ["#1f8f76", "#f6e7cf"], ["#d2436f", "#f7c94b"]];
  const nB = Math.max(3, Math.round(9 * Math.sqrt(A)));
  for (let i = 0; i < nB; i++) {
    const px = 60 * s + R() * (W - 120 * s), py = 70 * s + R() * (hz * .95);
    const rr = (30 + R() * 64) * s;
    const pal = stripes[Math.floor(R() * stripes.length)];
    x.save(); x.translate(px, py);
    const segs = 8;
    for (let k = 0; k < segs; k++) {
      const a0 = -Math.PI / 2 + (k / segs) * TAU, a1 = -Math.PI / 2 + ((k + 1) / segs) * TAU;
      x.fillStyle = k % 2 ? pal[0] : pal[1];
      x.beginPath(); x.moveTo(0, rr * 1.18);
      for (let t = 0; t <= 1; t += .1) {
        const a = a0 + (a1 - a0) * t;
        x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr * 1.06);
      }
      x.closePath(); x.fill();
    }
    x.fillStyle = "rgba(0,0,0,.18)";
    x.beginPath(); x.ellipse(rr * .4, rr * .3, rr * .5, rr * .8, .3, 0, TAU); x.fill();
    x.strokeStyle = "rgba(40,30,20,.7)"; x.lineWidth = 1.4 * s;
    x.beginPath(); x.moveTo(-rr * .3, rr * 1.12); x.lineTo(-rr * .22, rr * 1.5);
    x.moveTo(rr * .3, rr * 1.12); x.lineTo(rr * .22, rr * 1.5); x.stroke();
    x.fillStyle = "#8a5a2c"; x.fillRect(-rr * .26, rr * 1.48, rr * .52, rr * .3);
    x.restore();
  }

  for (let i = 0; i < 16 * Math.sqrt(A); i++) {
    const px = R() * W, py = R() * hz * .7, w = (6 + R() * 8) * s;
    x.strokeStyle = "rgba(30,44,60,.5)"; x.lineWidth = 1.5 * s; x.lineCap = "round";
    x.beginPath();
    x.moveTo(px - w, py); x.quadraticCurveTo(px - w * .5, py - w * .5, px, py);
    x.quadraticCurveTo(px + w * .5, py - w * .5, px + w, py);
    x.stroke();
  }
}

const DESIGNS = [
  { name: "Aurora",        draw: artAurora,   aspect: 4 / 3 },
  { name: "Summer Meadow", draw: artMeadow,   aspect: 4 / 3 },
  { name: "Coral Reef",    draw: artReef,     aspect: 4 / 3 },
  { name: "Facets",        draw: artLowpoly,  aspect: 4 / 3 },
  { name: "Harbour Dusk",  draw: artDusk,     aspect: 3 / 2 },
  { name: "Balloon Day",   draw: artBalloons, aspect: 3 / 2 }
];

function paint(design, seed, W) {
  const H = Math.round(W / design.aspect);
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  x.imageSmoothingQuality = "high";
  design.draw(x, W, H, mulberry32(seed));
  return cv;
}

/* ============================================================
   Cutting the board: edges, piece paths, sprite atlases
   ============================================================ */

// One cubic-bezier chain for a single cut between two pieces.
// s = 0 flat border, +1 tab pointing along the canonical normal, -1 socket.
function edgeSegs(sx, sy, dx, dy, nx, ny, len, tab, s, wig, off) {
  const P = (u, v) => [sx + dx * len * u + nx * tab * v, sy + dy * len * u + ny * tab * v];
  if (s === 0) { const e = P(1, 0); return [["L", e[0], e[1]]]; }
  const a = 0.5 + off * 0.055;
  const t = s * 0.26;
  const out = [];
  const C = (c1u, c1v, c2u, c2v, pu, pv) => {
    const c1 = P(c1u, c1v), c2 = P(c2u, c2v), p = P(pu, pv);
    out.push(["C", c1[0], c1[1], c2[0], c2[1], p[0], p[1]]);
  };
  C(0.18, wig, 0.30, -wig, a - 0.115, 0.012 * s);
  C(a - 0.14, t * 0.42, a - 0.155, t * 0.86, a - 0.10, t * 1.06);
  C(a - 0.035, t * 1.30, a + 0.035, t * 1.30, a + 0.10, t * 1.06);
  C(a + 0.155, t * 0.86, a + 0.14, t * 0.42, a + 0.115, 0.012 * s);
  C(a + 0.30, -wig, 0.82, wig, 1, 0);
  return out;
}

function reverseEdge(start, segs) {
  const pts = [start];
  for (const sg of segs) pts.push(sg[0] === "L" ? [sg[1], sg[2]] : [sg[5], sg[6]]);
  const out = [];
  for (let i = segs.length - 1; i >= 0; i--) {
    const sg = segs[i], from = pts[i];
    if (sg[0] === "L") out.push(["L", from[0], from[1]]);
    else out.push(["C", sg[3], sg[4], sg[1], sg[2], from[0], from[1]]);
  }
  return { start: pts[pts.length - 1], segs: out };
}

function emit(ctx, segs) {
  for (const sg of segs) {
    if (sg[0] === "L") ctx.lineTo(sg[1], sg[2]);
    else ctx.bezierCurveTo(sg[1], sg[2], sg[3], sg[4], sg[5], sg[6]);
  }
}

function chooseGrid(target, aspect) {
  let best = null;
  const hi = Math.max(2, Math.ceil(Math.sqrt(target * aspect) * 2.2));
  for (let cols = 1; cols <= hi; cols++) {
    const rows = Math.max(1, Math.round(target / cols));
    const count = cols * rows;
    const squareness = Math.abs(Math.log((aspect * rows) / cols));
    const err = Math.abs(count - target) / target;
    const score = squareness * 3.2 + err * 2.4;
    if (!best || score < best.score) best = { cols, rows, count, score };
  }
  return best;
}

/* ============================================================
   Game state
   ============================================================ */
const G = {
  img: null, name: "", W: 0, H: 0,
  cols: 0, rows: 0, pw: 0, ph: 0, pad: 0, cellW: 0, cellH: 0,
  hE: null, vE: null,
  pieces: [], groups: [], order: [], atlases: [],
  world: { x0: 0, y0: 0, x1: 0, y1: 0 },
  zoom: 1, panX: 0, panY: 0, minZoom: .06, maxZoom: 3,
  rotateMode: false, ghost: true, edgeFocus: false,
  startedAt: 0, elapsed: 0, running: false, solved: false,
  tol: 12, pulses: [], confetti: [], anims: [], hints: 0, celebrating: 0,
  held: null, selected: null, seed: 0, designIndex: 0, target: 100
};

const canvas = $("board");
const ctx = canvas.getContext("2d");
let DPR = 1, cssW = 0, cssH = 0, dirty = true, needFit = false;

// requestAnimationFrame is paused whenever the page is hidden — and also when
// this page is in a frame the browser isn't painting — which would strand the
// cut on "Cutting the board" for good. Drive work from whichever of rAF or a
// timer arrives first, and tell the callback when rAF was the one that failed
// so it can stop budgeting for frames nobody is drawing.
function schedule(fn) {
  let ran = false;
  const run = starved => { if (ran) return; ran = true; fn(starved); };
  requestAnimationFrame(() => run(false));
  setTimeout(() => run(true), 40);
}

function resize() {
  const st = $("stage");
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cssW = st.clientWidth; cssH = st.clientHeight;
  canvas.width = Math.max(1, Math.round(cssW * DPR));
  canvas.height = Math.max(1, Math.round(cssH * DPR));
  if (needFit && cssW > 2 && cssH > 2 && G.pieces.length) fitView();
  dirty = true;
}
new ResizeObserver(resize).observe($("stage"));
document.addEventListener("visibilitychange", () => { if (!document.hidden) dirty = true; });

/* ---- build ---- */
function buildPuzzle(srcCanvas, target, name, onProgress, onDone) {
  const grid = chooseGrid(target, srcCanvas.width / srcCanvas.height);
  const cols = grid.cols, rows = grid.rows;
  const pw = Math.max(18, Math.round(srcCanvas.width / cols));
  const ph = Math.max(18, Math.round(srcCanvas.height / rows));
  const W = pw * cols, H = ph * rows;

  const img = document.createElement("canvas");
  img.width = W; img.height = H;
  const ix = img.getContext("2d");
  ix.imageSmoothingQuality = "high";
  ix.drawImage(srcCanvas, 0, 0, W, H);

  const tab = Math.min(pw, ph);
  const pad = Math.ceil(0.35 * tab) + 2;
  const cellW = pw + pad * 2, cellH = ph + pad * 2;

  // canonical edges
  const hE = [], vE = [];
  for (let r = 0; r <= rows; r++) {
    hE[r] = [];
    for (let c = 0; c < cols; c++) {
      const s = (r === 0 || r === rows) ? 0 : (Math.random() < .5 ? 1 : -1);
      const start = [c * pw, r * ph];
      const segs = edgeSegs(start[0], start[1], 1, 0, 0, -1, pw, tab, s, (Math.random() - .5) * .055, Math.random() - .5);
      hE[r][c] = { s, start, segs, rev: reverseEdge(start, segs) };
    }
  }
  for (let r = 0; r < rows; r++) {
    vE[r] = [];
    for (let c = 0; c <= cols; c++) {
      const s = (c === 0 || c === cols) ? 0 : (Math.random() < .5 ? 1 : -1);
      const start = [c * pw, r * ph];
      const segs = edgeSegs(start[0], start[1], 0, 1, -1, 0, ph, tab, s, (Math.random() - .5) * .055, Math.random() - .5);
      vE[r][c] = { s, start, segs, rev: reverseEdge(start, segs) };
    }
  }

  Object.assign(G, {
    img, name, W, H, cols, rows, pw, ph, pad, cellW, cellH, hE, vE,
    pieces: [], groups: [], order: [], atlases: [],
    tol: Math.max(9, Math.min(pw, ph) * 0.3),
    pulses: [], confetti: [], anims: [], hints: 0, solved: false, celebrating: 0, held: null, selected: null
  });

  // atlas packing
  const MAX = 4096;
  const perRow = Math.max(1, Math.floor(MAX / cellW));
  const rowsPerAtlas = Math.max(1, Math.floor(MAX / cellH));
  const perAtlas = perRow * rowsPerAtlas;
  const total = cols * rows;
  const atlasCount = Math.ceil(total / perAtlas);
  for (let i = 0; i < atlasCount; i++) {
    const n = Math.min(perAtlas, total - i * perAtlas);
    const aw = Math.min(MAX, perRow * cellW);
    const ah = Math.min(MAX, Math.ceil(n / perRow) * cellH);
    const cv = document.createElement("canvas");
    cv.width = aw; cv.height = ah;
    G.atlases.push({ cv, ctx: cv.getContext("2d"), w: aw, h: ah, mask: null });
  }

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      const ai = Math.floor(i / perAtlas), li = i % perAtlas;
      G.pieces.push({
        c, r, i,
        hx: c * pw, hy: r * ph,
        bx: c * pw - pad, by: r * ph - pad,
        atlas: G.atlases[ai],
        sx: (li % perRow) * cellW, sy: Math.floor(li / perRow) * cellH,
        edge: (c === 0 || r === 0 || c === cols - 1 || r === rows - 1),
        group: null
      });
    }
  }

  let i = 0;
  function step(starved) {
    // Nothing is being painted when rAF is starved, so there is no frame
    // budget to protect — finish the whole cut in one pass instead.
    const budget = starved ? Infinity : 13;
    const t0 = performance.now();
    while (i < total && performance.now() - t0 < budget) { renderPiece(G.pieces[i]); i++; }
    onProgress(i / total);
    if (i < total) schedule(step);
    else {
      for (const a of G.atlases) {
        const data = a.ctx.getImageData(0, 0, a.w, a.h).data;
        const m = new Uint8Array(a.w * a.h);
        for (let k = 0, n = m.length; k < n; k++) m[k] = data[k * 4 + 3] > 120 ? 1 : 0;
        a.mask = m;
      }
      for (const p of G.pieces) {
        const g = { rot: 0, tx: 0, ty: 0, pieces: [p], cx: p.hx + pw / 2, cy: p.hy + ph / 2, pbb: null, anim: null };
        p.group = g; G.groups.push(g); G.order.push(g);
      }
      G.groups.forEach(refreshGroup);
      onDone();
    }
  }
  schedule(step);
}

function piecePath(ctx2, c, r) {
  const top = G.hE[r][c], right = G.vE[r][c + 1], bot = G.hE[r + 1][c], left = G.vE[r][c];
  ctx2.moveTo(top.start[0], top.start[1]);
  emit(ctx2, top.segs);
  emit(ctx2, right.segs);
  emit(ctx2, bot.rev.segs);
  emit(ctx2, left.rev.segs);
  ctx2.closePath();
}

function renderPiece(p) {
  const a = p.atlas, x = a.ctx;
  const { cellW, cellH, img, W, H } = G;
  x.save();
  x.translate(p.sx - p.bx, p.sy - p.by); // work in puzzle coordinates

  x.beginPath(); piecePath(x, p.c, p.r); x.clip();

  const sx0 = Math.max(0, p.bx), sy0 = Math.max(0, p.by);
  const sx1 = Math.min(W, p.bx + cellW), sy1 = Math.min(H, p.by + cellH);
  if (sx1 > sx0 && sy1 > sy0) x.drawImage(img, sx0, sy0, sx1 - sx0, sy1 - sy0, sx0, sy0, sx1 - sx0, sy1 - sy0);

  // Shifting the highlight path down-right leaves only its top-left flank
  // inside the clip, so every piece is lit from the same corner.
  const lw = Math.max(1.4, cellW * 0.035);
  x.translate(1.2, 1.2);
  x.beginPath(); piecePath(x, p.c, p.r);
  x.strokeStyle = "rgba(255,255,255,0.32)"; x.lineWidth = lw * .85; x.stroke();
  x.translate(-1.2, -1.2);
  x.beginPath(); piecePath(x, p.c, p.r);
  x.strokeStyle = "rgba(0,0,0,0.45)"; x.lineWidth = lw; x.stroke();

  x.restore();
}

/* ---- group geometry ---- */
function rotPt(rot, x, y) {
  switch (rot & 3) {
    case 1: return [-y, x];
    case 2: return [-x, -y];
    case 3: return [y, -x];
    default: return [x, y];
  }
}
function invRotPt(rot, x, y) { return rotPt((4 - (rot & 3)) & 3, x, y); }

function refreshGroup(g) {
  let sx = 0, sy = 0, x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of g.pieces) {
    sx += p.hx + G.pw / 2; sy += p.hy + G.ph / 2;
    if (p.bx < x0) x0 = p.bx;
    if (p.by < y0) y0 = p.by;
    if (p.bx + G.cellW > x1) x1 = p.bx + G.cellW;
    if (p.by + G.cellH > y1) y1 = p.by + G.cellH;
  }
  g.cx = sx / g.pieces.length; g.cy = sy / g.pieces.length;
  g.pbb = { x0, y0, x1, y1 };
}

function groupWorldBox(g) {
  const b = g.pbb;
  const cs = [[b.x0, b.y0], [b.x1, b.y0], [b.x1, b.y1], [b.x0, b.y1]];
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const c of cs) {
    const q = rotPt(g.rot, c[0], c[1]);
    const wx = q[0] + g.tx, wy = q[1] + g.ty;
    if (wx < x0) x0 = wx; if (wx > x1) x1 = wx;
    if (wy < y0) y0 = wy; if (wy > y1) y1 = wy;
  }
  return { x0, y0, x1, y1 };
}

function groupCenterWorld(g) {
  const q = rotPt(g.rot, g.cx, g.cy);
  return [q[0] + g.tx, q[1] + g.ty];
}

function rotateGroup(g) {
  const [cx, cy] = groupCenterWorld(g);
  g.rot = (g.rot + 1) & 3;
  const q = rotPt(g.rot, g.cx, g.cy);
  g.tx = cx - q[0]; g.ty = cy - q[1];
}

function pieceAt(c, r) {
  if (c < 0 || r < 0 || c >= G.cols || r >= G.rows) return null;
  return G.pieces[r * G.cols + c];
}

const NEIGHBOURS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

function mergeInto(a, b) {
  // b absorbs a (both already share rot + translation)
  const keep = b.pieces.length >= a.pieces.length ? b : a;
  const gone = keep === b ? a : b;
  for (const p of gone.pieces) { p.group = keep; keep.pieces.push(p); }
  G.groups.splice(G.groups.indexOf(gone), 1);
  G.order.splice(G.order.indexOf(gone), 1);
  refreshGroup(keep);
  return keep;
}

function settle(g) {
  const tol = G.tol;
  let merged = 0, changed = true;
  while (changed) {
    changed = false;
    if (g.rot === 0 && Math.abs(g.tx) < tol && Math.abs(g.ty) < tol) { g.tx = 0; g.ty = 0; }
    outer:
    for (const p of g.pieces) {
      for (const [dc, dr] of NEIGHBOURS) {
        const n = pieceAt(p.c + dc, p.r + dr);
        if (!n || n.group === g) continue;
        const h = n.group;
        if (h.rot !== g.rot) continue;
        if (Math.abs(h.tx - g.tx) < tol && Math.abs(h.ty - g.ty) < tol) {
          g.tx = h.tx; g.ty = h.ty;
          const seam = rotPt(g.rot, (p.hx + n.hx) / 2 + G.pw / 2, (p.hy + n.hy) / 2 + G.ph / 2);
          G.pulses.push({ x: seam[0] + g.tx, y: seam[1] + g.ty, t: performance.now() });
          g = mergeInto(g, h);
          merged++; changed = true;
          break outer;
        }
      }
    }
  }
  if (merged) {
    G.order.splice(G.order.indexOf(g), 1);
    G.order.unshift(g);
  }
  return { group: g, merged };
}

/* ---- hints ---- */
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function rotPtF(ang, x, y) {
  const s = Math.sin(ang), c = Math.cos(ang);
  return [x * c - y * s, x * s + y * c];
}
const atHome = g => g.rot === 0 && g.tx === 0 && g.ty === 0;

// Animations advance inside render(), which rAF can stop delivering the moment
// the page is hidden — so every flight also carries its own timer. Whichever
// gets there first lands the piece; the other finds nothing left to do.
function finishAnim(g) {
  if (!g.anim) return;
  g.anim = null;
  const i = G.anims.indexOf(g);
  if (i >= 0) G.anims.splice(i, 1);
  landHint(g);
}

function stepAnims() {
  const now = performance.now();
  for (let i = G.anims.length - 1; i >= 0; i--) {
    const g = G.anims[i];
    if (!g.anim) { G.anims.splice(i, 1); continue; }
    g.anim.t = clamp((now - g.anim.t0) / g.anim.dur, 0, 1);
    if (g.anim.t >= 1) finishAnim(g);
  }
}

// Worth more the more it grows what is already assembled; corners first when
// nothing is down yet, which is how people actually start a jigsaw.
function hintScore(p) {
  let s = Math.random();
  for (const [dc, dr] of NEIGHBOURS) {
    const n = pieceAt(p.c + dc, p.r + dr);
    if (n && n.group !== p.group && atHome(n.group)) s += 10;
  }
  const corner = (p.c === 0 || p.c === G.cols - 1) && (p.r === 0 || p.r === G.rows - 1);
  if (corner) s += 6; else if (p.edge) s += 3;
  return s;
}

function pickHint() {
  // if you have a piece in hand, the hint is about that piece
  const sel = G.selected;
  if (sel && !sel.anim && !atHome(sel) && G.groups.includes(sel)) return sel;

  let best = null, bestScore = -1;
  for (const g of G.groups) {
    if (g.anim || atHome(g) || g.pieces.length !== 1) continue;
    const s = hintScore(g.pieces[0]);
    if (s > bestScore) { bestScore = s; best = g; }
  }
  if (best) return best;

  // nothing loose left — settle the smallest stray slab instead
  let smallest = null;
  for (const g of G.groups) {
    if (g.anim || atHome(g)) continue;
    if (!smallest || g.pieces.length < smallest.pieces.length) smallest = g;
  }
  return smallest;
}

function giveHint() {
  if (G.solved || !G.pieces.length) return;
  const g = pickHint();
  if (!g) return;
  startClock();

  G.hints++;
  updateHintBtn();

  const rotFrom = g.rot;
  let d = ((0 - rotFrom) % 4 + 4) % 4;
  if (d > 2) d -= 4;                       // unwind the short way round
  g.anim = {
    t: 0, t0: performance.now(), dur: 620,
    rotFrom, rotDelta: d,
    cFrom: groupCenterWorld(g),
    cTo: [g.cx, g.cy]                      // where its centre belongs on the board
  };
  G.anims.push(g);
  G.order.splice(G.order.indexOf(g), 1);
  G.order.push(g);                          // fly over everything else
  setTimeout(() => finishAnim(g), 620 + 140);
  dirty = true;
}

function landHint(g) {
  g.rot = 0; g.tx = 0; g.ty = 0;
  const res = settle(g);
  G.selected = res.group;
  G.pulses.push({ x: g.cx, y: g.cy, t: performance.now() });
  updateHud();
  checkSolved();
  dirty = true;
}

function updateHintBtn() {
  const b = $("hintBtn");
  if (!b) return;
  const lbl = b.querySelector(".lbl");
  if (lbl) lbl.textContent = G.hints ? `Hint \u00b7 ${G.hints}` : "Hint";
}

/* ---- scatter ---- */
function computeWorld() {
  const { W, H } = G;
  const n = G.pieces.length;
  // Ring of table around the frame, sized k × the picture's own area: small
  // puzzles keep the frame big on screen, big ones get room to spread out.
  const k = clamp(0.9 + n / 260, 1.2, 2.6);
  // solve (W+2m)(H+2m) = (1+k) W H  →  4m² + 2m(W+H) − kWH = 0
  const a = 4, b = 2 * (W + H), c = -k * W * H;
  // A few big pieces need a ring at least a piece deep, or there is nowhere
  // outside the frame to put them and the whole pile lands on the picture.
  const m = Math.max(
    (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a),
    Math.max(G.cellW, G.cellH) * 0.95
  );
  G.world = { x0: -m, y0: -m, x1: W + m, y1: H + m };
}

// The four strips of table around the frame, partitioned so nothing is
// double-counted. Sampling by area spreads the pile evenly round the picture.
function scatterBands() {
  const { x0, y0, x1, y1 } = G.world;
  const cell = Math.max(G.cellW, G.cellH);
  const mg = cell * .5, gap = cell * .15;
  return [
    { x: [x0 + mg, -gap],        y: [-gap, G.H + gap] },
    { x: [G.W + gap, x1 - mg],   y: [-gap, G.H + gap] },
    { x: [x0 + mg, x1 - mg],     y: [y0 + mg, -gap] },
    { x: [x0 + mg, x1 - mg],     y: [G.H + gap, y1 - mg] }
  ].map(b => ({ x: b.x, y: b.y, w: b.x[1] - b.x[0], h: b.y[1] - b.y[0] }))
   .filter(b => b.w > 2 && b.h > 2);
}

function scatter(only) {
  const bands = scatterBands();
  const area = bands.reduce((s, b) => s + b.w * b.h, 0);
  const pick = () => {
    if (!area) {
      const { x0, y0, x1, y1 } = G.world;
      return [x0 + Math.random() * (x1 - x0), y0 + Math.random() * (y1 - y0)];
    }
    let t = Math.random() * area;
    for (const b of bands) {
      t -= b.w * b.h;
      if (t <= 0) return [b.x[0] + Math.random() * b.w, b.y[0] + Math.random() * b.h];
    }
    const b = bands[bands.length - 1];
    return [b.x[0] + Math.random() * b.w, b.y[0] + Math.random() * b.h];
  };

  for (const g of G.groups) {
    if (only === "single") {
      if (g.pieces.length !== 1) continue;
      // leave a lone piece alone if it is already sitting in its slot
      if (g.rot === 0 && g.tx === 0 && g.ty === 0) continue;
    }
    if (G.rotateMode) g.rot = Math.floor(Math.random() * 4);
    const [tx, ty] = pick();
    const q = rotPt(g.rot, g.cx, g.cy);
    g.tx = tx - q[0]; g.ty = ty - q[1];
  }
  // shuffle draw order so the pile looks tumbled
  for (let i = G.order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [G.order[i], G.order[j]] = [G.order[j], G.order[i]];
  }
  dirty = true;
}

/* ---- view ---- */
function fitView(pad) {
  // A frame that is not being painted reports a zero-sized stage, which would
  // bake a NaN zoom. Defer until the real size arrives via the ResizeObserver.
  if (cssW < 2 || cssH < 2) { needFit = true; return; }
  needFit = false;
  const w = G.world.x1 - G.world.x0, h = G.world.y1 - G.world.y0;
  const z = Math.min(cssW / (w * (pad || 1.02)), cssH / (h * (pad || 1.02)));
  G.minZoom = z * .55;
  G.zoom = z;
  G.panX = cssW / 2 - ((G.world.x0 + G.world.x1) / 2) * z;
  G.panY = cssH / 2 - ((G.world.y0 + G.world.y1) / 2) * z;
  dirty = true;
}

function zoomAt(sxp, syp, factor) {
  const z0 = G.zoom;
  const z = clamp(z0 * factor, G.minZoom, G.maxZoom);
  if (z === z0) return;
  const wx = (sxp - G.panX) / z0, wy = (syp - G.panY) / z0;
  G.zoom = z;
  G.panX = sxp - wx * z; G.panY = syp - wy * z;
  dirty = true;
}

const toWorld = (sxp, syp) => [(sxp - G.panX) / G.zoom, (syp - G.panY) / G.zoom];

/* ---- render ---- */
let feltColors = { table: "#173029", edge: "#0c1a16" };
function refreshFelt() {
  const s = getComputedStyle(document.documentElement);
  feltColors = {
    table: s.getPropertyValue("--table").trim() || "#173029",
    edge: s.getPropertyValue("--table-edge").trim() || "#0c1a16"
  };
  dirty = true;
}
if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  mq.addEventListener ? mq.addEventListener("change", refreshFelt) : mq.addListener(refreshFelt);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  const bg = ctx.createRadialGradient(cssW * .5 * DPR, cssH * .42 * DPR, 0, cssW * .5 * DPR, cssH * .5 * DPR, Math.max(cssW, cssH) * DPR * .8);
  bg.addColorStop(0, feltColors.table); bg.addColorStop(1, feltColors.edge);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (!G.pieces.length) { dirty = false; return; }

  ctx.setTransform(DPR * G.zoom, 0, 0, DPR * G.zoom, DPR * G.panX, DPR * G.panY);
  const vx0 = -G.panX / G.zoom, vy0 = -G.panY / G.zoom;
  const vx1 = (cssW - G.panX) / G.zoom, vy1 = (cssH - G.panY) / G.zoom;

  // the frame the finished picture belongs in
  ctx.fillStyle = "rgba(0,0,0,.22)";
  ctx.fillRect(0, 0, G.W, G.H);
  if (G.ghost) {
    ctx.globalAlpha = .17;
    ctx.drawImage(G.img, 0, 0);
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = "rgba(255,255,255,.26)";
  ctx.lineWidth = Math.max(1, 2 / G.zoom);
  ctx.setLineDash([12 / G.zoom, 9 / G.zoom]);
  ctx.strokeRect(0, 0, G.W, G.H);
  ctx.setLineDash([]);

  const held = G.held && G.held.group;
  const dim = G.edgeFocus;

  stepAnims();
  for (const g of G.order) {
    if (!g.anim) {
      const b = groupWorldBox(g);
      if (b.x1 < vx0 || b.x0 > vx1 || b.y1 < vy0 || b.y0 > vy1) continue;
    }
    drawGroup(g, g === held, dim);
  }

  // snap pulses
  const now = performance.now();
  for (let i = G.pulses.length - 1; i >= 0; i--) {
    const p = G.pulses[i];
    const t = (now - p.t) / 460;
    if (t >= 1) { G.pulses.splice(i, 1); continue; }
    ctx.strokeStyle = `rgba(116,211,166,${(1 - t) * .8})`;
    ctx.lineWidth = Math.max(1, 3 / G.zoom);
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.min(G.pw, G.ph) * (.25 + t * .95), 0, TAU);
    ctx.stroke();
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (G.confetti.length) drawConfetti();

  dirty = G.pulses.length > 0 || G.confetti.length > 0 || G.anims.length > 0;
}

function drawGroup(g, isHeld, dim) {
  const { cellW, cellH } = G;
  ctx.save();
  if (isHeld) {
    const [cx, cy] = groupCenterWorld(g);
    ctx.translate(cx, cy); ctx.scale(1.045, 1.045); ctx.translate(-cx, -cy);
    if (g.pieces.length <= 6) {
      ctx.shadowColor = "rgba(0,0,0,.55)";
      ctx.shadowBlur = 16 / G.zoom;
      ctx.shadowOffsetY = 7 / G.zoom;
    }
  }

  // A hinted piece flies home: the centre travels in a straight line while the
  // angle unwinds, so it reads as being set down rather than teleporting.
  if (g.anim) {
    const a = g.anim, e = easeInOut(a.t);
    const ang = (a.rotFrom + a.rotDelta * e) * Math.PI / 2;
    const cx = a.cFrom[0] + (a.cTo[0] - a.cFrom[0]) * e;
    const cy = a.cFrom[1] + (a.cTo[1] - a.cFrom[1]) * e;
    const q = rotPtF(ang, g.cx, g.cy);
    const lift = 1 + 0.12 * Math.sin(e * Math.PI);
    ctx.translate(cx, cy); ctx.scale(lift, lift); ctx.translate(-cx, -cy);
    ctx.translate(cx - q[0], cy - q[1]);
    ctx.rotate(ang);
    for (const p of g.pieces) ctx.drawImage(p.atlas.cv, p.sx, p.sy, cellW, cellH, p.bx, p.by, cellW, cellH);
    ctx.restore();
    return;
  }

  if (g.rot === 0) {
    const tx = g.tx, ty = g.ty;
    const vx0 = -G.panX / G.zoom - cellW, vy0 = -G.panY / G.zoom - cellH;
    const vx1 = (cssW - G.panX) / G.zoom, vy1 = (cssH - G.panY) / G.zoom;
    for (const p of g.pieces) {
      const dx = p.bx + tx, dy = p.by + ty;
      if (dx < vx0 || dx > vx1 || dy < vy0 || dy > vy1) continue;
      if (dim && !p.edge) { ctx.globalAlpha = .18; }
      ctx.drawImage(p.atlas.cv, p.sx, p.sy, cellW, cellH, dx, dy, cellW, cellH);
      if (dim && !p.edge) ctx.globalAlpha = 1;
    }
  } else {
    ctx.translate(g.tx, g.ty);
    ctx.rotate(g.rot * Math.PI / 2);
    for (const p of g.pieces) {
      if (dim && !p.edge) ctx.globalAlpha = .18;
      ctx.drawImage(p.atlas.cv, p.sx, p.sy, cellW, cellH, p.bx, p.by, cellW, cellH);
      if (dim && !p.edge) ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

function drawConfetti() {
  const now = performance.now();
  for (let i = G.confetti.length - 1; i >= 0; i--) {
    const c = G.confetti[i];
    const dt = Math.min(48, now - c.last); c.last = now;
    c.vy += 0.019 * dt;
    c.x += c.vx * dt * 0.06; c.y += c.vy * dt * 0.06;
    c.a += c.va * dt * 0.06;
    if (c.y > cssH + 40) { G.confetti.splice(i, 1); continue; }
    ctx.save();
    ctx.translate(c.x * DPR, c.y * DPR);
    ctx.rotate(c.a);
    ctx.fillStyle = c.col;
    ctx.globalAlpha = .92;
    ctx.fillRect(-c.w * DPR / 2, -c.h * DPR / 2, c.w * DPR, c.h * DPR);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function burstConfetti() {
  const cols = ["#d9a441", "#74d3a6", "#e2694a", "#f3e7cf", "#6fb6d8"];
  for (let i = 0; i < 160; i++) {
    G.confetti.push({
      x: cssW * (.2 + Math.random() * .6), y: cssH * .35 + Math.random() * 40,
      vx: (Math.random() - .5) * 9, vy: -4 - Math.random() * 7,
      a: Math.random() * TAU, va: (Math.random() - .5) * .5,
      w: 5 + Math.random() * 7, h: 8 + Math.random() * 9,
      col: cols[Math.floor(Math.random() * cols.length)], last: performance.now()
    });
  }
  dirty = true;
}

function loop() {
  if (dirty || G.confetti.length || G.pulses.length) render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ============================================================
   Pointer input
   ============================================================ */
const pointers = new Map();
let drag = null, pan = null, pinch = null, lastWorld = [0, 0];

// Turning re-anchors the drag, otherwise the next move re-applies the whole
// delta and the group leaps away from the cursor.
function turnHeld() {
  const g = (G.held && G.held.group) || G.selected;
  if (!g || !G.rotateMode || G.solved) return;
  rotateGroup(g);
  if (drag && drag.g === g) {
    drag.tx0 = g.tx; drag.ty0 = g.ty;
    drag.sx = lastWorld[0]; drag.sy = lastWorld[1];
  }
  dirty = true;
}

function localPt(e) {
  const r = canvas.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

function hitTest(wx, wy) {
  const { cellW, cellH, pw, ph } = G;
  for (let i = G.order.length - 1; i >= 0; i--) {
    const g = G.order[i];
    if (g.anim) continue;
    const q = invRotPt(g.rot, wx - g.tx, wy - g.ty);
    const c = Math.floor(q[0] / pw), r = Math.floor(q[1] / ph);
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const p = pieceAt(c + dc, r + dr);
        if (!p || p.group !== g) continue;
        if (G.edgeFocus && !p.edge) continue;
        const lx = Math.floor(q[0] - p.bx), ly = Math.floor(q[1] - p.by);
        if (lx < 0 || ly < 0 || lx >= cellW || ly >= cellH) continue;
        const a = p.atlas;
        if (a.mask && a.mask[(p.sy + ly) * a.w + (p.sx + lx)]) return p;
      }
    }
  }
  return null;
}

canvas.addEventListener("pointerdown", e => {
  if (G.solved) return;
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, localPt(e));
  hideHint();

  if (pointers.size === 2) {
    drag = null; pan = null;
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), cx: (a[0] + b[0]) / 2, cy: (a[1] + b[1]) / 2 };
    return;
  }
  if (pointers.size > 2) return;

  const [sxp, syp] = localPt(e);
  const [wx, wy] = toWorld(sxp, syp);
  lastWorld = [wx, wy];

  if (e.button === 2) {
    const p = hitTest(wx, wy);
    if (p && G.rotateMode) { G.selected = p.group; turnHeld(); }
    return;
  }

  const p = hitTest(wx, wy);
  if (p) {
    startClock();
    const g = p.group;
    G.held = p; G.selected = g;
    G.order.splice(G.order.indexOf(g), 1); G.order.push(g);
    drag = { g, sx: wx, sy: wy, tx0: g.tx, ty0: g.ty, moved: false };
    canvas.classList.add("grabbing");
  } else {
    pan = { sx: sxp, sy: syp, px: G.panX, py: G.panY };
    canvas.classList.add("grabbing");
  }
  dirty = true;
});

canvas.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, localPt(e));

  if (pinch && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    const cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2;
    if (pinch.d > 0) zoomAt(cx, cy, d / pinch.d);
    G.panX += cx - pinch.cx; G.panY += cy - pinch.cy;
    pinch = { d, cx, cy };
    dirty = true;
    return;
  }

  const [sxp, syp] = localPt(e);
  lastWorld = toWorld(sxp, syp);
  if (drag) {
    const [wx, wy] = lastWorld;
    drag.g.tx = drag.tx0 + (wx - drag.sx);
    drag.g.ty = drag.ty0 + (wy - drag.sy);
    drag.moved = true;
    dirty = true;
  } else if (pan) {
    G.panX = pan.px + (sxp - pan.sx);
    G.panY = pan.py + (syp - pan.sy);
    dirty = true;
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) {
    if (drag) {
      const res = settle(drag.g);
      G.selected = res.group;
      if (res.merged) checkSolved();
      updateHud();
    }
    drag = null; pan = null;
    G.held = null;
    canvas.classList.remove("grabbing");
    dirty = true;
  }
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("contextmenu", e => e.preventDefault());

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const [sxp, syp] = localPt(e);
  zoomAt(sxp, syp, Math.pow(0.9988, e.deltaY * (e.deltaMode === 1 ? 16 : 1)));
}, { passive: false });

/* ============================================================
   HUD, clock, flow
   ============================================================ */
function startClock() {
  if (G.running || G.solved) return;
  G.running = true;
  G.startedAt = performance.now() - G.elapsed;
}
setInterval(() => {
  if (G.running && !G.solved) {
    G.elapsed = performance.now() - G.startedAt;
    $("clock").textContent = fmtTime(G.elapsed);
  }
}, 250);

function updateHud() {
  const total = G.pieces.length;
  const joined = total - G.groups.length;
  $("joinedCount").textContent = joined;
  $("totalCount").textContent = total;
  $("barFill").style.width = (total > 1 ? (joined / (total - 1)) * 100 : 100) + "%";
}

function checkSolved() {
  if (G.groups.length !== 1 || G.solved) return;
  G.solved = true; G.running = false;
  const g = G.groups[0];
  g.rot = 0; g.tx = 0; g.ty = 0;
  dirty = true;

  const key = "jt.best." + G.pieces.length;
  const prev = store(key);
  const isRecord = prev === null || G.elapsed < prev;
  if (isRecord) store(key, Math.round(G.elapsed));

  $("solvedTime").textContent = fmtTime(G.elapsed);
  $("solvedDetail").textContent = `${G.pieces.length} pieces \u00b7 ${G.name} \u00b7 ${G.cols} \u00d7 ${G.rows}`
    + (G.hints ? ` \u00b7 ${G.hints} hint${G.hints > 1 ? "s" : ""}` : " \u00b7 no hints");
  const rec = $("solvedRecord");
  if (isRecord && prev !== null) { rec.hidden = false; rec.textContent = `New best \u2014 you beat ${fmtTime(prev)}`; }
  else if (isRecord) { rec.hidden = false; rec.textContent = "Your first time at this size. It's the one to beat."; }
  else { rec.hidden = false; rec.textContent = `Your best at this size is ${fmtTime(prev)}`; }

  setTimeout(() => { $("solvedVeil").hidden = false; burstConfetti(); }, 520);
}

let hintTimer = null;
function showHint(text, ms) {
  const h = $("hint");
  h.textContent = text; h.hidden = false; h.style.opacity = "1";
  clearTimeout(hintTimer);
  hintTimer = setTimeout(hideHint, ms || 7000);
}
function hideHint() {
  const h = $("hint");
  h.style.opacity = "0";
  setTimeout(() => { h.hidden = true; }, 520);
}

/* ---- setup screen ---- */
const PIECE_OPTIONS = [
  { n: 12,   label: "Tiny" },
  { n: 24,   label: "Warm-up" },
  { n: 50,   label: "Easy" },
  { n: 100,  label: "Classic" },
  { n: 200,  label: "Tricky" },
  { n: 500,  label: "Hard" },
  { n: 1000, label: "Expert" }
];

let seeds = DESIGNS.map(() => Math.floor(Math.random() * 1e9));
let photos = [];          // {id, name, canvas} — this browser session only
let photoSeq = 0;
let chosen = { kind: "design", index: 0, id: 0 };

const photoById = id => photos.find(p => p.id === id);

function chosenSource() {
  if (chosen.kind === "photo") {
    const p = photoById(chosen.id);
    if (p) return { canvas: p.canvas, name: p.name };
  }
  const d = DESIGNS[chosen.index] || DESIGNS[0];
  return { design: d, name: d.name };
}

function currentAspect() {
  if (chosen.kind === "photo") {
    const p = photoById(chosen.id);
    if (p) return p.canvas.width / p.canvas.height;
  }
  return (DESIGNS[chosen.index] || DESIGNS[0]).aspect;
}

function makeTile(kind, key, label) {
  const cell = document.createElement("div");
  cell.className = "thumb-wrap";
  const btn = document.createElement("button");
  btn.className = "thumb"; btn.type = "button";
  btn.dataset.kind = kind; btn.dataset.key = String(key);
  if (label) {
    const cap = document.createElement("figcaption");
    cap.textContent = label;
    btn.appendChild(cap);
  }
  cell.appendChild(btn);
  return { cell, btn };
}

function thumbCanvas(src, w) {
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = Math.max(1, Math.round(w * src.height / src.width));
  cv.getContext("2d").drawImage(src, 0, 0, cv.width, cv.height);
  return cv;
}

function buildThumbs() {
  const wrap = $("thumbs");
  wrap.innerHTML = "";

  DESIGNS.forEach((d, i) => {
    const { cell, btn } = makeTile("design", i, d.name);
    btn.insertBefore(paint(d, seeds[i], 360), btn.firstChild);
    btn.addEventListener("click", () => {
      chosen = { kind: "design", index: i, id: 0 };
      refreshThumbSelection(); updateSpec();
    });
    wrap.appendChild(cell);
  });

  photos.forEach(p => {
    const { cell, btn } = makeTile("photo", p.id, p.name);
    btn.insertBefore(thumbCanvas(p.canvas, 360), btn.firstChild);
    btn.addEventListener("click", () => {
      chosen = { kind: "photo", index: chosen.index, id: p.id };
      refreshThumbSelection(); updateSpec();
    });
    const rm = document.createElement("button");
    rm.className = "thumb-remove"; rm.type = "button";
    rm.title = `Remove ${p.name}`;
    rm.setAttribute("aria-label", `Remove ${p.name}`);
    rm.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
    rm.addEventListener("click", () => removePhoto(p.id));
    cell.appendChild(rm);
    wrap.appendChild(cell);
  });

  const { cell, btn } = makeTile("add", "add", null);
  btn.classList.add("upload");
