<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universe Engine</title>
<style>
:root {
  --bg: #000;
  --panel: rgba(10, 13, 20, 0.78);
  --panel-border: rgba(140, 170, 220, 0.14);
  --text: #dfe6f2;
  --muted: #8b97ab;
  --accent: #7fb4ff;
  --accent-2: #ffcf7a;
  --danger: #ff7a7a;
  --radius: 10px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--font); overflow: hidden; }
button, input { font: inherit; color: inherit; }

#app { position: fixed; inset: 0; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; cursor: grab; }
#view.dragging { cursor: grabbing; }

#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.label {
  position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: auto; cursor: pointer;
  font-size: 11.5px; letter-spacing: 0.02em; color: rgba(225, 233, 245, 0.85);
  text-shadow: 0 0 3px #000, 0 0 6px #000; padding: 1px 4px; border-radius: 4px; will-change: transform;
}
.label:hover { color: #fff; background: rgba(127, 180, 255, 0.15); }
.label.planet { font-size: 13px; color: #fff; font-weight: 500; }
.label.star { color: var(--accent-2); font-weight: 600; }
.label.moon { color: rgba(190, 205, 225, 0.8); }
.label.comet { color: #9fe3d2; }
.label.interstellar { color: #e7a6ff; }
.label.blackhole { color: #c9a8ff; }
.label.blackhole::before {
  content: ''; position: absolute; left: -9px; top: 50%; width: 6px; height: 6px; margin-top: -4px; border-radius: 50%;
  border: 1px solid #b48cff; background: #000; box-shadow: 0 0 4px rgba(180, 140, 255, 0.8);
}
.label.dwarf, .label.kbo { color: #d9c2a0; }
.label.focus { color: var(--accent); }

.panel {
  position: absolute; background: var(--panel); border: 1px solid var(--panel-border);
  border-radius: var(--radius); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
}
.panel-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); padding: 12px 14px 6px; }

#topbar {
  position: absolute; top: 12px; left: 12px; right: 12px; display: flex; align-items: center; gap: 14px; pointer-events: none;
}
#topbar > * { pointer-events: auto; }
.brand { font-weight: 600; letter-spacing: 0.08em; font-size: 14px; text-transform: uppercase; color: #fff; text-shadow: 0 0 12px rgba(127, 180, 255, 0.6); white-space: nowrap; }
.search { position: relative; flex: 0 1 380px; }
#search {
  width: 100%; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--panel-border); background: var(--panel);
  backdrop-filter: blur(14px); outline: none;
}
#search:focus { border-color: var(--accent); }
#search-results {
  position: absolute; top: 40px; left: 0; right: 0; margin: 0; padding: 4px; list-style: none; max-height: 60vh; overflow: auto;
  background: rgba(10, 13, 20, 0.95); border: 1px solid var(--panel-border); border-radius: var(--radius); z-index: 5;
}
#search-results li { padding: 6px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
#search-results li.active, #search-results li:hover { background: rgba(127, 180, 255, 0.16); }
#search-results .kind { color: var(--muted); font-size: 11px; }

.toggles { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.toggle {
  padding: 6px 10px; border-radius: 999px; border: 1px solid var(--panel-border); background: var(--panel); cursor: pointer;
  backdrop-filter: blur(14px); font-size: 12px; color: var(--muted); user-select: none;
}
.toggle.on { color: #fff; border-color: rgba(127, 180, 255, 0.5); background: rgba(40, 70, 120, 0.55); }

#browser { top: 64px; left: 12px; width: 250px; bottom: 96px; display: flex; flex-direction: column; transition: width 0.2s; }
#browser.wide { width: 318px; }
#tree { overflow: auto; padding: 0 6px 10px; flex: 1; }
#tree[hidden], #sandbox[hidden], #stars[hidden], #holes[hidden], #neutron[hidden] { display: none; }
#stars { overflow: auto; padding: 0 6px 10px; flex: 1; }
#stars .stars-filter { position: sticky; top: 0; padding: 6px 2px 8px; background: inherit; z-index: 1; }
#stars .stars-filter input { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(140, 170, 220, 0.2);
  background: rgba(10, 16, 28, 0.9); color: var(--text); font: inherit; font-size: 12px; }
#stars .stars-loading, #stars .stars-note { color: var(--muted); font-size: 11px; padding: 8px; line-height: 1.4; }
.tree-item .planets { color: #8fd18f; font-size: 10px; margin-left: 4px; }
#holes, #neutron { overflow: auto; padding: 0 6px 12px; flex: 1; }
#holes .stars-filter, #neutron .stars-filter { position: sticky; top: 0; padding: 6px 2px 8px; background: inherit; z-index: 1; }
#holes .stars-filter input, #neutron .stars-filter input { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(140, 170, 220, 0.2);
  background: rgba(10, 16, 28, 0.8); color: var(--text); font: inherit; font-size: 12px; outline: none; }
#holes .stars-note, #neutron .stars-note { color: var(--muted); font-size: 11px; padding: 6px 8px; line-height: 1.4; }
#holes .tree-item .planets, #neutron .tree-item .planets { color: #c9a8ff; }
#holes .bh-name, #neutron .bh-name { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tree-item .dot.hole { background: #000; border: 1.5px solid #b48cff; box-shadow: 0 0 4px rgba(180, 140, 255, 0.7); box-sizing: border-box; }
.tree-item .dot.hole.candidate, .tree-item .dot.hole.disputed { border-color: rgba(180, 140, 255, 0.45); box-shadow: none; }
#info .planet-list { margin: 4px 0 8px; }
#info .planet-list button { display: block; width: 100%; text-align: left; margin: 2px 0; }
#info .hz { color: #8fd18f; }
.tabs { display: flex; gap: 4px; padding: 8px 8px 6px; }
.tab {
  flex: 1; padding: 6px 3px; border-radius: 8px; border: 1px solid transparent; background: none; cursor: pointer; color: var(--muted);
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
}
.tab:hover { color: var(--text); }
.tab.on { color: #fff; background: rgba(127, 180, 255, 0.14); border-color: rgba(127, 180, 255, 0.3); }

/* ---------------------------------------------------------------- sandbox */
#sandbox { overflow: auto; padding: 0 10px 12px; flex: 1; }
.sb-section { padding: 8px 2px 10px; border-top: 1px solid rgba(140, 170, 220, 0.1); }
.sb-section:first-child { border-top: 0; }
.sb-h { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.sb-target { color: var(--accent); text-transform: none; letter-spacing: 0; font-size: 12.5px; }
.sb-hint { color: var(--muted); font-size: 11px; text-transform: none; letter-spacing: 0; }
.sb-kinds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.sb-kinds button {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px 6px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--panel-border); background: rgba(255, 255, 255, 0.03); font-size: 10.5px; color: #c6d0df; line-height: 1.15;
}
.sb-kinds button:hover { border-color: rgba(127, 180, 255, 0.45); }
.sb-kinds button.on { background: rgba(255, 150, 80, 0.16); border-color: rgba(255, 170, 100, 0.6); color: #fff; }
.sb-kinds .ic { font-size: 17px; line-height: 1; height: 19px; }
.ic.k-asteroid { color: #b9a58f; } .ic.k-comet { color: #7fe3cf; } .ic.k-blackhole { color: #b48cff; }
.ic.k-neutronstar { color: #9cc8ff; } .ic.k-whitedwarf { color: #eef3ff; } .ic.k-star { color: #ffcf7a; } .ic.k-rogue { color: #8fb6ff; }
.sb-params { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.sb-row { display: grid; grid-template-columns: 78px 1fr 92px; align-items: center; gap: 8px; font-size: 12px; }
.sb-row span { color: var(--muted); }
.sb-row output { font-variant-numeric: tabular-nums; text-align: right; font-size: 11.5px; color: var(--accent-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-row input[type=range] { width: 100%; accent-color: #ff9f5a; }
.sb-seg { display: flex; gap: 4px; flex-wrap: nowrap; margin: 2px 0 8px; }
.sb-seg.sb-wrap { flex-wrap: wrap; }
.sb-seg button {
  flex: 1 1 auto; padding: 5px 8px; border-radius: 999px; border: 1px solid var(--panel-border); background: rgba(40, 70, 120, 0.25);
  cursor: pointer; font-size: 11.5px; white-space: nowrap;
}
.sb-seg button:hover { border-color: var(--accent); }
.sb-seg button.on { background: rgba(127, 180, 255, 0.3); border-color: rgba(127, 180, 255, 0.6); color: #fff; }
.sb-line { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.sb-small {
  padding: 4px 10px; border-radius: 999px; border: 1px solid var(--panel-border); background: rgba(40, 70, 120, 0.35); cursor: pointer; font-size: 11.5px;
}
.sb-small:hover { border-color: var(--accent); }
.sb-small.on { background: rgba(255, 170, 100, 0.25); border-color: rgba(255, 170, 100, 0.7); }
.sb-small.danger { color: #ffb3a8; }
.sb-small.danger:hover { border-color: var(--danger); }
.sb-right { margin-left: auto; text-transform: none; letter-spacing: 0; }
.sb-launch {
  flex: 1; padding: 9px 12px; border-radius: 10px; border: 1px solid rgba(255, 170, 100, 0.7); cursor: pointer; font-weight: 600;
  background: linear-gradient(180deg, rgba(255, 140, 60, 0.45), rgba(200, 80, 30, 0.35)); color: #fff; letter-spacing: 0.02em;
}
.sb-launch:hover { background: linear-gradient(180deg, rgba(255, 160, 80, 0.6), rgba(220, 90, 40, 0.45)); }
.sb-check { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); cursor: pointer; }
.sb-predict { margin-top: 8px; font-size: 11.5px; color: #c6d0df; display: flex; flex-direction: column; gap: 2px; }
.sb-predict div:first-child { color: var(--accent-2); }
#sandbox select, #sandbox input[type=number] {
  padding: 3px 6px; border-radius: 6px; border: 1px solid var(--panel-border); background: rgba(0, 0, 0, 0.35); font-size: 12px;
}
#sandbox input[type=number] { width: 64px; }
.sb-status { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.sb-status .warn { color: var(--accent-2); }
.sb-status .live { color: #ffb36b; font-weight: 600; }
.sb-ev { padding: 7px 8px; border-radius: 8px; background: rgba(255, 255, 255, 0.03); margin-bottom: 5px; cursor: pointer; border-left: 2px solid rgba(140, 170, 220, 0.3); }
.sb-ev:hover { background: rgba(127, 180, 255, 0.08); }
.sb-ev.impact { border-left-color: #ff9f5a; }
.sb-ev.bh { border-left-color: #b48cff; }
.sb-ev-t { font-size: 12px; }
.sb-ev-t b { font-weight: 600; }
.sb-ev-d { font-size: 10.5px; color: var(--muted); font-family: var(--mono); margin-bottom: 2px; }
.sb-ev-l { font-size: 11px; color: #aeb9ca; }
.label.blackhole { color: #cdb3ff; }
.label.neutronstar, .label.whitedwarf { color: #cfe0ff; }
.label.spawnstar { color: var(--accent-2); }
.tree-group > summary { list-style: none; cursor: pointer; padding: 6px 8px; border-radius: 6px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; }
.tree-group > summary::-webkit-details-marker { display: none; }
.tree-group > summary::before { content: '▸ '; }
.tree-group[open] > summary::before { content: '▾ '; }
.tree-item { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.tree-item:hover { background: rgba(127, 180, 255, 0.1); }
.tree-item.selected { background: rgba(127, 180, 255, 0.2); color: #fff; }
.tree-item .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.tree-item .count { margin-left: auto; color: var(--muted); font-size: 11px; }
.tree-children { margin-left: 14px; border-left: 1px solid rgba(140, 170, 220, 0.1); }
.tree-sub > summary { list-style: none; }
.tree-sub > summary::-webkit-details-marker { display: none; }

#info { top: 64px; right: 12px; width: 340px; max-height: calc(100% - 170px); overflow: auto; padding: 16px 16px 12px; }
#info .close { position: absolute; top: 8px; right: 10px; border: 0; background: none; font-size: 20px; color: var(--muted); cursor: pointer; }
#info h2 { margin: 0 0 2px; font-size: 20px; font-weight: 600; }
#info .subtitle { color: var(--muted); margin-bottom: 10px; text-transform: capitalize; }
#info p { color: #c6d0df; margin: 8px 0 12px; }
#info table { width: 100%; border-collapse: collapse; font-size: 12px; }
#info td { padding: 4px 0; border-bottom: 1px solid rgba(140, 170, 220, 0.08); vertical-align: top; }
#info td:first-child { color: var(--muted); padding-right: 10px; width: 45%; }
#info td:last-child { font-variant-numeric: tabular-nums; }
#info h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin: 16px 0 4px; font-weight: 500; }
#info .actions { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
#info .actions button { padding: 5px 10px; border-radius: 999px; border: 1px solid var(--panel-border); background: rgba(40, 70, 120, 0.35); cursor: pointer; font-size: 12px; }
#info .actions button:hover { border-color: var(--accent); }
#info .note { font-size: 11px; color: var(--accent-2); }
#info .fate { margin: 1px 0 3px; }
#info .fate.past { opacity: 0.5; }

#timebar {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 18px;
  padding: 10px 16px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 999px; backdrop-filter: blur(14px);
}
.time-readout { text-align: center; min-width: 150px; }
#date { font-weight: 600; font-size: 14px; }
#clock { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.time-controls { display: flex; align-items: center; gap: 6px; }
.time-controls button, #goto-date button {
  min-width: 34px; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--panel-border);
  background: rgba(40, 70, 120, 0.35); cursor: pointer;
}
.time-controls button:hover, #goto-date button:hover { border-color: var(--accent); }
.time-controls button.active { background: rgba(127, 180, 255, 0.35); }
#rate { min-width: 90px; text-align: center; font-family: var(--mono); font-size: 12px; color: var(--accent-2); }
#goto-date { display: flex; gap: 6px; }
#date-input { width: 150px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--panel-border); background: rgba(0, 0, 0, 0.3); outline: none; font-family: var(--mono); font-size: 12px; }
#date-input.invalid { border-color: var(--danger); }

#hud { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); text-align: center; pointer-events: none; text-shadow: 0 0 8px #000; }
#focus-name { font-size: 22px; font-weight: 300; letter-spacing: 0.2em; text-transform: uppercase; }
#focus-stats { font-size: 12px; color: var(--muted); font-family: var(--mono); }

/* Loading screen: a black hole seen almost edge-on (stylized), with a planet on an inclined orbit. */
#loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vmin; background: #000; transition: opacity 0.6s; z-index: 50; }
#loading.done { opacity: 0; pointer-events: none; }
.ld-scene { position: relative; width: clamp(160px, 34vmin, 360px); aspect-ratio: 1; }
.ld-hole { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ld-tilt { position: absolute; inset: 0; transform: rotate(-24deg); pointer-events: none; }
.ld-orbit { position: absolute; inset: 0; animation: ld-orbit 8s linear infinite; }
.ld-back { animation-name: ld-orbit, ld-back; }
.ld-front { animation-name: ld-orbit, ld-front; }
.ld-planet { position: absolute; left: 46.5%; top: 46.5%; width: 7%; height: 7%; border-radius: 50%; overflow: hidden;
  background: radial-gradient(circle at 50% 45%, #eef3ff 0%, #b9c8e6 55%, #7f93b8 100%); }
.ld-shade { position: absolute; inset: -6%; border-radius: 50%; background: radial-gradient(circle, rgba(0, 0, 0, 0.94) 58%, rgba(0, 0, 0, 0) 72%);
  animation: ld-shade 8s linear infinite; }
.ld-lens { opacity: 0; animation: ld-lens 8s linear infinite; }
.ld-text { font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
/* A thin line filling over the 20 seconds the screen stays up (LOADING_MS in main.js). */
.ld-bar { width: clamp(140px, 24vmin, 260px); height: 1px; margin-top: -2vmin; background: rgba(139, 151, 171, 0.18); overflow: hidden; }
.ld-bar i { display: block; height: 100%; background: rgba(223, 230, 242, 0.75); transform-origin: 0 50%; transform: scaleX(0);
  animation: ld-fill 20s linear forwards; }
@keyframes ld-fill { to { transform: scaleX(1); } }
@keyframes ld-front { 0%, 49.99% { opacity: 1; } 50%, 99.99% { opacity: 0; } 100% { opacity: 1; } }
@keyframes ld-back { 0%, 49.99% { opacity: 0; } 50%, 99.99% { opacity: 1; } 100% { opacity: 0; } }
/* (Behind the hole the planet's light is bent around it: a faint Einstein ring as it passes directly behind.) */
@keyframes ld-lens { 0%, 68% { opacity: 0; } 75% { opacity: 0.55; } 82%, 100% { opacity: 0; } }

  0.000% { transform: translate(40.000%, 0.000%) scale(1.0000); }

<body>
<a href="../../index.html" title="Back to Arcade" style="position:fixed;top:10px;left:10px;z-index:2147483647;display:flex;align-items:center;justify-content:center;width:26px;height:26px;background:rgba(0,0,0,0.6);color:#fff;font:14px/1 system-ui,-apple-system,sans-serif;border-radius:50%;text-decoration:none;opacity:0.4;transition:opacity .15s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.4">&larr;</a>
<div id="app">
  <canvas id="view"></canvas>
  <div id="labels"></div>

  <header id="topbar">
    <div class="brand">Universe Engine</div>
    <div class="search">
      <input id="search" type="search" placeholder="Search planets, moons, stars, exoplanets…  ( / )" autocomplete="off" spellcheck="false">
      <ul id="search-results" hidden></ul>
    </div>
    <div class="toggles" id="toggles"></div>
  </header>

  <aside id="browser" class="panel">
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="tree" role="tab">Solar System</button>
      <button class="tab" data-tab="stars" role="tab" title="Stars and planetary systems beyond the Sun  ( G )">Stars</button>
      <button class="tab" data-tab="holes" role="tab" title="Every known black hole in the Milky Way">Black holes</button>
      <button class="tab" data-tab="neutron" role="tab" title="Pulsars, magnetars and every known neutron star">Neutron stars</button>
      <button class="tab" data-tab="sandbox" role="tab" title="Throw asteroids, black holes, stars…  ( X )">Sandbox</button>
    </div>
    <div id="tree"></div>
    <div id="stars" hidden><div class="stars-loading">Loading 125,000 stars…</div></div>
    <div id="holes" hidden><div class="stars-loading">Loading black holes…</div></div>
    <div id="neutron" hidden><div class="stars-loading">Loading neutron stars…</div></div>
    <div id="sandbox" hidden></div>
  </aside>

  <aside id="info" class="panel" hidden>
    <button class="close" id="info-close" aria-label="Close">×</button>
    <div id="info-body"></div>
  </aside>

  <footer id="timebar">
    <div class="time-readout">
      <div id="date">—</div>
      <div id="clock">—</div>
    </div>
    <div class="time-controls">
      <button id="t-reverse" title="Reverse time">⏪</button>
      <button id="t-slower" title="Slower  ( [ )">−</button>
      <button id="t-play" title="Play / pause  ( Space )">⏸</button>
      <button id="t-faster" title="Faster  ( ] )">+</button>
      <button id="t-now" title="Jump to now">Now</button>
      <button id="t-origins" title="Watch the Solar System, the Earth and the Moon form 4.57 billion years ago, and the Earth's history up to us">Our origins</button>
      <button id="t-bigbang" title="Go to the Big Bang, 13.8 billion years ago, and watch the first billion years on a logarithmic clock">Big Bang</button>
      <div id="rate">1 s/s</div>
    </div>
    <form id="goto-date">
      <input id="date-input" type="text" placeholder="YYYY-MM-DD or a year" title="A date (YYYY-MM-DD hh:mm, UTC), a year (5000, 500 BC), or a far-future or far-past year in words or powers of ten (5 billion, 1e12, 4.6 billion years ago); back to the Big Bang" aria-label="Go to date (UTC) or year">
      <button type="submit">Go</button>
    </form>
  </footer>

  <div id="hud">
    <div id="focus-name"></div>
    <div id="focus-stats"></div>
  </div>
  <div id="loading">
    <!-- A black hole seen almost edge-on (stylized): the shadow, the photon ring, the accretion disk crossing in front
         of it, and a planet on an inclined orbit, lit by the disk. Pure CSS animation (transforms and opacity), so it
         keeps moving while the page is still busy loading. -->
    <div class="ld-scene" aria-hidden="true">
      <div class="ld-tilt"><div class="ld-orbit ld-back"><div class="ld-planet"><i class="ld-shade"></i></div></div></div>
      <svg class="ld-hole" viewBox="-100 -100 200 200">
        <defs>
          <radialGradient id="ldGlow" r="0.5">
            <stop offset="0.38" stop-color="#cfdcff" stop-opacity="0"/>
            <stop offset="0.43" stop-color="#cfdcff" stop-opacity="0.22"/>
            <stop offset="1" stop-color="#cfdcff" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="ldRing" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0.5"/>
          </linearGradient>
          <linearGradient id="ldDisk" gradientUnits="userSpaceOnUse" x1="-98" y1="0" x2="98" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/>
            <stop offset="0.22" stop-color="#fff" stop-opacity="0.95"/>
            <stop offset="0.5" stop-color="#fff"/>
            <stop offset="0.78" stop-color="#fff" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
          <filter id="ldBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
        </defs>
        <circle r="100" fill="url(#ldGlow)"/>
        <circle r="41" fill="none" stroke="url(#ldRing)" stroke-width="8" filter="url(#ldBlur)" opacity="0.55"/>
        <circle r="38.6" fill="#000"/>
        <circle r="41" fill="none" stroke="url(#ldRing)" stroke-width="2.6"/>
        <circle class="ld-lens" r="44" fill="none" stroke="#dfe8ff" stroke-width="1.4"/>
        <g transform="rotate(-24)">
          <line x1="-98" y1="0" x2="98" y2="0" stroke="#000" stroke-width="11" stroke-linecap="round"/>
          <line x1="-96" y1="0" x2="96" y2="0" stroke="url(#ldDisk)" stroke-width="7" filter="url(#ldBlur)" opacity="0.5"/>
          <line x1="-96" y1="0" x2="96" y2="0" stroke="url(#ldDisk)" stroke-width="2.4" stroke-linecap="round"/>
        </g>
      </svg>
      <div class="ld-tilt"><div class="ld-orbit ld-front"><div class="ld-planet"><i class="ld-shade"></i></div></div></div>
    </div>
    <div class="ld-text">Computing the Solar System…</div>
    <div class="ld-bar" aria-hidden="true"><i></i></div>
  </div>
</div>
<script>
(function () {
var started = false;
function go() {
  if (started) return;
  started = true;
  var files = ["assets/three.js", "assets/addons.js", "assets/app.js"];
  (function next(i) {
    if (i === files.length) return;
    var s = document.createElement("script");
    s.src = files[i];
    s.onload = function () { next(i + 1); };
    s.onerror = function () { document.querySelector("#loading .ld-text").textContent = "Could not load " + files[i]; };
    document.body.appendChild(s);
  })(0);
}
requestAnimationFrame(function () { setTimeout(go, 0); });
setTimeout(go, 400);
})();
</script>
