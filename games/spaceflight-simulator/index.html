const ChallengesModule = (() => {
// Each challenge exposes `check(ctx)` returning true once its goal condition
// holds for the current flight. `ctx` = { rocket, t, dominantBody, altitude,
// speed, elements (orbital elements around dominant body), maxAltitudeSeen,
// hasBeenToSpace, launchBodyId }
const CHALLENGES = [
  {
    id: 'first_flight', name: 'First Flight', reward: 'Rite of passage',
    desc: 'Launch a rocket from Terra and climb above 10 km altitude.',
    check: (c) => c.dominantBody.id === 'terra' && c.altitude > 10000,
  },
  {
    id: 'breaking_the_sky', name: 'Breaking the Sky', reward: 'Mach 1 club',
    desc: 'Exceed the speed of sound (343 m/s) while still inside Terra’s atmosphere.',
    check: (c) => c.dominantBody.id === 'terra' && c.altitude < c.dominantBody.atmosphereHeight && c.altitude > 0 && c.speed > 343,
  },
  {
    id: 'to_orbit', name: 'To Orbit', reward: 'Orbital pilot badge',
    desc: 'Achieve a stable orbit around Terra (periapsis above the atmosphere).',
    check: (c) => c.dominantBody.id === 'terra' && c.elements && c.elements.isElliptical && c.elements.periapsis > c.dominantBody.radius + c.dominantBody.atmosphereHeight,
  },
  {
    id: 'around_the_moon', name: 'Around the Moon', reward: 'Deep space wings',
    desc: 'Fly to Luna and enter its sphere of influence.',
    check: (c) => c.dominantBody.id === 'luna',
  },
  {
    id: 'one_small_step', name: 'One Small Step', reward: 'Lunar lander medal',
    desc: 'Touch down softly on the surface of Luna.',
    check: (c) => c.rocket.landed && c.rocket.landedBodyId === 'luna',
  },
  {
    id: 'grand_tour', name: 'Grand Tour', reward: 'Interplanetary passport',
    desc: 'Travel all the way to Rubis and enter its sphere of influence.',
    check: (c) => c.dominantBody.id === 'rubis',
  },
  {
    id: 'safe_return', name: 'Safe Return', reward: 'Re-entry specialist',
    desc: 'Reach space above Terra (past the atmosphere) and land safely back on the surface.',
    check: (c) => c.rocket.landed && c.rocket.landedBodyId === 'terra' && c.hasBeenToSpace,
  },
  {
    id: 'efficiency_expert', name: 'Efficiency Expert', reward: 'Lightweight engineer',
    desc: 'Reach a stable Terra orbit with a rocket whose total launch mass is under 2,000 kg.',
    check: (c) => c.dominantBody.id === 'terra' && c.elements && c.elements.isElliptical &&
      c.elements.periapsis > c.dominantBody.radius + c.dominantBody.atmosphereHeight && c.launchMass < 2000,
  },
];

function getChallengeContext(rocket, t, launchMass, state) {
  const posV = new Vector2Module.Vector2(rocket.position.x, rocket.position.y);
  const dominantBody = SolarSystemModule.getDominantBody(posV, t);
  const bodyPos = dominantBody.positionAt(t);
  const altitude = posV.distanceTo(bodyPos) - dominantBody.radius;
  const relVel = new Vector2Module.Vector2(rocket.velocity.x, rocket.velocity.y).sub(dominantBody.velocityAt(t));
  const speed = relVel.length();
  const relPos = posV.sub(bodyPos);
  const elements = OrbitModule.computeOrbitalElements(relPos, relVel, dominantBody.mu);

  const terra = SolarSystemModule.getBody('terra');
  if (dominantBody.id === 'terra' && altitude > terra.atmosphereHeight) state.hasBeenToSpace = true;

  return {
    rocket, t, dominantBody, altitude, speed, elements,
    hasBeenToSpace: !!state.hasBeenToSpace,
    launchMass,
  };
}

function checkChallenges(ctx, onComplete) {
  const progress = StorageModule.Storage.getChallengeProgress();
  for (const ch of CHALLENGES) {
    if (progress[ch.id] && progress[ch.id].done) continue;
    try {
      if (ch.check(ctx)) {
        StorageModule.Storage.setChallengeComplete(ch.id);
        onComplete && onComplete(ch);
      }
    } catch (e) { /* defensive: a bad frame of data shouldn't crash flight */ }
  }
}

function getChallengeList() {
  const progress = StorageModule.Storage.getChallengeProgress();
  return CHALLENGES.map(c => ({ ...c, done: !!(progress[c.id] && progress[c.id].done) }));
}
  return { CHALLENGES, getChallengeContext, checkChallenges, getChallengeList };
})();

const MapViewModule = (() => {
class MapView {
  constructor({ onClose }) {
    this.camera = new CameraModule.Camera();
    this.camera.zoom = 2e-5;
    this.dragging = false;
    this.labels = new Map();
    this.focusBodyId = null; // when set, camera tracks this body instead of the ship

    this.root = DOMModule.el('div', { id: 'map-hud' });
    this.legend = DOMModule.el('div', { class: 'hud-panel map-legend' },
      'Scroll to zoom · Drag to pan · Click a body to focus it');
    this.closeBtn = DOMModule.el('button', { class: 'btn icon map-toggle-btn', onclick: onClose }, 'Close Map [M]');
    this.focusBtn = DOMModule.el('button', { class: 'btn small', style: { position: 'absolute', bottom: '14px', right: '14px' }, onclick: () => this.focusOnShip() }, 'Focus Ship');
    this.root.append(this.legend, this.closeBtn, this.focusBtn);
    DOMModule.mount(this.root);
    this._focusShip = true;
  }

  focusOnShip() { this._focusShip = true; this.focusBodyId = null; }

  // Click a body to lock the camera on it — essential for lining up an
  // encounter, since you need to watch the target, not your own ship.
  handleClick(mouseX, mouseY, w, h, t) {
    let best = null, bestDist = 42; // px
    for (const body of SolarSystemModule.SolarSystem.all) {
      const p = body.positionAt(t);
      const s = this.camera.worldToScreen(p.x, p.y, w, h);
      const d = Math.hypot(s.x - mouseX, s.y - mouseY);
      if (d < bestDist) { best = body; bestDist = d; }
    }
    if (best) {
      this.focusBodyId = best.id;
      this._focusShip = false;
      this.legend.textContent = `Focused on ${best.name} · targeting it · "Focus Ship" to release`;
      return { bodyId: best.id };
    }
    return null;
  }

  handleWheel(deltaY) {
    const factor = deltaY > 0 ? 0.85 : 1.176;
    this.camera.zoom = Math.max(1e-9, Math.min(0.02, this.camera.zoom * factor));
  }

  handleDragStart() { this.dragging = true; }
  handleDragEnd() { this.dragging = false; }
  handleDragMove(dx, dy) {
    if (!this.dragging) return;
    this.camera.x -= dx / this.camera.zoom;
    this.camera.y += dy / this.camera.zoom;
  }

  update(rocket, t, w, h) {
    if (this.focusBodyId) {
      const fb = SolarSystemModule.getBody(this.focusBodyId);
      if (fb) { const p = fb.positionAt(t); this.camera.x = p.x; this.camera.y = p.y; }
    } else if (this._focusShip) {
      this.camera.x = rocket.position.x;
      this.camera.y = rocket.position.y;
    }
    // position labels
    for (const body of SolarSystemModule.SolarSystem.all) {
      let label = this.labels.get(body.id);
      if (!label) {
        label = DOMModule.el('div', { class: 'map-body-label' }, body.name);
        this.labels.set(body.id, label);
        this.root.appendChild(label);
      }
      const p = body.positionAt(t);
      const s = this.camera.worldToScreen(p.x, p.y, w, h);
      const onScreen = s.x > -40 && s.x < w + 40 && s.y > -40 && s.y < h + 40;
      label.style.display = onScreen ? 'block' : 'none';
      label.style.left = `${s.x}px`;
      label.style.top = `${s.y}px`;
    }
  }

  render(ctx, w, h, t, rocket, prediction) {
    ctx.save();
    this.camera.applyOriginAtCamera(ctx, w, h);
    const ox = this.camera.x, oy = this.camera.y;

    const px = 1 / this.camera.zoom; // one screen pixel in world units
    for (const body of SolarSystemModule.SolarSystem.all) {
      if (body.parent) BodyRendererModule.drawOrbitCircle(ctx, body, t, undefined, ox, oy, px);
    }

    // Sphere-of-influence rings: without seeing these you can't tell how close
    // an approach has to be for the target's gravity to actually capture you.
    for (const body of SolarSystemModule.SolarSystem.all) {
      if (!body.parent || !isFinite(body.soiRadius)) continue;
      const p = body.positionAt(t);
      const screenSoi = body.soiRadius * this.camera.zoom;
      if (screenSoi < 14 || screenSoi > Math.max(w, h) * 8) continue;
      ctx.beginPath();
      ctx.arc(p.x - ox, p.y - oy, body.soiRadius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(120,200,255,0.18)';
      ctx.lineWidth = 1 / this.camera.zoom;
      ctx.setLineDash([6 / this.camera.zoom, 6 / this.camera.zoom]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    if (prediction && !rocket.destroyed) {
      TrajectoryRendererModule.drawPredictedPath(ctx, prediction, t, {
        lineWidth: 1.6 / this.camera.zoom,
        markerSize: 4.5 / this.camera.zoom,
        labelScale: 1 / this.camera.zoom,
      }, ox, oy);
    }

    for (const body of SolarSystemModule.SolarSystem.all) {
      const p = body.positionAt(t);
      const s1 = this.camera.worldToScreen(p.x, p.y, w, h);
      const s2 = this.camera.worldToScreen(p.x + body.radius, p.y, w, h);
      const screenR = Math.abs(s2.x - s1.x);
      const drawR = Math.max(screenR, 3.2);
      const rel = { x: p.x - ox, y: p.y - oy };
      if (drawR <= 3.6) {
        ctx.beginPath();
        ctx.arc(rel.x, rel.y, 3.6 / this.camera.zoom, 0, Math.PI * 2);
        ctx.fillStyle = body.color;
        ctx.fill();
      } else {
        BodyRendererModule.drawBody(ctx, body, t, screenR, ox, oy);
      }
    }

    if (!rocket.destroyed) {
      const s = this.camera.worldToScreen(rocket.position.x, rocket.position.y, w, h);
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.translate(s.x, s.y);
      ctx.rotate(rocket.angle - Math.PI / 2 + Math.PI);
      ctx.beginPath();
      ctx.moveTo(0, -7); ctx.lineTo(5, 6); ctx.lineTo(0, 3); ctx.lineTo(-5, 6);
      ctx.closePath();
      ctx.fillStyle = '#4fd1ff';
      ctx.fill();
      ctx.restore();
    }

    ctx.restore();
  }

  destroy() { DOMModule.unmount(this.root); }
}
  return { MapView };
})();

const BuilderSceneModule = (() => {
const SNAP_RADIUS_PX = 46;

class BuilderScene {
  constructor(app) {
    this.app = app;
    this.camera = new CameraModule.Camera();
    this.camera.zoom = 55;
    this.starfield = new StarfieldModule.Starfield();
    this.selectedDefId = null;
    this.selectedPartUid = null;
    this.hoverPartUid = null;
    this.symmetry = true;
    this.ghost = null;
    this._dragPan = null;
    this._undo = [];
    this._redo = [];
    this._search = '';
  }

  // ---------------------------------------------------------- undo / redo
  // Blueprint snapshots are small (a few hundred bytes) and the builder is not
  // perf-critical, so full-state snapshots are simpler and far more reliable
  // than trying to invert each individual edit operation.
  _pushHistory() {
    if (!this.rocket) return;
    this._undo.push(JSON.stringify(this.rocket.toBlueprint()));
    if (this._undo.length > 60) this._undo.shift();
    this._redo.length = 0;
    this._refreshHistoryButtons();
  }

  _restore(json) {
    const bp = JSON.parse(json);
    const name = this.rocket.name;
    this.rocket = RocketModule.Rocket.fromBlueprint(bp);
    this.rocket.name = bp.name || name;
    if (this.nameInput) this.nameInput.value = this.rocket.name;
    this.selectedPartUid = null;
    this._refreshAll();
  }

  undo() {
    if (!this._undo.length) { ToastModule.toast('Nothing to undo.'); return; }
    this._redo.push(JSON.stringify(this.rocket.toBlueprint()));
    this._restore(this._undo.pop());
    AudioModule.AudioSys.click();
    this._refreshHistoryButtons();
  }

  redo() {
    if (!this._redo.length) { ToastModule.toast('Nothing to redo.'); return; }
    this._undo.push(JSON.stringify(this.rocket.toBlueprint()));
    this._restore(this._redo.pop());
    AudioModule.AudioSys.click();
    this._refreshHistoryButtons();
  }

  _refreshHistoryButtons() {
    if (this.undoBtn) this.undoBtn.disabled = this._undo.length === 0;
    if (this.redoBtn) this.redoBtn.disabled = this._redo.length === 0;
  }

  onEnter(params = {}) {
    if (params.blueprintId) {
      const bp = StorageModule.Storage.getBlueprint(params.blueprintId);
      this.rocket = bp ? RocketModule.Rocket.fromBlueprint(bp) : new RocketModule.Rocket('New Rocket');
    } else if (params.rocket) {
      this.rocket = params.rocket;
    } else {
      this.rocket = new RocketModule.Rocket('New Rocket');
    }
    // A loaded blueprint already carries a deliberate stage order — don't
    // re-derive it out from under the player.
    this._manualStaging = !!(params.blueprintId || params.rocket);
    this.camera.x = 0; this.camera.y = 4;
    this._buildDom();
    this._offWheel = this.app.input.onWheel((dy) => {
      const factor = dy > 0 ? 0.9 : 1.111;
      this.camera.setZoomClamped(this.camera.zoom * factor, 10, 220);
    });
    this._offClick = this.app.input.onClick((phase, mouse, e) => {
      if (phase === 'down' && mouse.button === 2) {
        this._dragPan = { x: mouse.x, y: mouse.y };
        this._rightDownAt = { x: mouse.x, y: mouse.y };
      }
      if (phase === 'up') {
        // A right-click that didn't drag is a delete; a drag is a pan.
        if (this._rightDownAt && Math.hypot(mouse.x - this._rightDownAt.x, mouse.y - this._rightDownAt.y) < 5) {
          this._deleteUnderCursor(mouse);
        }
        this._rightDownAt = null;
        this._dragPan = null;
      }
      if (phase === 'down' && mouse.button === 0) this._handleLeftClick(mouse);
    });
    this._offKey = this.app.input.onKeydown((code, e) => {
      if (e && (e.ctrlKey || e.metaKey)) {
        if (code === 'KeyZ') { e.preventDefault(); e.shiftKey ? this.redo() : this.undo(); return; }
        if (code === 'KeyY') { e.preventDefault(); this.redo(); return; }
      }
      // Don't hijack keys while the player is typing the rocket's name.
      if (e && e.target && e.target.tagName === 'INPUT') return;
      if (code === 'Delete' || code === 'Backspace') this._deleteSelected();
      if (code === 'Escape') { this.selectedDefId = null; this.selectedPartUid = null; this._refreshPaletteSelection(); }
      if (code === 'KeyX') this._toggleSymmetry();
      if (code === 'KeyF') this._fitToRocket();
    });
    this._undo = []; this._redo = [];
    this._refreshAll();
    this._fitToRocket();
  }

  onExit() {
    this._offWheel && this._offWheel();
    this._offClick && this._offClick();
    this._offKey && this._offKey();
    DOMModule.clearUI();
  }

  // ------------------------------------------------------------ DOM
  _buildDom() {
    DOMModule.clearUI();
    this.nameInput = DOMModule.el('input', { id: 'rocket-name', value: this.rocket.name, oninput: (e) => { this.rocket.name = e.target.value; } });

    this.undoBtn = DOMModule.el('button', { class: 'btn small icon', title: 'Undo (Ctrl+Z)', onclick: () => this.undo() }, '↶');
    this.redoBtn = DOMModule.el('button', { class: 'btn small icon', title: 'Redo (Ctrl+Shift+Z)', onclick: () => this.redo() }, '↷');

    const topbar = DOMModule.el('div', { class: 'builder-topbar' }, [
      DOMModule.el('button', { class: 'btn small', onclick: () => this._backToMenu() }, '← Menu'),
      this.nameInput,
      this.undoBtn, this.redoBtn,
      DOMModule.el('button', { class: 'btn small icon', title: 'Fit view to rocket (F)', onclick: () => this._fitToRocket() }, '⤢'),
      DOMModule.el('div', { class: 'spacer' }),
      DOMModule.el('button', { class: 'btn small', onclick: () => this._openLoadDialog() }, 'Load'),
      DOMModule.el('button', { class: 'btn small', onclick: () => this._save() }, 'Save'),
      DOMModule.el('button', { class: 'btn small', onclick: () => this._newRocket() }, 'New'),
      DOMModule.el('button', { class: 'btn primary', onclick: () => this._launch() }, '🚀 Launch'),
    ]);

    this.leftSide = DOMModule.el('div', { class: 'builder-side left' });
    this.searchInput = DOMModule.el('input', {
      class: 'part-search', placeholder: 'Search parts…', value: this._search,
      oninput: (e) => { this._search = e.target.value.toLowerCase(); this._buildPalette(); },
    });
    // clearUI() detached the previous list, so drop the stale reference and
    // let _buildPalette build a fresh one into the new leftSide.
    this.paletteList = null;
    this._buildPalette();

    this.rightSide = DOMModule.el('div', { class: 'builder-side right' });
    this.symToggleBtn = DOMModule.el('button', { class: 'btn small' + (this.symmetry ? ' active' : ''), onclick: () => this._toggleSymmetry() }, `Symmetry: ${this.symmetry ? 'ON' : 'OFF'} [X]`);
    this.statsBlock = DOMModule.el('div', { class: 'stats-block' });
    this.infoBlock = DOMModule.el('div', { class: 'stats-block part-info-block hidden' });
    this.stagingBlock = DOMModule.el('div', { class: 'stats-block' });
    this.rightSide.append(this.symToggleBtn, this.statsBlock, this.infoBlock, this.stagingBlock);

    this.hint = DOMModule.el('div', { class: 'builder-hint' },
      'Click a part → click a glowing node to attach · Right-click a part to delete · Ctrl+Z undo · F fit view');

    this.app.uiRoot.append(topbar, this.leftSide, this.rightSide, this.hint);
    this._refreshHistoryButtons();
  }

  _buildPalette() {
    // The search field lives OUTSIDE the rebuilt list — removing a focused
    // input from the DOM drops focus, which would break typing after one char.
    if (!this.paletteList) {
      this.paletteList = DOMModule.el('div', { class: 'palette-list' });
      this.leftSide.append(this.searchInput, this.paletteList);
    }
    this.paletteList.innerHTML = '';
    const q = this._search;
    let shown = 0;
    for (const cat of PartDefsModule.PART_CATEGORIES) {
      const defs = PartDefsModule.partsInCategory(cat).filter(d => !q ||
        d.name.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q) || cat.toLowerCase().includes(q));
      if (!defs.length) continue;
      this.paletteList.appendChild(DOMModule.el('div', { class: 'parts-category' }, cat));
      for (const def of defs) {
        shown++;
        const canvas = document.createElement('canvas');
        canvas.width = 44; canvas.height = 44;
        this._drawIcon(canvas, def);
        const tile = DOMModule.el('div', {
          class: 'part-tile',
          onclick: () => this._selectPaletteDef(def.id),
          onmouseenter: () => this._showPartInfo(def),
          onmouseleave: () => this._showPartInfo(null),
        }, [
          canvas,
          DOMModule.el('div', { class: 'part-info' }, [
            DOMModule.el('div', { class: 'part-name' }, def.name),
            DOMModule.el('div', { class: 'part-stat' }, statLine(def)),
          ]),
        ]);
        tile.dataset.defId = def.id;
        this.paletteList.appendChild(tile);
      }
    }
    if (!shown) this.paletteList.appendChild(DOMModule.el('div', { class: 'empty-hint' }, `No parts match “${this._search}”.`));
    this._refreshPaletteSelection();
  }

  // Full stats for the hovered part, shown in the right rail. The old
  // title-attribute tooltip hid the numbers behind a delay and truncated them.
  _showPartInfo(def) {
    if (!this.infoBlock) return;
    this.infoBlock.innerHTML = '';
    if (!def) { this.infoBlock.classList.add('hidden'); return; }
    this.infoBlock.classList.remove('hidden');
    this.infoBlock.appendChild(DOMModule.el('h4', {}, def.name));
    this.infoBlock.appendChild(DOMModule.el('div', { class: 'part-desc' }, def.desc));
    const rows = [statRow('Dry mass', DOMModule.fmtMass(def.mass))];
    if (def.fuelCapacity) rows.push(statRow('Fuel', DOMModule.fmtMass(def.fuelCapacity)));
    if (def.isEngine) {
      rows.push(statRow('Thrust (vac)', `${(def.thrustVac / 1000).toFixed(1)} kN`));
      rows.push(statRow('Isp vac / sea', `${def.ispVac} / ${def.ispSea} s`));
      rows.push(statRow('Throttleable', def.throttleable ? 'Yes' : 'No'));
      rows.push(statRow('Gimbal', def.gimbal ? `${def.gimbal}°` : 'None'));
    }
    if (def.controlTorque) rows.push(statRow('Torque', `${(def.controlTorque / 1000).toFixed(1)} kN·m`));
    rows.push(statRow('Size', `${def.width.toFixed(1)} × ${def.height.toFixed(1)} m`));
    rows.push(statRow('Drag Cd', def.cd.toFixed(2)));
    this.infoBlock.append(...rows);
  }

  _drawIcon(canvas, def) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, 44, 44);
    const scale = 34 / Math.max(def.width, def.height);
    ctx.save();
    ctx.translate(22, 24);
    ctx.scale(scale, scale);
    RocketRendererModule.drawPartLocal(ctx, { def, halfW: def.width / 2, halfH: def.height / 2, flipped: false });
    ctx.restore();
  }

  _selectPaletteDef(defId) {
    // Placing several of the same part in a row is common (e.g. many fuel
    // tanks) — re-clicking the already-armed tile keeps it armed rather than
    // toggling off; use Escape or the trash/Delete key to cancel placement.
    this.selectedDefId = defId;
    this.selectedPartUid = null;
    this._refreshPaletteSelection();
  }

  _refreshPaletteSelection() {
    this.leftSide.querySelectorAll('.part-tile').forEach(t => t.classList.toggle('selected', t.dataset.defId === this.selectedDefId));
  }

  _toggleSymmetry() {
    this.symmetry = !this.symmetry;
    this.symToggleBtn.textContent = `Symmetry: ${this.symmetry ? 'ON' : 'OFF'} [X]`;
    this.symToggleBtn.classList.toggle('active', this.symmetry);
  }

  // ------------------------------------------------------------ interaction
  _handleLeftClick(mouse) {
    const w = this.app.canvas.width, h = this.app.canvas.height;
    const world = this.camera.screenToWorld(mouse.x, mouse.y, w, h);
    if (this.selectedDefId) {
      this._placeAt(world.x, world.y);
    } else {
      const part = AttachmentModule.findPartNear(this.rocket, world.x, world.y, 0.3);
      this.selectedPartUid = part ? part.uid : null;
    }
  }

  _placeAt(worldX, worldY) {
    const def = PartDefsModule.getPartDef(this.selectedDefId);
    const snapMeters = SNAP_RADIUS_PX / this.camera.zoom;

    if (!this.rocket.rootUid) {
      this._pushHistory();
      const newUid = this.rocket.addPart(def.id, null, null);
      this._afterAdd(newUid);
      ToastModule.toast(`${def.name} placed as the root part.`);
      this._refreshAll();
      return;
    }

    const spot = AttachmentModule.findBestAttachPoint(this.rocket, def, worldX, worldY, snapMeters);
    if (!spot) { ToastModule.toast('No valid attachment point nearby.'); return; }

    this._pushHistory();
    const newUid = this.rocket.addPart(def.id, spot.parentUid, spot.node, spot.offsetAlongParent, false);
    this._afterAdd(newUid);

    if (this.symmetry && (spot.node === 'left' || spot.node === 'right')) {
      const parent = this.rocket.parts.get(spot.parentUid);
      // If the host is itself half of a symmetric pair (e.g. a radial decoupler
      // on the left), the mirrored child belongs on that host's TWIN — not on
      // the far side of the same host, which would stack both boosters onto one
      // decoupler and leave the other bare.
      const mirrorParentUid = (parent && parent.symmetryPartnerUid && this.rocket.parts.has(parent.symmetryPartnerUid))
        ? parent.symmetryPartnerUid
        : spot.parentUid;
      // The child always mounts on the mirrored side so it faces outward:
      // right-decoupler/right-node (x = +0.85 + arm) mirrors to
      // left-decoupler/left-node (x = -0.85 - arm).
      const mirrorNode = spot.node === 'left' ? 'right' : 'left';
      const mirrorParent = this.rocket.parts.get(mirrorParentUid);
      const alreadyMirrored = mirrorParent && mirrorParent.childUids.some(cu => {
        const c = this.rocket.parts.get(cu);
        return c && c.node === mirrorNode && Math.abs(c.offsetAlongParent - spot.offsetAlongParent) < 0.05 && c.defId === def.id;
      });
      if (!alreadyMirrored) {
        const mirrorUid = this.rocket.addPart(def.id, mirrorParentUid, mirrorNode, spot.offsetAlongParent, true);
        this.rocket.linkSymmetry(newUid, mirrorUid);
        this._afterAdd(mirrorUid, true);
      }
    }
    AudioModule.AudioSys.click();
    this._refreshAll();
  }

  _isStageable(part) {
    return !!(part.def.isEngine || part.def.isDecoupler || part.def.isParachute || part.def.isFairing);
  }

  _afterAdd(uid, isSymmetryMirror = false) {
    const part = this.rocket.parts.get(uid);
    if (!part || !this._isStageable(part)) return;
    if (this._manualStaging) {
      // Respect a hand-ordered sequence: append rather than re-sorting.
      if (isSymmetryMirror && this.rocket.stages.length) {
        const last = this.rocket.stages[this.rocket.stages.length - 1];
        last.push(uid); part.stage = this.rocket.stages.length - 1;
      } else {
        this.rocket.stages.push([uid]);
        part.stage = this.rocket.stages.length - 1;
      }
      return;
    }
    this._autoSortStages();
  }

  // Builds a sensible default firing order from the rocket's geometry rather
  // than from the order parts happened to be clicked. Naive append-order gets
  // side boosters catastrophically wrong — it jettisons the radial decouplers
  // before the boosters mounted on them ever ignite.
  //
  // Rule: things lower on the rocket go first (that's how a stack burns), and
  // at the same height an engine lights before the decoupler that discards it.
  // Parachutes are always dead last. Symmetric pairs share one stage.
  _autoSortStages() {
    const stageable = this.rocket.partList.filter(p => this._isStageable(p));
    const rank = (p) => {
      if (p.def.isParachute) return 4;
      // A fairing is shed high in the ascent, after the boosters it shrouds
      // have done their work but before the payload needs to deploy.
      if (p.def.isFairing) return 3;
      if (p.def.isDecoupler) return 2;
      return 1; // engine
    };
    stageable.sort((a, b) => {
      const pa = rank(a), pb = rank(b);
      // Fairings and chutes are ordered by role, not height: both sit near the
      // TOP of the stack, so sorting them by position would fire them first.
      if (pa !== pb && (pa >= 3 || pb >= 3)) return pa - pb;
      if (Math.abs(a.localPos.y - b.localPos.y) > 1e-6) return a.localPos.y - b.localPos.y;
      return pa - pb;
    });

    const groups = [];
    const seen = new Set();
    for (const p of stageable) {
      if (seen.has(p.uid)) continue;
      const group = [p.uid];
      seen.add(p.uid);
      // Fire a symmetric pair together — a lone booster would flip the rocket.
      if (p.symmetryPartnerUid && this.rocket.parts.has(p.symmetryPartnerUid) && !seen.has(p.symmetryPartnerUid)) {
        group.push(p.symmetryPartnerUid);
        seen.add(p.symmetryPartnerUid);
      }
      groups.push(group);
    }
    this.rocket.stages = groups;
    groups.forEach((g, i) => g.forEach(uid => {
      const part = this.rocket.parts.get(uid);
      if (part) part.stage = i;
    }));
    this.rocket.currentStageIndex = 0;
  }

  _deleteSelected() {
    if (!this.selectedPartUid) return;
    this._pushHistory();
    const removed = this.rocket.removePart(this.selectedPartUid);
    this._pruneEmptyStages();
    this.selectedPartUid = null;
    if (removed.length) { ToastModule.toast(`Removed ${removed.length} part${removed.length > 1 ? 's' : ''}.`); AudioModule.AudioSys.click(); }
    this._refreshAll();
  }

  _deleteUnderCursor(mouse) {
    const world = this.camera.screenToWorld(mouse.x, mouse.y, this.app.canvas.width, this.app.canvas.height);
    const part = AttachmentModule.findPartNear(this.rocket, world.x, world.y, 0.3);
    if (!part) return;
    this.selectedPartUid = part.uid;
    this._deleteSelected();
  }

  // Frames the whole rocket. Building at a fixed default zoom means tall
  // stacks run off-screen and you have to hunt for the ends.
  _fitToRocket() {
    const parts = this.rocket ? this.rocket.partList : [];
    if (!parts.length) { this.camera.x = 0; this.camera.y = 2; this.camera.zoom = 55; return; }
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of parts) {
      minX = Math.min(minX, p.localPos.x - p.halfW); maxX = Math.max(maxX, p.localPos.x + p.halfW);
      minY = Math.min(minY, p.localPos.y - p.halfH); maxY = Math.max(maxY, p.localPos.y + p.halfH);
    }
    const pad = 2.5;
    const wWorld = (maxX - minX) + pad * 2, hWorld = (maxY - minY) + pad * 2;
    const vw = this.app.canvas.width - 460; // minus both side rails
    const vh = this.app.canvas.height - 52;
    this.camera.x = (minX + maxX) / 2;
    this.camera.y = (minY + maxY) / 2;
    this.camera.setZoomClamped(Math.min(vw / wWorld, vh / hWorld), 10, 220);
  }

  _pruneEmptyStages() {
    this.rocket.stages = this.rocket.stages.filter(s => s.length > 0);
    this.rocket.stages.forEach((s, i) => s.forEach(uid => { const p = this.rocket.parts.get(uid); if (p) p.stage = i; }));
    this.rocket.currentStageIndex = Math.min(this.rocket.currentStageIndex, this.rocket.stages.length);
  }

  _moveStage(idx, dir) {
    const j = idx + dir;
    if (j < 0 || j >= this.rocket.stages.length) return;
    // Once the player orders stages by hand, stop re-deriving the order.
    this._manualStaging = true;
    const tmp = this.rocket.stages[idx];
    this.rocket.stages[idx] = this.rocket.stages[j];
    this.rocket.stages[j] = tmp;
    this._pruneEmptyStages();
    this._refreshStaging();
  }

  // ------------------------------------------------------------ persistence / nav
  _save() {
    if (!this.rocket.rootUid) { ToastModule.toast('Add at least one part before saving.'); return; }
    if (!this.rocket.name || !this.rocket.name.trim()) this.rocket.name = 'Untitled Rocket';
    StorageModule.Storage.saveBlueprint(this.rocket.toBlueprint());
    ToastModule.toast(`Saved "${this.rocket.name}".`);
    AudioModule.AudioSys.success();
  }

  _newRocket() {
    this.rocket = new RocketModule.Rocket('New Rocket');
    this.nameInput.value = this.rocket.name;
    this.selectedPartUid = null; this.selectedDefId = null;
    this._manualStaging = false;
    this._refreshAll();
  }

  _launch() {
    if (!this.rocket.rootUid) { ToastModule.toast('Build a rocket before launching.'); return; }
    if (this.rocket.stages.length === 0) { ToastModule.toast('Add at least one engine or staged part.'); return; }
    StorageModule.Storage.saveBlueprint(this.rocket.toBlueprint());
    const flightRocket = RocketModule.Rocket.fromBlueprint(this.rocket.toBlueprint());
    this.app.sceneManager.goto('flight', { rocket: flightRocket, launchBodyId: 'terra' });
  }

  _backToMenu() { this.app.sceneManager.goto('mainmenu'); }

  _openLoadDialog() {
    const list = StorageModule.Storage.getBlueprints();
    const overlay = DOMModule.el('div', { class: 'overlay-screen' });
    const rows = list.length ? list.map(bp => DOMModule.el('div', { class: 'list-row' }, [
      DOMModule.el('div', {}, [DOMModule.el('div', { class: 'row-title' }, bp.name), DOMModule.el('div', { class: 'row-sub' }, `${bp.parts.length} parts`)]),
      DOMModule.el('div', { class: 'row-actions' }, [
        DOMModule.el('button', { class: 'btn small primary', onclick: () => { this.rocket = RocketModule.Rocket.fromBlueprint(bp); this.nameInput.value = this.rocket.name; this._refreshAll(); DOMModule.unmount(overlay); } }, 'Load'),
        DOMModule.el('button', { class: 'btn small danger', onclick: () => { StorageModule.Storage.deleteBlueprint(bp.id); DOMModule.unmount(overlay); this._openLoadDialog(); } }, 'Delete'),
      ]),
    ])) : [DOMModule.el('div', { class: 'empty-hint' }, 'No saved rockets yet. Build one and hit Save!')];

    overlay.appendChild(DOMModule.el('div', { class: 'panel dialog' }, [
      DOMModule.el('div', { class: 'dialog-header' }, [DOMModule.el('h2', {}, 'Load Rocket'), DOMModule.el('button', { class: 'close-x', onclick: () => DOMModule.unmount(overlay) }, '✕')]),
      DOMModule.el('div', { class: 'list-scroll' }, rows),
    ]));
    this.app.uiRoot.appendChild(overlay);
  }

  // ------------------------------------------------------------ stats & staging UI
  _refreshAll() { this._refreshStats(); this._refreshStaging(); }

  _refreshStats() {
    const agg = this.rocket.getAggregate();
    const terra = SolarSystemModule.getBody('terra');
    const g = terra.surfaceGravity();
    const stage0 = this.rocket.stages[0] || [];
    let thrust0 = 0;
    for (const uid of stage0) {
      const p = this.rocket.parts.get(uid);
      if (p && p.def.isEngine) thrust0 += p.def.thrustVac;
    }
    const twr = agg.mass > 0 ? (thrust0 / (agg.mass * g)) : 0;
    const dv = this.rocket.estimateStageDeltaV();

    this.statsBlock.innerHTML = '';
    this.statsBlock.appendChild(DOMModule.el('h4', {}, 'Rocket Stats'));
    const twrRow = statRow('Stage 1 TWR (Terra)', twr.toFixed(2));
    // A first stage under 1.0 TWR physically cannot leave the pad — flag it here
    // rather than letting the player discover it after a launch that goes nowhere.
    if (thrust0 > 0 && twr < 1) {
      twrRow.classList.add('stat-bad');
      twrRow.title = 'Below 1.0 — this rocket cannot lift off. Add thrust or remove mass.';
    } else if (twr >= 1.2) {
      twrRow.classList.add('stat-good');
    }
    this.statsBlock.append(
      statRow('Parts', this.rocket.partCount),
      statRow('Total mass', DOMModule.fmtMass(agg.mass)),
      statRow('Stage 1 thrust', `${(thrust0 / 1000).toFixed(1)} kN`),
      twrRow,
      statRow('Total Δv (vac. est.)', `${dv.totalDeltaV.toFixed(0)} m/s`),
    );

    // Per-stage breakdown — total Δv alone hides which stage is starved.
    // Only stages that actually produce Δv are listed: an engine that is
    // still nominally lit but has no fuel left contributes nothing, and
    // printing it as "0 m/s" reads like a bug rather than a spent stage.
    const producing = dv.stages.filter(s => s.engineCount > 0 && s.deltaV > 1);
    if (producing.length > 1) {
      this.statsBlock.appendChild(DOMModule.el('div', { class: 'stat-subhead' }, 'Δv by stage'));
      for (const s of producing) {
        this.statsBlock.appendChild(
          statRow(`Stage ${s.stage + 1}`, `${s.deltaV.toFixed(0)} m/s · ${s.isp.toFixed(0)}s`));
      }
    }
  }

  _refreshStaging() {
    this.stagingBlock.innerHTML = '';
    this.stagingBlock.appendChild(DOMModule.el('h4', {}, 'Staging'));
    if (this.rocket.stages.length === 0) {
      this.stagingBlock.appendChild(DOMModule.el('div', { class: 'empty-hint' }, 'Add an engine, decoupler, or parachute to create stages.'));
      return;
    }
    const list = DOMModule.el('div', { class: 'stage-list' });
    this.rocket.stages.forEach((group, idx) => {
      const chips = group.map(uid => {
        const p = this.rocket.parts.get(uid);
        if (!p) return null;
        return DOMModule.el('span', { class: 'stage-part-chip' }, p.def.name);
      }).filter(Boolean);
      list.appendChild(DOMModule.el('div', { class: 'stage-group' }, [
        DOMModule.el('div', { class: 'stage-label' }, [
          `STAGE ${idx + 1}  `,
          DOMModule.el('button', { class: 'btn small icon', onclick: () => this._moveStage(idx, -1) }, '▼ later'),
          ' ',
          DOMModule.el('button', { class: 'btn small icon', onclick: () => this._moveStage(idx, 1) }, '▲ earlier'),
        ]),
        DOMModule.el('div', {}, chips),
      ]));
    });
    this.stagingBlock.appendChild(list);
  }

  // ------------------------------------------------------------ loop
  update(dt) {
    const input = this.app.input;
    if (this._dragPan && input.mouse.down && input.mouse.button === 2) {
      const dx = input.mouse.x - this._dragPan.x, dy = input.mouse.y - this._dragPan.y;
      this.camera.x -= dx / this.camera.zoom;
      this.camera.y += dy / this.camera.zoom;
      this._dragPan = { x: input.mouse.x, y: input.mouse.y };
    }

    const w = this.app.canvas.width, h = this.app.canvas.height;
    const world = this.camera.screenToWorld(input.mouse.x, input.mouse.y, w, h);

    if (this.selectedDefId) {
      const def = PartDefsModule.getPartDef(this.selectedDefId);
      this.attachPoints = AttachmentModule.listAttachPoints(this.rocket, def);
      if (!this.rocket.rootUid) {
        this.ghost = { x: 0, y: 0, def, valid: true };
      } else {
        const snapMeters = SNAP_RADIUS_PX / this.camera.zoom;
        const spot = AttachmentModule.findBestAttachPoint(this.rocket, def, world.x, world.y, snapMeters);
        // Keep showing the ghost when there's no snap, greyed out — vanishing
        // entirely gave no clue whether the part or the position was the problem.
        this.ghost = spot
          ? { x: spot.x, y: spot.y, def, valid: true }
          : { x: world.x, y: world.y, def, valid: false };
      }
      this.hoverPartUid = null;
    } else {
      this.ghost = null;
      this.attachPoints = null;
      const hovered = AttachmentModule.findPartNear(this.rocket, world.x, world.y, 0.3);
      this.hoverPartUid = hovered ? hovered.uid : null;
    }
  }

  render(ctx, w, h) {
    this.starfield.draw(ctx, w, h, performance.now() / 1000);
    ctx.save();
    this.camera.apply(ctx, w, h);

    this._drawGrid(ctx, w, h);
    this._drawPad(ctx, w, h);

    const t = performance.now() / 1000;

    // Fairings are drawn last and see-through in the builder: an opaque shroud
    // hides the payload you're trying to assemble inside it.
    const ordered = [...this.rocket.partList].sort(
      (a, b) => (a.def.isFairing ? 1 : 0) - (b.def.isFairing ? 1 : 0));

    for (const part of ordered) {
      const isSel = part.uid === this.selectedPartUid;
      const isHover = part.uid === this.hoverPartUid;
      ctx.save();
      ctx.translate(part.localPos.x, part.localPos.y);
      if (part.def.isFairing) ctx.globalAlpha = 0.42;
      if (isSel || isHover) {
        ctx.save();
        ctx.shadowColor = isSel ? '#4fd1ff' : 'rgba(255,255,255,0.9)';
        ctx.shadowBlur = (isSel ? 22 : 12) / this.camera.zoom * 10;
        ctx.strokeStyle = isSel ? '#4fd1ff' : 'rgba(255,255,255,0.75)';
        ctx.lineWidth = (isSel ? 2.4 : 1.6) / this.camera.zoom;
        ctx.strokeRect(-part.halfW - 0.06, -part.halfH - 0.06, part.halfW * 2 + 0.12, part.halfH * 2 + 0.12);
        ctx.restore();
      }
      RocketRendererModule.drawPartLocal(ctx, part);
      ctx.restore();
    }

    // Attachment pips: the single biggest readability win while placing a part.
    if (this.attachPoints && this.attachPoints.length) {
      const pulse = 0.55 + 0.45 * Math.sin(t * 4);
      const r = 5 / this.camera.zoom;
      for (const ap of this.attachPoints) {
        ctx.beginPath();
        ctx.arc(ap.x, ap.y, r * (ap.kind === 'stack' ? 1 : 0.8), 0, Math.PI * 2);
        ctx.fillStyle = ap.kind === 'stack'
          ? `rgba(88,224,138,${0.35 + 0.4 * pulse})`
          : `rgba(255,190,90,${0.3 + 0.35 * pulse})`;
        ctx.fill();
        ctx.strokeStyle = ap.kind === 'stack' ? 'rgba(140,255,190,0.9)' : 'rgba(255,215,150,0.9)';
        ctx.lineWidth = 1.2 / this.camera.zoom;
        ctx.stroke();
      }
    }

    if (this.ghost) {
      ctx.save();
      ctx.translate(this.ghost.x, this.ghost.y);
      const gp = { def: this.ghost.def, halfW: this.ghost.def.width / 2, halfH: this.ghost.def.height / 2, flipped: false };
      if (this.ghost.valid) {
        ctx.globalAlpha = 0.7;
        RocketRendererModule.drawPartLocal(ctx, gp);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = 'rgba(88,224,138,0.95)';
        ctx.lineWidth = 2 / this.camera.zoom;
        ctx.strokeRect(-gp.halfW, -gp.halfH, gp.halfW * 2, gp.halfH * 2);
      } else {
        ctx.globalAlpha = 0.28;
        RocketRendererModule.drawPartLocal(ctx, gp);
        ctx.globalAlpha = 0.85;
        ctx.strokeStyle = 'rgba(255,92,92,0.9)';
        ctx.lineWidth = 2 / this.camera.zoom;
        ctx.setLineDash([6 / this.camera.zoom, 4 / this.camera.zoom]);
        ctx.strokeRect(-gp.halfW, -gp.halfH, gp.halfW * 2, gp.halfH * 2);
        ctx.setLineDash([]);
      }
      ctx.restore();
    }

    ctx.restore();
  }

  // Ground level = the underside of the lowest part, so the rocket always
  // stands ON the pad. Pinning the deck to y=0 instead buried everything below
  // the command pod underground, since parts build downward from the root.
  _padY() {
    const parts = this.rocket ? this.rocket.partList : [];
    if (!parts.length) return 0;
    let minY = Infinity;
    for (const p of parts) minY = Math.min(minY, p.localPos.y - p.halfH);
    return minY;
  }

  // A launch pad under the rocket: gives an unmistakable "this way is up",
  // a ground plane to build from, and a real sense of scale.
  _drawPad(ctx, w, h) {
    const topLeft = this.camera.screenToWorld(0, 0, w, h);
    const bottomRight = this.camera.screenToWorld(w, h, w, h);
    const groundY = this._padY();
    if (topLeft.y < groundY) return; // ground is off-screen above

    const padHalf = Math.max(6, this.rocket ? this.rocket.maxWidth() * 3 : 6);

    ctx.fillStyle = '#141926';
    ctx.fillRect(topLeft.x, bottomRight.y, bottomRight.x - topLeft.x, groundY - bottomRight.y);

    ctx.fillStyle = '#222a3a';
    ctx.fillRect(-padHalf, groundY - 0.55, padHalf * 2, 0.55);
    ctx.fillStyle = '#2c3547';
    ctx.fillRect(-padHalf, groundY - 0.18, padHalf * 2, 0.18);

    // hazard stripes along the pad deck
    ctx.save();
    ctx.beginPath(); ctx.rect(-padHalf, groundY - 0.18, padHalf * 2, 0.18); ctx.clip();
    for (let x = -padHalf; x < padHalf; x += 0.5) {
      ctx.fillStyle = ((x * 2) | 0) % 2 === 0 ? 'rgba(255,190,60,0.5)' : 'rgba(20,24,34,0.5)';
      ctx.fillRect(x, groundY - 0.18, 0.25, 0.18);
    }
    ctx.restore();

    ctx.strokeStyle = 'rgba(120,160,220,0.35)';
    ctx.lineWidth = 1.5 / this.camera.zoom;
    ctx.beginPath(); ctx.moveTo(topLeft.x, groundY); ctx.lineTo(bottomRight.x, groundY); ctx.stroke();
  }

  _drawGrid(ctx, w, h) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1 / this.camera.zoom;
    const topLeft = this.camera.screenToWorld(0, 0, w, h);
    const bottomRight = this.camera.screenToWorld(w, h, w, h);
    const step = 1;
    for (let x = Math.floor(topLeft.x); x <= bottomRight.x; x += step) {
      ctx.beginPath(); ctx.moveTo(x, topLeft.y); ctx.lineTo(x, bottomRight.y); ctx.stroke();
    }
    for (let y = Math.floor(bottomRight.y); y <= topLeft.y; y += step) {
      ctx.beginPath(); ctx.moveTo(topLeft.x, y); ctx.lineTo(bottomRight.x, y); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.beginPath(); ctx.moveTo(topLeft.x, 0); ctx.lineTo(bottomRight.x, 0); ctx.stroke();
    ctx.restore();
  }
}

function statRow(k, v) { return DOMModule.el('div', { class: 'stat-row' }, [DOMModule.el('span', {}, k), DOMModule.el('b', {}, String(v))]); }

function statLine(def) {
  if (def.isEngine) return `${(def.thrustVac / 1000).toFixed(0)} kN · ${def.ispVac}s isp`;
  if (def.fuelCapacity) return `${DOMModule.fmtMass(def.mass)} + ${DOMModule.fmtMass(def.fuelCapacity)} fuel`;
  return DOMModule.fmtMass(def.mass);
}
  return { BuilderScene };
})();

const MainMenuSceneModule = (() => {
class MainMenuScene {
  constructor(app) {
    this.app = app;
    this.starfield = new StarfieldModule.Starfield();
  }

  onEnter() {
    DOMModule.clearUI();
    const menu = DOMModule.el('div', { id: 'main-menu', class: 'screen fade-in' }, [
      DOMModule.el('div', { class: 'menu-title' }, [
        DOMModule.el('h1', {}, 'SFS'),
        DOMModule.el('p', {}, 'Spaceflight Simulator'),
      ]),
      DOMModule.el('div', { class: 'menu-buttons' }, [
        btn('🚀  New Rocket', () => this.app.sceneManager.goto('builder')),
        btn('📁  My Rockets', () => this._openMyRockets()),
        btn('🏆  Challenges', () => this._openChallenges()),
        btn('⚙️  Settings', () => this._openSettings()),
      ]),
      DOMModule.el('div', { class: 'menu-footer' }, 'Terra · Luna · Vulcan · Rubis · Gasso · Ferra'),
      DOMModule.el('div', { class: 'menu-version' }, 'v1.0'),
    ]);
    this.app.uiRoot.appendChild(menu);
  }

  onExit() { DOMModule.clearUI(); }
  update() {}

  render(ctx, w, h) {
    this.starfield.draw(ctx, w, h, performance.now() / 1000);
    ctx.save();
    const t = performance.now() / 1000;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.translate(w * 0.78, h * 0.5);

    const planetR = Math.min(w, h) * 0.16;
    const grad = ctx.createRadialGradient(-planetR * 0.35, -planetR * 0.35, planetR * 0.1, 0, 0, planetR * 1.1);
    grad.addColorStop(0, '#5b96e0'); grad.addColorStop(0.75, '#3f7fd1'); grad.addColorStop(1, '#1c3a63');
    ctx.beginPath(); ctx.arc(0, 0, planetR, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill();
    const atmo = ctx.createRadialGradient(0, 0, planetR * 0.95, 0, 0, planetR * 1.18);
    atmo.addColorStop(0, 'rgba(110,170,255,0)'); atmo.addColorStop(0.6, 'rgba(110,170,255,0.25)'); atmo.addColorStop(1, 'rgba(110,170,255,0)');
    ctx.beginPath(); ctx.arc(0, 0, planetR * 1.18, 0, Math.PI * 2); ctx.fillStyle = atmo; ctx.fill();

    const moonAngle = t * 0.18;
    const moonOrbitR = planetR * 2.1;
    const mx = Math.cos(moonAngle) * moonOrbitR, my = Math.sin(moonAngle) * moonOrbitR * 0.4;
    const moonR = planetR * 0.28;
    const mgrad = ctx.createRadialGradient(mx - moonR * 0.3, my - moonR * 0.3, moonR * 0.1, mx, my, moonR * 1.1);
    mgrad.addColorStop(0, '#c7c3ba'); mgrad.addColorStop(1, '#5c5850');
    ctx.beginPath(); ctx.arc(mx, my, moonR, 0, Math.PI * 2); ctx.fillStyle = mgrad; ctx.fill();

    ctx.restore();
  }

  _openMyRockets() {
    const list = StorageModule.Storage.getBlueprints();
    const overlay = DOMModule.el('div', { class: 'overlay-screen' });
    const rows = list.length ? list.map(bp => {
      let mass = 0;
      try { mass = RocketModule.Rocket.fromBlueprint(bp).getAggregate().mass; } catch (e) {}
      return DOMModule.el('div', { class: 'list-row' }, [
        DOMModule.el('div', {}, [DOMModule.el('div', { class: 'row-title' }, bp.name), DOMModule.el('div', { class: 'row-sub' }, `${bp.parts.length} parts · ${DOMModule.fmtMass(mass)}`)]),
        DOMModule.el('div', { class: 'row-actions' }, [
          DOMModule.el('button', { class: 'btn small primary', onclick: () => { this.app.sceneManager.goto('flight', { rocket: RocketModule.Rocket.fromBlueprint(bp), launchBodyId: 'terra' }); } }, 'Launch'),
          DOMModule.el('button', { class: 'btn small', onclick: () => this.app.sceneManager.goto('builder', { blueprintId: bp.id }) }, 'Edit'),
          DOMModule.el('button', { class: 'btn small danger', onclick: () => { StorageModule.Storage.deleteBlueprint(bp.id); overlay.remove(); this._openMyRockets(); } }, 'Delete'),
        ]),
      ]);
    }) : [DOMModule.el('div', { class: 'empty-hint' }, 'No rockets yet. Click "New Rocket" to build your first one!')];

    overlay.appendChild(DOMModule.el('div', { class: 'panel dialog' }, [
      DOMModule.el('div', { class: 'dialog-header' }, [DOMModule.el('h2', {}, 'My Rockets'), DOMModule.el('button', { class: 'close-x', onclick: () => overlay.remove() }, '✕')]),
      DOMModule.el('div', { class: 'list-scroll' }, rows),
    ]));
    this.app.uiRoot.appendChild(overlay);
  }

  _openChallenges() {
    const items = ChallengesModule.getChallengeList();
    const doneCount = items.filter(i => i.done).length;
    const overlay = DOMModule.el('div', { class: 'overlay-screen' });
    overlay.appendChild(DOMModule.el('div', { class: 'panel dialog' }, [
      DOMModule.el('div', { class: 'dialog-header' }, [DOMModule.el('h2', {}, `Challenges (${doneCount}/${items.length})`), DOMModule.el('button', { class: 'close-x', onclick: () => overlay.remove() }, '✕')]),
      DOMModule.el('div', { class: 'list-scroll' }, items.map(c => DOMModule.el('div', { class: `challenge-card${c.done ? ' done' : ''}` }, [
        DOMModule.el('div', { class: 'challenge-check' }, c.done ? '✓' : ''),
        DOMModule.el('div', {}, [
          DOMModule.el('div', { class: 'challenge-name' }, c.name),
          DOMModule.el('div', { class: 'challenge-desc' }, c.desc),
          DOMModule.el('div', { class: 'challenge-reward' }, `Reward: ${c.reward}`),
        ]),
      ]))),
    ]));
    this.app.uiRoot.appendChild(overlay);
  }

  _openSettings() {
    const settings = StorageModule.Storage.getSettings();
    const overlay = DOMModule.el('div', { class: 'overlay-screen' });
    const sfxToggle = DOMModule.el('div', { class: 'toggle-switch' + (settings.sfx !== false ? ' on' : ''), onclick: (e) => {
      settings.sfx = settings.sfx === false;
      StorageModule.Storage.saveSettings(settings);
      AudioModule.AudioSys.setEnabled(settings.sfx);
      e.target.closest('.toggle-switch').classList.toggle('on', settings.sfx);
    } }, [DOMModule.el('div', { class: 'knob' })]);

    overlay.appendChild(DOMModule.el('div', { class: 'panel dialog', style: { width: '420px' } }, [
      DOMModule.el('div', { class: 'dialog-header' }, [DOMModule.el('h2', {}, 'Settings'), DOMModule.el('button', { class: 'close-x', onclick: () => overlay.remove() }, '✕')]),
      DOMModule.el('div', {}, [
        DOMModule.el('div', { class: 'settings-row' }, [
          DOMModule.el('div', {}, [DOMModule.el('div', { class: 'settings-label' }, 'Sound Effects'), DOMModule.el('div', { class: 'settings-sub' }, 'Engine rumble, staging, UI clicks')]),
          sfxToggle,
        ]),
        DOMModule.el('div', { class: 'settings-row' }, [
          DOMModule.el('div', {}, [DOMModule.el('div', { class: 'settings-label' }, 'Reset Progress'), DOMModule.el('div', { class: 'settings-sub' }, 'Clears challenge completion (keeps rockets)')]),
          DOMModule.el('button', { class: 'btn small danger', onclick: () => { localStorage.removeItem('sfs.challenges.v1'); overlay.remove(); this._openSettings(); } }, 'Reset'),
        ]),
      ]),
    ]));
    this.app.uiRoot.appendChild(overlay);
  }
}

function btn(label, onclick) {
  return DOMModule.el('button', { class: 'btn big', onclick: () => { AudioModule.AudioSys.click(); onclick(); } }, label);
}
  return { MainMenuScene };
})();

const FlightSceneModule = (() => {
class FlightScene {
  constructor(app) {
    this.app = app;
    this.camera = new CameraModule.Camera();
    this.camera.zoom = 6;
    this.starfield = new StarfieldModule.Starfield();
    this.particles = new ParticlesModule.ParticleSystem();
    this.mapMode = false;
    this.warpIndex = 0;
    this.t = 0;
    this.debris = [];
    this._wasLanded = false;
    this._challengeState = {};
    this._dragLast = null;
    this.autopilotMode = 'off';
    this.vessels = [];
    this.target = new TargetModule.TargetSystem();
    this._approach = null;
    this._approachAge = Infinity;
    // Trajectory prediction is far too costly to redo every frame, so it's
    // cached and refreshed on a timer (and immediately whenever thrust or
    // staging invalidates it).
    this.prediction = null;
    this._predictionAge = Infinity;
    this._predictionDirty = true;
  }

  onEnter({ rocket, launchBodyId = 'terra', t0 = null }) {
    this.rocket = rocket;
    this.launchBodyId = launchBodyId;
    this.launchMass = rocket.getAggregate().mass;
    this._originalBlueprint = rocket.toBlueprint();
    this.t = t0 !== null ? t0 : this.app.simTime;

    if (rocket.position.x === 0 && rocket.position.y === 0 && !rocket.landed && !rocket._launched) {
      const body = SolarSystemModule.getBody(launchBodyId);
      const bodyPos = body.positionAt(this.t);
      const terrainR = body.terrainRadiusAt(ConstantsModule.LAUNCH_ANGLE);
      rocket.position.x = bodyPos.x + Math.cos(ConstantsModule.LAUNCH_ANGLE) * terrainR;
      rocket.position.y = bodyPos.y + Math.sin(ConstantsModule.LAUNCH_ANGLE) * terrainR;
      const groundVel = body.surfacePointVelocity(this.t, ConstantsModule.LAUNCH_ANGLE);
      rocket.velocity.x = groundVel.x; rocket.velocity.y = groundVel.y;
      rocket.angle = ConstantsModule.LAUNCH_ANGLE;
      rocket.landed = true;
      rocket.landedBodyId = body.id;
      rocket.landedAngle = ConstantsModule.LAUNCH_ANGLE;
      rocket._launched = true;
    }
    this._wasLanded = rocket.landed;
    this.vessels = [rocket];
    this.target.clear();

    this.hud = new HUDModule.FlightHUD({
      onStage: () => this.doStage(),
      onWarpChange: (d) => this.changeWarp(d),
      onMapToggle: () => this.toggleMap(),
      onBack: () => this.exitFlight(),
      onRetry: () => this.retry(),
      onAutopilot: (mode) => this.setAutopilot(mode),
      onSwitchVessel: () => this.switchVessel(1),
      onCycleTarget: () => this.cycleTarget(),
      onUndock: () => this.doUndock(),
    });
    this.hud.setAutopilotMode(this.autopilotMode);
    this.mapView = null;

    this._offWheel = this.app.input.onWheel((dy) => {
      if (this.mapMode && this.mapView) this.mapView.handleWheel(dy);
      else {
        const factor = dy > 0 ? 0.88 : 1.135;
        this.camera.setZoomClamped(this.camera.zoom * factor, 0.02, 400);
      }
    });
    this._offClick = this.app.input.onClick((phase, mouse) => {
      if (this.mapMode && this.mapView) {
        if (phase === 'down') {
          this.mapView.handleDragStart();
          this._dragLast = { x: mouse.x, y: mouse.y };
          this._dragStart = { x: mouse.x, y: mouse.y };
        }
        if (phase === 'up') {
          this.mapView.handleDragEnd();
          // Treat it as a body-focus click only if the pointer barely moved,
          // so panning the map never accidentally re-targets the camera.
          if (this._dragStart && Math.hypot(mouse.x - this._dragStart.x, mouse.y - this._dragStart.y) < 5) {
            const hit = this.mapView.handleClick(mouse.x, mouse.y, this.app.canvas.width, this.app.canvas.height, this.t);
            // Clicking a body both focuses it and makes it the nav target, so
            // "go there" is a single action.
            if (hit && hit.bodyId) this.setTargetBody(hit.bodyId);
          }
          this._dragStart = null;
        }
      }
    });

    AudioModule.AudioSys.startEngineRumble();
    ToastModule.toast(`Launch! Reach for the sky, ${rocket.name}.`);
  }

  onExit() {
    this.hud.destroy();
    if (this.mapView) this.mapView.destroy();
    this._offWheel && this._offWheel();
    this._offClick && this._offClick();
    AudioModule.AudioSys.stopEngineRumble();
  }

  exitFlight() {
    this.app.simTime = this.t;
    this.app.sceneManager.goto('mainmenu');
  }

  retry() {
    const fresh = RocketModule.Rocket.fromBlueprint(this._originalBlueprint);
    this.app.sceneManager.goto('flight', { rocket: fresh, launchBodyId: this.launchBodyId });
  }

  toggleMap() {
    this.mapMode = !this.mapMode;
    if (this.mapMode && !this.mapView) this.mapView = new MapViewModule.MapView({ onClose: () => this.toggleMap() });
    if (this.mapView) this.mapView.root.classList.toggle('hidden', !this.mapMode);
    this.hud.root.classList.toggle('hidden', this.mapMode);
  }

  changeWarp(dir) {
    if (this.rocket.throttle > 0.01) { ToastModule.toast('Cannot time warp while throttled up.'); return; }
    this.warpIndex = Math.max(0, Math.min(ConstantsModule.WARP_LEVELS.length - 1, this.warpIndex + dir));
    this.hud.setWarp(this.warpIndex);
  }

  setAutopilot(mode) {
    this.autopilotMode = (this.autopilotMode === mode && mode !== 'off') ? 'off' : mode;
    this.hud.setAutopilotMode(this.autopilotMode);
    AudioModule.AudioSys.click();
    if (this.autopilotMode !== 'off') ToastModule.toast(`Attitude hold: ${AutopilotModule.AP_LABELS[this.autopilotMode]}`);
  }

  // ---------------------------------------------------------- vessels
  switchVessel(dir = 1) {
    const live = this.vessels.filter(v => !v.destroyed);
    if (live.length < 2) { ToastModule.toast('No other craft in flight.'); return; }
    const idx = live.indexOf(this.rocket);
    const next = live[(idx + dir + live.length) % live.length];
    this.rocket = next;
    this.autopilotMode = 'off';
    this.hud.setAutopilotMode('off');
    this._predictionDirty = true;
    this._wasLanded = next.landed;
    // Targeting yourself makes no sense; retarget to the craft you just left.
    if (this.target.kind === 'vessel' && this.target.vessel === next) this.target.setVessel(live[idx]);
    AudioModule.AudioSys.click();
    ToastModule.toast(`Now controlling: ${next.name}`);
  }

  setTargetVessel(v) {
    if (!v || v === this.rocket) { this.target.clear(); ToastModule.toast('Target cleared.'); }
    else { this.target.setVessel(v); ToastModule.toast(`Target: ${v.name}`); }
    this._approachAge = Infinity;
    AudioModule.AudioSys.click();
  }

  setTargetBody(id) {
    this.target.setBody(id);
    this._approachAge = Infinity;
    AudioModule.AudioSys.click();
    ToastModule.toast(`Target: ${this.target.name}`);
  }

  cycleTarget() {
    const live = this.vessels.filter(v => !v.destroyed && v !== this.rocket);
    if (!live.length) { this.target.clear(); ToastModule.toast('No other craft to target.'); return; }
    const cur = this.target.kind === 'vessel' ? live.indexOf(this.target.vessel) : -1;
    this.setTargetVessel(live[(cur + 1) % live.length]);
  }

  doUndock() {
    const other = DockingModule.undock(this.rocket, RocketModule.Rocket);
    if (!other) { ToastModule.toast('Nothing is docked.'); return; }
    this.vessels.push(other);
    this._predictionDirty = true;
    AudioModule.AudioSys.stage();
    ToastModule.toast(`Undocked — ${other.name} separated.`);
  }

  _tryDock() {
    const live = this.vessels.filter(v => !v.destroyed && !(v._dockCooldown > 0));
    if (live.length < 2) return;
    const pair = DockingModule.findDockingPair(live);
    if (!pair) return;
    const survivor = DockingModule.dock(pair.a, pair.b, pair.portA, pair.portB);
    if (!survivor) return;
    // Keep controlling whichever craft the player was already flying.
    if (this.rocket === pair.b) this.rocket = survivor;
    if (this.target.kind === 'vessel' && this.target.vessel === pair.b) this.target.clear();
    this.vessels = this.vessels.filter(v => !v.destroyed || v === survivor);
    this._predictionDirty = true;
    AudioModule.AudioSys.success();
    this.hud.flashChallenge('Docking successful');
    ToastModule.toast(`Docked at ${pair.relSpeed.toFixed(2)} m/s.`);
  }

  _jettisonFairing(part) {
    // Two halves thrown sideways, matching how the shroud is drawn.
    const com = this.rocket.getAggregate().com;
    const base = DockingModule.partWorldPos(this.rocket, part);
    const outward = this.rocket.angle - Math.PI / 2;
    for (const side of [-1, 1]) {
      const dir = new Vector2Module.Vector2(Math.cos(outward), Math.sin(outward)).rotated(side * Math.PI / 2);
      this.debris.push({
        position: { x: base.x + dir.x * part.halfW, y: base.y + dir.y * part.halfW },
        velocity: {
          x: this.rocket.velocity.x + dir.x * 3.5,
          y: this.rocket.velocity.y + dir.y * 3.5,
        },
        mass: part.def.mass / 2, size: Math.max(part.halfW, part.halfH),
        angle: this.rocket.angle, angularVelocity: side * (0.5 + Math.random() * 0.5),
        life: 60,
      });
    }
    this.rocket.removePart(part.uid);
  }

  doStage() {
    if (!this.rocket.hasMoreStages()) return;
    const oldCom = this.rocket.getAggregate().com;
    const oldPos = { x: this.rocket.position.x, y: this.rocket.position.y };
    const angle = this.rocket.angle;

    const fired = [...(this.rocket.stages[this.rocket.currentStageIndex] || [])];

    const { detachedRoots } = this.rocket.activateStage();
    for (const rootUid of detachedRoots) {
      const detached = this.rocket.detachSubtree(rootUid);
      if (!detached) continue;
      const localOff = new Vector2Module.Vector2(detached.anchorLocalPos.x - oldCom.x, detached.anchorLocalPos.y - oldCom.y);
      const worldOff = localOff.rotated(angle - Math.PI / 2);
      const spawnPos = { x: oldPos.x + worldOff.x, y: oldPos.y + worldOff.y };
      const spawnVel = { x: this.rocket.velocity.x, y: this.rocket.velocity.y };

      // A jettisoned section that carries its own command pod or probe core is
      // still a flyable craft, not junk — keep it as a switchable vessel so
      // rendezvous and docking with your own hardware is possible.
      const hasControl = detached.parts.some(p => p.def.controlTorque && !p.def.isDockingPort);
      if (hasControl) {
        const v = RocketModule.Rocket.fromDetachedParts(detached.parts, `${this.rocket.name} · Section`);
        if (v) {
          v.position = spawnPos; v.velocity = spawnVel;
          v.angle = angle; v.angularVelocity = this.rocket.angularVelocity;
          v._launched = true; v._dockCooldown = 2.5;
          this.vessels.push(v);
          ToastModule.toast(`${v.name} is now a separate craft — press V to switch.`);
          continue;
        }
      }
      this.debris.push({
        position: spawnPos, velocity: spawnVel,
        mass: detached.mass, size: detached.size, angle, angularVelocity: (Math.random() - 0.5) * 0.4,
        life: 90,
      });
    }
    // Fairings split into two halves that tumble away rather than jettisoning
    // as one lump — and they stop suppressing drag the moment they go. Done
    // after activateStage so the COM correction below sees the final part set.
    for (const uid of fired) {
      const p = this.rocket.parts.get(uid);
      if (p && p.def.isFairing) this._jettisonFairing(p);
    }

    // The surviving rocket's center of mass shifts when parts are jettisoned;
    // correct its tracked position so its still-attached parts don't visually jump.
    if (detachedRoots.length > 0 && this.rocket.rootUid) {
      const newCom = this.rocket.getAggregate().com;
      const comDelta = new Vector2Module.Vector2(newCom.x - oldCom.x, newCom.y - oldCom.y).rotated(angle - Math.PI / 2);
      this.rocket.position.x = oldPos.x + comDelta.x;
      this.rocket.position.y = oldPos.y + comDelta.y;
    }
    this._predictionDirty = true;
    AudioModule.AudioSys.stage();
    ToastModule.toast('Staged.');
  }

  handleKeydown(code) {
    if (code === 'Space') { this.doStage(); }
    if (code === 'KeyM') this.toggleMap();
    if (code === 'Comma') this.changeWarp(-1);
    if (code === 'Period') this.changeWarp(1);
    if (code === 'KeyX') this.rocket.throttle = 0;
    if (code === 'KeyZ') this.rocket.throttle = 1;
  }

  update(dt) {
    dt = Math.min(dt, ConstantsModule.MAX_DT);
    const input = this.app.input;

    if (input.wasJustPressed('Space')) this.doStage();
    if (input.wasJustPressed('KeyM')) this.toggleMap();
    if (input.wasJustPressed('Comma')) this.changeWarp(-1);
    if (input.wasJustPressed('Period')) this.changeWarp(1);
    if (input.wasJustPressed('KeyX')) this.rocket.throttle = 0;
    if (input.wasJustPressed('KeyZ')) this.rocket.throttle = 1;

    if (input.wasJustPressed('KeyV')) this.switchVessel(1);
    if (input.wasJustPressed('KeyG')) this.cycleTarget();
    if (input.wasJustPressed('KeyU')) this.doUndock();

    // Attitude-hold shortcuts (T=hold, F=prograde, R=retrograde, Q/E=up/down)
    if (input.wasJustPressed('KeyT')) this.setAutopilot('hold');
    if (input.wasJustPressed('KeyF')) this.setAutopilot('prograde');
    if (input.wasJustPressed('KeyR')) this.setAutopilot('retrograde');
    if (input.wasJustPressed('KeyQ')) this.setAutopilot('up');
    if (input.wasJustPressed('KeyE')) this.setAutopilot('down');

    if (!this.rocket.destroyed) {
      const prevThrottle = this.rocket.throttle;
      if (input.isDown('ShiftLeft') || input.isDown('ShiftRight')) this.rocket.throttle = Math.min(1, this.rocket.throttle + dt * 0.8);
      if (input.isDown('ControlLeft') || input.isDown('ControlRight')) this.rocket.throttle = Math.max(0, this.rocket.throttle - dt * 0.8);
      if (this.rocket.throttle !== prevThrottle) this._predictionDirty = true;
    }

    let rotateDir = 0;
    if (input.isDown('KeyA') || input.isDown('ArrowLeft')) rotateDir -= 1;
    if (input.isDown('KeyD') || input.isDown('ArrowRight')) rotateDir += 1;

    // Manual input always overrides — and cancels — the autopilot, so you're
    // never fighting it for control of the ship.
    if (rotateDir !== 0) {
      if (this.autopilotMode !== 'off') { this.autopilotMode = 'off'; this.hud.setAutopilotMode('off'); }
    } else if (this.autopilotMode !== 'off' && !this.rocket.destroyed && !this.rocket.landed) {
      const apBody = SolarSystemModule.getDominantBody(new Vector2Module.Vector2(this.rocket.position.x, this.rocket.position.y), this.t);
      rotateDir = AutopilotModule.computeAutopilotCommand(this.autopilotMode, this.rocket, apBody, this.t, this.target);
    }

    if (this.mapMode && this.mapView && this._dragLast && input.mouse.down) {
      const dx = input.mouse.x - this._dragLast.x, dy = input.mouse.y - this._dragLast.y;
      this.mapView.handleDragMove(dx, dy);
      this._dragLast = { x: input.mouse.x, y: input.mouse.y };
    } else if (!input.mouse.down) {
      this._dragLast = null;
    }

    const warpMult = (this.rocket.throttle > 0.01) ? 1 : ConstantsModule.WARP_LEVELS[this.warpIndex];
    const simDt = dt * warpMult;
    const maxSubDt = 0.2;
    const substeps = Math.min(60, Math.max(1, Math.ceil(simDt / maxSubDt)));
    const subDt = simDt / substeps;

    for (let i = 0; i < substeps; i++) {
      this.t += subDt;
      // Every vessel is simulated, not just the one being flown — otherwise a
      // craft you left in orbit would freeze in place and rendezvous would be
      // meaningless.
      for (const v of this.vessels) {
        if (v.destroyed) continue;
        const isActive = v === this.rocket;
        if (v._dockCooldown > 0) v._dockCooldown -= subDt;
        const result = FlightPhysicsModule.stepRocket(v, subDt, this.t, { rotate: isActive ? rotateDir : 0 });
        if (isActive) {
          if (result.event === 'crash') this._onCrash(result);
          if (result.event === 'landed' && !this._wasLanded) this._onLanded(result);
        }
      }
      this._tryDock();
      for (const d of this.debris) { FlightPhysicsModule.stepDebris(d, subDt, this.t); d.life -= subDt; }
    }
    this._wasLanded = this.rocket.landed;
    this.debris = this.debris.filter(d => d.life > 0);
    this.vessels = this.vessels.filter(v => !v.destroyed || v === this.rocket);

    this._refreshPrediction(dt);

    this.app.simTime = this.t;
    this.particles.update(dt);
    AudioModule.AudioSys.setEngineLevel(this.rocket.destroyed ? 0 : this.rocket.throttle * (this.rocket.ignitedEngines().length > 0 ? 1 : 0));

    if (!this.mapMode) {
      this.camera.x = this.rocket.position.x;
      this.camera.y = this.rocket.position.y;
    } else if (this.mapView) {
      this.mapView.update(this.rocket, this.t, this.app.canvas.width, this.app.canvas.height);
    }

    this._updateHudAndChallenges();
  }

  _refreshPrediction(dt) {
    this._predictionAge += dt;
    if (this.rocket.destroyed || this.rocket.landed) { this.prediction = null; return; }
    // Under thrust the path changes continuously, so refresh briskly; coasting
    // it only needs an occasional update (and time warp makes it stale faster).
    const thrusting = this.rocket.throttle > 0.01 && this.rocket.ignitedEngines().length > 0;
    const interval = thrusting ? 0.12 : 0.5;
    if (!this._predictionDirty && this._predictionAge < interval) return;

    this.prediction = TrajectoryModule.predictTrajectory(this.rocket.position, this.rocket.velocity, this.t, {
      maxDuration: 60 * 60 * 24 * 40,
    });
    this._predictionAge = 0;
    this._predictionDirty = false;
  }

  _onCrash(result) {
    this.particles.burst(result.position.x, result.position.y, { count: 40, speed: 90, life: 1.4 });
    AudioModule.AudioSys.crash();
    this.hud.showMessage('CRASHED', 'crash');
    this.hud.showRetry(true);
    ToastModule.toast(`Impact at ${result.impactSpeed.toFixed(1)} m/s destroyed the vessel.`);
  }

  _onLanded(result) {
    AudioModule.AudioSys.success();
    ToastModule.toast(`Touchdown on ${result.body.name} — impact speed ${result.impactSpeed.toFixed(1)} m/s.`);
  }

  _updateHudAndChallenges() {
    const posV = new Vector2Module.Vector2(this.rocket.position.x, this.rocket.position.y);
    const body = SolarSystemModule.getDominantBody(posV, this.t);
    const alt = FlightPhysicsModule.getAltitude(posV, body, this.t);
    const relVel = new Vector2Module.Vector2(this.rocket.velocity.x, this.rocket.velocity.y).sub(body.velocityAt(this.t));
    const speed = relVel.length();
    const radialOut = new Vector2Module.Vector2(Math.cos(alt.angle), Math.sin(alt.angle));
    const vSpeed = relVel.dot(radialOut);
    const relPos = posV.sub(body.positionAt(this.t));
    const elements = OrbitModule.computeOrbitalElements(relPos, relVel, body.mu);

    let status = 'Flying';
    if (this.rocket.destroyed) status = 'Destroyed';
    else if (this.rocket.landed) status = `Landed on ${body.name}`;
    else if (alt.altitude < body.atmosphereHeight) status = `Atmospheric flight (${body.name})`;
    else if (elements && elements.isElliptical) status = `Orbiting ${body.name}`;
    else status = `In flight near ${body.name}`;

    const fuel = this.rocket.liquidFuelStatus();
    const srbs = this.rocket.partList.filter(p => p.def.fuelType === 'solid');
    const srbFuel = srbs.reduce((s, p) => s + p.fuel, 0);
    const srbCap = srbs.reduce((s, p) => s + p.fuelCapacity, 0);
    const totalFuel = fuel.fuel + srbFuel, totalCap = fuel.capacity + srbCap;

    // Where this path actually ends up — the single most useful readout in the game.
    let encounter = 'Stable orbit', encounterClass = ' good';
    if (this.rocket.landed) { encounter = 'Landed'; encounterClass = ''; }
    else if (!this.prediction) { encounter = '—'; encounterClass = ''; }
    else {
      const ev = TrajectoryModule.encounterSummary(this.prediction);
      if (ev && ev.type === 'impact') {
        encounter = `Impact: ${SolarSystemModule.getBody(ev.bodyId).name} in ${DOMModule.fmtTime(ev.t - this.t)}`;
        encounterClass = ' danger';
      } else if (ev && ev.type === 'soi-enter') {
        encounter = `Encounter: ${SolarSystemModule.getBody(ev.bodyId).name} in ${DOMModule.fmtTime(ev.t - this.t)}`;
        encounterClass = ' good';
      } else if (!elements || !elements.isElliptical) {
        encounter = `Escaping ${body.name}`;
        encounterClass = ' warn';
      }
    }

    this.hud.update({
      status, bodyName: body.name, encounter, encounterClass,
      altitude: alt.altitude, speed, vSpeed,
      apoapsis: elements && elements.isElliptical ? DOMModule.fmtDist(elements.apoapsis - body.radius) : (elements ? 'Escape traj.' : '—'),
      periapsis: elements ? DOMModule.fmtDist(elements.periapsis - body.radius) : '—',
      period: elements && elements.isElliptical ? DOMModule.fmtTime(elements.period) : '—',
      stageLabel: this.rocket.hasMoreStages() ? `${this.rocket.currentStageIndex + 1} / ${this.rocket.stages.length}` : 'Final',
      mass: this.rocket.getAggregate().mass,
      fuelLabel: totalCap > 0 ? `${totalFuel.toFixed(0)} / ${totalCap.toFixed(0)} kg` : 'N/A',
      fuelFrac: totalCap > 0 ? totalFuel / totalCap : 0,
      hasMoreStages: this.rocket.hasMoreStages() && !this.rocket.destroyed,
    });
    this.hud.setThrottle(this.rocket.throttle);

    // Navball: "up" is radial-out from the reference body; velocity pips use
    // surface-relative motion so they mean the right thing during ascent/landing.
    const surfVel = new Vector2Module.Vector2(this.rocket.velocity.x, this.rocket.velocity.y)
      .sub(FlightPhysicsModule.atmosphereVelocityAt(posV, body, this.t));

    // ---- navigation readout ------------------------------------------------
    let targetBearing = null;
    if (this.target.isSet) {
      const rel = this.target.relativeTo(this.rocket, this.t);
      if (rel) {
        targetBearing = rel.direction.angle();
        this._approachAge += 1 / 60;
        if (this._approachAge > 1.5) {
          this._approach = TargetModule.closestApproach(this.rocket, this.target, this.t);
          this._approachAge = 0;
        }
        // Docking is possible only when both range and closing speed are inside
        // the ports' limits — surface that as one clear yes/no cue.
        const dockReady = this.target.kind === 'vessel' && rel.range < 3.5 && rel.relSpeed < 2.0;
        this.hud.updateTarget({
          name: this.target.name,
          range: DOMModule.fmtDist(rel.range),
          relSpeed: `${rel.relSpeed.toFixed(2)} m/s`,
          closing: `${rel.closingRate >= 0 ? '+' : ''}${rel.closingRate.toFixed(2)} m/s`,
          closingPositive: rel.closingRate >= 0,
          approach: this._approach
            ? `${DOMModule.fmtDist(this._approach.distance)} in ${DOMModule.fmtTime(this._approach.time)}`
            : '—',
          dockReady,
        });
      } else this.hud.updateTarget(null);
    } else {
      this.hud.updateTarget(null);
    }

    this.hud.drawNavball(
      this.rocket.angle,
      alt.angle,
      surfVel.length() > 0.6 ? surfVel.angle() : null,
      surfVel.length(),
      this.autopilotMode === 'off' ? null : this.autopilotMode,
      targetBearing,
    );

    if (!this.rocket.destroyed) {
      const ctx = ChallengesModule.getChallengeContext(this.rocket, this.t, this.launchMass, this._challengeState);
      ChallengesModule.checkChallenges(ctx, (ch) => { this.hud.flashChallenge(ch.name); AudioModule.AudioSys.success(); });
    }
  }

  render(ctx, w, h) {
    this.starfield.draw(ctx, w, h, performance.now() / 1000);

    const activeCam = this.mapMode && this.mapView ? this.mapView.camera : this.camera;

    if (this.mapMode && this.mapView) {
      this.mapView.render(ctx, w, h, this.t, this.rocket, this.prediction);
      return;
    }

    ctx.save();
    activeCam.applyOriginAtCamera(ctx, w, h);
    const ox = activeCam.x, oy = activeCam.y;

    for (const body of SolarSystemModule.SolarSystem.all) {
      const p = body.positionAt(this.t);
      const dxScreen = (p.x - activeCam.x) * activeCam.zoom;
      const dyScreen = (p.y - activeCam.y) * activeCam.zoom;
      if (Math.abs(dxScreen) > w * 1.5 + body.radius * activeCam.zoom || Math.abs(dyScreen) > h * 1.5 + body.radius * activeCam.zoom) continue;
      BodyRendererModule.drawBody(ctx, body, this.t, body.radius * activeCam.zoom, ox, oy);
    }

    if (!this.rocket.destroyed && this.prediction) {
      TrajectoryRendererModule.drawPredictedPath(ctx, this.prediction, this.t, {
        lineWidth: 1.4 / activeCam.zoom,
        markerSize: 4 / activeCam.zoom,
        labelScale: 1 / activeCam.zoom,
      }, ox, oy);
    }

    for (const d of this.debris) RocketRendererModule.drawDebris(ctx, d, ox, oy);

    // Other craft in flight, plus a target reticle on whichever is targeted.
    for (const v of this.vessels) {
      if (v === this.rocket || v.destroyed) continue;
      RocketRendererModule.drawRocket(ctx, v, performance.now() / 1000, ox, oy);
      const isTarget = this.target.kind === 'vessel' && this.target.vessel === v;
      const r = 14 / activeCam.zoom;
      ctx.beginPath();
      ctx.arc(v.position.x - ox, v.position.y - oy, r, 0, Math.PI * 2);
      ctx.strokeStyle = isTarget ? 'rgba(192,125,255,0.95)' : 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1.6 / activeCam.zoom;
      ctx.setLineDash(isTarget ? [] : [4 / activeCam.zoom, 4 / activeCam.zoom]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    if (!this.rocket.destroyed) RocketRendererModule.drawRocket(ctx, this.rocket, performance.now() / 1000, ox, oy);

    this.particles.draw(ctx, ox, oy);

    ctx.restore();
  }
}
  return { FlightScene };
})();

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

const app = {
  canvas, ctx,
  uiRoot: document.getElementById('ui-root'),
  input: null,
  simTime: 0,
  sceneManager: null,
};

app.input = new InputModule.Input(canvas);

class SceneManager {
  constructor(app) {
    this.app = app;
    this.scenes = {
      mainmenu: new MainMenuSceneModule.MainMenuScene(app),
      builder: new BuilderSceneModule.BuilderScene(app),
      flight: new FlightSceneModule.FlightScene(app),
    };
    this.current = null;
    this.currentName = null;
  }

  goto(name, params = {}) {
    if (this.current && this.current.onExit) this.current.onExit();
    DOMModule.clearUI();
    this.current = this.scenes[name];
    this.currentName = name;
    if (this.current.onEnter) this.current.onEnter(params);
  }
}

app.sceneManager = new SceneManager(app);
window.SFS = app; // debug/console access

// Canvas backing store is kept 1:1 with CSS pixels (no devicePixelRatio scale)
// so mouse coordinates (CSS px, from getBoundingClientRect) and world->screen
// projection (Camera, in the same px space) never drift apart.
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

app.sceneManager.goto('mainmenu');

let lastTime = performance.now();
function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  app.simTime += dt;

  const w = canvas.width, h = canvas.height;

  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);

  if (app.sceneManager.current) {
    app.sceneManager.current.update && app.sceneManager.current.update(dt);
    app.sceneManager.current.render && app.sceneManager.current.render(ctx, w, h);
  }

  ctx.restore();
  app.input.endFrame();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
