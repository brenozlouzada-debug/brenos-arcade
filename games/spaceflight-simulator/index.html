const AttachmentModule = (() => {
// Finds the best valid attachment point for a candidate part definition near
// a world-space cursor position, searching every existing part's exposed
// stack/radial nodes. Returns null if nothing is in snap range.
function findBestAttachPoint(rocket, partDef, worldX, worldY, snapRadiusMeters) {
  if (!rocket.rootUid) {
    return { parentUid: null, node: null, offsetAlongParent: 0, x: 0, y: 0, dist: 0 };
  }

  let best = null;
  for (const part of rocket.partList) {
    const occupied = { top: false, bottom: false };
    for (const cUid of part.childUids) {
      const c = rocket.parts.get(cUid);
      if (c && (c.node === 'top' || c.node === 'bottom')) occupied[c.node] = true;
    }

    // New part attaches to `part`'s TOP node (new part sits above `part`).
    // `node` names which node of the PARENT is occupied (matches Rocket.recomputeLayout).
    if (part.def.attach.top && !occupied.top && partDef.attach.bottom) {
      const x = part.localPos.x, y = part.localPos.y + part.halfH + partDef.height / 2;
      consider(x, y, part.uid, 'top', 0);
    }
    // New part attaches to `part`'s BOTTOM node (new part sits below `part`).
    if (part.def.attach.bottom && !occupied.bottom && partDef.attach.top) {
      const x = part.localPos.x, y = part.localPos.y - part.halfH - partDef.height / 2;
      consider(x, y, part.uid, 'bottom', 0);
    }
    // Radial: side of `part` <- new part (fins/legs/rcs/etc.)
    if (part.def.attach.radialHost && partDef.attach.sides) {
      const side = worldX >= part.localPos.x ? 'right' : 'left';
      const clampedY = Math.max(part.localPos.y - part.halfH * 0.85, Math.min(part.localPos.y + part.halfH * 0.85, worldY));
      const x = part.localPos.x + (side === 'right' ? 1 : -1) * (part.halfW + partDef.width / 2);
      const y = clampedY;
      consider(x, y, part.uid, side, clampedY - part.localPos.y);
    }
  }

  function consider(x, y, parentUid, node, offsetAlongParent) {
    const d = Math.hypot(x - worldX, y - worldY);
    if (d > snapRadiusMeters) return;
    if (!best || d < best.dist) best = { parentUid, node, offsetAlongParent, x, y, dist: d };
  }

  return best;
}

// Every attachment point the given part definition could legally occupy right
// now. The builder renders these as pips so the player can SEE where a held
// part will snap instead of hunting for an invisible hotspot.
function listAttachPoints(rocket, partDef) {
  if (!rocket.rootUid) return [];
  const points = [];
  for (const part of rocket.partList) {
    const occupied = { top: false, bottom: false };
    for (const cUid of part.childUids) {
      const c = rocket.parts.get(cUid);
      if (c && (c.node === 'top' || c.node === 'bottom')) occupied[c.node] = true;
    }
    if (part.def.attach.top && !occupied.top && partDef.attach.bottom) {
      points.push({ x: part.localPos.x, y: part.localPos.y + part.halfH, kind: 'stack' });
    }
    if (part.def.attach.bottom && !occupied.bottom && partDef.attach.top) {
      points.push({ x: part.localPos.x, y: part.localPos.y - part.halfH, kind: 'stack' });
    }
    if (part.def.attach.radialHost && partDef.attach.sides) {
      points.push({ x: part.localPos.x + part.halfW, y: part.localPos.y, kind: 'radial' });
      points.push({ x: part.localPos.x - part.halfW, y: part.localPos.y, kind: 'radial' });
    }
  }
  return points;
}

// Finds the part instance nearest to a world position (for select/delete), within a radius.
function findPartNear(rocket, worldX, worldY, radiusMeters) {
  let best = null, bestD = Infinity;
  for (const part of rocket.partList) {
    const dx = worldX - part.localPos.x, dy = worldY - part.localPos.y;
    const halfDiag = Math.hypot(part.halfW, part.halfH);
    const d = Math.hypot(dx, dy);
    if (d < Math.max(halfDiag, radiusMeters) && d < bestD) { best = part; bestD = d; }
  }
  return best;
}
  return { findBestAttachPoint, listAttachPoints, findPartNear };
})();

const StorageModule = (() => {
function safeParse(json, fallback) {
  try {
    const v = JSON.parse(json);
    return v === null || v === undefined ? fallback : v;
  } catch (e) {
    return fallback;
  }
}

function read(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw == null) return fallback;
    return safeParse(raw, fallback);
  } catch (e) {
    return fallback;
  }
}

function write(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    console.warn('Storage write failed', key, e);
    return false;
  }
}

const Storage = {
  // ---- Blueprints -------------------------------------------------
  getBlueprints() {
    return read(ConstantsModule.STORAGE_KEYS.BLUEPRINTS, []);
  },
  saveBlueprint(bp) {
    const list = Storage.getBlueprints();
    const idx = list.findIndex(b => b.id === bp.id);
    if (idx >= 0) list[idx] = bp; else list.push(bp);
    write(ConstantsModule.STORAGE_KEYS.BLUEPRINTS, list);
    return bp;
  },
  deleteBlueprint(id) {
    const list = Storage.getBlueprints().filter(b => b.id !== id);
    write(ConstantsModule.STORAGE_KEYS.BLUEPRINTS, list);
  },
  getBlueprint(id) {
    return Storage.getBlueprints().find(b => b.id === id) || null;
  },

  // ---- Challenges ---------------------------------------------------
  getChallengeProgress() {
    return read(ConstantsModule.STORAGE_KEYS.CHALLENGES, {});
  },
  setChallengeComplete(id, data = {}) {
    const progress = Storage.getChallengeProgress();
    progress[id] = { done: true, completedAt: Date.now(), ...data };
    write(ConstantsModule.STORAGE_KEYS.CHALLENGES, progress);
    return progress;
  },

  // ---- Settings -------------------------------------------------------
  getSettings() {
    return read(ConstantsModule.STORAGE_KEYS.SETTINGS, { sfx: true, music: false, showTips: true });
  },
  saveSettings(s) {
    write(ConstantsModule.STORAGE_KEYS.SETTINGS, s);
  },
};

function uid(prefix = 'id') {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
}
  return { Storage, uid };
})();

const CelestialBodyModule = (() => {
// A CelestialBody is a star/planet/moon that follows a fixed circular orbit
// around its parent (analytic, so it never drifts or destabilizes) and has
// its own gravity well / optional atmosphere / optional solid surface.
class CelestialBody {
  constructor(opts) {
    this.id = opts.id;
    this.name = opts.name;
    this.parent = opts.parent || null;       // CelestialBody or null (root/star)
    this.children = [];

    this.mass = opts.mass;                    // kg
    this.mu = ConstantsModule.G * this.mass;                  // standard gravitational parameter
    this.radius = opts.radius;                // m, surface/cloud-top radius

    this.orbitRadius = opts.orbitRadius || 0;  // m, distance from parent (circular)
    this.startAngle = opts.startAngle || 0;    // rad, phase at t=0
    this.orbitPeriod = this.orbitRadius > 0 && this.parent
      ? Vector2Module.TAU * Math.sqrt((this.orbitRadius ** 3) / this.parent.mu)
      : Infinity;
    this.angularVelocity = this.orbitPeriod > 0 && isFinite(this.orbitPeriod) ? Vector2Module.TAU / this.orbitPeriod : 0;

    this.rotationPeriod = opts.rotationPeriod || 0; // s, for spin (surface launch velocity + rendering)
    this.rotationDir = opts.rotationDir ?? 1;

    // Atmosphere: exponential density model. 0 height = airless body.
    this.atmosphereHeight = opts.atmosphereHeight || 0;
    this.seaLevelDensity = opts.seaLevelDensity || 0;
    this.scaleHeight = opts.scaleHeight || 1;

    this.hasSurface = opts.hasSurface !== false; // false = gas giant, crash-only, no landing
    this.color = opts.color || '#888';
    this.shadeColor = opts.shadeColor || '#444';
    this.atmoColor = opts.atmoColor || null;

    // Simple deterministic terrain: radius perturbation = sum of sine octaves.
    this.terrainAmplitude = opts.terrainAmplitude || 0;
    this.terrainSeed = opts.terrainSeed || 1;

    // Optional flat launch/landing pad: terrain amplitude fades to 0 near
    // padAngle so a low-thrust rocket's first tiny liftoff step can never be
    // out-paced by high-frequency terrain noise (a real pad is graded flat).
    this.padAngle = opts.padAngle;
    this.padFlatHalfWidth = opts.padFlatHalfWidth || 0.02;

    if (this.parent) {
      this.mu = this.mu; // (self mu already computed)
      this.soiRadius = this.orbitRadius > 0
        ? this.orbitRadius * Math.pow(this.mass / this.parent.mass, 2 / 5)
        : Infinity;
      this.parent.children.push(this);
    } else {
      this.soiRadius = Infinity; // star / root: dominant everywhere nothing else claims
    }
  }

  // Terrain radius at a given absolute angle (radians), body-local (ignores rotation
  // for simplicity — terrain is a static bumpy "crust" pattern around the body).
  terrainRadiusAt(angle) {
    if (this.terrainAmplitude <= 0) return this.radius;
    const s = this.terrainSeed;
    const n = Math.sin(angle * 3 + s) * 0.5
            + Math.sin(angle * 7 + s * 2.1) * 0.3
            + Math.sin(angle * 13 + s * 4.7) * 0.2;
    let amplitude = this.terrainAmplitude;
    if (this.padAngle !== undefined) {
      const d = Math.abs(Vector2Module.wrapAngle(angle - this.padAngle));
      const fadeZone = this.padFlatHalfWidth * 4;
      if (d < this.padFlatHalfWidth) amplitude = 0;
      else if (d < fadeZone) amplitude *= (d - this.padFlatHalfWidth) / (fadeZone - this.padFlatHalfWidth);
    }
    return this.radius + n * amplitude;
  }

  // Position of this body's center in absolute world space at time t (seconds).
  positionAt(t, out = new Vector2Module.Vector2()) {
    if (!this.parent) return out.set(0, 0);
    const parentPos = this.parent.positionAt(t);
    const ang = this.startAngle + this.angularVelocity * t;
    out.set(parentPos.x + Math.cos(ang) * this.orbitRadius, parentPos.y + Math.sin(ang) * this.orbitRadius);
    return out;
  }

  // Velocity of this body's center in absolute world space at time t.
  velocityAt(t, out = new Vector2Module.Vector2()) {
    if (!this.parent) return out.set(0, 0);
    const parentVel = this.parent.velocityAt(t);
    const ang = this.startAngle + this.angularVelocity * t;
    const speed = this.angularVelocity * this.orbitRadius;
    out.set(parentVel.x - Math.sin(ang) * speed, parentVel.y + Math.cos(ang) * speed);
    return out;
  }

  // Velocity (world space) of a fixed point on the rotating surface at given absolute angle.
  surfacePointVelocity(t, angle) {
    const base = this.velocityAt(t);
    if (this.rotationPeriod <= 0) return base;
    const spinOmega = (Vector2Module.TAU / this.rotationPeriod) * this.rotationDir;
    const r = this.terrainRadiusAt(angle);
    // tangential direction = angle + 90deg
    const tangent = new Vector2Module.Vector2(Math.cos(angle + Math.PI / 2), Math.sin(angle + Math.PI / 2));
    return base.add(tangent.scale(spinOmega * r));
  }

  surfacePosition(t, angle) {
    const c = this.positionAt(t);
    const r = this.terrainRadiusAt(angle);
    return new Vector2Module.Vector2(c.x + Math.cos(angle) * r, c.y + Math.sin(angle) * r);
  }

  // Atmospheric density at a given altitude above surface (0 if no atmo / above top).
  densityAt(altitude) {
    if (this.atmosphereHeight <= 0 || altitude >= this.atmosphereHeight || altitude < -5000) return 0;
    if (altitude <= 0) return this.seaLevelDensity;
    return this.seaLevelDensity * Math.exp(-altitude / this.scaleHeight);
  }

  surfaceGravity() {
    return this.mu / (this.radius * this.radius);
  }
}
  return { CelestialBody };
})();

const OrbitModule = (() => {
// Classical two-body orbital mechanics helpers, used both for the flight HUD
// (Ap/Pe/period readouts) and for drawing the trajectory ellipse in map view.
// relPos / relVel are position & velocity relative to the dominant body's center.
// Returns null for a degenerate (near-zero) state.
function computeOrbitalElements(relPos, relVel, mu) {
  const r = relPos.length();
  const v = relVel.length();
  if (r < 1 || mu <= 0) return null;

  const energy = (v * v) / 2 - mu / r;
  const a = -mu / (2 * energy); // semi-major axis (negative if hyperbolic)

  const h = relPos.cross(relVel); // specific angular momentum (scalar, 2D)

  // eccentricity vector: e_vec = ((v^2 - mu/r) r_vec - (r . v) v_vec) / mu
  const rdotv = relPos.dot(relVel);
  const ex = ((v * v - mu / r) * relPos.x - rdotv * relVel.x) / mu;
  const ey = ((v * v - mu / r) * relPos.y - rdotv * relVel.y) / mu;
  const e = Math.hypot(ex, ey);

  const isElliptical = e < 1 && a > 0;
  const apoapsis = isElliptical ? a * (1 + e) : Infinity;
  const periapsis = a * (1 - e);
  const period = isElliptical ? 2 * Math.PI * Math.sqrt((a * a * a) / mu) : Infinity;

  // argument of periapsis (angle of eccentricity vector) — used to orient the ellipse
  const argPeriapsis = e > 1e-6 ? Math.atan2(ey, ex) : relPos.angle();

  // true anomaly of current position
  let trueAnomaly = 0;
  if (e > 1e-6) {
    const cosNu = clampCos((ex * relPos.x + ey * relPos.y) / (e * r));
    trueAnomaly = Math.acos(cosNu);
    if (rdotv < 0) trueAnomaly = -trueAnomaly;
  } else {
    trueAnomaly = relPos.angle() - argPeriapsis;
  }

  return {
    a, e, h, apoapsis, periapsis, period, argPeriapsis, trueAnomaly, isElliptical,
    specificEnergy: energy,
    speed: v,
    radius: r,
  };
}

function clampCos(x) { return Math.max(-1, Math.min(1, x)); }

// Sample N points along the orbit ellipse/hyperbola for rendering, relative to body center.
function sampleOrbitPath(elements, segments = 128) {
  const { a, e, argPeriapsis, isElliptical } = elements;
  const pts = [];
  if (isElliptical) {
    for (let i = 0; i <= segments; i++) {
      const nu = (i / segments) * Math.PI * 2;
      const r = (a * (1 - e * e)) / (1 + e * Math.cos(nu));
      const ang = nu + argPeriapsis;
      pts.push(new Vector2Module.Vector2(Math.cos(ang) * r, Math.sin(ang) * r));
    }
  } else {
    // Hyperbolic/escape trajectory: draw a bounded arc around current true anomaly range.
    const nuInf = Math.acos(-1 / e) - 0.05;
    for (let i = 0; i <= segments; i++) {
      const nu = -nuInf + (i / segments) * (2 * nuInf);
      const denom = 1 + e * Math.cos(nu);
      if (Math.abs(denom) < 1e-6) continue;
      const r = (a * (1 - e * e)) / denom;
      if (r < 0 || r > a * -40) continue;
      const ang = nu + argPeriapsis;
      pts.push(new Vector2Module.Vector2(Math.cos(ang) * r, Math.sin(ang) * r));
    }
  }
  return pts;
}
  return { computeOrbitalElements, sampleOrbitPath };
})();

const RocketModule = (() => {
function isSolidFuel(v) { return v.fuelType === 'solid'; }
function isLiquidFuel(v) { return v.fuelType === 'liquid'; }

// A Rocket is a tree of PartInstances (assembled in the builder, flown in
// flight scenes). It owns layout (forward kinematics), mass/COM/inertia
// aggregation, staging, and fuel bookkeeping. Per-frame force integration
// lives in physics/FlightPhysics.js, which reads/writes this object.
class Rocket {
  constructor(name = 'Untitled Rocket') {
    this.id = StorageModule.uid('rocket');
    this.name = name;
    this.parts = new Map();       // uid -> instance
    this.rootUid = null;
    this.stages = [];             // array of arrays of uids; index 0 fires first
    this.currentStageIndex = 0;

    // Flight-only runtime state (meaningless until launched)
    this.position = { x: 0, y: 0 };
    this.velocity = { x: 0, y: 0 };
    this.angle = 0;               // world-space radians, 0 = facing +X
    this.angularVelocity = 0;
    this.throttle = 0;
    this.destroyed = false;
    this.landed = false;
    this.landedBodyId = null;
    this.landedAngle = null;        // persistent angular position on landedBodyId (see FlightPhysics)
    this._liftoffGrace = 0; // s remaining where ground contact isn't re-tested (see FlightPhysics)
  }

  // ---------------------------------------------------------- tree ops
  addPart(defId, parentUid, node, offsetAlongParent = 0, flipped = false) {
    const def = PartDefsModule.getPartDef(defId);
    const uid = StorageModule.uid('p');
    const inst = {
      uid, defId, def,
      parentUid: parentUid || null,
      node: parentUid ? node : null,
      offsetAlongParent, flipped,
      childUids: [],
      stage: 0,
      symmetryPartnerUid: null,
      localPos: { x: 0, y: 0 }, halfW: def.width / 2, halfH: def.height / 2,
      // runtime
      fuel: def.fuelCapacity || 0,
      fuelCapacity: def.fuelCapacity || 0,
      ignited: false,
      broken: false,
      chuteState: def.isParachute ? 'packed' : undefined,
    };
    this.parts.set(uid, inst);
    if (parentUid) {
      const parent = this.parts.get(parentUid);
      parent.childUids.push(uid);
    } else {
      this.rootUid = uid;
    }
    this.recomputeLayout();
    return uid;
  }

  linkSymmetry(uidA, uidB) {
    const a = this.parts.get(uidA), b = this.parts.get(uidB);
    if (a) a.symmetryPartnerUid = uidB;
    if (b) b.symmetryPartnerUid = uidA;
  }

  removePart(uid) {
    const inst = this.parts.get(uid);
    if (!inst) return [];
    const toRemove = new Set();
    const collect = (start) => {
      const stack = [start];
      while (stack.length) {
        const u = stack.pop();
        if (toRemove.has(u)) continue;
        toRemove.add(u);
        const p = this.parts.get(u);
        if (p) stack.push(...p.childUids);
      }
    };
    collect(uid);
    if (inst.symmetryPartnerUid && this.parts.has(inst.symmetryPartnerUid)) collect(inst.symmetryPartnerUid);

    for (const u of toRemove) {
      const p = this.parts.get(u);
      if (p && p.parentUid) {
        const parent = this.parts.get(p.parentUid);
        if (parent) parent.childUids = parent.childUids.filter(c => c !== u);
      }
      this.parts.delete(u);
    }
    if (toRemove.has(this.rootUid)) this.rootUid = null;
    this.stages = this.stages.map(s => s.filter(u => !toRemove.has(u)));
    this.recomputeLayout();
    return [...toRemove];
  }

  recomputeLayout() {
    if (!this.rootUid) return;
    const root = this.parts.get(this.rootUid);
    if (!root) return;
    root.localPos = { x: 0, y: 0 };
    root.halfW = root.def.width / 2; root.halfH = root.def.height / 2;
    const queue = [root];
    while (queue.length) {
      const p = queue.shift();
      for (const cUid of p.childUids) {
        const c = this.parts.get(cUid);
        if (!c) continue;
        c.halfW = c.def.width / 2; c.halfH = c.def.height / 2;
        if (c.node === 'top') c.localPos = { x: p.localPos.x, y: p.localPos.y + p.halfH + c.halfH };
        else if (c.node === 'bottom') c.localPos = { x: p.localPos.x, y: p.localPos.y - p.halfH - c.halfH };
        else if (c.node === 'left') c.localPos = { x: p.localPos.x - (p.halfW + c.halfW), y: p.localPos.y + c.offsetAlongParent };
        else if (c.node === 'right') c.localPos = { x: p.localPos.x + (p.halfW + c.halfW), y: p.localPos.y + c.offsetAlongParent };
        queue.push(c);
      }
    }
  }

  get partList() { return [...this.parts.values()]; }
  get partCount() { return this.parts.size; }

  // ---------------------------------------------------------- aggregates
  getAggregate() {
    let mass = 0, comX = 0, comY = 0;
    for (const p of this.parts.values()) {
      const m = p.def.mass + (p.fuel || 0);
      mass += m; comX += p.localPos.x * m; comY += p.localPos.y * m;
    }
    if (mass <= 0) return { mass: 0, com: { x: 0, y: 0 }, momentOfInertia: 50 };
    comX /= mass; comY /= mass;
    let I = 0;
    for (const p of this.parts.values()) {
      const m = p.def.mass + (p.fuel || 0);
      const dx = p.localPos.x - comX, dy = p.localPos.y - comY;
      I += m * (dx * dx + dy * dy);
      const r = Math.max(p.halfW, p.halfH);
      I += 0.15 * m * r * r; // own rotational inertia (thin-disk-ish fudge)
    }
    return { mass, com: { x: comX, y: comY }, momentOfInertia: Math.max(I, 50) };
  }

  maxWidth() {
    let w = 0.3;
    for (const p of this.parts.values()) w = Math.max(w, p.def.width);
    return w;
  }

  averageCd() {
    let sum = 0, n = 0;
    for (const p of this.parts.values()) { sum += p.def.cd; n++; }
    return n ? sum / n : 0.3;
  }

  hasNoseConeAtTop() {
    for (const p of this.parts.values()) if (p.def.isNoseCone) return true;
    return false;
  }

  liquidFuelStatus() {
    let fuel = 0, capacity = 0;
    for (const p of this.parts.values()) {
      if (p.def.fuelType === 'liquid') { fuel += p.fuel; capacity += p.fuelCapacity; }
    }
    return { fuel, capacity };
  }

  controlTorqueAvailable() {
    let t = 0;
    for (const p of this.parts.values()) if (p.def.controlTorque) t += p.def.controlTorque;
    return t;
  }

  ignitedEngines() {
    return this.partList.filter(p => p.def.isEngine && p.ignited && !p.broken);
  }

  allEngines() { return this.partList.filter(p => p.def.isEngine); }
  allParachutes() { return this.partList.filter(p => p.def.isParachute); }
  allLandingLegs() { return this.partList.filter(p => p.def.isLandingLeg); }
  allFins() { return this.partList.filter(p => p.def.stabilizer); }

  // ---------------------------------------------------------- staging
  activateStage() {
    if (this.currentStageIndex >= this.stages.length) return { fired: [], detachedRoots: [] };
    const group = this.stages[this.currentStageIndex];
    const detachedRoots = [];
    for (const uid of group) {
      const part = this.parts.get(uid);
      if (!part) continue;
      if (part.def.isEngine) part.ignited = true;
      if (part.def.isParachute) part.chuteState = 'armed';
      if (part.def.isDecoupler) {
        const belowUid = part.childUids[0];
        if (belowUid) detachedRoots.push(belowUid);
      }
    }
    this.currentStageIndex++;
    return { fired: group, detachedRoots };
  }

  hasMoreStages() { return this.currentStageIndex < this.stages.length; }

  detachSubtree(uid) {
    const root = this.parts.get(uid);
    if (!root) return null;
    const collected = [];
    const stack = [uid];
    while (stack.length) {
      const u = stack.pop();
      const p = this.parts.get(u);
      if (!p) continue;
      collected.push(p);
      stack.push(...p.childUids);
    }
    if (root.parentUid) {
      const parent = this.parts.get(root.parentUid);
      if (parent) parent.childUids = parent.childUids.filter(c => c !== uid);
    }
    const collectedUids = new Set(collected.map(p => p.uid));
    for (const p of collected) this.parts.delete(p.uid);
    this.stages = this.stages.map(s => s.filter(u => !collectedUids.has(u)));

    const baseX = root.localPos.x, baseY = root.localPos.y;
    let mass = 0, maxExtent = 0.5;
    for (const p of collected) {
      mass += p.def.mass + (p.fuel || 0);
      const dx = p.localPos.x - baseX, dy = p.localPos.y - baseY;
      maxExtent = Math.max(maxExtent, Math.hypot(dx, dy) + Math.max(p.halfW, p.halfH));
    }
    this.recomputeLayout();
    return { parts: collected, mass, size: maxExtent, anchorLocalPos: { x: baseX, y: baseY } };
  }

  // ---------------------------------------------------------- delta-v estimate (builder stats)
  estimateStageDeltaV() {
    const virtual = new Map();
    for (const [uid, p] of this.parts) {
      virtual.set(uid, {
        uid, parentUid: p.parentUid, childUids: [...p.childUids],
        dryMass: p.def.mass, fuel: p.fuelCapacity || 0, fuelType: p.def.fuelType,
        isEngine: !!p.def.isEngine, thrustVac: p.def.thrustVac, ispVac: p.def.ispVac,
        isDecoupler: !!p.def.isDecoupler,
      });
    }
    const sumMass = () => {
      let m = 0;
      for (const v of virtual.values()) m += v.dryMass + (v.fuel || 0);
      return m;
    };
    const removeSubtree = (startUid) => {
      const stack = [startUid];
      while (stack.length) {
        const u = stack.pop();
        const v = virtual.get(u);
        if (!v) continue;
        stack.push(...v.childUids);
        virtual.delete(u);
      }
    };

    const results = [];
    const ignited = new Set();
    let totalDv = 0;
    for (let s = 0; s < this.stages.length; s++) {
      const group = this.stages[s];
      let detachUid = null;
      for (const uid of group) {
        const v = virtual.get(uid);
        if (!v) continue;
        if (v.isEngine) ignited.add(uid);
        if (v.isDecoupler) { const b = v.childUids[0]; if (b) detachUid = b; }
      }
      const massBefore = sumMass();
      const activeEngines = [...ignited].map(u => virtual.get(u)).filter(Boolean);
      let dv = 0, isp = 0;
      if (activeEngines.length > 0) {
        let totalThrust = 0, totalMassFlow = 0;
        for (const e of activeEngines) {
          totalThrust += e.thrustVac;
          totalMassFlow += e.thrustVac / (e.ispVac * ConstantsModule.G0);
        }
        isp = totalThrust / (totalMassFlow * ConstantsModule.G0);
        const solidOnly = activeEngines.every(e => isSolidFuel(e) || e.fuelType === undefined && false) &&
                           activeEngines.every(e => e.fuelType === 'solid' || virtual.get(e.uid)?.fuel > 0 && e.fuelType === 'solid');
        const anySolid = activeEngines.some(e => e.fuelType === 'solid');
        const allSolid = activeEngines.every(e => e.fuelType === 'solid');
        let fuelPool = 0;
        for (const v of virtual.values()) {
          if (v.fuel <= 0) continue;
          if (allSolid) { if (isSolidFuel(v)) fuelPool += v.fuel; }
          else { if (isLiquidFuel(v)) fuelPool += v.fuel; if (anySolid && isSolidFuel(v)) fuelPool += v.fuel; }
        }
        const massAfter = Math.max(massBefore - fuelPool, massBefore * 0.02);
        dv = isp * ConstantsModule.G0 * Math.log(massBefore / massAfter);
        totalDv += dv;
        for (const v of virtual.values()) {
          if (allSolid) { if (isSolidFuel(v)) v.fuel = 0; }
          else { if (isLiquidFuel(v)) v.fuel = 0; if (anySolid && isSolidFuel(v)) v.fuel = 0; }
        }
      }
      results.push({ stage: s, deltaV: dv, isp, massBefore, engineCount: activeEngines.length });
      if (detachUid) removeSubtree(detachUid);
    }
    return { stages: results, totalDeltaV: totalDv };
  }

  // ---------------------------------------------------------- serialization
  toBlueprint() {
    const parts = [];
    // parent-first ordering
    const visited = new Set();
    const order = [];
    if (this.rootUid) {
      const stack = [this.rootUid];
      while (stack.length) {
        const u = stack.shift ? stack.shift() : stack.pop();
        if (visited.has(u)) continue;
        visited.add(u);
        order.push(u);
        const p = this.parts.get(u);
        if (p) stack.push(...p.childUids);
      }
    }
    for (const uid of order) {
      const p = this.parts.get(uid);
      parts.push({
        uid: p.uid, defId: p.defId, parentUid: p.parentUid, node: p.node,
        offsetAlongParent: p.offsetAlongParent, flipped: p.flipped,
        symmetryPartnerUid: p.symmetryPartnerUid, stage: p.stage,
      });
    }
    return {
      id: this.id, name: this.name, parts,
      stages: this.stages, rootUid: this.rootUid,
      updatedAt: Date.now(),
    };
  }

  static fromBlueprint(bp) {
    const r = new Rocket(bp.name);
    r.id = bp.id;
    const byUid = new Map(bp.parts.map(p => [p.uid, p]));
    const added = new Set();
    const uidRemap = new Map();

    const addOne = (raw) => {
      if (added.has(raw.uid)) return;
      const parentNewUid = raw.parentUid ? uidRemap.get(raw.parentUid) : null;
      if (raw.parentUid && !parentNewUid) return; // parent not added yet
      const newUid = r.addPart(raw.defId, parentNewUid, raw.node, raw.offsetAlongParent || 0, !!raw.flipped);
      uidRemap.set(raw.uid, newUid);
      added.add(raw.uid);
      const inst = r.parts.get(newUid);
      inst.stage = raw.stage || 0;
    };

    let guard = 0;
    while (added.size < bp.parts.length && guard++ < bp.parts.length * bp.parts.length + 5) {
      for (const raw of bp.parts) addOne(raw);
    }
    // relink symmetry using remapped uids
    for (const raw of bp.parts) {
      if (raw.symmetryPartnerUid) {
        const a = uidRemap.get(raw.uid), b = uidRemap.get(raw.symmetryPartnerUid);
        if (a && b) r.linkSymmetry(a, b);
      }
    }
    // rebuild stages using remapped uids
    r.stages = (bp.stages || []).map(group => group.map(u => uidRemap.get(u)).filter(Boolean));
    r.recomputeLayout();
    return r;
  }

  clone() { return Rocket.fromBlueprint(this.toBlueprint()); }

  // Rebuilds a flyable Rocket from parts that were just detached from another
  // craft (used when a jettisoned section carries its own control unit, so it
  // becomes a separate vessel instead of inert debris). Part instances are
  // reused as-is, preserving fuel levels and ignition state; positions are
  // re-centred on the new section's own centre of mass.
  static fromDetachedParts(parts, name = 'Section') {
    if (!parts || !parts.length) return null;
    const r = new Rocket(name);
    let sumMass = 0, cx = 0, cy = 0;
    for (const p of parts) {
      const m = p.def.mass + (p.fuel || 0);
      sumMass += m; cx += p.localPos.x * m; cy += p.localPos.y * m;
    }
    if (sumMass > 1e-9) { cx /= sumMass; cy /= sumMass; } else { cx = 0; cy = 0; }

    const keep = new Set(parts.map(p => p.uid));
    for (const p of parts) {
      p.localPos = { x: p.localPos.x - cx, y: p.localPos.y - cy };
      // Drop links to parts left behind on the parent craft.
      if (p.parentUid && !keep.has(p.parentUid)) { p.parentUid = null; p.node = null; }
      p.childUids = p.childUids.filter(u => keep.has(u));
      r.parts.set(p.uid, p);
    }
    // Root on whichever surviving part has no parent inside this section.
    const rootPart = parts.find(p => !p.parentUid) || parts[0];
    r.rootUid = rootPart.uid;
    // Any staged parts that came along stay usable on the new craft.
    const stageable = parts.filter(p => p.def.isEngine || p.def.isDecoupler || p.def.isParachute);
    r.stages = stageable.map(p => [p.uid]);
    r.currentStageIndex = 0;
    return r;
  }
}
  return { Rocket };
})();

const SolarSystemModule = (() => {
// Builds the game's solar system. Numbers are internally-consistent (real G,
// derived mu/orbital periods/SOI radii) but scaled down from real life so
// that reaching orbit takes realistic-feeling but achievable delta-v with a
// handful of parts, exactly like the real Spaceflight Simulator's approach.
function buildSolarSystem() {
  const bodies = {};

  const sun = new CelestialBodyModule.CelestialBody({
    id: 'sun', name: 'Sol', parent: null,
    mass: 2.0e28, radius: 4.0e7,
    color: '#fff2c4', shadeColor: '#ffb84d',
    rotationPeriod: 200000,
  });
  bodies.sun = sun;

  const vulcan = new CelestialBodyModule.CelestialBody({
    id: 'vulcan', name: 'Vulcan', parent: sun,
    mass: 5.619e21, radius: 2.5e5,

const SolarSystem = buildSolarSystem();

// Walk the body tree to find whichever body's sphere of influence the given
// world position is inside, preferring the deepest (most specific) match —
// e.g. a rocket near Luna is "in Luna's SOI", not just "in Terra's".
function getDominantBody(worldPos, t) {
  let current = SolarSystem.sun;
  outer: while (true) {
    for (const child of current.children) {
      const cpos = child.positionAt(t);
      const d = worldPos.distanceTo(cpos);
      if (d < child.soiRadius) {
        current = child;
        continue outer;
      }
    }
    return current;
  }
}

function getBody(id) {
  return SolarSystem.bodies[id];
}
  return { SolarSystem, getDominantBody, getBody };
})();

const TrajectoryRendererModule = (() => {
// Draws a predicted flight path (from physics/Trajectory.js). Each segment is
// stored relative to the body that dominated during it, and is drawn against
// that body's CURRENT position — so a closed orbit sits still on screen while
// an interplanetary transfer visibly hands off from one body to the next.

const SEGMENT_COLORS = [
  'rgba(120,220,255,0.95)',
  'rgba(150,255,190,0.9)',
  'rgba(255,215,130,0.9)',
  'rgba(255,160,200,0.85)',
  'rgba(200,180,255,0.85)',
];

function drawPredictedPath(ctx, prediction, t, opts = {}, originX = 0, originY = 0) {
  if (!prediction || !prediction.segments.length) return;
  const lineWidth = opts.lineWidth || 1.5;

  prediction.segments.forEach((seg, i) => {
    if (seg.points.length < 2) return;
    const body = SolarSystemModule.getBody(seg.bodyId);
    if (!body) return;
    const bp = body.positionAt(t);
    const cx = bp.x - originX, cy = bp.y - originY;

    ctx.beginPath();
    for (let k = 0; k < seg.points.length; k++) {
      const x = cx + seg.points[k].x, y = cy + seg.points[k].y;
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    if (seg.closed) ctx.closePath();

    ctx.strokeStyle = opts.color || SEGMENT_COLORS[i % SEGMENT_COLORS.length];
    ctx.lineWidth = lineWidth;
    // Later segments are drawn dashed: they're further into the future and
    // more sensitive to any burn you make between now and then.
    ctx.setLineDash(i === 0 ? [] : [lineWidth * 4, lineWidth * 3]);
    ctx.globalAlpha = i === 0 ? 1 : 0.8;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  });

  if (opts.markers === false) return;

  // Apoapsis / periapsis markers on the first (current) segment only.
  const first = prediction.segments[0];
  if (first && first.points.length > 2) {
    const body = SolarSystemModule.getBody(first.bodyId);
    const bp = body.positionAt(t);
    const cx = bp.x - originX, cy = bp.y - originY;
    let apIdx = 0, peIdx = 0, apR = -Infinity, peR = Infinity;
    for (let k = 0; k < first.points.length; k++) {
      const r = first.points[k].length();
      if (r > apR) { apR = r; apIdx = k; }
      if (r < peR) { peR = r; peIdx = k; }
    }
    const ms = opts.markerSize || 4;
    if (first.closed) {
      drawMarker(ctx, cx + first.points[apIdx].x, cy + first.points[apIdx].y, ms, '#ff9d4d', 'Ap', opts);
    }
    drawMarker(ctx, cx + first.points[peIdx].x, cy + first.points[peIdx].y, ms, '#4fd1ff', 'Pe', opts);
  }

  // Encounter / impact markers make the outcome unmistakable.
  let labelSlot = 0;
  for (const ev of prediction.events) {
    const body = SolarSystemModule.getBody(ev.bodyId);
    if (!body) continue;

    if (ev.type === 'soi-enter') {
      // A "ghost" of the target drawn where it will ACTUALLY be at intercept.
      // Without it the outbound leg appears to stop in empty space — the target
      // simply has not arrived at the rendezvous point yet.
      //
      // Critically this must be expressed in the SAME frame the outgoing
      // segment is drawn in (relative to the departure body's *current*
      // position). Using the target's absolute future position instead puts the
      // ghost wherever the departure body will have travelled to by then —
      // hundreds of thousands of km away, right off the screen.
      const fromBody = ev.fromBodyId ? SolarSystemModule.getBody(ev.fromBodyId) : null;
      let gx, gy;
      if (fromBody) {
        const relAtIntercept = body.positionAt(ev.t).sub(fromBody.positionAt(ev.t));
        const anchor = fromBody.positionAt(t);
        gx = anchor.x + relAtIntercept.x - originX;
        gy = anchor.y + relAtIntercept.y - originY;
      } else {
        const future = body.positionAt(ev.t);
        gx = future.x - originX; gy = future.y - originY;
      }
      ctx.beginPath();
      ctx.arc(gx, gy, body.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(88,224,138,0.10)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(88,224,138,0.55)';
      ctx.lineWidth = (opts.lineWidth || 1.5) * 0.8;
      ctx.setLineDash([(opts.lineWidth || 1.5) * 3, (opts.lineWidth || 1.5) * 3]);
      ctx.stroke();
      ctx.setLineDash([]);
      drawMarker(ctx, gx, gy, (opts.markerSize || 4) * 1.15, '#58e08a',
        `${body.name} intercept`, opts, labelSlot++);
      continue;
    }

    const bp = body.positionAt(t);
    const x = bp.x - originX + ev.relPos.x;
    const y = bp.y - originY + ev.relPos.y;
    const ms = (opts.markerSize || 4) * 1.15;
    if (ev.type === 'impact') drawMarker(ctx, x, y, ms, '#ff5c5c', 'Impact', opts, labelSlot++);
  }
}

function drawMarker(ctx, x, y, r, color, label, opts = {}, labelSlot = 0) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = r * 0.35;
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.stroke();

  if (label && opts.labelScale) {
    // Labels are drawn in screen-space units passed by the caller so they stay
    // readable at any zoom (the world transform would otherwise scale them).
    // labelSlot staggers them vertically so co-located markers (an intercept
    // and the impact that follows it) don't print on top of each other.
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(opts.labelScale, -opts.labelScale);
    ctx.font = '600 11px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const dy = labelSlot * 14;
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(4,6,12,0.85)';
    ctx.strokeText(label, 9, dy);
    ctx.fillStyle = color;
    ctx.fillText(label, 9, dy);
    ctx.restore();
  }
}
  return { drawPredictedPath };
})();

const TargetModule = (() => {
// Navigation targeting. A target can be a celestial body (for transfers) or
// another vessel (for rendezvous and docking). Everything downstream — navball
// pips, closest-approach readout, the target-hold autopilot — reads from here.

class TargetSystem {
  constructor() {
    this.kind = null;   // 'body' | 'vessel' | null
    this.bodyId = null;
    this.vessel = null;
  }

  clear() { this.kind = null; this.bodyId = null; this.vessel = null; }

  setBody(id) { this.kind = 'body'; this.bodyId = id; this.vessel = null; }

  setVessel(v) { this.kind = 'vessel'; this.vessel = v; this.bodyId = null; }

  get isSet() {
    if (this.kind === 'vessel') return !!this.vessel && !this.vessel.destroyed;
    return this.kind === 'body' && !!this.bodyId;
  }

  get name() {
    if (this.kind === 'vessel') return this.vessel ? this.vessel.name : '—';
    if (this.kind === 'body') { const b = SolarSystemModule.getBody(this.bodyId); return b ? b.name : '—'; }
    return '—';
  }

  // Absolute world position/velocity of the target at time t.
  stateAt(t) {
    if (this.kind === 'vessel' && this.vessel && !this.vessel.destroyed) {
      return {
        pos: new Vector2Module.Vector2(this.vessel.position.x, this.vessel.position.y),
        vel: new Vector2Module.Vector2(this.vessel.velocity.x, this.vessel.velocity.y),
      };
    }
    if (this.kind === 'body') {
      const b = SolarSystemModule.getBody(this.bodyId);
      if (b) return { pos: b.positionAt(t), vel: b.velocityAt(t) };
    }
    return null;
  }

  // Range and closing rate relative to a vessel. Negative closing rate means
  // you're falling behind, which is the number that actually matters when
  // trying to rendezvous.
  relativeTo(rocket, t) {
    const s = this.stateAt(t);
    if (!s) return null;
    const pos = new Vector2Module.Vector2(rocket.position.x, rocket.position.y);
    const vel = new Vector2Module.Vector2(rocket.velocity.x, rocket.velocity.y);
    const dPos = s.pos.sub(pos);
    const dVel = s.vel.sub(vel);
    const range = dPos.length();
    // Positive = closing. Projection of relative velocity onto the line of sight.
    const closingRate = range > 1e-6 ? dVel.scale(-1).dot(dPos.normalized()) : 0;
    return {
      range, closingRate,
      relVelocity: dVel.scale(-1),      // our velocity as seen from the target
      relSpeed: dVel.length(),
      direction: range > 1e-6 ? dPos.normalized() : new Vector2Module.Vector2(1, 0),
      targetPos: s.pos, targetVel: s.vel,
    };
  }
}

// Cheap closest-approach search: sample the two future paths on a coarse grid
// and refine around the best sample. Exact conic intersection isn't worth it
// here — the vessel's own path is already only a prediction.
function closestApproach(rocket, target, t, horizonSeconds = 6 * 3600) {
  const s = target.stateAt(t);
  if (!s) return null;

  // Two-body relative motion under the dominant body is close enough over the
  // few hours that matter for a rendezvous.
  const sample = (dt) => {
    const a = propagate(rocket.position, rocket.velocity, t, dt);
    const b = target.kind === 'vessel'
      ? propagate(target.vessel.position, target.vessel.velocity, t, dt)
      : (() => { const body = SolarSystemModule.getBody(target.bodyId); return body ? body.positionAt(t + dt) : null; })();
    if (!a || !b) return Infinity;
    return a.distanceTo(b);
  };

  const steps = 90;
  let bestT = 0, bestD = Infinity;
  for (let i = 0; i <= steps; i++) {
    const dt = (i / steps) * horizonSeconds;
    const d = sample(dt);
    if (d < bestD) { bestD = d; bestT = dt; }
  }
  // refine
  let lo = Math.max(0, bestT - horizonSeconds / steps);
  let hi = Math.min(horizonSeconds, bestT + horizonSeconds / steps);
  for (let k = 0; k < 24; k++) {
    const m1 = lo + (hi - lo) / 3, m2 = hi - (hi - lo) / 3;
    if (sample(m1) < sample(m2)) hi = m2; else lo = m1;
  }
  const finalT = (lo + hi) / 2;
  return { time: finalT, distance: sample(finalT) };
}

// Lightweight two-body propagation used only by the closest-approach search.
function propagate(position, velocity, t0, dt) {
  const pos = new Vector2Module.Vector2(position.x, position.y);
  const vel = new Vector2Module.Vector2(velocity.x, velocity.y);
  if (dt <= 0) return pos;
  const steps = Math.min(220, Math.max(6, Math.ceil(dt / 20)));
  const h = dt / steps;
  for (let i = 0; i < steps; i++) {
    const tt = t0 + i * h;
    let ax = 0, ay = 0;
    for (const body of SolarSystemModule.SolarSystem.all) {
      const bp = body.positionAt(tt);
      const ddx = bp.x - pos.x, ddy = bp.y - pos.y;
      const r2 = ddx * ddx + ddy * ddy;
      if (r2 < 1) continue;
      const r = Math.sqrt(r2);
      const a = body.mu / r2;
      ax += (ddx / r) * a; ay += (ddy / r) * a;
    }
    vel.x += ax * h; vel.y += ay * h;
    pos.x += vel.x * h; pos.y += vel.y * h;
  }
  return pos;
}
  return { TargetSystem, closestApproach };
})();

const DockingModule = (() => {
// Docking: two independent vessels latch into a single craft when their
// docking ports meet gently. This is what makes multi-launch missions (fuel
// tankers, station assembly, lunar-orbit rendezvous) possible.

// World-space position of a part, accounting for the vessel's COM-relative
// rendering transform. Must match RocketRenderer.drawRocket exactly or the
// latch would trigger somewhere other than where the port is drawn.
function partWorldPos(rocket, part) {
  const com = rocket.getAggregate().com;
  const local = new Vector2Module.Vector2(part.localPos.x - com.x, part.localPos.y - com.y);
  const rotated = local.rotated(rocket.angle - Math.PI / 2);
  return new Vector2Module.Vector2(rocket.position.x + rotated.x, rocket.position.y + rotated.y);
}

function freeDockingPorts(rocket) {
  return rocket.partList.filter(p => p.def.isDockingPort && !p.docked && !p.broken);
}

/**
 * Looks for a port pair close enough and slow enough to latch.
 * Returns { a, b, portA, portB, distance, relSpeed } or null.
 */
function findDockingPair(vessels) {
  for (let i = 0; i < vessels.length; i++) {
    for (let j = i + 1; j < vessels.length; j++) {
      const a = vessels[i], b = vessels[j];
      if (a.destroyed || b.destroyed) continue;
      const relSpeed = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
      for (const portA of freeDockingPorts(a)) {
        for (const portB of freeDockingPorts(b)) {
          const limit = Math.min(portA.def.dockRadius, portB.def.dockRadius);
          const speedLimit = Math.min(portA.def.dockSpeed, portB.def.dockSpeed);
          if (relSpeed > speedLimit) continue;
          const pa = partWorldPos(a, portA), pb = partWorldPos(b, portB);
          const d = pa.distanceTo(pb);
          if (d <= limit) return { a, b, portA, portB, distance: d, relSpeed };
        }
      }
    }
  }
  return null;
}

/**
 * Merges vessel `b` into vessel `a` at the given port pair, producing one
 * rocket. Returns the surviving vessel (`a`), or null if the merge failed.
 *
 * Momentum is conserved: the combined craft takes the mass-weighted average
 * velocity, so docking never injects or destroys energy.
 */
function dock(a, b, portA, portB) {
  const aggA = a.getAggregate(), aggB = b.getAggregate();
  const massA = Math.max(aggA.mass, 1), massB = Math.max(aggB.mass, 1);

  // Combined velocity from conservation of linear momentum.
  const vx = (a.velocity.x * massA + b.velocity.x * massB) / (massA + massB);
  const vy = (a.velocity.y * massA + b.velocity.y * massB) / (massA + massB);

  // Re-express every part of B in A's local frame. B's parts are laid out in
  // B's own coordinates, so we go local-B -> world -> local-A.
  const comB = aggB.com, comA = aggA.com;
  const rotB = b.angle - Math.PI / 2;
  const rotA = a.angle - Math.PI / 2;

  const mapped = [];
  for (const p of b.partList) {
    const localB = new Vector2Module.Vector2(p.localPos.x - comB.x, p.localPos.y - comB.y);
    const world = localB.rotated(rotB).add(new Vector2Module.Vector2(b.position.x, b.position.y));
    const relToA = world.sub(new Vector2Module.Vector2(a.position.x, a.position.y)).rotated(-rotA);
    mapped.push({ part: p, localPos: { x: relToA.x + comA.x, y: relToA.y + comA.y } });
  }

  // Splice B's parts into A's map. They keep their own parent/child links
  // amongst themselves; the two trees are bridged by the docked port pair so
  // staging and mass aggregation treat the result as one craft.
  for (const m of mapped) {
    const p = m.part;
    p.localPos = m.localPos;
    a.parts.set(p.uid, p);
  }
  portA.docked = portB.uid;
  portB.docked = portA.uid;
  // Record the join so undocking can split the craft again later.
  a.dockedJoints = a.dockedJoints || [];
  a.dockedJoints.push({ portA: portA.uid, portB: portB.uid, addedUids: mapped.map(m => m.part.uid) });

  // Merge staging so B's engines/chutes stay usable from the combined craft.
  for (const group of b.stages) {
    const kept = group.filter(uid => a.parts.has(uid));
    if (kept.length) a.stages.push(kept);
  }

  a.velocity.x = vx; a.velocity.y = vy;
  // Average the spin, mass-weighted, for the same reason as velocity.
  a.angularVelocity = (a.angularVelocity * massA + b.angularVelocity * massB) / (massA + massB);

  b.destroyed = true;   // B no longer exists as an independent vessel
  b.mergedInto = a;
  return a;
}

/**
 * Splits the most recently docked joint back into two vessels.
 * Returns the newly separated vessel, or null if nothing is docked.
 */
function undock(rocket, RocketClass) {
  if (!rocket.dockedJoints || !rocket.dockedJoints.length) return null;
  const joint = rocket.dockedJoints.pop();
  const portA = rocket.parts.get(joint.portA);
  const portB = rocket.parts.get(joint.portB);
  if (portA) portA.docked = null;
  if (portB) portB.docked = null;

  const moving = joint.addedUids.map(uid => rocket.parts.get(uid)).filter(Boolean);
  if (!moving.length) return null;

  const agg = rocket.getAggregate();
  const rot = rocket.angle - Math.PI / 2;

  const other = new RocketClass(`${rocket.name} · Section`);
  // Re-root the separated section on its own first part.
  let sumMass = 0, cx = 0, cy = 0;
  for (const p of moving) {
    const m = p.def.mass + (p.fuel || 0);
    sumMass += m; cx += p.localPos.x * m; cy += p.localPos.y * m;
  }
  cx /= Math.max(sumMass, 1e-9); cy /= Math.max(sumMass, 1e-9);

  for (const p of moving) {
    rocket.parts.delete(p.uid);
    p.localPos = { x: p.localPos.x - cx, y: p.localPos.y - cy };
    other.parts.set(p.uid, p);
  }
  // Reparent anything whose parent stayed behind, so the new tree is valid.
  for (const p of other.partList) {
    if (p.parentUid && !other.parts.has(p.parentUid)) { p.parentUid = null; p.node = null; }
  }
  other.rootUid = other.partList[0] ? other.partList[0].uid : null;
  for (const p of rocket.partList) {
    if (p.parentUid && !rocket.parts.has(p.parentUid)) { p.parentUid = null; p.node = null; }
  }
  if (!rocket.parts.has(rocket.rootUid)) rocket.rootUid = rocket.partList[0] ? rocket.partList[0].uid : null;

  rocket.stages = rocket.stages.map(g => g.filter(uid => rocket.parts.has(uid))).filter(g => g.length);

  // Place the separated section at the world position its COM occupied, then
  // push the two apart gently so they don't immediately re-latch.
  const offset = new Vector2Module.Vector2(cx - agg.com.x, cy - agg.com.y).rotated(rot);
  other.position = { x: rocket.position.x + offset.x, y: rocket.position.y + offset.y };
  const push = offset.length() > 1e-6 ? offset.normalized() : new Vector2Module.Vector2(1, 0);
  const SEP = 0.6; // m/s separation impulse, like a real port's springs
  other.velocity = { x: rocket.velocity.x + push.x * SEP, y: rocket.velocity.y + push.y * SEP };
  rocket.velocity.x -= push.x * SEP; rocket.velocity.y -= push.y * SEP;
  other.angle = rocket.angle;
  other.angularVelocity = rocket.angularVelocity;
  other.landed = rocket.landed;
  other.landedBodyId = rocket.landedBodyId;
  other.landedAngle = rocket.landedAngle;
  other._launched = true;
  // Ports that just separated need a moment before they can latch again.
  other._dockCooldown = 2.5;
  rocket._dockCooldown = 2.5;
  return other;
}
  return { partWorldPos, freeDockingPorts, findDockingPair, dock, undock };
})();

const AudioModule = (() => {
// All sound is synthesized with WebAudio oscillators/noise — no asset files.
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.enabled = StorageModule.Storage.getSettings().sfx !== false;
    this._engineNode = null;
    this._engineGain = null;
  }

  _ensure() {
    if (!this.ctx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new Ctx();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  }

  setEnabled(v) {
    this.enabled = v;
    const s = StorageModule.Storage.getSettings(); s.sfx = v; StorageModule.Storage.saveSettings(s);
    if (!v) this.stopEngineRumble();
  }

  click() { this._blip(660, 0.045, 'square', 0.05); }
  hover() { this._blip(440, 0.02, 'sine', 0.02); }
  success() { this._blip(523, 0.09, 'sine', 0.09); this._blipDelayed(784, 0.14, 0.11, 'sine', 0.09); }
  error() { this._blip(160, 0.14, 'sawtooth', 0.09); }
  stage() { this._noiseBurst(0.18, 0.25); this._blip(200, 0.08, 'square', 0.12); }
  crash() { this._noiseBurst(0.6, 0.35); this._blip(80, 0.5, 'sawtooth', 0.25); }

  _blip(freq, dur, type = 'sine', gainAmt = 0.08) {
    if (!this.enabled) return;
    const ctx = this._ensure();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(gainAmt, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + dur + 0.02);
  }

  _blipDelayed(freq, delay, dur, type, gainAmt) {
    if (!this.enabled) return;
    setTimeout(() => this._blip(freq, dur, type, gainAmt), delay * 1000);
  }

  _noiseBurst(dur = 0.3, gainAmt = 0.2) {
    if (!this.enabled) return;
    const ctx = this._ensure();
    const bufferSize = Math.floor(ctx.sampleRate * dur);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    const src = ctx.createBufferSource(); src.buffer = buffer;
    const gain = ctx.createGain(); gain.gain.value = gainAmt;
    src.connect(gain); gain.connect(ctx.destination);
    src.start();
  }

  startEngineRumble() {
    if (!this.enabled || this._engineNode) return;
    const ctx = this._ensure();
    const bufferSize = ctx.sampleRate * 2;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let last = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      data[i] = last * 3.2;
    }
    const src = ctx.createBufferSource(); src.buffer = buffer; src.loop = true;
    const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 320;
    const gain = ctx.createGain(); gain.gain.value = 0;
    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    src.start();
    this._engineNode = src; this._engineGain = gain;
  }

  setEngineLevel(throttle01) {
    if (!this._engineGain) return;
    const target = this.enabled ? Math.max(0, Math.min(1, throttle01)) * 0.16 : 0;
    this._engineGain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.08);
  }

  stopEngineRumble() {
    if (this._engineNode) { try { this._engineNode.stop(); } catch (e) {} this._engineNode = null; this._engineGain = null; }
  }
}

const AudioSys = new AudioEngine();
  return { AudioSys };
})();

const FlightPhysicsModule = (() => {
const STABILIZER_COEFF = 0.55;

// Gravitational acceleration on a point at `pos` (world m) from `body` at time t.
function gravityAccel(pos, body, t, out = new Vector2Module.Vector2()) {
  const bodyPos = body.positionAt(t);
  const dx = bodyPos.x - pos.x, dy = bodyPos.y - pos.y;
  const r2 = dx * dx + dy * dy;
  const r = Math.sqrt(r2);
  if (r < 1) return out.set(0, 0);
  const a = body.mu / r2;
  return out.set((dx / r) * a, (dy / r) * a);
}

// Summed gravity from EVERY body — not just the dominant one.
//
// This matters more than it looks: each body follows a fixed analytic orbit, so
// Terra is permanently accelerating ~0.037 m/s² sunward. A rocket that only
// felt Terra's pull would not share that acceleration and would drift ~70 km
// per revolution relative to the planet it is supposedly orbiting. Summing all
// bodies keeps vessel and planet falling around the sun together, which is what
// makes orbits actually hold — and it gets slingshots and Lagrange-ish effects
// for free. With a handful of bodies the cost is negligible.
function totalGravityAccel(pos, t, out = new Vector2Module.Vector2()) {
  let ax = 0, ay = 0;
  for (const body of SolarSystemModule.SolarSystem.all) {
    const bp = body.positionAt(t);
    const dx = bp.x - pos.x, dy = bp.y - pos.y;
    const r2 = dx * dx + dy * dy;
    if (r2 < 1) continue;
    const r = Math.sqrt(r2);
    const a = body.mu / r2;
    ax += (dx / r) * a;
    ay += (dy / r) * a;
  }
  return out.set(ax, ay);
}

// Velocity of the local atmosphere (planet surface + spin) at a given world position.
function atmosphereVelocityAt(pos, body, t) {
  const bodyPos = body.positionAt(t);
  const toPos = new Vector2Module.Vector2(pos.x - bodyPos.x, pos.y - bodyPos.y);
  const r = toPos.length();
  const bodyVel = body.velocityAt(t);
  if (body.rotationPeriod <= 0 || r < 1) return bodyVel;
  const omega = (Vector2Module.TAU / body.rotationPeriod) * body.rotationDir;
  const tangent = new Vector2Module.Vector2(-toPos.y / r, toPos.x / r);
  return bodyVel.add(tangent.scale(omega * r));
}

function getAltitude(pos, body, t) {
  const bodyPos = body.positionAt(t);
  const toPos = new Vector2Module.Vector2(pos.x - bodyPos.x, pos.y - bodyPos.y);
  const r = toPos.length();
  const angle = Math.atan2(toPos.y, toPos.x);
  const terrainR = body.terrainRadiusAt(angle);
  return { altitude: r - terrainR, radius: r, angle, terrainR, bodyPos };
}

// Advances a live (launched) rocket by one physics substep `dt` (seconds).
// `t` is absolute simulation time (used to evaluate body positions/velocities).
// `input` = { rotate: -1|0|1, throttleDelta, translateHoldingStill }
function stepRocket(rocket, dt, t, input = {}) {
  if (rocket.destroyed) return { event: null };
  const body = SolarSystemModule.getDominantBody(new Vector2Module.Vector2(rocket.position.x, rocket.position.y), t);
  const agg = rocket.getAggregate();
  const mass = Math.max(agg.mass, 1);
  const com = agg.com; // rocket-local
  const I = agg.momentOfInertia;

  const pos = new Vector2Module.Vector2(rocket.position.x, rocket.position.y);
  const vel = new Vector2Module.Vector2(rocket.velocity.x, rocket.velocity.y);

  // ---------------------------------------------------------- Landed state
  if (rocket.landed) {
    // Pin using the persistent `landedAngle` (fixed relative to the body),
    // NOT an angle re-derived from `rocket.position` against `t`. The body
    // can drift hundreds of meters in absolute space between substeps (fast
    // orbital motion), so re-deriving the angle from a stale position against
    // a newer time produced a wrong angle every single substep — which read
    // as the ship vibrating/bouncing in place even while just sitting still.
    const terrainR = body.terrainRadiusAt(rocket.landedAngle);
    const liftThrustCheck = computeThrustSummary(rocket, body, 0, rocket.throttle);
    const gLocal = body.mu / (terrainR * terrainR);
    if (rocket.throttle > 0 && liftThrustCheck.magnitude > mass * gLocal * 1.02) {
      rocket.landed = false; // liftoff!
      // Ground contact isn't re-tested for a short grace window — otherwise a
      // marginal-TWR craft can toggle landed/airborne every substep (a visible
      // bounce/vibration in place) as each tiny hop fails to clear the ground.
      rocket._liftoffGrace = ConstantsModule.LIFTOFF_GRACE_PERIOD;
    } else {
      const groundPos = body.surfacePosition(t, rocket.landedAngle);
      const groundVel = atmosphereVelocityAt(groundPos, body, t);
      rocket.position.x = groundPos.x; rocket.position.y = groundPos.y;
      rocket.velocity.x = groundVel.x; rocket.velocity.y = groundVel.y;
      rocket.angle = rocket.landedAngle;
      rocket.angularVelocity = 0;
      updateFuelAndParachutes(rocket, body, 0, t, dt, false);
      return { event: null, altitude: 0, body };
    }
  }

  const alt = getAltitude(pos, body, t);

  // ---------------------------------------------------------- Forces
  const gravAcc = totalGravityAccel(pos, t);
  const atmoVel = atmosphereVelocityAt(pos, body, t);
  const relVel = vel.sub(atmoVel);
  const speed = relVel.length();

  const rho = body.densityAt(alt.altitude);
  const area = Math.PI * Math.pow(rocket.maxWidth() / 2, 2);
  let cd = rocket.averageCd();
  if (rocket.hasNoseConeAtTop()) cd *= 0.55;
  // A fairing streamlines everything it shrouds, so the whole stack pays much
  // less drag until it's jettisoned — that trade (mass now vs. drag saved) is
  // the entire reason to carry one.
  const fairing = rocket.partList.find(p => p.def.isFairing && !p.broken);
  if (fairing) cd *= fairing.def.dragMultiplier;

  let dragMag = 0.5 * rho * speed * speed * cd * area * ConstantsModule.DRAG_SCALE;

  // Heat shields only bite when actually presented to the airflow: full effect
  // flying blunt-end-first (retrograde), nothing at all nose-first. That makes
  // "turn retrograde to brake" a real, learnable technique rather than a
  // passive stat bonus.
  if (rho > 0 && speed > 1) {
    const aoa = Vector2Module.wrapAngle(relVel.angle() - rocket.angle);
    const bluntness = Math.max(0, -Math.cos(aoa));
    if (bluntness > 0) {
      for (const hs of rocket.partList) {
        if (!hs.def.isHeatShield || hs.broken) continue;
        const shieldArea = Math.PI * Math.pow(hs.def.width / 2, 2);
        dragMag += 0.5 * rho * speed * speed * hs.def.cd * shieldArea * bluntness * ConstantsModule.DRAG_SCALE;
      }
    }
  }

  let totalDragForce = speed > 1e-6 ? relVel.normalized().scale(-dragMag) : new Vector2Module.Vector2();

  // Parachutes (their own independent drag contribution)
  for (const chute of rocket.allParachutes()) {
    if (chute.chuteState === 'deployed') {
      const cMag = 0.5 * rho * speed * speed * chute.def.deployedCd * chute.def.deployedArea;
      if (speed > 1e-6) totalDragForce = totalDragForce.add(relVel.normalized().scale(-cMag));
    }
  }

  const thrustSummary = computeThrustSummary(rocket, body, alt.altitude, rocket.throttle);
  const thrustForce = Vector2Module.Vector2.fromAngle(rocket.angle, thrustSummary.magnitude);

  const totalForce = gravAcc.scale(mass).add(totalDragForce).add(thrustForce);
  const accel = totalForce.scale(1 / mass);

  // ---------------------------------------------------------- Torque / rotation
  const controlTorque = rocket.controlTorqueAvailable() + thrustSummary.gimbalTorque;
  let angAccel = 0;
  if (input.rotate) angAccel += input.rotate * controlTorque / I;

  const fins = rocket.allFins();
  if (fins.length > 0 && rho > 0 && speed > 3) {
    const velAngle = relVel.angle();
    const aoa = Vector2Module.wrapAngle(velAngle - rocket.angle);
    const q = 0.5 * rho * speed * speed;
    let armSum = 0;
    for (const f of fins) armSum += f.def.finArea * (com.y - f.localPos.y);
    angAccel += STABILIZER_COEFF * q * Math.sin(aoa) * armSum / I;
  }

  // ---------------------------------------------------------- Integrate (semi-implicit Euler)
  vel.addInPlace(accel.scale(dt));
  pos.addInPlace(vel.scale(dt));
  rocket.angularVelocity += angAccel * dt;
  rocket.angularVelocity *= 0.999; // tiny damping to avoid endless micro-spin buildup from numerical noise
  rocket.angle = Vector2Module.wrapAngle(rocket.angle + rocket.angularVelocity * dt);

  rocket.position.x = pos.x; rocket.position.y = pos.y;
  rocket.velocity.x = vel.x; rocket.velocity.y = vel.y;

  updateFuelAndParachutes(rocket, body, thrustSummary, t, dt, true);

  // A rocket is only ever destroyed by an actual hard impact with the ground
  // (checked below) — flying fast, even descending fast, never destroys it
  // while it's still clear of the surface.
  const alt2 = getAltitude(pos, body, t);
  const groundVel2 = atmosphereVelocityAt(pos, body, t);
  const relVel2 = vel.sub(groundVel2);

  // ---------------------------------------------------------- Collision / landing
  if (rocket._liftoffGrace > 0) {
    rocket._liftoffGrace = Math.max(0, rocket._liftoffGrace - dt);
  } else if (alt2.altitude <= 0) {
    const impactSpeed = relVel2.length();
    const outwardAngle = alt2.angle;
    const tilt = Math.abs(Vector2Module.wrapAngle(rocket.angle - outwardAngle));
    const hasLegs = rocket.allLandingLegs().length > 0;
    const threshold = (hasLegs && tilt < ConstantsModule.CRASH_ANGLE_LEGGED) ? ConstantsModule.CRASH_SPEED_LEGGED : ConstantsModule.CRASH_SPEED;

    if (!body.hasSurface || impactSpeed > threshold) {
      rocket.destroyed = true;
      return { event: 'crash', impactSpeed, body, position: pos.clone() };
    } else {
      const groundPos = body.surfacePosition(t, outwardAngle);
      rocket.position.x = groundPos.x; rocket.position.y = groundPos.y;
      rocket.velocity.x = groundVel2.x; rocket.velocity.y = groundVel2.y;
      rocket.angle = outwardAngle;
      rocket.angularVelocity = 0;
      rocket.landed = true;
      rocket.landedAngle = outwardAngle;
      rocket.landedBodyId = body.id;
      return { event: 'landed', impactSpeed, body };
    }
  }

  return { event: null, altitude: alt2.altitude, body };
}

function computeThrustSummary(rocket, body, altitude, throttle) {
  const rho = body.densityAt(altitude);
  const fraction = body.seaLevelDensity > 0 ? Vector2Module.clamp(rho / body.seaLevelDensity, 0, 1) : 0;
  let magnitude = 0, gimbalTorque = 0, massFlowLiquid = 0, massFlowSolid = 0;
  const agg = rocket.getAggregate();
  for (const e of rocket.ignitedEngines()) {
    if (e.broken) continue;
    const fuelOk = e.def.fuelType === 'solid' ? e.fuel > 0 : rocket.liquidFuelStatus().fuel > 0;
    if (!fuelOk) continue;
    const effThrottle = e.def.throttleable ? throttle : 1.0;
    if (effThrottle <= 0) continue;
    const isp = e.def.ispVac + (e.def.ispSea - e.def.ispVac) * fraction;
    const thrust = e.def.thrustVac * effThrottle;
    magnitude += thrust;
    const massFlow = thrust / (isp * ConstantsModule.G0);
    if (e.def.fuelType === 'solid') massFlowSolid += massFlow; else massFlowLiquid += massFlow;
    if (e.def.gimbal > 0) {
      const dist = Math.hypot(e.localPos.x - agg.com.x, e.localPos.y - agg.com.y);
      gimbalTorque += thrust * Math.sin(e.def.gimbal * Math.PI / 180) * dist;
    }
  }
  return { magnitude, gimbalTorque, massFlowLiquid, massFlowSolid };
}

function updateFuelAndParachutes(rocket, body, thrustSummary, t, dt, checkAutoDeploy) {
  if (thrustSummary && (thrustSummary.massFlowLiquid > 0)) {
    let demand = thrustSummary.massFlowLiquid * dt;
    const tanks = rocket.partList.filter(p => p.def.fuelType === 'liquid' && p.fuel > 0);
    const total = tanks.reduce((s, p) => s + p.fuel, 0);
    if (total > 0) {
      for (const tk of tanks) {
        const draw = demand * (tk.fuel / total);
        tk.fuel = Math.max(0, tk.fuel - draw);
      }
    }
  }
  if (thrustSummary && thrustSummary.massFlowSolid > 0) {
    let demand = thrustSummary.massFlowSolid * dt;
    const srbs = rocket.partList.filter(p => p.def.fuelType === 'solid' && p.ignited && p.fuel > 0);
    const total = srbs.reduce((s, p) => s + p.fuel, 0);
    if (total > 0) {
      for (const s of srbs) {
        const draw = demand * (s.fuel / total);
        s.fuel = Math.max(0, s.fuel - draw);
      }
    }
  }
  // Flame out engines with no fuel left
  for (const e of rocket.ignitedEngines()) {
    if (e.def.fuelType === 'solid') { if (e.fuel <= 0) e.ignited = false; }
    else { if (rocket.liquidFuelStatus().fuel <= 0) e.ignited = false; }
  }

  if (!checkAutoDeploy) return;
  const alt = getAltitude(new Vector2Module.Vector2(rocket.position.x, rocket.position.y), body, t);
  const relVel = new Vector2Module.Vector2(rocket.velocity.x, rocket.velocity.y).sub(atmosphereVelocityAt(new Vector2Module.Vector2(rocket.position.x, rocket.position.y), body, t));
  const speed = relVel.length();
  const radialOut = new Vector2Module.Vector2(Math.cos(alt.angle), Math.sin(alt.angle));
  const descending = relVel.dot(radialOut) < 0;
  for (const chute of rocket.allParachutes()) {
    if (chute.chuteState === 'armed' && body.densityAt(alt.altitude) > 0 && descending && alt.altitude < chute.def.deployAltitudeAuto) {
      if (speed > 320) { chute.chuteState = 'torn'; }
      else chute.chuteState = 'deployed';
    } else if (chute.chuteState === 'deployed' && speed > 320) {
      chute.chuteState = 'torn';
    }
  }
}

// Simple free-body step for jettisoned debris clusters (no thrust/control/staging).
function stepDebris(deb, dt, t) {
  const body = SolarSystemModule.getDominantBody(new Vector2Module.Vector2(deb.position.x, deb.position.y), t);
  if (deb.landed) {
    // Same fix as the rocket: pin using the persistent landedAngle, not one
    // re-derived from a stale position against a newer (body-has-since-moved) time.
    const gp = body.surfacePosition(t, deb.landedAngle);
    deb.position.x = gp.x; deb.position.y = gp.y;
    return { body };
  }
  const pos = new Vector2Module.Vector2(deb.position.x, deb.position.y);
  const vel = new Vector2Module.Vector2(deb.velocity.x, deb.velocity.y);
  const alt = getAltitude(pos, body, t);
  const gravAcc = totalGravityAccel(pos, t);
  const atmoVel = atmosphereVelocityAt(pos, body, t);
  const relVel = vel.sub(atmoVel);
  const speed = relVel.length();
  const rho = body.densityAt(alt.altitude);
  const area = Math.PI * Math.pow(deb.size / 2, 2) * 0.5;
  const dragMag = 0.5 * rho * speed * speed * 0.8 * area;
  const dragForce = speed > 1e-6 ? relVel.normalized().scale(-dragMag) : new Vector2Module.Vector2();
  const accel = gravAcc.add(dragForce.scale(1 / Math.max(deb.mass, 1)));
  vel.addInPlace(accel.scale(dt));
  pos.addInPlace(vel.scale(dt));
  deb.position.x = pos.x; deb.position.y = pos.y;
  deb.velocity.x = vel.x; deb.velocity.y = vel.y;
  deb.angularVelocity = deb.angularVelocity || (Math.random() - 0.5) * 0.6;
  deb.angle = (deb.angle || 0) + deb.angularVelocity * dt;

  const alt2 = getAltitude(pos, body, t);
  if (alt2.altitude <= 0) {
    deb.landed = true;
    deb.landedAngle = alt2.angle;
    const gp = body.surfacePosition(t, alt2.angle);
    const gv = atmosphereVelocityAt(gp, body, t);
    deb.position.x = gp.x; deb.position.y = gp.y;
    deb.velocity.x = gv.x; deb.velocity.y = gv.y;
  }
  return { body };
}
  return { totalGravityAccel, getAltitude, stepRocket, stepDebris, gravityAccel, atmosphereVelocityAt };
})();

const TrajectoryModule = (() => {
// Forward-propagates the vessel's future path so the player can SEE where they
// will actually end up — including sphere-of-influence handoffs ("you will
// encounter Luna") and surface impacts. Without this, any trip beyond your
// current body is blind guesswork.
//
// The propagation deliberately reuses the live force model from
// FlightPhysics (`totalGravityAccel`, summed over every body). Because the
// prediction and the simulation share the same function, the drawn path is
// what actually happens — drag and thrust excluded, so the line shows where
// you're headed if you cut the engines now.
//
// Output is a list of segments, each expressed RELATIVE to the body that
// dominates during that stretch. Rendering relative-to-body is what makes a
// closed orbit sit still on screen instead of smearing into a spiral as the
// parent body sweeps around the sun.

const MAX_ANGLE_STEP = 0.016;   // rad of arc swept per integration step
const MIN_DT = 0.05;            // s
const MAX_DT = 12000;           // s
const MAX_STEPS = 24000;
const MAX_POINTS_PER_SEGMENT = 420;
const MAX_SEGMENTS = 5;

const _accA = new Vector2Module.Vector2();
const _accB = new Vector2Module.Vector2();

/**
 * @param {{x,y}} position    absolute world position
 * @param {{x,y}} velocity    absolute world velocity
 * @param {number} t0         absolute sim time to start from
 * @param {object} opts       { maxDuration } seconds of future to predict
 * @returns {{segments: Array, events: Array, truncated: boolean}}
 *   segments[i] = { bodyId, points: Vector2[] (relative to body), closed: bool }
 *   events[i]   = { type: 'soi-enter'|'soi-exit'|'impact', bodyId, t, relPos }
 */
function predictTrajectory(position, velocity, t0, opts = {}) {
  const maxDuration = opts.maxDuration ?? 60 * 60 * 24 * 30; // 30 days default horizon

  const pos = new Vector2Module.Vector2(position.x, position.y);
  const vel = new Vector2Module.Vector2(velocity.x, velocity.y);

  let t = t0;
  let body = SolarSystemModule.getDominantBody(pos, t);

  const segments = [];
  const events = [];
  let seg = { bodyId: body.id, points: [], closed: false, tStart: t };
  let stepsInSeg = 0;
  let pointStride = 1;
  let truncated = false;

  // Track the starting relative state so we can detect a completed revolution
  // and stop drawing (a closed orbit shouldn't be re-traced forever).
  let startRel = pos.sub(body.positionAt(t));
  let sweptAngle = 0;
  let prevRelAngle = startRel.angle();

  const pushPoint = (rel) => {
    if (seg.points.length >= MAX_POINTS_PER_SEGMENT) {
      // Thin out: keep every other point so the segment keeps its full extent
      // at half resolution rather than simply stopping mid-orbit.
      seg.points = seg.points.filter((_, i) => i % 2 === 0);
      pointStride *= 2;
    }
    seg.points.push(rel);
  };

  pushPoint(startRel.clone());

  for (let step = 0; step < MAX_STEPS; step++) {
    const bodyPos = body.positionAt(t);
    const rel = pos.sub(bodyPos);
    const r = rel.length();
    if (r < 1) break;

    const relVel = vel.sub(body.velocityAt(t));
    const speed = relVel.length();

    // Adaptive step: bound the arc swept per step so tight periapsis passes
    // stay accurate while long slow apoapsis coasts don't burn thousands of steps.
    const angularRate = Math.abs(rel.cross(relVel)) / (r * r);
    let dt = angularRate > 1e-12 ? MAX_ANGLE_STEP / angularRate : MAX_DT;
    if (speed > 1e-6) dt = Math.min(dt, (r * 0.02) / speed + MIN_DT);
    dt = Math.max(MIN_DT, Math.min(MAX_DT, dt));
    if (t - t0 + dt > maxDuration) { truncated = true; break; }

    // Velocity-Verlet keeps eccentric orbits from spiralling the way plain
    // Euler does over long horizons.
    const a1 = FlightPhysicsModule.totalGravityAccel(pos, t, _accA);
    pos.x += vel.x * dt + 0.5 * a1.x * dt * dt;
    pos.y += vel.y * dt + 0.5 * a1.y * dt * dt;
    const a2 = FlightPhysicsModule.totalGravityAccel(pos, t + dt, _accB);
    vel.x += 0.5 * (a1.x + a2.x) * dt;
    vel.y += 0.5 * (a1.y + a2.y) * dt;
    t += dt;
    stepsInSeg++;

    const newBodyPos = body.positionAt(t);
    const newRel = pos.sub(newBodyPos);
    const newR = newRel.length();

    // ---- surface impact -------------------------------------------------
    const terrainR = body.terrainRadiusAt(newRel.angle());
    if (newR <= terrainR) {
      pushPoint(newRel.clone());
      events.push({ type: 'impact', bodyId: body.id, t, relPos: newRel.clone() });
      break;
    }

    // ---- sphere-of-influence handoff -------------------------------------
    const nowBody = SolarSystemModule.getDominantBody(pos, t);
    if (nowBody !== body) {
      const exitRel = newRel.clone();
      seg.tEnd = t;
      segments.push(seg);
      events.push({
        type: nowBody.parent === body ? 'soi-enter' : 'soi-exit',
        bodyId: nowBody.id, fromBodyId: body.id, t,
        relPos: pos.sub(nowBody.positionAt(t)),
      });
      if (segments.length >= MAX_SEGMENTS) { truncated = true; seg = null; break; }
      body = nowBody;
      seg = { bodyId: body.id, points: [], closed: false, tStart: t };
      stepsInSeg = 0;
      pointStride = 1;
      startRel = pos.sub(body.positionAt(t));
      prevRelAngle = startRel.angle();
      sweptAngle = 0;
      pushPoint(startRel.clone());
      continue;
    }

    if (stepsInSeg % pointStride === 0) pushPoint(newRel.clone());

    // ---- closed-revolution detection --------------------------------------
    const relAngle = newRel.angle();
    let d = relAngle - prevRelAngle;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    sweptAngle += d;
    prevRelAngle = relAngle;
    if (Math.abs(sweptAngle) >= Math.PI * 2) {
      seg.closed = true;
      seg.tEnd = t;
      break;
    }
  }

  if (seg && (!seg.tEnd)) seg.tEnd = t;
  if (seg && seg.points.length > 1) segments.push(seg);

  return { segments, events, truncated, endTime: t };
}

// Which body (if any) the path ends up encountering — used for HUD readout.
function encounterSummary(prediction) {
  for (const ev of prediction.events) {
    if (ev.type === 'soi-enter') return ev;
  }
  const impact = prediction.events.find(e => e.type === 'impact');
  return impact || null;
}
  return { predictTrajectory, encounterSummary };
})();

const AutopilotModule = (() => {
// Attitude hold. Manually feathering rotation to stay exactly on prograde
// while also managing throttle and staging is more hands than a player has —
// every game in this genre provides this, and precise burns are impossible
// without it.

const AP_MODES = ['off', 'hold', 'prograde', 'retrograde', 'up', 'down', 'target', 'antitarget'];

// Kept short so they fit the navball-width button grid without truncating.
const AP_LABELS = {
  off: 'OFF',
  hold: 'HLD',
  prograde: 'PRO',
  retrograde: 'RET',
  up: 'UP',
  down: 'DWN',
  target: 'TGT',
  antitarget: 'ATG',
};

// Proportional gain on angle error -> desired angular rate, and derivative
// gain on rate error -> control command. Tuned to settle without hunting
// across the whole mass range the parts list can produce.
const P_ANGLE = 2.2;
const D_RATE = 3.4;
const MAX_RATE = 0.9; // rad/s ceiling so big ships don't whip around

/**
 * Returns the world-space heading the given mode wants to point at,
 * or null if the mode has no meaningful target right now.
 */
function autopilotTargetAngle(mode, rocket, body, t, targetSystem = null) {
  const pos = new Vector2Module.Vector2(rocket.position.x, rocket.position.y);
  const bodyPos = body.positionAt(t);
  const radialOut = pos.sub(bodyPos).angle();

  if (mode === 'up') return radialOut;
  if (mode === 'down') return Vector2Module.wrapAngle(radialOut + Math.PI);

  if (mode === 'target' || mode === 'antitarget') {
    if (!targetSystem || !targetSystem.isSet) return null;
    const rel = targetSystem.relativeTo(rocket, t);
    if (!rel || rel.range < 0.5) return null;
    const bearing = rel.direction.angle();
    return mode === 'target' ? bearing : Vector2Module.wrapAngle(bearing + Math.PI);
  }

  if (mode === 'prograde' || mode === 'retrograde') {
    // Surface-relative velocity is the meaningful reference low down (it's what
    // drag and landing care about); it converges to orbital velocity up high
    // where the atmosphere co-rotation term vanishes.
    const relVel = new Vector2Module.Vector2(rocket.velocity.x, rocket.velocity.y)
      .sub(FlightPhysicsModule.atmosphereVelocityAt(pos, body, t));
    if (relVel.length() < 0.6) return null; // too slow for a stable direction
    return mode === 'prograde' ? relVel.angle() : Vector2Module.wrapAngle(relVel.angle() + Math.PI);
  }

  return null; // 'hold' has no external target — see computeAutopilotCommand
}

/**
 * PD controller producing a rotation command in [-1, 1] to feed
 * FlightPhysics.stepRocket's `input.rotate`.
 */
function computeAutopilotCommand(mode, rocket, body, t, targetSystem = null) {
  if (!mode || mode === 'off') return 0;

  if (mode === 'hold') {
    // Pure rate damping: cancel any tumble, keep whatever heading you have.
    return clamp(-rocket.angularVelocity * D_RATE, -1, 1);
  }

  const target = autopilotTargetAngle(mode, rocket, body, t, targetSystem);
  if (target === null) return clamp(-rocket.angularVelocity * D_RATE, -1, 1);

  const error = Vector2Module.wrapAngle(target - rocket.angle);
  const desiredRate = clamp(error * P_ANGLE, -MAX_RATE, MAX_RATE);
  const rateError = desiredRate - rocket.angularVelocity;
  return clamp(rateError * D_RATE, -1, 1);
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  return { AP_MODES, AP_LABELS, autopilotTargetAngle, computeAutopilotCommand };
})();
