<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SFS &mdash; Spaceflight Simulator</title>
<style>
/* ============================================================
   SFS — Spaceflight Simulator clone — global styles
   ============================================================ */

@font-face {
  font-family: 'SFS-UI';
  src: local('Segoe UI'), local('Helvetica Neue'), local('Arial');
}

:root {
  --bg-dark: #05070d;
  --panel-bg: rgba(14, 18, 28, 0.92);
  --panel-bg-light: rgba(24, 30, 46, 0.92);
  --panel-border: #2b3550;
  --accent: #4fd1ff;
  --accent-dim: #2b7ba1;
  --accent-orange: #ff9d4d;
  --accent-red: #ff5c5c;
  --accent-green: #58e08a;
  --text-main: #e8edf7;
  --text-dim: #8b95ad;
  --font: 'SFS-UI', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'SFMono-Regular', Consolas, 'Courier New', monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg-dark);
  color: var(--text-main);
  font-family: var(--font);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

#game-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: var(--bg-dark);
}

#ui-root {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}

#ui-root > * {
  pointer-events: auto;
}

button {
  font-family: var(--font);
  cursor: pointer;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #3a4560; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #4a5878; }

/* ---------------------------------------------------------- */
/* Generic buttons                                             */
/* ---------------------------------------------------------- */

.btn {
  background: linear-gradient(180deg, #24304a, #161d2e);
  border: 1px solid var(--panel-border);
  color: var(--text-main);
  padding: 10px 18px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.3px;
  transition: all 0.12s ease;
}
.btn:hover { background: linear-gradient(180deg, #303f60, #1c2438); border-color: var(--accent-dim); color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, #1d7fa8, #135873); border-color: var(--accent); color: #eafcff; }
.btn.primary:hover { background: linear-gradient(180deg, #2493c4, #17698a); }
.btn.danger { background: linear-gradient(180deg, #a83030, #732020); border-color: #ff7a7a; }
.btn.danger:hover { background: linear-gradient(180deg, #c23838, #8a2626); }
.btn.big { padding: 14px 30px; font-size: 16px; width: 100%; }
.btn.small { padding: 5px 10px; font-size: 12px; }
.btn.icon { padding: 8px 10px; }
.btn.active { background: linear-gradient(180deg, #1d7fa8, #135873); border-color: var(--accent); color: #fff; }

/* ============================================================
   MAIN MENU
   ============================================================ */

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
}

#main-menu {
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 50% 30%, rgba(40,60,100,0.25), transparent 60%);
}

.menu-title {
  text-align: center;
  margin-bottom: 42px;
}
.menu-title h1 {
  font-size: 64px;
  margin: 0;
  letter-spacing: 6px;
  font-weight: 800;
  background: linear-gradient(180deg, #ffffff, #7fd4ff 70%, #2b7ba1);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 40px rgba(79, 209, 255, 0.35);
}
.menu-title p {
  margin: 6px 0 0;
  color: var(--text-dim);
  letter-spacing: 4px;
  font-size: 13px;
  text-transform: uppercase;
}

.menu-buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 320px;
}

.menu-footer {
  position: absolute;
  bottom: 14px;
  left: 18px;
  color: var(--text-dim);
  font-size: 11px;
  letter-spacing: 0.5px;
}
.menu-version {
  position: absolute;
  bottom: 14px;
  right: 18px;
  color: var(--text-dim);
  font-size: 11px;
}

/* ============================================================
   PANELS (shared card look for lists / dialogs)
   ============================================================ */

.panel {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  backdrop-filter: blur(6px);
}

.overlay-screen {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(4,6,12,0.55);
}

.dialog {
  width: 640px;
  max-width: 92vw;
  max-height: 84vh;
  display: flex;
  flex-direction: column;
  padding: 22px 24px;
}

.dialog-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.dialog-header h2 {
  margin: 0;
  font-size: 20px;
  letter-spacing: 1px;
}

.close-x {
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 22px;
  line-height: 1;
  padding: 4px 8px;
}
.close-x:hover { color: var(--accent-red); }

.list-scroll {
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  padding: 10px 14px;
}
.list-row:hover { border-color: var(--accent-dim); background: rgba(79,209,255,0.05); }
.list-row .row-title { font-weight: 600; font-size: 14px; }
.list-row .row-sub { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
.list-row .row-actions { display: flex; gap: 6px; }

.empty-hint {
  color: var(--text-dim);
  text-align: center;
  padding: 30px 10px;
  font-size: 13px;
  line-height: 1.6;
}

/* ============================================================
   BUILDER (VAB)
   ============================================================ */

#builder-screen {
  flex-direction: row;
}

.builder-topbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  background: var(--panel-bg);
  border-bottom: 1px solid var(--panel-border);
  z-index: 5;
}
.builder-topbar input#rocket-name {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--panel-border);
  color: var(--text-main);
  padding: 7px 12px;
  border-radius: 6px;
  font-size: 14px;
  width: 220px;
}
.builder-topbar .spacer { flex: 1; }

.builder-side {
  position: absolute;
  top: 52px; bottom: 0;
  width: 230px;
  background: var(--panel-bg);
  border-right: 1px solid var(--panel-border);
  overflow-y: auto;
  padding: 10px;
}
/* Left rail pins the search box and scrolls only the part list under it. */
.builder-side.left {
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.palette-list { overflow-y: auto; flex: 1; margin-top: 6px; }
.builder-side.left { left: 0; }
.builder-side.right {
  left: auto; right: 0;
  border-right: none;
  border-left: 1px solid var(--panel-border);
}

.parts-category {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin: 14px 0 8px;
  padding-left: 2px;
}
.parts-category:first-child { margin-top: 2px; }

.part-tile {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 8px;
  border-radius: 8px;
  border: 1px solid transparent;
  margin-bottom: 4px;
}
.part-tile:hover { background: rgba(79,209,255,0.08); border-color: var(--accent-dim); }
.part-tile.selected { background: rgba(79,209,255,0.16); border-color: var(--accent); }
.part-tile canvas { flex-shrink: 0; }
.part-tile .part-info .part-name { font-size: 12.5px; font-weight: 600; }
.part-tile .part-info .part-stat { font-size: 10.5px; color: var(--text-dim); }

.builder-viewport {
  position: absolute;
  top: 52px; bottom: 0;
  left: 230px; right: 230px;
}

.stats-block {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 10px;
  font-size: 12.5px;
}
.stats-block .stat-row { display: flex; justify-content: space-between; padding: 3px 0; color: var(--text-dim); gap: 8px; }
.stats-block .stat-row b { color: var(--text-main); font-weight: 600; text-align: right; }
.stats-block h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); }
.stats-block .stat-row.stat-good b { color: var(--accent-green); }
.stats-block .stat-row.stat-bad b { color: var(--accent-red); }
.stats-block .stat-subhead {
  font-size: 10px; letter-spacing: 0.8px; text-transform: uppercase;
  color: var(--text-dim); margin: 8px 0 2px;
  border-top: 1px solid var(--panel-border); padding-top: 6px;
}
.part-info-block .part-desc {
  font-size: 11.5px; color: var(--text-dim); line-height: 1.5;
  margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--panel-border);
}

.part-search {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--panel-border);
  color: var(--text-main);
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 12.5px;
  font-family: var(--font);
  margin-bottom: 4px;
}
.part-search:focus { outline: none; border-color: var(--accent); }
.part-search::placeholder { color: var(--text-dim); }

.stage-list {
  display: flex;
  flex-direction: column-reverse;
  gap: 6px;
}
.stage-group {
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  padding: 6px 8px;
  background: rgba(255,255,255,0.02);
}
.stage-group .stage-label { font-size: 10.5px; color: var(--accent-orange); font-weight: 700; margin-bottom: 4px; letter-spacing: 0.5px; }
.stage-part-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(255,255,255,0.06);
  border-radius: 5px;
  padding: 3px 7px;
  margin: 2px 3px 2px 0;
  font-size: 11px;
}

.builder-hint {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--text-dim);
  font-size: 11.5px;
  background: rgba(0,0,0,0.35);
  padding: 6px 14px;
  border-radius: 20px;
  white-space: nowrap;
}

.symmetry-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-dim);
}

/* ============================================================
   FLIGHT HUD
   ============================================================ */

#flight-hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
#flight-hud * { pointer-events: auto; }

.hud-top-left {
  position: absolute;
  top: 12px; left: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 200px;
}
.hud-panel {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12.5px;
}
.hud-panel .hud-row { display: flex; justify-content: space-between; gap: 14px; padding: 2px 0; }
.hud-panel .hud-row .k { color: var(--text-dim); }
.hud-panel .hud-row .v { font-weight: 700; font-variant-numeric: tabular-nums; }
.hud-panel .hud-row .v.warn { color: var(--accent-orange); }
.hud-panel .hud-row .v.danger { color: var(--accent-red); }
.hud-panel .hud-row .v.good { color: var(--accent-green); }

.hud-top-right {
  position: absolute;
  top: 12px; right: 12px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}

.hud-bottom-center {
  position: absolute;
  bottom: 14px; left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: flex-end;
  gap: 16px;
}

.throttle-widget {
  width: 34px;
  height: 130px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  position: relative;
  overflow: hidden;
}
.throttle-fill {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(0deg, var(--accent-orange), #ffd24d);
  transition: height 0.05s linear;
}
.throttle-label {
  position: absolute;
  top: -18px; left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: var(--text-dim);
  white-space: nowrap;
}

.stage-btn {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ff8a4d, #a83a1c 75%);
  border: 3px solid #ffbb8a;
  color: #fff;
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.5px;
  box-shadow: 0 4px 18px rgba(255,90,20,0.35);
}
.stage-btn:active { transform: scale(0.95); }

.warp-widget {
  display: flex;
  gap: 4px;
  align-items: center;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12px;
}
.warp-widget .warp-tick {
  width: 5px; height: 12px;
  background: #333e58;
  border-radius: 1px;
}
.warp-widget .warp-tick.active { background: var(--accent); }

.navball-wrap {
  position: absolute;
  bottom: 14px; right: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.navball-wrap canvas {
  display: block;
  filter: drop-shadow(0 4px 14px rgba(0,0,0,0.55));
}

.ap-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  width: 168px;
}
.ap-btn {
  padding: 4px 2px;
  font-size: 10px;
  letter-spacing: 0.2px;
  text-align: center;
  min-width: 0;      /* let grid tracks shrink the buttons instead of overflowing */
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-msg-center {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: 3px;
  text-shadow: 0 0 30px rgba(0,0,0,0.8);
  opacity: 0;
  transition: opacity 0.3s ease;
}
.hud-msg-center.show { opacity: 1; }
.hud-msg-center.crash { color: var(--accent-red); }
.hud-msg-center.success { color: var(--accent-green); }

.action-buttons-left {
  position: absolute;
  bottom: 14px; left: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.top-center-controls {
  position: absolute;
  top: 12px; left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
}

.map-toggle-btn {
  position: absolute;
  top: 12px; right: 12px;
}

/* Challenge toast during flight */
.challenge-toast {
  position: absolute;
  top: 70px; left: 50%;
  transform: translateX(-50%);
  background: var(--panel-bg);
  border: 1px solid var(--accent-green);
  color: var(--accent-green);
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 13px;
  opacity: 0;
  transition: opacity 0.4s, transform 0.4s;
  pointer-events: none;
}
.challenge-toast.show { opacity: 1; transform: translateX(-50%) translateY(6px); }

/* ============================================================
   MAP VIEW
   ============================================================ */

#map-hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
#map-hud * { pointer-events: auto; }

.map-legend {
  position: absolute;
  bottom: 14px; left: 14px;
}
.map-body-label {
  position: absolute;
  font-size: 11px;
  color: var(--text-dim);
  transform: translate(8px, -6px);
  white-space: nowrap;
}

/* ============================================================
   CHALLENGES
   ============================================================ */

.challenge-card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  padding: 14px;
}
.challenge-card.done { border-color: var(--accent-green); background: rgba(88,224,138,0.06); }
.challenge-check {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 2px solid var(--panel-border);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  margin-top: 2px;
}
.challenge-card.done .challenge-check {
  border-color: var(--accent-green);
  background: var(--accent-green);
  color: #04150a;
}
.challenge-card .challenge-name { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
.challenge-card .challenge-desc { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
.challenge-card .challenge-reward { font-size: 11px; color: var(--accent-orange); margin-top: 4px; }

/* ============================================================
   TOASTS
   ============================================================ */

#toast-root {
  position: fixed;
  top: 18px; left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
}
.toast {
  background: rgba(10,14,22,0.95);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  padding: 10px 18px;
  font-size: 13px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  animation: toast-in 0.25s ease;
}
@keyframes toast-in {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   SETTINGS
   ============================================================ */

.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 4px;
  border-bottom: 1px solid var(--panel-border);
}
.settings-row:last-child { border-bottom: none; }
.settings-row .settings-label { font-size: 13.5px; font-weight: 600; }
.settings-row .settings-sub { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

.toggle-switch {
  width: 44px; height: 24px;
  background: #263149;
  border-radius: 12px;
  position: relative;
  border: 1px solid var(--panel-border);
  flex-shrink: 0;
}
.toggle-switch .knob {
  position: absolute;
  top: 2px; left: 2px;
  width: 18px; height: 18px;
  background: var(--text-dim);
  border-radius: 50%;
  transition: all 0.15s ease;
}
.toggle-switch.on { background: var(--accent-dim); }
.toggle-switch.on .knob { left: 22px; background: var(--accent); }

/* ============================================================
   MISC
   ============================================================ */

.back-btn {
  position: absolute;
  top: 12px; left: 12px;
}

.fade-in { animation: fadein 0.2s ease; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

.hidden { display: none !important; }

.site-picker {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.site-card {
  width: 150px;
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  padding: 12px;
  background: rgba(255,255,255,0.03);
  text-align: center;
}
.site-card:hover { border-color: var(--accent); background: rgba(79,209,255,0.06); }
.site-card .site-swatch {
  width: 100%; height: 60px;
  border-radius: 8px;
  margin-bottom: 8px;
}
.site-card .site-name { font-weight: 700; font-size: 13px; }
.site-card .site-sub { font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }
</style>
</head>

<a href="../../index.html" title="Back to Arcade" style="position:fixed;top:10px;left:10px;z-index:2147483647;display:flex;align-items:center;justify-content:center;width:26px;height:26px;background:rgba(0,0,0,0.6);color:#fff;font:14px/1 system-ui,-apple-system,sans-serif;border-radius:50%;text-decoration:none;opacity:0.4;transition:opacity .15s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.4">&larr;</a>
  <canvas id="game-canvas"></canvas>

  <div id="ui-root">

  <div id="toast-root"></div>

  <script>
const ConstantsModule = (() => {
// Global physical & gameplay constants.
const G = 6.674e-11;          // real gravitational constant, m^3 kg^-1 s^-2
const G0 = 9.80665;           // standard gravity, used for ISP -> exhaust velocity conversion

// Simulation tuning
const PHYSICS_SUBSTEPS_PER_FRAME = 4;   // base substeps at 1x warp
const MAX_DT = 1 / 20;                  // clamp huge frame deltas (tab switch etc.)
const CRASH_SPEED = 9;                  // m/s impact speed above which (without legs) a part breaks
const CRASH_SPEED_LEGGED = 8.5;         // m/s impact speed a landing leg can absorb
const CRASH_ANGLE_LEGGED = 35 * Math.PI / 180; // max tilt from vertical for a safe leg landing

// A rocket that has just lifted off (thrust barely above weight) won't be
// re-tested for ground contact for this long — without it, a marginal-TWR
// craft can toggle landed/airborne every physics substep (a visible "bounce"
// in place) as a one-frame hop repeatedly fails to clear the ground.
const LIFTOFF_GRACE_PERIOD = 0.35; // s

// Body-frame drag is scaled down from a "pure" Cd*A*0.5*rho*v^2 model — full
// realism there makes ascents punishingly fuel-hungry for 2D open-loop flight
// (no 3D banking/lift to manage energy). This keeps atmospheric flight feeling
// weighty and real without requiring frame-perfect gravity-turn piloting.
const DRAG_SCALE = 0.42;

const WARP_LEVELS = [1, 5, 10, 50, 100, 500];

const LAUNCH_ANGLE = Math.PI / 2; // Terra launch pad position (world angle, "north pole")

const BUILD_GRID = 8; // px snap grid at 1x zoom in builder (visual only, attachment uses node snapping)

const STORAGE_KEYS = {
  BLUEPRINTS: 'sfs.blueprints.v1',
  CHALLENGES: 'sfs.challenges.v1',
  SETTINGS: 'sfs.settings.v1',
};
  return { G, G0, PHYSICS_SUBSTEPS_PER_FRAME, MAX_DT, CRASH_SPEED, CRASH_SPEED_LEGGED, CRASH_ANGLE_LEGGED, LIFTOFF_GRACE_PERIOD, DRAG_SCALE, WARP_LEVELS, LAUNCH_ANGLE, BUILD_GRID, STORAGE_KEYS };
})();

const Vector2Module = (() => {
// Lightweight 2D vector math used throughout the physics/render code.
class Vector2 {
  constructor(x = 0, y = 0) {
    this.x = x;
    this.y = y;
  }

  static zero() { return new Vector2(0, 0); }
  static fromAngle(angleRad, length = 1) { return new Vector2(Math.cos(angleRad) * length, Math.sin(angleRad) * length); }

  clone() { return new Vector2(this.x, this.y); }
  set(x, y) { this.x = x; this.y = y; return this; }
  copy(v) { this.x = v.x; this.y = v.y; return this; }

  add(v) { return new Vector2(this.x + v.x, this.y + v.y); }
  sub(v) { return new Vector2(this.x - v.x, this.y - v.y); }
  scale(s) { return new Vector2(this.x * s, this.y * s); }
  mul(v) { return new Vector2(this.x * v.x, this.y * v.y); }

  addInPlace(v) { this.x += v.x; this.y += v.y; return this; }
  subInPlace(v) { this.x -= v.x; this.y -= v.y; return this; }
  scaleInPlace(s) { this.x *= s; this.y *= s; return this; }

  dot(v) { return this.x * v.x + this.y * v.y; }
  cross(v) { return this.x * v.y - this.y * v.x; } // scalar (2D cross)

  length() { return Math.hypot(this.x, this.y); }
  lengthSq() { return this.x * this.x + this.y * this.y; }

  normalized() {
    const len = this.length();
    if (len < 1e-9) return new Vector2(0, 0);
    return new Vector2(this.x / len, this.y / len);
  }

  rotated(angleRad) {
    const c = Math.cos(angleRad), s = Math.sin(angleRad);
    return new Vector2(this.x * c - this.y * s, this.x * s + this.y * c);
  }

  angle() { return Math.atan2(this.y, this.x); }

  distanceTo(v) { return Math.hypot(this.x - v.x, this.y - v.y); }
  distanceToSq(v) { const dx = this.x - v.x, dy = this.y - v.y; return dx * dx + dy * dy; }

  lerp(v, t) { return new Vector2(this.x + (v.x - this.x) * t, this.y + (v.y - this.y) * t); }

  toString() { return `(${this.x.toFixed(2)}, ${this.y.toFixed(2)})`; }
}

const TAU = Math.PI * 2;
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function degToRad(d) { return d * Math.PI / 180; }
function radToDeg(r) { return r * 180 / Math.PI; }

// Wrap an angle to [-PI, PI]
function wrapAngle(a) {
  a = a % TAU;
  if (a > Math.PI) a -= TAU;
  if (a < -Math.PI) a += TAU;
  return a;
}
  return { Vector2, TAU, clamp, lerp, degToRad, radToDeg, wrapAngle };
})();

const NavballModule = (() => {
// A 2D-appropriate navball: an attitude indicator locked to the LOCAL HORIZON
// frame of whatever body you're near. "Up" on the ball is always radial-out
// (straight away from the planet centre), so the sky/ground split tells you
// instantly whether you're pointed up, sideways, or into the dirt — and the
// prograde/retrograde pips tell you which way you're actually moving, which is
// rarely the same thing as which way you're pointing.

class Navball {
  constructor(size = 120) {
    this.size = size;
    this.canvas = document.createElement('canvas');
    this.canvas.width = size;
    this.canvas.height = size;
    this.canvas.style.width = size + 'px';
    this.canvas.style.height = size + 'px';
    this.ctx = this.canvas.getContext('2d');
  }

  /**
   * @param {number} shipAngle    world-space heading of the vessel (rad)
   * @param {number} radialOut    world-space angle of "straight up" (rad)
   * @param {number|null} velAngle world-space angle of surface-relative velocity
   * @param {number} speed        surface-relative speed (m/s), gates the pips
   * @param {string|null} holdMode active autopilot mode, highlighted on the ball
   */
  draw(shipAngle, radialOut, velAngle, speed, holdMode = null, targetAngle = null) {
    const ctx = this.ctx;
    const s = this.size;
    const c = s / 2;
    const R = s / 2 - 5;

    ctx.clearRect(0, 0, s, s);

    // Everything is drawn in "horizon frame": rotate world angles so that
    // radial-out points to the top of the widget.
    const toBall = (worldAngle) => Vector2Module.wrapAngle(worldAngle - radialOut);

    ctx.save();
    ctx.translate(c, c);

    // ---- ball body: sky above the horizon, ground below --------------------
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.clip();

    const sky = ctx.createLinearGradient(0, -R, 0, 0);
    sky.addColorStop(0, '#2f6ea8');
    sky.addColorStop(1, '#6fb3e0');
    ctx.fillStyle = sky;
    ctx.fillRect(-R, -R, R * 2, R);

    const ground = ctx.createLinearGradient(0, 0, 0, R);
    ground.addColorStop(0, '#9a6a3c');
    ground.addColorStop(1, '#5d3d20');
    ctx.fillStyle = ground;
    ctx.fillRect(-R, 0, R * 2, R);

    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-R, 0); ctx.lineTo(R, 0);
    ctx.stroke();

    // pitch ladder
    ctx.strokeStyle = 'rgba(255,255,255,0.32)';
    ctx.lineWidth = 1;
    for (let i = 1; i <= 3; i++) {
      const y = (R / 4) * i;
      const halfW = R * 0.42 * (1 - i * 0.22);
      ctx.beginPath(); ctx.moveTo(-halfW, y); ctx.lineTo(halfW, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-halfW, -y); ctx.lineTo(halfW, -y); ctx.stroke();
    }
    ctx.restore();

    // ---- velocity pips ------------------------------------------------------
    if (velAngle !== null && speed > 0.6) {
      const pro = toBall(velAngle);
      this._prograde(ctx, pro, R * 0.72, '#a8ff5c', holdMode === 'prograde');
      this._retrograde(ctx, Vector2Module.wrapAngle(pro + Math.PI), R * 0.72, '#ff8f5c', holdMode === 'retrograde');
    }

    // ---- target bearing -----------------------------------------------------
    if (targetAngle !== null) {
      this._target(ctx, toBall(targetAngle), R * 0.86, '#c07dff', holdMode === 'target');
    }

    // ---- ship heading -------------------------------------------------------
    const shipBall = toBall(shipAngle);
    ctx.save();
    // Ball angles are measured from "up"; canvas Y grows downward, hence -sin/cos.
    ctx.rotate(shipBall);
    ctx.beginPath();
    ctx.moveTo(0, -R * 0.95);
    ctx.lineTo(R * 0.13, -R * 0.66);
    ctx.lineTo(0, -R * 0.74);
    ctx.lineTo(-R * 0.13, -R * 0.66);
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = '#16324a';
    ctx.stroke();
    ctx.restore();

    // fixed centre reticle
    ctx.strokeStyle = '#ffd24d';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-7, 0); ctx.lineTo(-2, 0);
    ctx.moveTo(7, 0); ctx.lineTo(2, 0);
    ctx.moveTo(0, -3); ctx.lineTo(0, 0);
    ctx.stroke();

    // ---- bezel ---------------------------------------------------------------
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.strokeStyle = '#2b3550';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, R + 1.5, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
  }

  _markerPos(ballAngle, radius) {
    // ball angle 0 = up. Canvas Y is inverted.
    return { x: Math.sin(ballAngle) * radius, y: -Math.cos(ballAngle) * radius };
  }

  _prograde(ctx, ballAngle, radius, color, highlighted) {
    const { x, y } = this._markerPos(ballAngle, radius);
    ctx.save();
    ctx.translate(x, y);
    if (highlighted) {
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(168,255,92,0.22)'; ctx.fill();
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-5, 0); ctx.lineTo(-9, 0);
    ctx.moveTo(5, 0); ctx.lineTo(9, 0);
    ctx.moveTo(0, -5); ctx.lineTo(0, -9);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 1.6, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.restore();
  }

  // Target bearing: a filled triangle, visually distinct from the ringed
  // velocity pips so "where the target is" never reads as "where I'm going".
  _target(ctx, ballAngle, radius, color, highlighted) {
    const { x, y } = this._markerPos(ballAngle, radius);
    ctx.save();
    ctx.translate(x, y);
    if (highlighted) {
      ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(192,125,255,0.22)'; ctx.fill();
    }
    ctx.rotate(ballAngle);
    ctx.beginPath();
    ctx.moveTo(0, -7); ctx.lineTo(6, 5); ctx.lineTo(-6, 5);
    ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    ctx.lineWidth = 1.4; ctx.strokeStyle = '#2a1240'; ctx.stroke();
    ctx.restore();
  }

  _retrograde(ctx, ballAngle, radius, color, highlighted) {
    const { x, y } = this._markerPos(ballAngle, radius);
    ctx.save();
    ctx.translate(x, y);
    if (highlighted) {
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,143,92,0.22)'; ctx.fill();
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-5, 0); ctx.lineTo(-9, 0);
    ctx.moveTo(5, 0); ctx.lineTo(9, 0);
    ctx.moveTo(0, -5); ctx.lineTo(0, -9);
    ctx.stroke();
    // X through the middle distinguishes it from prograde at a glance
    ctx.beginPath();
    ctx.moveTo(-3, -3); ctx.lineTo(3, 3);
    ctx.moveTo(3, -3); ctx.lineTo(-3, 3);
    ctx.stroke();
    ctx.restore();
  }
}
  return { Navball };
})();

const InputModule = (() => {
// Centralized keyboard/mouse/wheel state. Scenes poll `keys`/`mouse` each frame
// and subscribe to discrete events (keydown-once, click, wheel) via callbacks.
class Input {
  constructor(canvas) {
    this.canvas = canvas;
    this.keys = new Set();
    this.justPressed = new Set();
    this.mouse = { x: 0, y: 0, down: false, button: -1 };
    this.wheelDelta = 0;
    this._keydownHandlers = [];
    this._wheelHandlers = [];
    this._clickHandlers = [];

    window.addEventListener('keydown', (e) => {
      if (!this.keys.has(e.code)) this.justPressed.add(e.code);
      this.keys.add(e.code);
      for (const h of this._keydownHandlers) h(e.code, e);
    });
    window.addEventListener('keyup', (e) => this.keys.delete(e.code));
    window.addEventListener('blur', () => { this.keys.clear(); });

    canvas.addEventListener('mousedown', (e) => {
      this.mouse.down = true; this.mouse.button = e.button;
      this._updateMouse(e);
      for (const h of this._clickHandlers) h('down', this.mouse, e);
    });
    window.addEventListener('mouseup', (e) => {
      this.mouse.down = false;
      for (const h of this._clickHandlers) h('up', this.mouse, e);
    });
    canvas.addEventListener('mousemove', (e) => this._updateMouse(e));
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.wheelDelta += e.deltaY;
      for (const h of this._wheelHandlers) h(e.deltaY, this.mouse);
    }, { passive: false });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  _updateMouse(e) {
    const rect = this.canvas.getBoundingClientRect();
    this.mouse.x = e.clientX - rect.left;
    this.mouse.y = e.clientY - rect.top;
  }

  onKeydown(fn) { this._keydownHandlers.push(fn); return () => this._offKeydown(fn); }
  _offKeydown(fn) { this._keydownHandlers = this._keydownHandlers.filter(h => h !== fn); }
  onWheel(fn) { this._wheelHandlers.push(fn); return () => { this._wheelHandlers = this._wheelHandlers.filter(h => h !== fn); }; }
  onClick(fn) { this._clickHandlers.push(fn); return () => { this._clickHandlers = this._clickHandlers.filter(h => h !== fn); }; }

  isDown(code) { return this.keys.has(code); }
  wasJustPressed(code) { return this.justPressed.has(code); }

  endFrame() { this.justPressed.clear(); this.wheelDelta = 0; }
}
  return { Input };
})();

const DOMModule = (() => {
// Tiny DOM builder helper — avoids a template/JSX dependency for a vanilla-JS game.
function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class' || k === 'className') node.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') node.innerHTML = v;
    else if (v !== undefined && v !== null && v !== false) node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of [].concat(children)) {
    if (c === null || c === undefined || c === false) continue;
    node.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
  }
  return node;
}

const uiRoot = document.getElementById('ui-root');

function clearUI() { uiRoot.innerHTML = ''; }

function mount(node) { uiRoot.appendChild(node); return node; }
function unmount(node) { if (node && node.parentNode) node.parentNode.removeChild(node); }

function fmt(n, digits = 0) {
  if (!isFinite(n)) return n > 0 ? '∞' : '-∞';
  return n.toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function fmtAltitude(m) {
  if (Math.abs(m) >= 1_000_000) return `${(m / 1000).toFixed(0)} km`;
  if (Math.abs(m) >= 10_000) return `${(m / 1000).toFixed(1)} km`;
  return `${m.toFixed(0)} m`;
}

function fmtDist(m) {
  if (Math.abs(m) >= 1e9) return `${(m / 1e9).toFixed(2)} Gm`;
  if (Math.abs(m) >= 1e6) return `${(m / 1e6).toFixed(2)} Mm`;
  if (Math.abs(m) >= 1000) return `${(m / 1000).toFixed(1)} km`;
  return `${m.toFixed(0)} m`;
}

function fmtSpeed(v) { return `${v.toFixed(1)} m/s`; }

function fmtTime(s) {
  if (!isFinite(s)) return '—';
  s = Math.max(0, s);
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  const sec = Math.floor(s);
  if (d > 0) return `${d}d ${h}h ${m}m`;
  if (h > 0) return `${h}h ${m}m ${sec}s`;
  if (m > 0) return `${m}m ${sec}s`;
  return `${sec}s`;
}

function fmtMass(kg) {
  if (kg >= 1000) return `${(kg / 1000).toFixed(2)} t`;
  return `${kg.toFixed(0)} kg`;
}
  return { el, uiRoot, clearUI, mount, unmount, fmt, fmtAltitude, fmtDist, fmtSpeed, fmtTime, fmtMass };
})();

const ToastModule = (() => {
const root = document.getElementById('toast-root');

function toast(message, ms = 2600) {
  const node = document.createElement('div');
  node.className = 'toast';
  node.textContent = message;
  root.appendChild(node);
  setTimeout(() => {
    node.style.transition = 'opacity 0.3s ease';
    node.style.opacity = '0';
    setTimeout(() => node.remove(), 300);
  }, ms);
}
  return { toast };
})();

const RocketRendererModule = (() => {
// Procedural (no image assets) rendering of rocket parts. Everything is
// drawn in a local frame centered on the part with +Y = toward the nose,
// matching the physics convention, so no extra flips are needed at call time.

function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

// Lighting model shared by every cylindrical part. A flat left-to-right ramp
// reads as a wedge; a real tube needs a bright specular band offset from centre
// plus darkened limbs. This one helper is what makes the whole rocket look
// rounded instead of like stacked rectangles.
function cylinderFill(ctx, hw, color, shade, lightOffset = -0.32) {
  const g = ctx.createLinearGradient(-hw, 0, hw, 0);
  const spec = mixHex(color, '#ffffff', 0.55);
  const deep = mixHex(shade, '#000000', 0.35);
  const lx = (lightOffset + 1) / 2; // -1..1 -> 0..1
  g.addColorStop(0, deep);
  g.addColorStop(Math.max(0.02, lx - 0.26), shade);
  g.addColorStop(Math.max(0.06, lx - 0.06), spec);
  g.addColorStop(Math.min(0.94, lx + 0.14), color);
  g.addColorStop(0.88, shade);
  g.addColorStop(1, deep);
  return g;
}

function hexToRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function mixHex(a, b, t) {
  const [ar, ag, ab] = hexToRgb(a), [br, bg, bb] = hexToRgb(b);
  const r = Math.round(ar + (br - ar) * t);
  const g = Math.round(ag + (bg - ag) * t);
  const bl = Math.round(ab + (bb - ab) * t);
  return `rgb(${r},${g},${bl})`;
}

// Thin darker caps at a part's ends sell the join between stacked parts.
function endCaps(ctx, hw, hh, shade) {
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(-hw, hh - hh * 0.06, hw * 2, hh * 0.06);
  ctx.fillRect(-hw, -hh, hw * 2, hh * 0.06);
}

function shapePod(ctx, hw, hh, def) {
  ctx.beginPath();
  ctx.moveTo(-hw, -hh);
  ctx.lineTo(-hw, hh * 0.1);
  ctx.quadraticCurveTo(-hw, hh, 0, hh);
  ctx.quadraticCurveTo(hw, hh, hw, hh * 0.1);
  ctx.lineTo(hw, -hh);
  ctx.closePath();
  ctx.fillStyle = cylinderFill(ctx, hw, def.color, def.shade);
  ctx.fill();
  ctx.save();
  ctx.clip();
  endCaps(ctx, hw, hh, def.shade);
  // ablative band around the base of the capsule
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(-hw, -hh, hw * 2, hh * 0.22);
  ctx.restore();
  ctx.strokeStyle = mixHex(def.shade, '#000000', 0.3);
  ctx.lineWidth = hw * 0.05; ctx.stroke();

  // window, with a glass highlight
  ctx.beginPath();
  ctx.arc(0, hh * 0.15, hw * 0.32, 0, Math.PI * 2);
  const wg = ctx.createRadialGradient(-hw * 0.1, hh * 0.25, hw * 0.02, 0, hh * 0.15, hw * 0.34);
  wg.addColorStop(0, '#cdeeff');
  wg.addColorStop(0.5, '#5fc9ff');
  wg.addColorStop(1, '#1d6f96');
  ctx.fillStyle = wg; ctx.fill();
  ctx.strokeStyle = '#16323f'; ctx.lineWidth = hw * 0.055; ctx.stroke();
  ctx.beginPath();
  ctx.arc(-hw * 0.1, hh * 0.26, hw * 0.09, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();
}

function shapeProbe(ctx, hw, hh, def) {
  ctx.beginPath();
  ctx.moveTo(0, hh); ctx.lineTo(hw, hh * 0.3); ctx.lineTo(hw, -hh * 0.3); ctx.lineTo(0, -hh);
  ctx.lineTo(-hw, -hh * 0.3); ctx.lineTo(-hw, hh * 0.3);
  ctx.closePath();
  ctx.fillStyle = def.color; ctx.fill();
  ctx.strokeStyle = def.shade; ctx.lineWidth = hw * 0.08; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, hw * 0.22, 0, Math.PI * 2);
  ctx.fillStyle = '#ff8a4d'; ctx.fill();
}

function shapeTank(ctx, hw, hh, def) {
  roundRect(ctx, -hw, -hh, hw * 2, hh * 2, hw * 0.16);
  ctx.fillStyle = cylinderFill(ctx, hw, def.color, def.shade);
  ctx.fill();

  ctx.save();
  ctx.clip();
  endCaps(ctx, hw, hh, def.shade);
  // Ribbed hull bands, spaced by length so a long tank reads as longer rather
  // than just bigger.
  const bands = Math.max(2, Math.round(hh / (hw * 0.55)));
  ctx.lineWidth = hw * 0.035;
  for (let i = 1; i < bands; i++) {
    const y = -hh + (hh * 2 * i) / bands;
    ctx.strokeStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.moveTo(-hw, y); ctx.lineTo(hw, y); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.beginPath(); ctx.moveTo(-hw, y + hw * 0.04); ctx.lineTo(hw, y + hw * 0.04); ctx.stroke();
  }
  ctx.restore();

  ctx.strokeStyle = mixHex(def.shade, '#000000', 0.35);
  ctx.lineWidth = hw * 0.045;
  roundRect(ctx, -hw, -hh, hw * 2, hh * 2, hw * 0.16);
  ctx.stroke();
}

function shapeEngine(ctx, hw, hh, def) {
  // Mounting collar at the top, then a flared bell below it.
  ctx.beginPath();
  roundRect(ctx, -hw * 0.62, hh * 0.42, hw * 1.24, hh * 0.58, hw * 0.08);
  ctx.fillStyle = cylinderFill(ctx, hw * 0.62, def.color, def.shade);
  ctx.fill();
  ctx.strokeStyle = '#171a1f'; ctx.lineWidth = hw * 0.05; ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-hw * 0.55, hh * 0.45);
  ctx.quadraticCurveTo(-hw * 0.72, -hh * 0.35, -hw, -hh);
  ctx.lineTo(hw, -hh);
  ctx.quadraticCurveTo(hw * 0.72, -hh * 0.35, hw * 0.55, hh * 0.45);
  ctx.closePath();
  ctx.fillStyle = cylinderFill(ctx, hw, def.color, def.shade);
  ctx.fill();

  ctx.save();
  ctx.clip();
  // Dark throat shadow so the bell reads as hollow rather than solid.
  const throat = ctx.createLinearGradient(0, -hh, 0, hh * 0.2);
  throat.addColorStop(0, 'rgba(0,0,0,0.55)');
  throat.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = throat;
  ctx.fillRect(-hw, -hh, hw * 2, hh * 1.2);
  ctx.restore();

  ctx.strokeStyle = '#171a1f'; ctx.lineWidth = hw * 0.055; ctx.stroke();
  // nozzle lip
  ctx.beginPath();
  ctx.ellipse(0, -hh, hw, hh * 0.1, 0, 0, Math.PI * 2);
  ctx.fillStyle = mixHex(def.shade, '#000000', 0.45); ctx.fill();
  ctx.strokeStyle = '#0f1216'; ctx.lineWidth = hw * 0.04; ctx.stroke();
}

function shapeSrb(ctx, hw, hh, def) {
  // Rounded nose cap, straight body, tapered nozzle at the base.
  ctx.beginPath();
  ctx.moveTo(-hw, hh * 0.78);
  ctx.quadraticCurveTo(-hw, hh, 0, hh);
  ctx.quadraticCurveTo(hw, hh, hw, hh * 0.78);
  ctx.lineTo(hw, -hh * 0.82);
  ctx.lineTo(hw * 0.62, -hh);
  ctx.lineTo(-hw * 0.62, -hh);
  ctx.lineTo(-hw, -hh * 0.82);
  ctx.closePath();
  ctx.fillStyle = cylinderFill(ctx, hw, def.color, def.shade);
  ctx.fill();

  ctx.save();
  ctx.clip();
  endCaps(ctx, hw, hh, def.shade);
  ctx.fillStyle = 'rgba(0,0,0,0.20)';
  ctx.fillRect(-hw, -hh, hw * 2, hh * 0.16);        // scorched nozzle end
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.fillRect(-hw, hh * 0.5, hw * 2, hh * 0.05);   // painted stripe
  ctx.fillRect(-hw, hh * 0.1, hw * 2, hh * 0.05);
  ctx.restore();

  ctx.strokeStyle = mixHex(def.shade, '#000000', 0.35);
  ctx.lineWidth = hw * 0.05; ctx.stroke();
}

function shapeTube(ctx, hw, hh, def) {
  roundRect(ctx, -hw, -hh, hw * 2, hh * 2, hw * 0.08);
  ctx.fillStyle = cylinderFill(ctx, hw, def.color, def.shade);
  ctx.fill();
  ctx.save();
  ctx.clip();
  endCaps(ctx, hw, hh, def.shade);
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.lineWidth = hw * 0.03;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(i * hw * 0.4, -hh); ctx.lineTo(i * hw * 0.4, hh);
    ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = mixHex(def.shade, '#000000', 0.3);
  ctx.lineWidth = hw * 0.045; ctx.stroke();
}

function shapeNose(ctx, hw, hh, def) {
  ctx.beginPath();
  ctx.moveTo(-hw, -hh); ctx.quadraticCurveTo(-hw * 0.9, hh * 0.5, 0, hh); ctx.quadraticCurveTo(hw * 0.9, hh * 0.5, hw, -hh);
  ctx.closePath();
  ctx.fillStyle = cylinderFill(ctx, hw, def.color, def.shade);
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(-hw, -hh, hw * 2, hh * 0.12);
  // bright leading edge along the tip
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = hw * 0.07;
  ctx.beginPath();
  ctx.moveTo(-hw * 0.30, -hh * 0.2);
  ctx.quadraticCurveTo(-hw * 0.16, hh * 0.55, 0, hh * 0.95);
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = mixHex(def.shade, '#000000', 0.3);
  ctx.lineWidth = hw * 0.05; ctx.stroke();
}

function shapeDecoupler(ctx, hw, hh, def) {
  roundRect(ctx, -hw, -hh, hw * 2, hh * 2, hh * 0.15);
  ctx.fillStyle = def.color; ctx.fill();
  ctx.strokeStyle = '#ff9d4d'; ctx.lineWidth = hw * 0.05;
  ctx.setLineDash([hw * 0.15, hw * 0.1]); ctx.stroke(); ctx.setLineDash([]);
}

function shapeFin(ctx, hw, hh, def, flipped) {
  ctx.beginPath();
  ctx.moveTo(-hw * 0.1, hh); ctx.lineTo(hw, -hh * 0.2); ctx.lineTo(hw * 0.5, -hh); ctx.lineTo(-hw * 0.1, -hh * 0.6);
  ctx.closePath();
  ctx.fillStyle = def.color; ctx.fill();
  ctx.strokeStyle = def.shade; ctx.lineWidth = hw * 0.12; ctx.stroke();
}

function shapeChutePack(ctx, hw, hh, def) {
  roundRect(ctx, -hw, -hh, hw * 2, hh * 2, hh * 0.4);
  ctx.fillStyle = def.color; ctx.fill();
  ctx.strokeStyle = def.shade; ctx.lineWidth = hw * 0.08; ctx.stroke();
}

function shapeLegs(ctx, hw, hh, def) {
  ctx.strokeStyle = def.color; ctx.lineWidth = hw * 0.35; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, hh * 0.6); ctx.lineTo(hw * 1.6, -hh * 1.8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hw * 1.1, -hh * 0.6); ctx.lineTo(hw * 2.1, -hh * 1.8); ctx.stroke();
  ctx.fillStyle = def.shade;
  ctx.beginPath(); ctx.ellipse(hw * 1.9, -hh * 1.8, hw * 0.55, hw * 0.22, 0, 0, Math.PI * 2); ctx.fill();
}

function shapeRcs(ctx, hw, hh, def) {
  roundRect(ctx, -hw, -hh, hw * 2, hh * 2, hw * 0.2);
  ctx.fillStyle = def.color; ctx.fill();
  ctx.strokeStyle = def.shade; ctx.lineWidth = hw * 0.15; ctx.stroke();
}

function shapePanel(ctx, hw, hh, def) {
  ctx.fillStyle = def.shade;
  ctx.fillRect(-hw * 0.15, -hh, hw * 0.3, hh * 2);
  const px = hw * 0.3;
  roundRect(ctx, px, -hh, hw * 1.8, hh * 2, hh * 0.1);
  ctx.fillStyle = def.color; ctx.fill();
  ctx.strokeStyle = '#0c1830'; ctx.lineWidth = hh * 0.15;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(px + (hw * 1.8 * i) / 4, -hh); ctx.lineTo(px + (hw * 1.8 * i) / 4, hh); ctx.stroke();
  }
}

function shapeBattery(ctx, hw, hh, def) {
  roundRect(ctx, -hw, -hh, hw * 2, hh * 2, hh * 0.3);
  ctx.fillStyle = def.color; ctx.fill();
  ctx.strokeStyle = def.shade; ctx.lineWidth = hw * 0.08; ctx.stroke();
  ctx.fillStyle = '#ffd24d';
  ctx.fillRect(-hw * 0.15, -hh * 0.4, hw * 0.3, hh * 0.8);
}

function shapeAntenna(ctx, hw, hh, def) {
  ctx.strokeStyle = def.color; ctx.lineWidth = hw * 0.9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -hh); ctx.lineTo(hw * 2.2, hh * 1.4); ctx.stroke();
  ctx.fillStyle = def.shade;
  ctx.beginPath(); ctx.arc(0, -hh, hw * 1.1, 0, Math.PI * 2); ctx.fill();
}

function shapeRadialDecoupler(ctx, hw, hh, def) {
  roundRect(ctx, -hw, -hh, hw * 2, hh * 2, hw * 0.3);
  ctx.fillStyle = def.color; ctx.fill();
  ctx.strokeStyle = '#ff9d4d'; ctx.lineWidth = hw * 0.2;
  ctx.setLineDash([hh * 0.3, hh * 0.22]); ctx.stroke(); ctx.setLineDash([]);
}

function shapeHeatShield(ctx, hw, hh, def) {
  // Blunt dish, curved side facing "down" (-Y), flat mounting face up.
  ctx.beginPath();
  ctx.moveTo(-hw, hh);
  ctx.lineTo(hw, hh);
  ctx.quadraticCurveTo(hw * 0.75, -hh * 2.4, 0, -hh * 2.4);
  ctx.quadraticCurveTo(-hw * 0.75, -hh * 2.4, -hw, hh);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, hh, 0, -hh * 2.4);
  g.addColorStop(0, def.shade);
  g.addColorStop(0.55, def.color);
  g.addColorStop(1, '#15110e');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#15110e'; ctx.lineWidth = hw * 0.05; ctx.stroke();
}

function shapeDockingPort(ctx, hw, hh, def) {
  roundRect(ctx, -hw, -hh, hw * 2, hh * 2, hh * 0.25);
  ctx.fillStyle = cylinderFill(ctx, hw, def.color, def.shade);
  ctx.fill();
  ctx.strokeStyle = mixHex(def.shade, '#000000', 0.35);
  ctx.lineWidth = hw * 0.05; ctx.stroke();
  // capture ring + latch teeth, so the mating face is obvious
  ctx.strokeStyle = 'rgba(30,36,46,0.75)';
  ctx.lineWidth = hh * 0.22;
  ctx.beginPath(); ctx.moveTo(-hw * 0.78, hh * 0.35); ctx.lineTo(hw * 0.78, hh * 0.35); ctx.stroke();
  ctx.fillStyle = '#3a434f';
  for (let i = -2; i <= 2; i++) {
    ctx.fillRect(i * hw * 0.3 - hw * 0.07, hh * 0.5, hw * 0.14, hh * 0.5);
  }
}

// Fairing halves are drawn separately so staging can animate them apart; while
// attached they meet on the centreline and read as one shroud.
function fairingHalf(ctx, hw, hh, def, side) {
  ctx.beginPath();
  ctx.moveTo(0, hh);
  ctx.quadraticCurveTo(side * hw * 0.95, hh * 0.45, side * hw, -hh * 0.25);
  ctx.lineTo(side * hw, -hh);
  ctx.lineTo(0, -hh);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, 0, side * hw, 0);
  g.addColorStop(0, mixHex(def.color, '#ffffff', 0.35));
  g.addColorStop(0.55, def.color);
  g.addColorStop(1, def.shade);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = mixHex(def.shade, '#000000', 0.3);
  ctx.lineWidth = hw * 0.035; ctx.stroke();
}

function shapeFairing(ctx, hw, hh, def) {
  fairingHalf(ctx, hw, hh, def, -1);
  fairingHalf(ctx, hw, hh, def, 1);
  // seam down the split line
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = hw * 0.03;
  ctx.beginPath(); ctx.moveTo(0, hh); ctx.lineTo(0, -hh); ctx.stroke();
}

const SHAPES = {
  pod: shapePod, probe: shapeProbe, tank: shapeTank, engine: shapeEngine, srb: shapeSrb,
  tube: shapeTube, nose: shapeNose, decoupler: shapeDecoupler, fin: shapeFin,
  chute: shapeChutePack, legs: shapeLegs, rcs: shapeRcs, panel: shapePanel,
  battery: shapeBattery, antenna: shapeAntenna,
  radialdecoupler: shapeRadialDecoupler, heatshield: shapeHeatShield,
  dockingport: shapeDockingPort, fairing: shapeFairing,
};

function drawPartLocal(ctx, part) {
  const def = part.def;
  const fn = SHAPES[def.shape] || shapeTube;
  ctx.save();
  if (part.flipped) ctx.scale(-1, 1);
  fn(ctx, part.halfW, part.halfH, def, part.flipped);
  ctx.restore();
}

function drawFlame(ctx, part, throttle, time) {
  const hw = part.halfW, hh = part.halfH;
  const len = hh * (2.2 + throttle * 2.6) * (0.85 + 0.15 * Math.sin(time * 40 + part.uid.length));
  const wob = Math.sin(time * 55 + part.localPos.x) * hw * 0.12;
  ctx.save();
  const g = ctx.createLinearGradient(0, -hh, 0, -hh - len);
  g.addColorStop(0, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.35, 'rgba(255,200,80,0.85)');
  g.addColorStop(1, 'rgba(255,90,20,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-hw * 0.55, -hh);
  ctx.quadraticCurveTo(wob, -hh - len * 0.7, 0, -hh - len);
  ctx.quadraticCurveTo(-wob, -hh - len * 0.7, hw * 0.55, -hh);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawDeployedChute(ctx, part) {
  const hw = part.halfW, hh = part.halfH;
  const canopyY = hh + hw * 5.5;
  const canopyR = hw * 4.2;
  ctx.save();
  ctx.strokeStyle = 'rgba(230,230,230,0.85)'; ctx.lineWidth = hw * 0.08;
  ctx.beginPath(); ctx.moveTo(-hw * 0.6, hh); ctx.lineTo(-canopyR * 0.85, canopyY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hw * 0.6, hh); ctx.lineTo(canopyR * 0.85, canopyY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, hh); ctx.lineTo(0, canopyY); ctx.stroke();

  ctx.beginPath();
  ctx.arc(0, canopyY, canopyR, Math.PI, 0, false);
  ctx.closePath();
  ctx.fillStyle = part.def.color;
  ctx.fill();
  ctx.strokeStyle = part.def.shade; ctx.lineWidth = hw * 0.1; ctx.stroke();
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.moveTo(0, canopyY); ctx.lineTo(i * canopyR * 0.42, canopyY - Math.sqrt(Math.max(0, canopyR * canopyR - (i * canopyR * 0.42) ** 2)));
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = hw * 0.04; ctx.stroke();
  }
  ctx.restore();
}

// Draws every part of the rocket in world space (relative to originX/originY —
// see Camera.applyOriginAtCamera; keeps values small enough for canvas transform
// precision at solar-system scale). `time` drives flame flicker.
function drawRocket(ctx, rocket, time, originX = 0, originY = 0) {
  const agg = rocket.getAggregate();
  const com = agg.com;
  ctx.save();
  ctx.translate(rocket.position.x - originX, rocket.position.y - originY);
  ctx.rotate(rocket.angle - Math.PI / 2);
  ctx.translate(-com.x, -com.y);

  for (const part of rocket.partList) {
    if (part.def.isEngine && part.ignited) {
      const effThrottle = part.def.throttleable ? rocket.throttle : 1;
      if (effThrottle > 0.02 && (part.def.fuelType === 'solid' ? part.fuel > 0 : rocket.liquidFuelStatus().fuel > 0)) {
        ctx.save();
        ctx.translate(part.localPos.x, part.localPos.y);
        if (part.flipped) ctx.scale(-1, 1);
        drawFlame(ctx, part, effThrottle, time);
        ctx.restore();
      }
    }
  }

  for (const part of rocket.partList) {
    ctx.save();
    ctx.translate(part.localPos.x, part.localPos.y);
    drawPartLocal(ctx, part);
    ctx.restore();
  }

  for (const part of rocket.partList) {
    if (part.def.isParachute && part.chuteState === 'deployed') {
      ctx.save();
      ctx.translate(part.localPos.x, part.localPos.y);
      if (part.flipped) ctx.scale(-1, 1);
      drawDeployedChute(ctx, part);
      ctx.restore();
    }
  }

  ctx.restore();
}

// A jettisoned stage cluster: rendered as a small tumbling debris cluster (simplified, not per-part).
function drawDebris(ctx, deb, originX = 0, originY = 0) {
  ctx.save();
  ctx.translate(deb.position.x - originX, deb.position.y - originY);
  ctx.rotate(deb.angle || 0);
  const s = Math.max(0.6, deb.size * 0.5);
  ctx.fillStyle = '#7c828c';
  ctx.strokeStyle = '#33363c';
  ctx.lineWidth = s * 0.08;
  ctx.beginPath();
  ctx.moveTo(-s, -s * 0.5); ctx.lineTo(-s * 0.3, -s); ctx.lineTo(s * 0.6, -s * 0.6);
  ctx.lineTo(s, s * 0.2); ctx.lineTo(s * 0.2, s); ctx.lineTo(-s * 0.7, s * 0.6);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();
}
  return { drawPartLocal, drawRocket, drawDebris, fairingHalf };
})();

const StarfieldModule = (() => {
// Simple fixed-in-screen-space starfield with a subtle twinkle and a very
// slight parallax drift so movement still reads as motion without the
// complexity of a true infinite tiled field.
class Starfield {
  constructor(count = 260) {
    this.count = count;
    this.stars = [];
    this.regenerate(1920, 1080);
  }

  regenerate(w, h) {
    this.w = w; this.h = h;
    this.stars = [];
    for (let i = 0; i < this.count; i++) {
      this.stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.4 + 0.3,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 1.2 + 0.4,
        depth: Math.random() * 0.5 + 0.15,
      });
    }
  }

  draw(ctx, w, h, time, camDx = 0, camDy = 0) {
    if (w !== this.w || h !== this.h) this.regenerate(w, h);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (const s of this.stars) {
      const tw = 0.55 + 0.45 * Math.sin(time * s.speed + s.phase);
      const x = ((s.x - camDx * s.depth) % this.w + this.w) % this.w;
      const y = ((s.y + camDy * s.depth) % this.h + this.h) % this.h;
      ctx.globalAlpha = tw * 0.85 + 0.1;
      ctx.fillStyle = '#dfe8ff';
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}
  return { Starfield };
})();

const CameraModule = (() => {
// World is meters with +Y "up" (math convention, angle CCW from +X).
// Camera maps that directly onto the canvas (Y-down) via setTransform so all
// render code can just draw using raw world coordinates.
class Camera {
  constructor() {
    this.x = 0;
    this.y = 0;
    this.zoom = 1; // pixels per meter
  }

  apply(ctx, canvasWidth, canvasHeight) {
    ctx.setTransform(this.zoom, 0, 0, -this.zoom,
      canvasWidth / 2 - this.x * this.zoom,
      canvasHeight / 2 + this.y * this.zoom);
  }

  // Solar-system-scale positions (billions of meters from the sun) blow out
  // canvas transform precision if baked into setTransform's translation.
  // This variant leaves the camera position OUT of the matrix (just
  // scale+flip+center); callers must draw at (worldX - this.x, worldY - this.y)
  // — a small delta computed in JS double precision — instead of raw world
  // coordinates. Used by any scene whose camera can roam the whole system
  // (flight, map). Builder's camera stays meters-scale so plain apply() is fine.
  applyOriginAtCamera(ctx, canvasWidth, canvasHeight) {
    ctx.setTransform(this.zoom, 0, 0, -this.zoom, canvasWidth / 2, canvasHeight / 2);
  }

  screenToWorld(sx, sy, canvasWidth, canvasHeight) {
    const wx = (sx - (canvasWidth / 2 - this.x * this.zoom)) / this.zoom;
    const wy = -(sy - (canvasHeight / 2 + this.y * this.zoom)) / this.zoom;
    return { x: wx, y: wy };
  }

  worldToScreen(wx, wy, canvasWidth, canvasHeight) {
    const sx = wx * this.zoom + (canvasWidth / 2 - this.x * this.zoom);
    const sy = -wy * this.zoom + (canvasHeight / 2 + this.y * this.zoom);
    return { x: sx, y: sy };
  }

  setZoomClamped(z, lo, hi) { this.zoom = Math.max(lo, Math.min(hi, z)); }
}
  return { Camera };
})();

const BodyRendererModule = (() => {
// Draws a celestial body: bumpy terrain outline (visible up close), a soft
// 3D-ish shading gradient, and an atmosphere glow. All in world units so it
// must be called while the camera transform is active.
function drawBody(ctx, body, t, screenRadiusPx, originX = 0, originY = 0) {
  const abs = body.positionAt(t);
  const c = { x: abs.x - originX, y: abs.y - originY };
  const isSun = !body.parent;

  if (isSun) {
    const grad = ctx.createRadialGradient(c.x, c.y, body.radius * 0.2, c.x, c.y, body.radius * 2.2);
    grad.addColorStop(0, 'rgba(255,246,214,0.9)');
    grad.addColorStop(0.35, 'rgba(255,214,120,0.35)');
    grad.addColorStop(1, 'rgba(255,180,80,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(c.x, c.y, body.radius * 2.2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Atmosphere glow (drawn behind terrain)
  if (body.atmosphereHeight > 0 && body.atmoColor) {
    const outer = body.radius + body.atmosphereHeight;
    const grad = ctx.createRadialGradient(c.x, c.y, body.radius * 0.94, c.x, c.y, outer);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.55, body.atmoColor);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(c.x, c.y, outer, 0, Math.PI * 2);
    ctx.fill();
  }

  // Terrain body. At tiny screen sizes, skip the bumpy outline (would alias) and just fill a circle.
  ctx.beginPath();
  if (screenRadiusPx > 40 && body.terrainAmplitude > 0) {
    const segs = Math.min(220, Math.max(48, Math.floor(screenRadiusPx / 2)));
    for (let i = 0; i <= segs; i++) {
      const a = (i / segs) * Math.PI * 2;
      const r = body.terrainRadiusAt(a);
      const x = c.x + Math.cos(a) * r, y = c.y + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
  } else {
    ctx.arc(c.x, c.y, body.radius, 0, Math.PI * 2);
  }
  ctx.closePath();

  const grad = ctx.createRadialGradient(
    c.x - body.radius * 0.35, c.y + body.radius * 0.35, body.radius * 0.1,
    c.x, c.y, body.radius * 1.15
  );
  grad.addColorStop(0, body.color);
  grad.addColorStop(0.75, body.color);
  grad.addColorStop(1, body.shadeColor);
  ctx.fillStyle = isSun ? '#fff3d0' : grad;
  ctx.fill();

  if (!isSun) {
    ctx.lineWidth = Math.max(0.5, body.radius * 0.004);
    ctx.strokeStyle = body.shadeColor;
    ctx.globalAlpha = 0.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawOrbitCircle(ctx, body, t, color = 'rgba(255,255,255,0.14)', originX = 0, originY = 0, lineWidth = null) {
  if (!body.parent) return;
  const abs = body.parent.positionAt(t);
  const pc = { x: abs.x - originX, y: abs.y - originY };
  ctx.beginPath();
  ctx.arc(pc.x, pc.y, body.orbitRadius, 0, Math.PI * 2);
  ctx.strokeStyle = color;
  // Width is in WORLD units under the active camera transform, so it must be
  // passed in as (screen px / zoom). Defaulting to 1 world metre made these
  // circles vanish entirely at map-view zoom levels.
  ctx.lineWidth = lineWidth != null ? lineWidth : body.orbitRadius * 0.002;
  const dash = Math.max(body.orbitRadius * 0.004, ctx.lineWidth * 3);
  ctx.setLineDash([dash, dash * 1.5]);
  ctx.stroke();
  ctx.setLineDash([]);
}
  return { drawBody, drawOrbitCircle };
})();

const ParticlesModule = (() => {
// Minimal particle system for explosions / launch smoke. World-space.
class ParticleSystem {
  constructor() { this.particles = []; }

  burst(x, y, opts = {}) {
    const count = opts.count || 26;
    const speed = opts.speed || 60;
    const life = opts.life || 1.1;
    const colors = opts.colors || ['#ffcf6b', '#ff8a3d', '#ff5c3d', '#8a8a8a'];
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = speed * (0.3 + Math.random() * 0.9);
      this.particles.push({
        x, y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life, maxLife: life,
        size: (opts.size || 3) * (0.6 + Math.random() * 0.8),
        color: colors[(Math.random() * colors.length) | 0],
      });
    }
  }

  update(dt) {
    for (const p of this.particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.98; p.vy *= 0.98;
      p.life -= dt;
    }
    this.particles = this.particles.filter(p => p.life > 0);
  }

  draw(ctx, originX = 0, originY = 0) {
    for (const p of this.particles) {
      const t = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = t;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x - originX, p.y - originY, p.size * (0.4 + t * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  get isEmpty() { return this.particles.length === 0; }
}
  return { ParticleSystem };
})();
